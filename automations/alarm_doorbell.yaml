#############################################################
### Fil: alarm_doorbell.yaml
### Innehåll: Automations för ringklockor (tvättstuga & hall),
###           blinkning av ljus vid ringsignal och en
###           automation för att slå på/av ringklockor baserat
###           på närvaro (home/not_home).
### Viktiga enheter: switch.ringklocka_tvattstuga,
###                  switch.ringklocka_hall,
###                  camera.camera_3, camera.camera_2,
###                  input_select.home_status,
###                  group.track_for_home_devices
#############################################################
 
  ###############################################################################
  ### Ringklocka tvättstuga (samlad: dag / natt / borta)
  ### T: switch.ringklocka_tvattstuga == on
  ### C: input_select.home_status — hanteras med choose (dag/natt/borta)
  ### A: homeassistant.turn_off switch, camera.snapshot, notify.mobile_app_sm_a528b
  ###############################################################################
  - alias: Ringklocka tvättstuga
    id: '4680276550081'
    mode: single

    trigger:
      - platform: state
        entity_id: switch.ringklocka_tvattstuga
        to: 'on'

    action:
      - service: homeassistant.turn_off
        entity_id: switch.ringklocka_tvattstuga
      - delay:
          seconds: 5
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma på'
            sequence:
              - service: camera.snapshot
                data:
                  entity_id: camera.camera_3
                  filename: /media/Day/camera_3_latest.jpg
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: "Ringklocka tvättstuga, dag"
                  data:
                    file: /media/Day/camera_3_latest.jpg
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma av'
            sequence:
              - service: camera.snapshot
                data:
                  entity_id: camera.camera_3
                  filename: /media/Night/camera_3_latest.jpg
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: "Ringklocka tvättstuga, natt"
                  data:
                    file: /media/Night/camera_3_latest.jpg
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'borta'
            sequence:
              - service: camera.snapshot
                data:
                  entity_id: camera.camera_3
                  filename: /media/Away/camera_3_latest.jpg
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: "Ringklocka tvättstuga, borta"
                  data:
                    file: /media/Away/camera_3_latest.jpg
      - delay:
          seconds: 10

  ###############################################################################
  ### Ringklocka hall (samlad: dag / natt / borta)
  ### T: switch.ringklocka_hall == on
  ### C: input_select.home_status — hanteras med choose (dag/natt/borta)
  ### A: homeassistant.turn_off switch, camera.snapshot, notify.mobile_app_sm_a528b
  ###############################################################################
  - alias: Ringklocka hall
    id: '2011937267361'
    mode: single

    trigger:
      - platform: state
        entity_id: switch.ringklocka_hall
        to: 'on'

    action:
      - service: homeassistant.turn_off
        entity_id: switch.ringklocka_hall
      - delay:
          seconds: 5
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma på'
            sequence:
              - service: camera.snapshot
                data:
                  entity_id: camera.camera_2
                  filename: /media/Day/camera_2_latest.jpg
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: "Ringklocka hall, dag"
                  data:
                    file: /media/Day/camera_2_latest.jpg
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma av'
            sequence:
              - service: camera.snapshot
                data:
                  entity_id: camera.camera_2
                  filename: /media/Night/camera_2_latest.jpg
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: "Ringklocka hall, natt"
                  data:
                    file: /media/Night/camera_2_latest.jpg
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'borta'
            sequence:
              - service: camera.snapshot
                data:
                  entity_id: camera.camera_2
                  filename: /media/Away/camera_2_latest.jpg
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: "Ringklocka hall, borta"
                  data:
                    file: /media/Away/camera_2_latest.jpg
      - delay:
          seconds: 10

  ###############################################################################
  ### Blinka med lyset när ringklocka ringer
  ### T: switch.ringklocka_tvattstuga == on OR switch.ringklocka_hall == on
  ### C: group.track_for_home_devices == 'home'
  ### A: light.toggle light.vardagsrum_vitrinskap
  ###############################################################################
  - alias: Blinka med lyset när ringklocka ringer
    id: '8363608373239' 
    mode: single

    trigger:
      - platform: state
        entity_id: switch.ringklocka_tvattstuga
        to: 'on'
      - platform: state
        entity_id: switch.ringklocka_hall
        to: 'on'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: group.track_for_home_devices
          state: 'home'

    action:
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap
      - delay:
          seconds: 1
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap
      - delay:
          seconds: 1
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap
      - delay:
          seconds: 1
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap

  ###############################################################################
  ### Slå ihop: Stänger/sätter på ringklocka
  ### T: group.track_for_home_devices changes to 'not_home' or 'home'
  ### C: none
  ### A: homeassistant.turn_off/turn_on switch.ringklocka
  ###############################################################################
  - alias: Ringklocka on off
    id: '2421022434971' 
    mode: single

    trigger:
      - platform: state
        entity_id: group.track_for_home_devices
        to: 'not_home'
      - platform: state
        entity_id: group.track_for_home_devices
        to: 'home'

    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'not_home' }}"
            sequence:
              - service: homeassistant.turn_off
                entity_id: switch.ringklocka
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'home' }}"
            sequence:
              - service: homeassistant.turn_on
                entity_id: switch.ringklocka