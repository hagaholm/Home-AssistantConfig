  ##############################################
  ### Blinka med lyset när ringklocka ringer ###
  ##############################################
  - alias: Blinka med lyset när ringklocka ringer
    id: '8363608373239' 
    mode: single

    trigger:
      - platform: state
        entity_id: switch.ringklocka_tvattstuga
        to: 'on'
      - platform: state
        entity_id: switch.ringklocka_hall
        to: 'on'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: group.track_for_home_devices
          state: 'home'

    action:
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap
      - delay:
          seconds: 1
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap
      - delay:
          seconds: 1
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap
      - delay:
          seconds: 1
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap

  ##############################################
  ### Slå ihop: Stänger/sätter på ringklocka ###
  ##############################################
  - alias: Ringklocka on off
    id: '2421022434971' 
    mode: single

    trigger:
      - platform: state
        entity_id: group.track_for_home_devices
        to: 'not_home'
      - platform: state
        entity_id: group.track_for_home_devices
        to: 'home'

    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'not_home' }}"
            sequence:
              - service: homeassistant.turn_off
                entity_id: switch.ringklocka
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'home' }}"
            sequence:
              - service: homeassistant.turn_on
                entity_id: switch.ringklocka