##############################################################
### Fil: alarm_friggebod_temperature.yaml
### Innehåll: Temperaturlarm för friggebod (hög, låg samt frysvakt).
### Viktiga enheter: sensor.friggebod_temperature, sensor.ute
##############################################################
 
  ########################################################################
  ### Friggebod - Varnar för hög temperatur
  ### T: sensor.friggebod_temperature > 23 (for: 00:10:00)
  ### C: sensor.ute < 15
  ### A: notify.mobile_app_sm_a528b (title + templated message)
  ########################################################################
  - alias: Friggebod larm hög temp
    id: '8904329147725'
    mode: single

    trigger:
      - platform: numeric_state
        entity_id: sensor.friggebod_temperature
        above: 23
        for: "00:10:00"

    condition:
      condition: and
      conditions:
        - condition: numeric_state
          entity_id: sensor.ute
          below: 15

    action:
      - service: notify.mobile_app_sm_a528b
        data:
          title: "LARM! Friggebod - hög temperatur"
          message: >
            {% set t = states('sensor.friggebod_temperature')|float(0) %}
            {% set unit = state_attr('sensor.friggebod_temperature','unit_of_measurement') %}
            {% set ute = states('sensor.ute') %}
            LARM! Hög temp i Friggebod: {{ t }} {{ unit }} (ute: {{ ute }})
            Nivå: {% if t > 27 %}Mycket hög{% elif t > 24 %}Hög{% else %}Mild{% endif %}

  ########################################################################
  ### Friggebod - Varnar för låg temperatur
  ### T: sensor.friggebod_temperature < 19 (for: 00:10:00)
  ### C: sensor.ute < 15
  ### A: notify.mobile_app_sm_a528b (title + templated message)
  ########################################################################
  - alias: Friggebod larm låg temp
    id: '3853132210260'
    mode: single

    trigger:
      - platform: numeric_state
        entity_id: sensor.friggebod_temperature
        below: 19
        for: "00:10:00"

    condition:
      condition: and
      conditions:
        - condition: numeric_state
          entity_id: sensor.ute
          below: 15

    action:
      - service: notify.mobile_app_sm_a528b
        data:
          title: "LARM! Friggebod - låg temperatur"
          message: >
            {% set t = states('sensor.friggebod_temperature')|float(0) %}
            {% set unit = state_attr('sensor.friggebod_temperature','unit_of_measurement') %}
            {% set ute = states('sensor.ute') %}
            LARM! Låg temp i Friggebod: {{ t }} {{ unit }} (ute: {{ ute }})
            Nivå: {% if t < 0 %}Mycket låg{% elif t < 17 %}Låg{% else %}Mild{% endif %}

  ########################################################################
  ### Friggebod - Frysvakt (larm vid frostrisk)
  ### T: sensor.friggebod_temperature < 3 (for: 00:05:00)
  ### C: none
  ### A: notify.mobile_app_sm_a528b (title + templated message)
  ########################################################################
  - alias: Friggebod frysvakt
    id: '8790714161214'
    mode: single

    trigger:
      - platform: numeric_state
        entity_id: sensor.friggebod_temperature
        below: 3
        for: "00:05:00"

    action:
      - service: notify.mobile_app_sm_a528b
        data:
          title: "LARM! Frysvakt Friggebod"
          message: >
            {% set t = states('sensor.friggebod_temperature')|float(0) %}
            {% set unit = state_attr('sensor.friggebod_temperature','unit_of_measurement') %}
            LARM! Frysvakt Friggebod: {{ t }} {{ unit }}
