#######################################################
#                                                     #
#     ACKUMULATORTANK TEMPERATURLARM AUTOMATION      #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 2.0
# Författare: Home Assistant Config
#
# BESKRIVNING:
# Samlad automation för temperaturövervakning av ackumulatortank.
# Larmar vid både för låg och för hög temperatur.
# Säkerställer korrekt drift av värmesystemet.
#
# HÅRDVARA/ENTITETER:
# - Sensor: sensor.varmepump_temperature
# - Notification: notify.mobile_app_sm_a528b
#
# TRIGGRAR:
# - Temperatur <20°C i 10 minuter (låg)
# - Temperatur >55°C i 10 minuter (hög)
#
# VILLKOR:
# - Sensor inte 'unknown' (validering)
#
# LOGIK:
# LÅG TEMP:
# - Larmar om <20°C (för kallt för effektiv värme)
# - Nivåer: <10°C (Mycket låg), <18°C (Låg), annars (Mild)
# - Indikerar värmepump problem eller underkapacitet
#
# HÖG TEMP:
# - Larmar om >55°C (för varmt, risk)
# - Nivåer: >65°C (Mycket hög), >60°C (Hög), annars (Mild)
# - Kan indikera felaktig termostat eller fastnat relä
#
# SÄKERHET:
# - 10 min fördröjning förhindrar korta toppar
# - Template validering säkerställer giltig data
# - Hög temp larm skyddar mot skalln ingsrisk
# - Låg temp larm säkerställer värmekomfort
#
# INTEGRATION:
# - Skickar notifikationer till mobil
# - Inkluderar temperatur och enhet
# - Visar allvarlighetsnivå
#
# KONSOLIDERINGSHISTORIK:
# Denna automation ersätter följande tidigare automationer:
# - Låg temp ackumulatortank (ID: 5099658940929)
# - Hög temp ackumulatortank (ID: 6125166678823)
# 
# Konsoliderad: 2025-12-27
# Behållet ID: 5099658940929 (från låg temp)
# Anledning: Enklare underhåll, delad logik, reducerad overhead
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga separata automationer
# v2.0 (2025-12-27): Konsoliderade låg/hög i en automation
#######################################################


#######################################################
#                                                     #
#   AUTOMATIONER FÖR ACKUMULATORTANK TEMPERATURLARM  #
#                                                     #
#######################################################

  - alias: Ackumulatortank temperaturlarm
    id: '1735304100007'
    mode: single

    trigger:
      # Låg temperatur
      - platform: numeric_state
        entity_id: sensor.varmepump_temperature
        below: 20
        for: "00:10:00"
        id: low_temp

      # Hög temperatur
      - platform: numeric_state
        entity_id: sensor.varmepump_temperature
        above: 55
        for: "00:10:00"
        id: high_temp

    condition:
      - condition: template
        value_template: "{{ not is_state('sensor.varmepump_temperature','unknown') }}"

    action:
      - choose:
          # LÅG TEMPERATUR
          - alias: Låg temperatur larm
            conditions:
              - condition: trigger
                id: low_temp
            sequence:
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "Larm! Låg temp ackumulatortank"
                  message: >
                    {% set t = states('sensor.varmepump_temperature')|float(0) %}
                    {% set unit = state_attr('sensor.varmepump_temperature','unit_of_measurement') %}
                    LARM! Låg temp i ackumulatortank: {{ t }} {{ unit }}
                    Nivå: {% if t < 10 %}Mycket låg{% elif t < 18 %}Låg{% else %}Mild{% endif %}

          # HÖG TEMPERATUR
          - alias: Hög temperatur larm
            conditions:
              - condition: trigger
                id: high_temp
            sequence:
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "Larm! Hög temp ackumulatortank"
                  message: >
                    {% set t = states('sensor.varmepump_temperature')|float(0) %}
                    {% set unit = state_attr('sensor.varmepump_temperature','unit_of_measurement') %}
                    LARM! Hög temp i ackumulatortank: {{ t }} {{ unit }}
                    Nivå: {% if t > 65 %}Mycket hög{% elif t > 60 %}Hög{% else %}Mild{% endif %}
