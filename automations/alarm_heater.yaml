    ############################################
    ### Låg temp ackumulatortank             ###
    ### T: sensor.varmepump_temperature < 20 ###
    ### A: notify.mobile_app_sm_a528b        ###
    ############################################
  - alias: Låg temp ackumulatortank
    id: '5099658940929' 

    trigger:
      platform: numeric_state
      entity_id: sensor.varmepump_temperature
      below: '20'

    action:
      - service: notify.mobile_app_sm_a528b
        data:
          message: "Larm! Låg temp ackumulatortank: {{ states('sensor.varmepump_temperature') }} {{ state_attr('sensor.varmepump_temperature', 'unit_of_measurement') }}"

    ############################################
    ### Hög temp ackumulatortank             ###
    ### T: sensor.varmepump_temperature > 52 ###
    ### A: notify.mobile_app_sm_a528b        ###
    ############################################
  - alias: Hög temp ackumulatortank
    id: '6125166678823' 

    trigger:
      platform: numeric_state
      entity_id: sensor.varmepump_temperature
      above: '52'

    action:
      - service: notify.mobile_app_sm_a528b
        data:
          message: "Larm! Hög temp ackumulatortank: {{ states('sensor.varmepump_temperature') }} {{ state_attr('sensor.varmepump_temperature', 'unit_of_measurement') }}"
