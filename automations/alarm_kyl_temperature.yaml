#######################################################
#                                                     #
#           KYL TEMPERATURLARM AUTOMATION             #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 2.0
# Författare: Home Assistant Config
#
# BESKRIVNING:
# Samlad automation för temperaturövervakning av kylskåpet.
# Larmar vid både för hög och för låg temperatur.
# Skyddar livsmedel och upptäcker felfunktioner.
#
# HÅRDVARA/ENTITETER:
# - Sensor: sensor.kyl_temperature
# - Notification: notify.mobile_app_sm_a528b
#
# TRIGGRAR:
# - Temperatur >10°C i 10 minuter (hög)
# - Temperatur <3°C i 10 minuter (låg)
#
# VILLKOR:
# - Sensor inte 'unknown' (validering)
#
# LOGIK:
# HÖG TEMP:
# - Larmar om >10°C (för varmt för kylskåp)
# - Nivåer: >12°C (Mycket hög), >10°C (Hög), annars (Mild)
# - Indikerar dörr öppen eller felfunktion
#
# LÅG TEMP:
# - Larmar om <3°C (för kallt, risk för frysning)
# - Nivåer: <0°C (Mycket låg), <2°C (Låg), annars (Mild)
# - Kan indikera felaktig termostat
#
# SÄKERHET:
# - 10 min fördröjning förhindrar korta toppar vid dörröppning
# - Template validering säkerställer giltig sensordata
# - Nivåbedömning ger snabb förståelse av allvaret
#
# INTEGRATION:
# - Skickar notifikationer till mobil
# - Inkluderar temperatur och enhet i meddelande
# - Visar allvarlighetsnivå
#
# KONSOLIDERINGSHISTORIK:
# Denna automation ersätter följande tidigare automationer:
# - Larm! Hög temp i kyl (ID: 9665695675546)
# - Larm! Låg temp i kyl (ID: 8148240711901)
# 
# Konsoliderad: 2025-12-27
# Behållet ID: 9665695675546 (från hög temp)
# Anledning: Enklare underhåll, delad logik, reducerad overhead
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga separata automationer
# v2.0 (2025-12-27): Konsoliderade hög/låg i en automation
#######################################################


#######################################################
#                                                     #
#        AUTOMATIONER FÖR KYL TEMPERATURLARM         #
#                                                     #
#######################################################

  - alias: Kyl temperaturlarm
    id: '1735304100008'
    mode: single

    trigger:
      # Hög temperatur
      - platform: numeric_state
        entity_id: sensor.kyl_temperature
        above: 10
        for: "00:10:00"
        id: high_temp

      # Låg temperatur
      - platform: numeric_state
        entity_id: sensor.kyl_temperature
        below: 3
        for: "00:10:00"
        id: low_temp

    condition:
      - condition: template
        value_template: "{{ not is_state('sensor.kyl_temperature','unknown') }}"

    action:
      - choose:
          # HÖG TEMPERATUR
          - alias: Hög temperatur larm
            conditions:
              - condition: trigger
                id: high_temp
            sequence:
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "LARM! Kyl - hög temperatur"
                  message: >
                    {% set t = states('sensor.kyl_temperature')|float(0) %}
                    {% set unit = state_attr('sensor.kyl_temperature','unit_of_measurement') %}
                    LARM! Hög temp i kylen: {{ t }} {{ unit }}
                    Nivå: {% if t > 12 %}Mycket hög{% elif t > 10 %}Hög{% else %}Mild{% endif %}

          # LÅG TEMPERATUR
          - alias: Låg temperatur larm
            conditions:
              - condition: trigger
                id: low_temp
            sequence:
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "LARM! Kyl - låg temperatur"
                  message: >
                    {% set t = states('sensor.kyl_temperature')|float(0) %}
                    {% set unit = state_attr('sensor.kyl_temperature','unit_of_measurement') %}
                    LARM! Låg temp i kylen: {{ t }} {{ unit }}
                    Nivå: {% if t < 0 %}Mycket låg{% elif t < 2 %}Låg{% else %}Mild{% endif %}
