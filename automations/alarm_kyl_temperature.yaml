############################################################
# Fil: alarm_kyl_temperature.yaml
# Innehåll: Temperaturlarm för kyl (hög och låg temperatur)
# Viktiga enheter: sensor.kyl_temperature
############################################################
 
  ########################################################################
  ### Kyl - Varnar för hög temperatur
  ### T: sensor.kyl_temperature > 10 (for: 00:10:00)
  ### C: not unknown
  ### A: notify.mobile_app_sm_a528b (title + templated message)
  ########################################################################
  - alias: Larm! Hög temp i kyl
    id: '9665695675546'
    mode: single

    trigger:
      - platform: numeric_state
        entity_id: sensor.kyl_temperature
        above: 10
        for: "00:10:00"

    condition:
      - condition: template
        value_template: "{{ not is_state('sensor.kyl_temperature','unknown') }}"

    action:
      - service: notify.mobile_app_sm_a528b
        data:
          title: "LARM! Kyl - hög temperatur"
          message: >
            {% set t = states('sensor.kyl_temperature')|float(0) %}
            {% set unit = state_attr('sensor.kyl_temperature','unit_of_measurement') %}
            LARM! Hög temp i kylen: {{ t }} {{ unit }}
            Nivå: {% if t > 12 %}Mycket hög{% elif t > 10 %}Hög{% else %}Mild{% endif %}

  ########################################################################
  ### Kyl - Varnar för låg temperatur
  ### T: sensor.kyl_temperature < 3 (for: 00:10:00)
  ### C: not unknown
  ### A: notify.mobile_app_sm_a528b (title + templated message)
  ########################################################################
  - alias: Larm! Låg temp i kyl
    id: '8148240711901'
    mode: single

    trigger:
      - platform: numeric_state
        entity_id: sensor.kyl_temperature
        below: 3
        for: "00:10:00"

    condition:
      - condition: template
        value_template: "{{ not is_state('sensor.kyl_temperature','unknown') }}"

    action:
      - service: notify.mobile_app_sm_a528b
        data:
          title: "LARM! Kyl - låg temperatur"
          message: >
            {% set t = states('sensor.kyl_temperature')|float(0) %}
            {% set unit = state_attr('sensor.kyl_temperature','unit_of_measurement') %}
            LARM! Låg temp i kylen: {{ t }} {{ unit }}
            Nivå: {% if t < 0 %}Mycket låg{% elif t < 2 %}Låg{% else %}Mild{% endif %}
