#######################################################
#                                                     #
#       GARAGE AVFUKTARE (DEHUMIDIFIER) AUTOMATION   #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 2.0
# Författare: Home Assistant Config
#
# BESKRIVNING:
# Samlad automation för styrning av garageavfuktare.
# Startar/stoppar baserat på luftfuktighet och temperatur.
# Förhindrar mögel och fuktskador i garage.
#
# HÅRDVARA/ENTITETER:
# - Sensor: sensor.garage_humidity
# - Sensor: sensor.garage_temperature
# - Switch: switch.garage_avfuktare
#
# TRIGGRAR:
# - Luftfuktighet >66% (starta)
# - Luftfuktighet <64% (stoppa)
#
# VILLKOR:
# - Starta: switch off OCH temperatur >10°C
# - Stoppa: switch on
#
# LOGIK:
# STARTA AVFUKTARE:
# - Vid >66% luftfuktighet
# - Endast om temp >10°C (effektivt vid normal temp)
# - Hysteresis: startar vid 66%, stoppar vid 64%
#
# STOPPA AVFUKTARE:
# - Vid <64% luftfuktighet
# - Ingen temp-check (alltid stoppa vid låg fukt)
#
# SÄKERHET:
# - Template validering (unknown/unavailable)
# - Hysteresis förhindrar flapping (66% start, 64% stopp)
# - Temperaturkontroll vid start (>10°C)
# - State check förhindrar onödiga omväxlingar
#
# INTEGRATION:
# - homeassistant.turn_on/off service
# - Template triggers för robust hantering
#
# KONSOLIDERINGSHISTORIK:
# Denna automation ersätter följande tidigare automationer:
# - Starta avfuktare (ID: 0673019039872)
# - Stoppa avfuktare (ID: 8624685283999)
# 
# Konsoliderad: 2025-12-27
# Behållet ID: 0673019039872 (från starta)
# Anledning: Enklare underhåll, delad logik, tydligare hysteresis
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga separata automationer
# v2.0 (2025-12-27): Konsoliderade start/stopp i en automation
#######################################################


#######################################################
#                                                     #
#    AUTOMATIONER FÖR GARAGE AVFUKTARE STYRNING      #
#                                                     #
#######################################################

- alias: Garage avfuktare styrning
  id: '1735304100002'
  mode: single

  trigger:
    # Starta vid hög luftfuktighet
    - platform: template
      value_template: "{{ states('sensor.garage_humidity') not in ['unknown','unavailable',''] and (states('sensor.garage_humidity')|float) > 66 }}"
      id: start_dehumidifier

    # Stoppa vid låg luftfuktighet
    - platform: template
      value_template: "{{ states('sensor.garage_humidity') not in ['unknown','unavailable',''] and (states('sensor.garage_humidity')|float) < 64 }}"
      id: stop_dehumidifier

  action:
    - choose:
        # STARTA AVFUKTARE
        - alias: Starta avfuktare vid hög fukt
          conditions:
            - condition: trigger
              id: start_dehumidifier
            - condition: state
              entity_id: switch.garage_avfuktare
              state: 'off'
            - condition: numeric_state
              entity_id: sensor.garage_temperature
              above: 10
          sequence:
            - service: homeassistant.turn_on
              entity_id: switch.garage_avfuktare

        # STOPPA AVFUKTARE
        - alias: Stoppa avfuktare vid låg fukt
          conditions:
            - condition: trigger
              id: stop_dehumidifier
            - condition: state
              entity_id: switch.garage_avfuktare
              state: 'on'
          sequence:
            - service: homeassistant.turn_off
              entity_id: switch.garage_avfuktare
