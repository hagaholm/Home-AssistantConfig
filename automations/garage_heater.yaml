#######################################################
#                                                     #
#              GARAGE ELVÄRME AUTOMATION              #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Samlad automation för garagets elvärmare baserat på
# temperaturnivåer i garage, förråd och ute.
# Flerriktad styrning med olika temperaturtröskel.
#
# HÅRDVARA:
# - Förrådstemperatur: sensor.forrad_temperature
# - Garagetemperatur: sensor.garage_temperature
# - Utetemperatur: sensor.ute
# - Värmeelement: switch.garage_elvarme
#
# TRIGGRAR:
# - Förråd/garage temp under 12°C
# - Förråd/garage temp över 9°C
#
# LOGIK:
# TÄND:
# - <7°C: När förråd ELLER garage <7°C OCH ute <6°C
# - <12°C: När förråd ELLER garage <12°C OCH ute <10°C
#
# SLÄCK:
# - >14°C: När BÅDE förråd OCH garage >14°C
# - >9°C: När BÅDE förråd OCH garage >9°C
#
# SÄKERHET:
# - Dubbla temperatursensorer förhindrar felaktiga triggningar
# - Utetemperatur används som extra kontroll
# - Hysteresis (9/14°C) förhindrar flackering
#
# INTEGRATION:
# - Styrs direkt via switch.garage_elvarme
# - Arbetar oberoende av andra system
#######################################################


#######################################################
#                                                     #
#            AUTOMATIONER FÖR GARAGE ELVÄRME          #
#                                                     #
#######################################################

- alias: Elvärme garage
  id: '1735304100014' 
  mode: single

  trigger:
    - platform: numeric_state
      entity_id: sensor.forrad_temperature
      below: '12'
    - platform: numeric_state
      entity_id: sensor.garage_temperature
      below: '12'
    - platform: numeric_state
      entity_id: sensor.forrad_temperature
      above: '9'
    - platform: numeric_state
      entity_id: sensor.garage_temperature
      above: '9'

  action:
    - choose:
        # TÄND - Temp < 7 grader
        - conditions:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.forrad_temperature
                  below: 7
                - condition: numeric_state
                  entity_id: sensor.garage_temperature
                  below: 7
            - condition: numeric_state
              entity_id: sensor.ute
              below: 6
          sequence:
            - service: homeassistant.turn_on
              entity_id: switch.garage_elvarme

        # TÄND - Temp < 12 grader
        - conditions:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.forrad_temperature
                  below: 12
                - condition: numeric_state
                  entity_id: sensor.garage_temperature
                  below: 12
            - condition: numeric_state
              entity_id: sensor.ute
              below: 10
          sequence:
            - service: homeassistant.turn_on
              entity_id: switch.garage_elvarme

        # SLÄCK - Temp > 14 grader
        - conditions:
            - condition: and
              conditions:
                - condition: numeric_state
                  entity_id: sensor.forrad_temperature
                  above: 14
                - condition: numeric_state
                  entity_id: sensor.garage_temperature
                  above: 14
          sequence:
            - service: homeassistant.turn_off
              entity_id: switch.garage_elvarme

        # SLÄCK - Temp > 9 grader
        - conditions:
            - condition: and
              conditions:
                - condition: numeric_state
                  entity_id: sensor.forrad_temperature
                  above: 9
                - condition: numeric_state
                  entity_id: sensor.garage_temperature
                  above: 9
          sequence:
            - service: homeassistant.turn_off
              entity_id: switch.garage_elvarme
