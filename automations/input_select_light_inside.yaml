#######################################################
#                                                     #
#        INNEBELYSNING INPUT_SELECT AUTOMATION        #
#                                                     #
#######################################################
#
# BESKRIVNING:
# State machine automation för innebelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande belysningsskript.
#
# HÅRDVARA:
# - Styrs via: input_select.light_inside
# - Exekveras av: script.*_lights_on
#
# TILLSTÅND:
# - Morgonbelysning: Mjukt morgonljus (05:00-09:00)
# - Dagbelysning: Normalt dagsljus
# - Kvällsbelysning: Dämpat kvällsljus
# - Nattbelysning: Minimalt nattljus (vid rörelse)
# - Bortabelysning: Simulerar närvaro när borta
# - Fönsterbelysning: Julbelysning i fönster
#
# LOGIK:
# När input_select.light_inside ändras:
# - Identifiera nytt tillstånd
# - Anropa motsvarande script
# - Scriptet hanterar faktisk ljuskontroll för alla rum
#
# INTEGRATION:
# - Kopplad till input_select.light_inside
# - Triggar centrala belysningsskript
# - Styrs av automationer i light_inside_*.yaml
#######################################################


#######################################################
#                                                     #
#      AUTOMATIONER FÖR INNEBELYSNING STATE           #
#                                                     #
#######################################################

  - alias: Innebelysning
    id: '1735304100020' 
    mode: single

    trigger:
      - platform: state
        entity_id: input_select.light_inside

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Morgonbelysning
            sequence:
              - service: script.morning_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Dagbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Kvällsbelysning
            sequence:
              - service: script.eveninglights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Nattbelysning
            sequence:
              - service: script.night_light

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Bortabelysning
            sequence:
              - service: script.away_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Fönsterbelysning
            sequence:
              - service: script.christmas_lights_on

    ##############################################
    ### Släcker innebelysning                  ###
    ### T: input_select.light_inside == Släckt ###
    ### A: script.inside_lights_off            ###
    ##############################################
  - alias: Släcker innebelysning
    id: '0733235795384' 
    mode: single

    trigger:
      - platform: state
        entity_id: input_select.light_inside
        to: Släckt

    action:
      - service: script.inside_lights_off


#       - Släckt
#       - Morgonbelysning
#     - Förmiddagsbelysning
#       - Dagbelysning
#     - Kvällsbelysning
#       - Nattbelysning
#       - Bortabelysning
#     - Arbetsbelysning
