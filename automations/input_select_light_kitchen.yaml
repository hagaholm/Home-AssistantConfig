#######################################################
#                                                     #
#         KÖKSBELYSNING INPUT_SELECT AUTOMATION       #
#                                                     #
#######################################################
#
# BESKRIVNING:
# State machine automation för köksbelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande ljusskript.
#
# HÅRDVARA:
# - Styrs via: input_select.light_kitchen
# - Exekveras av: script.kitchen_light_*
#
# TILLSTÅND:
# - Släckt: Alla lampor av
# - 25%: Dämpat nattljus
# - 50%: Morgonljus
# - 100%: Full belysning
#
# LOGIK:
# När input_select.light_kitchen ändras:
# - Identifiera nytt tillstånd
# - Anropa motsvarande script
# - Scriptet hanterar faktisk ljuskontroll
#
# INTEGRATION:
# - Kopplad till input_select.light_kitchen
# - Triggar script för faktisk ljuskontroll
# - Styrs av automationer i light_kitchen.yaml
#######################################################


#######################################################
#                                                     #
#       AUTOMATIONER FÖR KÖKSBELYSNING STATE          #
#                                                     #
#######################################################

  - alias: Köksbelysning
    id: '1735304100019' 
    mode: single

    trigger:
      - platform: state
        entity_id: input_select.light_kitchen

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_kitchen
                state: '100%'
            sequence:
              - service: script.kitchen_light_100

          - conditions:
              - condition: state
                entity_id: input_select.light_kitchen
                state: '50%'
            sequence:
              - service: script.kitchen_light_50

          - conditions:
              - condition: state
                entity_id: input_select.light_kitchen
                state: '25%'
            sequence:
              - service: script.kitchen_light_25

          - conditions:
              - condition: state
                entity_id: input_select.light_kitchen
                state: Släckt
            sequence:
              - service: script.kitchen_light_off
