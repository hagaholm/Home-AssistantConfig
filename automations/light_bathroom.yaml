#######################################################
#                                                     #
#                BADRUMSBELYSNING AUTOMATION          #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Samlad automation för badrumsbelysning som styrs av
# närvaro, ljusnivå och hemstatus.
# Logiken är uppbyggd som en state machine via
# input_select.light_bathroom.
#
# HÅRDVARA:
# - Närvarosensor: binary_sensor.motion_sensor
# - Ljussensor: sensor.kokets_ljusniva
# - Belysning: light.fonster_spott
#
# TILLSTÅND (input_select.light_bathroom):
# - Släckt:
#   Ingen belysning. Används vid hemstatus Borta
#   eller när det är för ljust.
#
# - Dag:
#   Dagsljus när det är mörkt, hemstatus är Hemma på
#   och ingen närvaro detekteras.
#
# - Dag närvaro:
#   Dagsljus med närvaro när hemstatus är Hemma på.
#
# - Natt närvaro:
#   Dämpat nattljus vid närvaro när hemstatus är Hemma av
#   och det är mörkt.
#
# ÖVERGÅNGAR:
# - Släckt → Dag:
#   När det är mörkt och hemstatus är Hemma på.
#
# - Släckt → Natt närvaro:
#   När närvaro detekteras, hemstatus är Hemma av
#   och det är mörkt.
#
# - Dag → Dag närvaro:
#   När närvaro detekteras.
#
# - Dag → Släckt:
#   När det blir för ljust eller hemstatus ändras till Borta.
#
# - Dag närvaro → Dag:
#   När närvaro försvinner (60 s timeout).
#
# - Natt närvaro → Släckt:
#   När närvaro försvinner (60 s timeout).
#
# - * → Släckt:
#   När hemstatus ändras till Borta.
#
# INTEGRATION:
# - Logik och tillstånd styrs via input_select.light_bathroom
# - Hemstatus hämtas från input_select.home_status
#######################################################


#######################################################
#                                                     #
#            AUTOMATIONER FÖR BADRUMSBELYSNING        #
#                                                     #
#######################################################

- alias: Badrumsbelysning – samlad automation
  id: bathroom_light_all_in_one
  description: >
    Samlad automation för badrumsbelysning baserat på närvaro,
    ljusnivå och hemstatus.
  mode: single

  trigger:
    # Hemstatus
    - platform: state
      entity_id: input_select.home_status

    # Närvaro
    - platform: state
      entity_id: binary_sensor.motion_sensor
      to: 'on'

    # Närvaro timeout
    - platform: state
      entity_id: binary_sensor.motion_sensor
      to: 'off'
      for:
        seconds: 60

    # Ljusnivå – mörkt
    - platform: numeric_state
      entity_id: sensor.kokets_ljusniva
      below: 100

    # Ljusnivå – för ljust
    - platform: numeric_state
      entity_id: sensor.kokets_ljusniva
      above: 150

  action:
    - choose:

        # --------------------------------------------------
        # SLÄCK VID BORTA OCH HEMMA AV
        # --------------------------------------------------
        - conditions:
            - condition: state
              entity_id: input_select.home_status
              state:
                - 'Borta'
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.light_bathroom
                option: Släckt

        # --------------------------------------------------
        # SLÄCK NÄR DET ÄR FÖR LJUST
        # --------------------------------------------------
        - conditions:
            - condition: numeric_state
              entity_id: sensor.kokets_ljusniva
              above: 150
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.light_bathroom
                option: Släckt

        # --------------------------------------------------
        # NATT – NÄRVARO + HEMMA AV + MÖRKT
        # --------------------------------------------------
        - conditions:
            - condition: state
              entity_id: binary_sensor.motion_sensor
              state: 'on'
            - condition: state
              entity_id: input_select.home_status
              state: 'Hemma av'
            - condition: numeric_state
              entity_id: sensor.kokets_ljusniva
              below: 100
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.light_bathroom
                option: Natt närvaro

        # --------------------------------------------------
        # NATT NÄRVARO → SLÄCKT (timeout)
        # --------------------------------------------------
        - conditions:
            - condition: state
              entity_id: binary_sensor.motion_sensor
              state: 'off'
            - condition: state
              entity_id: input_select.light_bathroom
              state: 'Natt närvaro'
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.light_bathroom
                option: Släckt

        # --------------------------------------------------
        # DAG – HEMMA PÅ + MÖRKT
        # --------------------------------------------------
        - conditions:
            - condition: state
              entity_id: input_select.home_status
              state: 'Hemma på'
            - condition: numeric_state
              entity_id: sensor.kokets_ljusniva
              below: 100
            - condition: state
              entity_id: binary_sensor.motion_sensor
              state: 'off'
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.light_bathroom
                option: Dag

        # --------------------------------------------------
        # DAG → DAG NÄRVARO
        # --------------------------------------------------
        - conditions:
            - condition: state
              entity_id: binary_sensor.motion_sensor
              state: 'on'
            - condition: state
              entity_id: input_select.light_bathroom
              state: 'Dag'
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.light_bathroom
                option: Dag närvaro

        # --------------------------------------------------
        # DAG NÄRVARO → DAG (timeout)
        # --------------------------------------------------
        - conditions:
            - condition: state
              entity_id: binary_sensor.motion_sensor
              state: 'off'
            - condition: state
              entity_id: input_select.light_bathroom
              state: 'Dag närvaro'
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.light_bathroom
                option: Dag

        # --------------------------------------------------
        # HEMMA AV → HEMMA PÅ (NATT → DAG NÄRVARO)
        # --------------------------------------------------
        - conditions:
            - condition: state
              entity_id: input_select.home_status
              state: 'Hemma på'
            - condition: state
              entity_id: input_select.light_bathroom
              state: 'Natt närvaro'
          sequence:
            - service: input_select.select_option
              data:
                entity_id: input_select.light_bathroom
                option: Dag närvaro
