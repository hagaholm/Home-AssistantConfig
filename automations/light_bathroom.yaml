
#######################################################
#                                                     #
#                BADRUMSBELYSNING AUTOMATION          #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Automatiserat belysningssystem för köket som styrs av Aqara FP2-närvarosensorer och hemstatus.
#
# HÅRDVARA:
# - Aqara FP2 närvarosensor med 3 zoner:
#   * Zone 1 (sensor_1): Övergripande köksnärvaro
#   * Zone 2 (sensor_2): Köksbord
#   * Zone 3 (sensor_3): Köksbänk
#
# FUNKTIONALITET:
# 1. SLÄCK BELYSNING:
#    - Om ingen närvaro i hela köket (sensor_1 = off):
#      * Sätter input_select.light_kitchen till 'Släckt' om den inte redan är det.
# 2. TÄND 25%:
#    - Om närvaro i hela köket (sensor_1 = on) och home_status = 'Hemma av':
#      * Sätter input_select.light_kitchen till 25%.
# 3. TÄND 50%:
#    - Om närvaro i hela köket (sensor_1 = on) och home_status är 'Hemma på' eller 'Borta' samt input_boolean.morning_light_on är på:
#      * Sätter input_select.light_kitchen till 50%.
# 4. TÄND 100%:
#    - Om närvaro vid köksbord (sensor_2) eller köksbänk (sensor_3) och home_status är 'Hemma på' eller 'Borta' samt input_boolean.kitchen_light_on är på:
#      * Sätter input_select.light_kitchen till 100%.
#
# SÄKERHETSKONTROLLER:
# - Kontroll av att lampor inte redan är släckta innan släckning.
# - Kontroll av hemstatus och kitchen_light_on innan tändning.
#
# INTEGRATION:
# - Styrs via input_select.light_kitchen (Släckt/25%/100%)
# - Aktiveras/inaktiveras via input_boolean.kitchen_light_on
# - Hemstatus från input_select.home_status
####################################################


#######################################################
#                                                     #
#            AUTOMATIONER FÖR BADRUMSBELYSNING        #
#                                                     #
#######################################################


# --------------------------------------------
# SLÄCK BADRUMSBELYSNING I FÖNSTRET VID BORTA
# --------------------------------------------
- alias: Badrumsbelysning i fönster av när borta
  id: 'bathroom_light_off_when_away'
  description: >
    Släcker badrumsbelysning i fönstret när borta.
    Sätter input_select.light_kitchen till 'Släckt' om den inte redan är det.
  mode: single
  trigger:
    - platform: state
      entity_id: input_select.home_status
      to: 'Hemma av'
  condition:
  action:
    - service: light.turn_off
      entity_id: light.fonster_spott


# ----------------------------------------------------------------
# SLÄCK BADRUMSBELYSNING I FÖNSTRET VID INGEN NÄRVARO OCH HEMMA AV
# ----------------------------------------------------------------
- alias: Badrumsbelysning i fönster av (ingen närvaro)
  id: 'bathroom_light_off_no_presence_home_off'
  description: >
    Släcker badrumsbelysning i fönstret när ingen närvaro i badrummet (motion_sensor = off) och home_status är 'Hemma av'.
    Sätter input_select.light_kitchen till 'Släckt' om den inte redan är det.
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.motion_sensor
      to: 'off'
      for:
        seconds: 60
  condition:
    - condition: state
      entity_id: input_select.home_status
      state: 'Hemma av'
  action:
    - service: light.turn_off
      entity_id: light.fonster_spott


# ------------------------------------------------
# TÄND NATT BELYSNING VID NÄRVARO I BADRUMMET VID HEMMA AV
# ------------------------------------------------
- alias: Badrumsbelysning fönster natt
  id: 'bathromm_light_night_presence'
  description: >
    Sätter badrumsbelysning i fönstret till natt läge (motion_sensor = on)
    och home_status är 'Hemma av'.
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.motion_sensor
      to: 'on'
  condition:
    - condition: state
      entity_id: input_select.home_status
      state: 'Hemma av'
    - condition: state
      entity_id: light.fonster_spott
      state: "off"
  action:
    - service: light.turn_on
      data:
        entity_id: light.fonster_spott
        brightness_pct: 2
#        transition: 2
