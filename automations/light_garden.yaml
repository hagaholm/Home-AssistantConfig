#######################################################
#                                                     #
#            TRÄDGÅRDSBELYSNING AUTOMATION            #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Samlad automation för trädgårdsbelysning baserat på
# ljusnivå, tid på dygnet och hemstatus.
# Hanterar både tändning och släckning i samma automation.
#
# HÅRDVARA:
# - Ljussensor: sensor.ljusstyrka
# - Trädgårdsswitch: switch.tradgard
# - Hemstatus: input_select.home_status
# - Innebelysning: light.kok_lilla_fonstret
#
# TRIGGRAR:
# - Hemstatus ändras till 'Hemma på'
# - Ljusnivå under 40 lux (mörkt)
# - Ljusnivå över 60 lux (ljust)
# - Innebelysning släcks
#
# LOGIK:
# TÄND:
# - Morgon (05:00-12:00): När hemma på och mörkt
# - Eftermiddag/kväll (12:00-05:00): När hemma på och mörkt
# - Borta (12:00-05:00): När borta och mörkt (säkerhet)
#
# SLÄCK:
# - När det blir ljust (>60 lux)
# - Kväll (21:00-06:00): När inne släcks och hemma
#
# INTEGRATION:
# - Styrs via input_select.light_garden
# - Samordnas med innebelysning
#######################################################


#######################################################
#                                                     #
#        AUTOMATIONER FÖR TRÄDGÅRDSBELYSNING          #
#                                                     #
#######################################################

  - alias: Trädgårdsbelysning
    id: '1735304100017'
    mode: single

    trigger:
      - platform: state
        entity_id: input_select.home_status
        to: 'Hemma på'
      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        below: input_number.ljusstyrka_40
      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        above: input_number.ljusstyrka_60
      - platform: state
        entity_id: light.kok_lilla_fonstret
        to: 'off'

    action:
      - choose:
          # Turn ON scenarios
          - alias: Tänd - Morgon när någon är hemma
            conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma på'
              - condition: time
                after: '05:00:00'
                before: '12:00:00'
              - condition: numeric_state
                entity_id: sensor.ljusstyrka
                below: input_number.ljusstyrka_40
              - condition: state
                entity_id: switch.tradgard
                state: 'off'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_garden
                  option: Tänt

          - alias: Tänd - Hemma eftermiddag och kväll
            conditions:
              - condition: time
                after: '12:00:00'
                before: '05:00:00'
              - condition: numeric_state
                entity_id: sensor.ljusstyrka
                below: input_number.ljusstyrka_40
              - condition: state
                entity_id: group.track_for_home_devices
                state: 'home'
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma på'
              - condition: state
                entity_id: switch.tradgard
                state: 'off'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_garden
                  option: Tänt

          - alias: Tänd - Borta eftermiddag och kväll
            conditions:
              - condition: time
                after: '12:00:00'
                before: '05:00:00'
              - condition: numeric_state
                entity_id: sensor.ljusstyrka
                below: input_number.ljusstyrka_40
              - condition: state
                entity_id: group.track_for_home_devices
                state: 'not_home'
              - condition: state
                entity_id: switch.tradgard
                state: 'off'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_garden
                  option: Tänt

          # Turn OFF scenarios
          - alias: Släck - Ljust ute
            conditions:
              - condition: numeric_state
                entity_id: sensor.ljusstyrka
                above: input_number.ljusstyrka_60
              - condition: state
                entity_id: switch.tradgard
                state: 'on'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_garden
                  option: Släckt

          - alias: Släck - Inne släcks på kvällen
            conditions:
              - condition: time
                after: '21:00:00'
                before: '06:00:00'
              - condition: state
                entity_id: group.track_for_home_devices
                state: 'home'
              - condition: state
                entity_id: switch.tradgard
                state: 'on'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_garden
                  option: Släckt
