#######################################################
#                                                     #
#        NIGHT LIGHTING AUTOMATION                    #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 2.0
# Författare: Home Assistant Config
#
# BESKRIVNING:
# Samlad automation för nattbelysning.
# Tänder/släcker ljus baserat på rörelse i kök
# när status är 'Hemma av' och dagsljus är på.
#
# HÅRDVARA/ENTITETER:
# - binary_sensor.kok_narvaro
# - input_select.light_inside
# - input_select.home_status
# - input_boolean.daylight_on
#
# TRIGGRAR:
# - binary_sensor.kok_narvaro -> 'on' (tänd)
# - binary_sensor.kok_narvaro -> 'off' (släck)
#
# VILLKOR:
# - Tänd: home_status='Hemma av' OCH daylight_on='on'
# - Släck: home_status='Hemma av'
#
# LOGIK:
# - Rörelse i kök nattetid tänder nattbelysning
# - När rörelsen upphör släcks ljuset
# - Endast aktivt när status är 'Hemma av'
#
# KONSOLIDERINGSHISTORIK:
# - Nattbelysning on (ID: 7188810450138)
# - Nattbelysning off (ID: 2393518316319)
# Konsoliderad: 2025-12-27
# Behållet ID: 7188810450138
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga separata automationer
# v2.0 (2025-12-27): Konsoliderade on/off i en automation
#######################################################


  - alias: Nattbelysning styrning
    id: '7188810450138'
    mode: single

    trigger:
      # Tänd vid rörelse
      - platform: state
        entity_id: binary_sensor.kok_narvaro
        to: 'on'
        id: motion_on

      # Släck när rörelse upphör
      - platform: state
        entity_id: binary_sensor.kok_narvaro
        to: 'off'
        id: motion_off

    action:
      - choose:
          # TÄND NATTBELYSNING
          - alias: Tänd nattbelysning vid rörelse
            conditions:
              - condition: trigger
                id: motion_on
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma av'
              - condition: state
                entity_id: input_boolean.daylight_on
                state: 'on'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Nattbelysning

          # SLÄCK NATTBELYSNING
          - alias: Släck nattbelysning efter rörelse
            conditions:
              - condition: trigger
                id: motion_off
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma av'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Släckt
