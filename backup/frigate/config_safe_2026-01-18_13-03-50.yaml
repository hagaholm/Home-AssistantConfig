mqtt:
  enabled: true
  host: 192.168.1.9
  user: ***MASKED***
  password: ***MASKED***

detectors:
  coral:
    type: edgetpu
    device: usb
    power_mode: max

ffmpeg:
  hwaccel_args: preset-vaapi

record:
  enabled: true
  sync_recordings: true
  retain:
    days: 0
    mode: all
  alerts:
    retain:
      days: 10
    pre_capture: 10
    post_capture: 10
  detections:
    retain:
      days: 10
    pre_capture: 10
    post_capture: 10
snapshots:
  enabled: false
  timestamp: true
  bounding_box: true
  retain:
    default: 10

birdseye:
  enabled: true
  mode: continuous
  restream: false

go2rtc:
  streams:
    # Camera 1 - RLC-420-5MP (disabled but defined for future use)
    cam1:
      - rtsp://***MASKED***/h264Preview_01_main
    cam1_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 3 - RLC-1220A (12MP camera)
    cam3:
      - rtsp://***MASKED***/h264Preview_01_main
    cam3_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 5 - RLC-1224A (12MP with spotlight)
    cam5:
      - rtsp://***MASKED***/h264Preview_01_main
    cam5_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 6 - RLC-1224A (12MP with spotlight)
    cam6:
      - rtsp://***MASKED***/h264Preview_01_main
    cam6_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 7 - RLC-820A (8MP camera)
    cam7:
      - rtsp://***MASKED***/h264Preview_01_main
    cam7_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 8 - RLC-1224A (12MP with spotlight)
    cam8:
      - rtsp://***MASKED***/h264Preview_01_main
    cam8_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

cameras:
#################################################################################
#################################################################################
#################################################################################
  cam1: # Reolink Kamera 1 RLC-420-5MP
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam1
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/cam1sub
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
    detect:
      enabled: false
      fps: 5
      width: 2024
      height: 1536
    objects:
      track:
        - person
        - bear
        - cat
        - cow
        - dog
#        - elephant
#        - giraffe
        - horse
        - sheep
#        - zebra
    motion:
      enabled: true
      threshold: 50
      contour_area: 10

      mask: 0.006,0.952,0.006,0.981,0.37,0.981,0.372,0.95
    zones:
      Uteplats:
        coordinates: 
          0,0.217,0.003,0.995,0.541,0.995,0.827,0.233,0.825,0,0.387,0,0.34,0.052
        loitering_time: 1
        objects: person
        inertia: 3
    review:
      alerts:
        labels:
          - person
        required_zones: Uteplats
      detections:
        labels:
          - bear
          - cat
          - cow
          - dog
#          - elephant
#          - giraffe
          - horse
          - sheep
#          - zebra

