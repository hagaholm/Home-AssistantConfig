mqtt:
  enabled: true
  host: 192.168.1.9
  user: ***MASKED***
  password: ***MASKED***

detectors:
  coral:
    type: edgetpu
    device: usb
    power_mode: max

ffmpeg:
  hwaccel_args: preset-vaapi

record:
  enabled: true
  sync_recordings: true
  alerts:
    retain:
      days: 10
    pre_capture: 10
    post_capture: 10
  detections:
    retain:
      days: 10
    pre_capture: 10
    post_capture: 10
snapshots:
  enabled: false
  timestamp: true
  bounding_box: true
  retain:
    default: 10

birdseye:
  enabled: true
  mode: continuous
  restream: false

face_recognition:
  enabled: true
  model_size: small

go2rtc:
  streams:
    # Camera 5 - RLC-1224A (12MP with spotlight)
    cam5:
      - rtsp://***MASKED***/h264Preview_01_main
    cam5_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 6 - RLC-1224A (12MP with spotlight)
    cam6:
      - rtsp://***MASKED***/h264Preview_01_main
    cam6_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 8 - RLC-1224A (12MP with spotlight)
    cam8:
      - rtsp://***MASKED***/h264Preview_01_main
    cam8_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 9 - RLC-1240A (12MP with spotlight)
    cam9:
      - rtsp://***MASKED***/h264Preview_01_main
      - ffmpeg:cam9#audio=aac   # Detta tvingar fram en omkodning av ljudet till AAC
    cam9_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

    # Camera 10 - RLC-1240A (12MP with spotlight)
    cam10:
      - rtsp://***MASKED***/h264Preview_01_main
      - ffmpeg:cam9#audio=aac   # Detta tvingar fram en omkodning av ljudet till AAC
    cam10_sub:
      - rtsp://***MASKED***/h264Preview_01_sub

