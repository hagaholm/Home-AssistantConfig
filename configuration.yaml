default_config:

####################################################
#                                                  #
#                 HOME ASSISTANT                   #
#                                                  #
####################################################
# https://home-assistant.io/docs/configuration/basic/

homeassistant:
  # Name of the location where Home Assistant is running
  name: Home
  # Location required to calculate the time the sun rises and sets
  latitude: !secret latitude
  longitude: !secret longitude
  # Impacts weather/sunrise data (altitude above sea level in meters)
  elevation: 34
  # Country in which Home Assistant is running
  country: SE
  # metric for Metric, imperial for Imperial
  unit_system: metric
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: !secret time_zone
  # Customization file
  customize: !include customize.yaml
  # Packages - explicitly included from packages.yaml
  packages: !include packages.yaml

  media_dirs:
    local: /media
    
  allowlist_external_dirs:
    - /config
    - /media
        
####################################################
#                                                  #
#                     GENERAL                      #
#                                                  #
####################################################
api:
system_health:
frontend:
config:
http:
conversation:
sun:
python_script:

####################################################
#                                                  #
#                      LOGGING                     #
#                                                  #
####################################################
recorder: !include logging/recorder.yaml
logbook: !include logging/logbook.yaml
logger: !include logging/logger.yaml

###################################################
#                                                 #
#                     lovelace                    #
#                                                 #
###################################################
# https://www.home-assistant.io/lovelace/yaml-mode/
lovelace:
  mode: storage
#  mode: yaml

  # Add more dashboards
  dashboards:
    # Standard
    lovelace-standard:
      mode: yaml
      title: Standard
      show_in_sidebar: true
      filename: ui-lovelace.yaml

    # Kamera
    lovelace-camera:
      mode: yaml
      title: Kamera
      show_in_sidebar: true
      filename: ui-camera.yaml

    # Automation
    lovelace-automation:
      mode: yaml
      title: Automation
      show_in_sidebar: true
      filename: ui-automation.yaml

    # Automation
    lovelace-automation-v2:
      mode: yaml
      title: Automation v2
      show_in_sidebar: true
      filename: ui-automation-v2.yaml
    
    # Ventilaton
    lovelace-ventilation:
      mode: yaml
      title: Ventilation
      show_in_sidebar: true
      filename: ui-ventilation.yaml

    # Climate (ventilation + friggebod + förråd)
    lovelace-climate:
      mode: yaml
      title: Klimat
      show_in_sidebar: true
      filename: ui-climate.yaml

    # Lights
    lovelace-lights:
      mode: yaml
      title: Lights
      show_in_sidebar: true
      filename: ui-lights.yaml

    # Documentation
    lovelace-documentation:
      mode: yaml
      filename: documentation.ui
      title: Documentation
      icon: mdi:book-open-page-variant
      show_in_sidebar: true
      require_admin: true

    # Generated - flat (one view per source YAML file)
    lovelace-generated-flat:
      mode: yaml
      filename: generated_ui/ui-generated-flat.yaml
      title: Generated (Flat)
      icon: mdi:view-list
      show_in_sidebar: true
      require_admin: true

    # Generated - grouped (one view per category)
    lovelace-generated-grouped:
      mode: yaml
      filename: generated_ui/ui-generated-grouped.yaml
      title: Generated (Grouped)
      icon: mdi:view-grid
      show_in_sidebar: true
      require_admin: true

    # Generated - entity types (one view per entity type)
    lovelace-generated-entity-types:
      mode: yaml
      filename: generated_ui/ui-generated-entity-types.yaml
      title: Generated (Entity Types)
      icon: mdi:shape-outline
      show_in_sidebar: true
      require_admin: true


####################################################
#                                                  #
#      LINKS TO INDIVUAL CONFIGURATION FILES       #
#                                                  #
####################################################
automation: !include_dir_merge_list automations/
sensor: !include_dir_merge_list sensor
group: !include_dir_merge_named group
script: !include_dir_merge_named script

####################################################
#                                                  #
#            END OF CONFIGURATION FILE             #
#                                                  #
####################################################

