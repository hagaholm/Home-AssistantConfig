default_config:

####################################################
#                                                  #
#                 HOME ASSISTANT                   #
#                                                  #
####################################################
# https://home-assistant.io/docs/configuration/basic/

homeassistant:
  # Name of the location where Home Assistant is running
  name: Home
  # Location required to calculate the time the sun rises and sets
  latitude: !secret latitude
  longitude: !secret longitude
  # Impacts weather/sunrise data (altitude above sea level in meters)
  elevation: 34
  # Country in which Home Assistant is running
  country: SE
  # metric for Metric, imperial for Imperial
  unit_system: metric
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: !secret time_zone
  # Customization file
  customize: !include customize.yaml
  # Package folder
  packages: !include_dir_named packages

  media_dirs:
    local: /media
    
  allowlist_external_dirs:
    - /config
    - /media
        
####################################################
#                                                  #
#                     GENERAL                      #
#                                                  #
####################################################
api:
system_health:
frontend:
config:
http:
conversation:
sun:
python_script:

####################################################
#                                                  #
#                      LOGGING                     #
#                                                  #
####################################################
recorder: !include logging/recorder.yaml
logbook: !include logging/logbook.yaml
logger: !include logging/logger.yaml

###################################################
#                                                 #
#                     lovelace                    #
#                                                 #
###################################################
# https://www.home-assistant.io/lovelace/yaml-mode/
lovelace:
  mode: storage
#  mode: yaml

  # Add more dashboards
  dashboards:
    # Standard
    lovelace-standard:
      mode: yaml
      title: Standard
      show_in_sidebar: true
      filename: ui-lovelace.yaml

    # Kamera
    lovelace-camera:
      mode: yaml
      title: Kamera
      show_in_sidebar: true
      filename: ui-camera.yaml

    # Automation
    lovelace-automation:
      mode: yaml
      title: Automation
      show_in_sidebar: true
      filename: ui-automation.yaml

    # Automation
    lovelace-automation-v2:
      mode: yaml
      title: Automation v2
      show_in_sidebar: true
      filename: ui-automation-v2.yaml
    
    # Ventilaton
    lovelace-ventilation:
      mode: yaml
      title: Ventilation
      show_in_sidebar: true
      filename: ui-ventilation.yaml

    # Climate (ventilation + friggebod + garage)
    lovelace-climate:
      mode: yaml
      title: Klimat
      show_in_sidebar: true
      filename: ui-climate.yaml

    # Lights
    lovelace-lights:
      mode: yaml
      title: Lights
      show_in_sidebar: true
      filename: ui-lights.yaml

    # Packages - Simple (one view per folder)
    lovelace-packages-simple:
      mode: yaml
      title: Packages (Simple)
      show_in_sidebar: true
      filename: ui-packages-simple.yaml
      icon: mdi:folder-multiple

    # Packages - Grouped (domain-focused)
    lovelace-packages-grouped:
      mode: yaml
      title: Packages (Grouped)
      show_in_sidebar: true
      filename: ui-packages-grouped.yaml
      icon: mdi:puzzle-multiple

    # Packages - Detailed (subsections per file)
    lovelace-packages-detailed:
      mode: yaml
      title: Packages (Detailed)
      show_in_sidebar: true
      filename: ui-packages-detailed.yaml
      icon: mdi:file-tree

    # Generated
    lovelace-generated: # Needs to contain a hyphen (-)
      mode: yaml
      filename: notexist.yaml
      title: Generated
      icon: mdi:tools
      show_in_sidebar: false
      require_admin: true

####################################################
#                                                  #
#      LINKS TO INDIVUAL CONFIGURATION FILES       #
#                                                  #
####################################################
automation: !include_dir_merge_list automations/
sensor: !include_dir_merge_list sensor
group: !include_dir_merge_named group
script: !include_dir_merge_named script

####################################################
#                                                  #
#            END OF CONFIGURATION FILE             #
#                                                  #
####################################################

