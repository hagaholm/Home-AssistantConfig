esphome:
  name: esphome-web-37a3e8
  friendly_name: ESPHome Web 37a3e8
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Pimoroni BME680
# Titta noga på texten på det lilla svarta kortet (oftast bredvid pinnarna):
#   + (Plus)  --> Koppla till 3.3V (eller 3V3) på ESP32.
#   - (Minus) --> Koppla till GND på ESP32.
#   D (Data)  --> Koppla till GPIO 4 (Detta är SDA).
#   C (Clock) --> Koppla till GPIO 5 (Detta är SCL).

i2c:
  sda: GPIO4   # Kopplas till "D" på sensorn
  scl: GPIO5   # Kopplas till "C" på sensorn
  scan: true
  frequency: 100kHz

sensor:
  - platform: bme680
    temperature:
      name: "Temperatur"
    humidity:
      name: "Luftfuktighet"
    pressure:
      name: "Lufttryck"
    gas_resistance:
      name: "Gasresistans"
    address: 0x76     # Pimoroni standard
    update_interval: 30s