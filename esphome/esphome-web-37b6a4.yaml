esphome:
  name: esphome-web-37b6a4
  friendly_name: ESPHome Web 37b6a4
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

bluetooth_proxy:
  active: true

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: wifi_signal
    name: "ESP32 Bathroom WiFi Signal dBm"
    update_interval: 60s
