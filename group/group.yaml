# Device tracker grouping for home/away detection
# Combines multiple device trackers used by person entities
# Documentation: https://www.home-assistant.io/integrations/group/
#
# Purpose:
# - Aggregate presence sources to simplify conditions
# - Used by home/away automations as a single entity
# - Mirrors devices mapped in packages/person.yaml

track_for_home_devices:
  name: Enheter för kontroll om hemma
  entities:
    - device_tracker.mikaels_a52s # Mickes mobil
    - device_tracker.annelies_galaxy_a71 # Annelies mobil

    - device_tracker.louises_a54 # Louises mobil
    - device_tracker.62_57_81_af_f2_a1 # Andreas mobil (ny)
    - device_tracker.mobil_erik # Eriks mobil
