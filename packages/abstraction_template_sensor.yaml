  # -------------------
  # Uterum Sensors (LUMI Weather.3)
  # -------------------
  - sensor:
      # Source: LUMI lumi.weather.3 (Uterum)
      # Company: LUMI
      # Type: Temperature, Humidity, Pressure sensor
      - name: "Uterum Temperatur"
        unique_id: uterum_lumi_weather_temperature_3
        state: "{{ states('sensor.lumi_lumi_weather_temperature_3') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        attributes:
          source_sensor: sensor.lumi_lumi_weather_temperature_3
          icon: mdi:thermometer
          friendly_name: Uterum Temperatur

      - name: "Uterum Luftfuktighet"
        unique_id: uterum_lumi_weather_humidity_3
        state: "{{ states('sensor.lumi_lumi_weather_humidity_3') }}"
        unit_of_measurement: "%"
        device_class: humidity
        attributes:
          source_sensor: sensor.lumi_lumi_weather_humidity_3
          icon: mdi:water-percent
          friendly_name: Uterum Luftfuktighet

      - name: "Uterum Lufttryck"
        unique_id: uterum_lumi_weather_pressure_3
        state: "{{ states('sensor.lumi_lumi_weather_pressure_3') }}"
        unit_of_measurement: "hPa"
        device_class: pressure
        attributes:
          source_sensor: sensor.lumi_lumi_weather_pressure_3
          icon: mdi:gauge
          friendly_name: Uterum Lufttryck

