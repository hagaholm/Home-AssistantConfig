#######################################################
#                                                     #
#         UTERUM TEMPERATURLARM AUTOMATION           #
#                                                     #
#######################################################

  - alias: Uterum larm hög temp
    id: '4622609198485'
    mode: single

    trigger:
      - platform: numeric_state
        entity_id: sensor.uterum_temperatur
        above: 35
        for: "00:10:00"

    condition:
      - condition: template
        value_template: "{{ not is_state('sensor.uterum_temperatur','unknown') }}"

    action:
      - service: notify.mobile_app_sm_a528b
        data:
          title: "LARM! Uterum - hög temperatur"
          message: >
            {% set t = states('sensor.uterum_temperatur')|float(0) %}
            {% set unit = state_attr('sensor.uterum_temperatur','unit_of_measurement') %}
            LARM! Hög temp i Uterum: {{ t }} {{ unit }}
            Nivå: {% if t > 40 %}Mycket hög{% elif t > 37 %}Hög{% else %}Mild{% endif %}
