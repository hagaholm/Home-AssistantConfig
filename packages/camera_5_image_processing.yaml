#####################
### Input Boolean ###
#####################
input_boolean:
  camera_5_active:
    name: Camera 5 aktiv
    initial: off
  camera_5_animal_detected:
    name: Camera 5 animal detected
    initial: off
  camera_5_person_detected:
    name: Camera 5 person detected
    initial: off


##################
### Input Text ###
##################
input_text:
  camera_5_person_time_fired:
    name: Camera 5 person time fired
  camera_5_person_confidence:
    name: Camera 5 person confidence
  camera_5_person_saved_file:
    name: Camera 5 person saved file
  camera_5_person_file_name:
    name: Camera 5 person file name

  camera_5_animal_time_fired:
    name: Camera 5 animal time fired
  camera_5_animal_confidence:
    name: Camera 5 animal confidence
  camera_5_animal_saved_file:
    name: Camera 5 animal saved file
  camera_5_animal_file_name:
    name: Camera 5 animal file name

  camera_5_trigger_light_on:
    name: Camera 5 trigger light on
    initial: "20.00"
  camera_5_trigger_image_day:
    name: Camera 5 trigger image day
    initial: "50.00"
  camera_5_trigger_image_night:
    name: Camera 5 trigger image night
    initial: "40.00"

#############
### Timer ###
#############
timer:
  # Used for control when person or animal is detected
  timer_camera_5_animal_detected:
    name: Timer camera 5 animal detected
    duration: '00:00:30'
  timer_camera_5_person_detected:
    name: Timer camera 5 person detected
    duration: '00:00:30'

##############
### Sensor ###
##############
sensor:
  - platform: template
    sensors:
      camera_5_person:
        friendly_name: "Person"
        unit_of_measurement: "persons"
        value_template: >-
          {% set summary = (state_attr('image_processing.deepstack_camera_5', 'summary')) %}
          {% if summary.person is defined %}
            {{ summary.person }}
          {% else %}
            0
          {% endif %}

      camera_5_animal:
        friendly_name: "Animal"
        unit_of_measurement: "animals"
        value_template: >-
          {% set summary = (state_attr('image_processing.deepstack_camera_5', 'summary')) %}
          {% if summary.animal is defined %}
            {{ summary.animal }}
          {% else %}
            0
          {% endif %}


########################
### Image processing ###
########################
image_processing:
  - platform: deepstack_object
    ip_address: localhost
    port: 5000
    api_key: !secret deepstack_password
    save_file_folder: /config/camera/deepstack_photo/
    save_timestamped_file: True
    targets:
      - target: person
        confidence: 20
      - target: animal
        confidence: 20
    source:
      - entity_id: camera.kamera5_clear
        name: deepstack_camera_5
    timeout: 5


##############
### Camera ###
##############
camera:
  # Keep latest image of a detected person day
  - platform: local_file
    name: Camera 5 Latest person
    file_path: /media/0/Day/camera_5_latest.jpg

  # Keep latest image of a detected person away
  - platform: local_file
    name: Camera 5 Latest person away
    file_path: /media/0/Away/camera_5_latest.jpg

  # Keep latest image of a detected person night
  - platform: local_file
    name: Camera 5 Latest person night
    file_path: /media/0/Night/camera_5_latest.jpg

  # Keep latest image of a detected animal day
  - platform: local_file
    name: Camera 5 Latest animal
    file_path: /media/0/animal/camera_5_latest.jpg


#####################
### Shell command ###
#####################
shell_command:
  # Used by automation Camera 5 copy file
  camera_5_cp_deepstack: "cp -f {{source_file}} {{dest_file}}"
  # Used by automation Camera 5 move file
  camera_5_mv_deepstack: "mv -f {{source_file}} {{dest_file}}"


##################
### Automation ###
##################
automation:
  ###############################################
  ### At startup:                             ###
  ### Turn off: input_boolean.camera_5_active ###
  ### Wait 10 sec                             ###
  ### Turn on input_boolean.camera_5_active   ###
  ###############################################
  - alias: Camera 5 startup
    id: '9556319091599' 
    mode: single

    trigger:
      - platform: homeassistant
        event: start

    action:
      - service: input_boolean.turn_off
        data:
          entity_id: input_boolean.camera_5_active

      - delay:
          seconds: 10

      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.camera_5_active

  ###############################################
  ### At shutdown:                            ###
  ### Turn off: input_boolean.camera_5_active ###
  ###############################################
  - alias: Camera 5 shutdown
    id: '5924169939928' 
    mode: single

    trigger:
      - platform: homeassistant
        event: shutdown

    action:
      - service: input_boolean.turn_off
        data:
          entity_id: input_boolean.camera_5_active

  ###################################################################################
  ### Start image processing, scan images for detection of object                 ###
  ### If input_boolean.camera_5_active == on                                      ###
  ### Get dynamic delay from input_number.camera_duration before image processing ###
  ### Restart the automation when done                                            ###
  ###################################################################################
  - alias: Camera 5 Image processing
    id: '0099648445442' 
    mode: single
    
    trigger:
      - platform: time_pattern
        seconds: /2
    
    action:
      # Add dynamic delay. input_number.camera_duration is controlled by another automation
      - delay: 
          milliseconds: "{{ states('input_number.camera_duration') }}"

      # Scan a new image
      - service: image_processing.scan
        entity_id: image_processing.deepstack_camera_5

  ################################
  ### Camera 5 Animal detected ###
  ################################
  - alias: Camera 5 Animal detected
    id: '8116220452311' 
    mode: single

    # Object detected
    trigger:
      - platform: event
        event_type: deepstack.object_detected

   # Need to be an animal and no person on the image from camera 5
    condition:
      condition: and
      conditions:

        # Needs to be image processing from camera 5
        - condition: template
          value_template: >
            {{ trigger.event.data.entity_id == 'image_processing.deepstack_camera_5' }}

        # Animal on image is needed
        - condition: template
          value_template: >
            {{ trigger.event.data.object_type == 'animal' }}

        # Person on image is not allowed as it will be handled in another automation
        - condition: template
          value_template: >
            {{ trigger.event.data.object_type != 'person' }}

    action:
      # Get timestamp when animal detected, just for information
      - service: input_text.set_value
        entity_id: input_text.camera_5_animal_time_fired
        data_template:
          value: '{{ trigger.event.data.saved_file[50:-4] }}'

      # Get confidence, just for information
      - service: input_text.set_value
        entity_id: input_text.camera_5_animal_confidence
        data_template:
          value: '{{ trigger.event.data.confidence }}'

      # Get saved file
      - service: input_text.set_value
        entity_id: input_text.camera_5_animal_saved_file
        data_template:
          value: '{{ trigger.event.data.saved_file }}'

      # Get file name
      - service: input_text.set_value
        entity_id: input_text.camera_5_animal_file_name
        data_template:
          value: '{{ trigger.event.data.saved_file[41:] }}'

  ################################
  ### Camera 5 Person detected ###
  ################################
  - alias: Camera 5 Person detected
    id: '8116220452312' 
    mode: single

    # Object detected
    trigger:
      - platform: event
        event_type: deepstack.object_detected

   # Need to be a person on the image from camera 5
    condition:
      condition: and
      conditions:

        # Needs to be image processing from camera 5
        - condition: template
          value_template: >
            {{ trigger.event.data.entity_id == 'image_processing.deepstack_camera_5' }}

        # Person on image is needed
        - condition: template
          value_template: >
            {{ trigger.event.data.object_type == 'person' }}

    action:
      # Get timestamp when person detected, just for information
      - service: input_text.set_value
        entity_id: input_text.camera_5_person_time_fired
        data_template:
          value: '{{ trigger.event.data.saved_file[50:-4] }}'

      # Get confidence, just for information
      - service: input_text.set_value
        entity_id: input_text.camera_5_person_confidence
        data_template:
          value: '{{ trigger.event.data.confidence }}'

      # Get saved file
      - service: input_text.set_value
        entity_id: input_text.camera_5_person_saved_file
        data_template:
          value: '{{ trigger.event.data.saved_file }}'

      # Get file name
      - service: input_text.set_value
        entity_id: input_text.camera_5_person_file_name
        data_template:
          value: '{{ trigger.event.data.saved_file[41:] }}'

  #########################################
  ### Camera 5 Animal is confidence day ###
  #########################################
  - alias: Camera 5 Animal is confidence day
    id: '1416857464757' 
    mode: single

    trigger:
      - platform: state
        entity_id: input_text.camera_5_animal_confidence

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >
            {{ states('input_text.camera_5_animal_confidence') | float > states('input_text.camera_5_trigger_image_day') | float }}

        - condition: state
          entity_id: switch.kamera5_infra_red_lights_in_night_mode
          state: 'off'

    action:
      # Delay 1 sec to be sure the images is saved
      - delay:
          milliseconds: 1000

      # Animal is detected
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.camera_5_animal_detected

      # Move images to correct /media folder
      - data:
          source_file: "{{ states('input_text.camera_5_animal_saved_file') }}"
          dest_file: "/media/0/animal/camera_5_latest.jpg"
        service: shell_command.camera_5_cp_deepstack
      - data:
          source_file: "{{ states('input_text.camera_5_animal_saved_file') }}"
          dest_file: "/media/0/animal/{{ states('input_text.camera_5_animal_file_name') }}"
        service: shell_command.camera_5_mv_deepstack

  ###########################################
  ### Camera 5 Animal is confidence night ###
  ###########################################
  - alias: Camera 5 Animal is confidence night 
    id: '1416857464758' 
    mode: single

    trigger:
      - platform: state
        entity_id: input_text.camera_5_animal_confidence

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >
            {{ states('input_text.camera_5_animal_confidence') | float > states('input_text.camera_5_trigger_image_night') | float }}

        - condition: state
          entity_id: switch.kamera5_infra_red_lights_in_night_mode
          state: 'on'

    action:
      # Delay 1 sec to be sure the images is saved
      - delay:
          milliseconds: 1000

      # Animal is detected
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.camera_5_animal_detected

      # Move images to correct /media folder
      - data:
          source_file: "{{ states('input_text.camera_5_animal_saved_file') }}"
          dest_file: "/media/0/animal/camera_5_latest.jpg"
        service: shell_command.camera_5_cp_deepstack
      - data:
          source_file: "{{ states('input_text.camera_5_animal_saved_file') }}"
          dest_file: "/media/0/animal/{{ states('input_text.camera_5_animal_file_name') }}"
        service: shell_command.camera_5_mv_deepstack

  #########################################
  ### Camera 5 Person is confidence day ###
  #########################################
  - alias: Camera 5 Person is confidence day
    id: '1416857464759' 
    mode: single

    trigger:
      - platform: state
        entity_id: input_text.camera_5_person_confidence

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >
            {{ states('input_text.camera_5_person_confidence') | float > states('input_text.camera_5_trigger_image_day') | float }}

        - condition: state
          entity_id: switch.kamera5_infra_red_lights_in_night_mode
          state: 'off'

    action:
      # Delay 1 sec to be sure the images is saved
      - delay:
          milliseconds: 1000

      # Person is detected
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.camera_5_person_detected

#      - service: system_log.write
#          data:
#          level: info
#          message: "MK 1416857464759 {{ states('input_text.camera_5_person_saved_file') }} --> /media/0/{{ states('input_select.camera_mode') }}/camera_5_latest.jpg"
#          message: "MK 1416857464759 {{ states('input_text.camera_5_person_saved_file') }} --> /media/0/{{ states('input_select.camera_mode') }}/{{ states('input_text.camera_5_person_file_name') }}"

      # Move images to correct /media folder      
      - data:
          source_file: "{{ states('input_text.camera_5_person_saved_file') }}"
          dest_file: "/media/0/{{ states('input_select.camera_mode') }}/camera_5_latest.jpg"
        service: shell_command.camera_5_cp_deepstack
      - data:
          source_file: "{{ states('input_text.camera_5_person_saved_file') }}"
          dest_file: "/media/0/{{ states('input_select.camera_mode') }}/{{ states('input_text.camera_5_person_file_name') }}"
        service: shell_command.camera_5_mv_deepstack

  ###########################################
  ### Camera 5 Person is confidence night ###
  ###########################################
  - alias: Camera 5 Person is confidence night 
    id: '1416857464756' 
    mode: single

    trigger:
      - platform: state
        entity_id: input_text.camera_5_person_confidence

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >
            {{ states('input_text.camera_5_person_confidence') | float > states('input_text.camera_5_trigger_image_night') | float }}

        - condition: state
          entity_id: switch.kamera5_infra_red_lights_in_night_mode
          state: 'on'

    action:
      # Delay 1 sec to be sure the images is saved
      - delay:
          milliseconds: 1000

      # Person is detected
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.camera_5_person_detected

      # Move images to correct /media folder
      - data:
          source_file: "{{ states('input_text.camera_5_person_saved_file') }}"
          dest_file: "/media/0/{{ states('input_select.camera_mode') }}/camera_5_latest.jpg"
        service: shell_command.camera_5_cp_deepstack
      - data:
          source_file: "{{ states('input_text.camera_5_person_saved_file') }}"
          dest_file: "/media/0/{{ states('input_select.camera_mode') }}/{{ states('input_text.camera_5_person_file_name') }}"
        service: shell_command.camera_5_mv_deepstack

  ##############################################################
  ### Camera 5 Start timer when animal or person is detected ###
  ##############################################################
  - alias: Camera 5 Start timer when detected
    id: '1416857464476' 
    mode: single

    trigger:
      - platform: state
        entity_id: input_boolean.camera_5_animal_detected
        to: 'on'
      - platform: state
        entity_id: input_boolean.camera_5_person_detected
        to: 'on'

    action:
    - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.camera_5_animal_detected
            state: 'on'
        sequence:
              # Reset, so it be turn on again when detected 
          - service: input_boolean.turn_off
            data:
              entity_id: input_boolean.camera_5_animal_detected
              # Start/restart timer and count down
          - service: timer.start
            entity_id: timer.timer_camera_5_animal_detected
      - conditions:
          - condition: state
            entity_id: input_boolean.camera_5_person_detected
            state: 'on'
        sequence:
              # Reset, so it be turn on again when detected 
          - service: input_boolean.turn_off
            data:
              entity_id: input_boolean.camera_5_person_detected
              # Start/restart timer and count down
          - service: timer.start
            entity_id: timer.timer_camera_5_person_detected

  #########################
  ### Camera 5 Light on ###
  #########################
  - alias: Camera 5 Light on 
    id: '1416857464436' 
    mode: single

    trigger:
      - platform: state
        entity_id: timer.timer_camera_5_animal_detected
        to: 'active'
      - platform: state
        entity_id: timer.timer_camera_5_person_detected
        to: 'active'

    condition:
      condition: and
      conditions:
        - condition: numeric_state
          entity_id: sensor.ljusstyrka
          below: 5

    action:
      - service: light.turn_on
        target:
          entity_id: light.stralkastare_husgavel

  ##########################
  ### Camera 5 Light off ###
  ##########################
  - alias: Camera 5 Light off 
    id: '1415557464436' 
    mode: single

    trigger:
      - platform: state
        entity_id: timer.timer_camera_5_animal_detected
        to: 'idle'
      - platform: state
        entity_id: timer.timer_camera_5_person_detected
        to: 'idle'

    conditions:
      - condition: state
        entity_id: light.stralkastare_husgavel
        state: 'on'

    action:
      - service: light.turn_off
        target:
          entity_id: light.stralkastare_husgavel

  ##################################################
  ### Camera 5 Animal detected - flash light day ###
  ### Flash if total detected is 2 or more       ###
  ##################################################
  - alias: Camera 5 Animal detected flash light day
    id: '8116232452399' 
    mode: single

    trigger:
      - platform: state
        entity_id: timer.timer_camera_5_animal_detected
        to: 'active'

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >
            {{ states('sensor.camera_5_person') | int + states('sensor.camera_5_animal') | int >= 2 }}
        - condition: state
          entity_id: input_select.home_status
          state: 'Hemma på'

    action:
      - repeat:
          count: 4
          sequence:
            - service: light.turn_on
              target:
                entity_id: 
                  - light.hall_skap
                  - light.hall_byra

            - delay: "1"

            - service: light.turn_off
              target:
                entity_id: 
                  - light.hall_skap
                  - light.hall_byra

            - delay: "1"

  ####################################################
  ### Camera 5 Animal detected - flash light night ###
  ### Flash if total detected is 2 or more         ###
  ####################################################
  - alias: Camera 5 Animal detected flash light night
    id: '8111901152399' 
    mode: single

    trigger:
      - platform: state
        entity_id: timer.timer_camera_5_animal_detected
        to: 'active'

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >
            {{ states('sensor.camera_5_person') | int + states('sensor.camera_5_animal') | int >= 2 }}
        - condition: state
          entity_id: input_select.home_status
          state: 'Hemma av'

    action:
      - repeat:
          count: 4
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.sovrum_fonster

            - delay: "1"

            - service: light.turn_off
              target:
                entity_id: light.sovrum_fonster

            - delay: "1"

  ############################################
  ### Camera 5 Detection - notify          ###
  ### Flash if total detected is 2 or more ###
  ############################################
  - alias: Camera 5 Detection notify
    id: '8111901152345' 
    mode: single

    trigger:
      - platform: state
        entity_id: timer.timer_camera_5_animal_detected
        to: 'active'
      - platform: state
        entity_id: timer.timer_camera_5_person_detected
        to: 'active'

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >
            {{ states('sensor.camera_5_person') | int + states('sensor.camera_5_animal') | int >= 2 }}
#        - condition: state
#          entity_id: input_select.home_status
#          state: 'Borta'

    action:
      # Send notify
      - service: notify.mobile_app_sm_a528b
        data:
          title: >
            "Camera 5 Detection Alert {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: >
            Camera 5 has detected:
            - Persons: {{ states('sensor.camera_5_persons') | int }} , confidence: {{ states('sensor.camera_5_person_confidence') | int }}
            - Animals: {{ states('sensor.camera_5_animals') | int }} , confidence: {{ states('sensor.camera_5_animals_confidence') | int }}