# /media/0/Night
# Only images captured when camera mode "Night"

# /media/0/animal
# Only images captured when an animal is detected

# /media/0/video_Away
# Only videos captured when camera mode "Away"

# /media/0/video_Night
# Only videos captured when camera mode "Night"

