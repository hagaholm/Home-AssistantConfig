          - binary_sensor.kamera3_husdjur
          - binary_sensor.kamera5_husdjur
          - binary_sensor.kamera6_husdjur
          - binary_sensor.kamera7_husdjur
          - binary_sensor.kamera8_husdjur
        to: 'on'

    action:
      - variables:
          camera_num: "{{ trigger.entity_id.split('.')[-1].split('_')[0][-1] }}"
          snapshot_path: "/config/media/camera_compare/reolink/animal/kamera{{ camera_num }}_animal_{{ now().timestamp() | int }}.jpg"
          home_status: "{{ states('input_select.home_status') }}"

      - service: camera.snapshot
        data:
          filename: "{{ snapshot_path }}"
        target:
          entity_id: "camera.kamera{{ camera_num }}"

      - service: input_number.increment
        target:
          entity_id: "input_number.reolink_cam{{ camera_num }}_animal_count"

      # Log detection time for Reolink (current timestamp in ms)
      - service: input_number.set_value
        target:
          entity_id: "input_number.reolink_last_detection_time"
        data:
          value: "{{ (now().timestamp() * 1000) | int }}"

      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: "Hemma på"
            sequence:
              - service: input_number.increment
                target:
                  entity_id: "input_number.reolink_hemma_pa_animal_count"
              - service: input_number.increment
                target:
                  entity_id: "input_number.reolink_cam{{ camera_num }}_hemma_pa_animal_count"
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: "Hemma av"
            sequence:
              - service: input_number.increment
                target:
                  entity_id: "input_number.reolink_hemma_av_animal_count"
              - service: input_number.increment
                target:
                  entity_id: "input_number.reolink_cam{{ camera_num }}_hemma_av_animal_count"
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: "Borta"
            sequence:
              - service: input_number.increment
                target:
                  entity_id: "input_number.reolink_borta_animal_count"
              - service: input_number.increment
                target:
                  entity_id: "input_number.reolink_cam{{ camera_num }}_borta_animal_count"

