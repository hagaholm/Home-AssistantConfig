          - binary_sensor.cam8_animal_active
        to: 'on'

    action:
      - variables:
          camera_num: "{{ trigger.entity_id.split('.')[-1].split('_')[0][3:] }}"
          snapshot_path: "/config/media/camera_compare/frigate/animal/cam{{ camera_num }}_animal_{{ now().timestamp() | int }}.jpg"
