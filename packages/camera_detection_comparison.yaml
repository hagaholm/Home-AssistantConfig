##################
### Automation ###
##################
automation:
  ##########################################################
  ### Initialize Snapshot Directories on Startup       ###
  ##########################################################
  - alias: "Initialize Camera Snapshot Directories"
    id: 'initialize_snapshot_directories'
    mode: single

    trigger:
      - platform: homeassistant
        event: start

    action:
      - service: shell_command.create_snapshot_directories
      - service: shell_command.migrate_old_snapshots_frigate
      - service: shell_command.migrate_old_snapshots_reolink
      - service: shell_command.cleanup_old_snapshot_dirs

  ###########################################
  ### Frigate Person Detection - Snapshot ###
  ###########################################
  - alias: "Frigate Person Detection - Snapshot"
    id: 'frigate_person_detection_snapshot'
    mode: parallel
    max: 10

    trigger:
      - platform: state
        entity_id:
          - binary_sensor.cam3_person_occupancy
          - binary_sensor.cam5_person_occupancy
          - binary_sensor.cam6_person_occupancy
          - binary_sensor.cam7_person_occupancy
          - binary_sensor.cam8_person_occupancy
        to: 'on'

    action:
      - variables:
          camera_num: "{{ trigger.entity_id.split('.')[-1].split('_')[0][3:] }}"
          snapshot_path: "/config/media/camera_compare/frigate/person/cam{{ camera_num }}_person_{{ now().timestamp() | int }}.jpg"
          home_status: "{{ states('input_select.home_status') }}"

      - service: camera.snapshot
        data:
          filename: "{{ snapshot_path }}"
        target:
          entity_id: "camera.cam{{ camera_num }}"

      - service: input_number.increment
        target:
          entity_id: "input_number.frigate_cam{{ camera_num }}_person_count"

      # Log detection time for Frigate (current timestamp in ms)
      - service: input_number.set_value
        target:
          entity_id: "input_number.frigate_last_detection_time"
        data:
          value: "{{ (now().timestamp() * 1000) | int }}"

      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: "Hemma på"
            sequence:
              - service: input_number.increment
                target:
                  entity_id: "input_number.frigate_hemma_pa_person_count"
              - service: input_number.increment
                target:
                  entity_id: "input_number.frigate_cam{{ camera_num }}_hemma_pa_person_count"
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: "Hemma av"
            sequence:
              - service: input_number.increment
                target:
                  entity_id: "input_number.frigate_hemma_av_person_count"
              - service: input_number.increment
                target:
                  entity_id: "input_number.frigate_cam{{ camera_num }}_hemma_av_person_count"
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: "Borta"
            sequence:
              - service: input_number.increment
                target:
                  entity_id: "input_number.frigate_borta_person_count"
              - service: input_number.increment
                target:
                  entity_id: "input_number.frigate_cam{{ camera_num }}_borta_person_count"

