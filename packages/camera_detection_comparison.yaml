  ##########################################################
  ### Compare Response Times - Analyze Fastest Detector ###
  ##########################################################
  - alias: "Analyze Detection Response Time"
    id: 'analyze_detection_response_time'
    mode: single

    trigger:
      - platform: state
        entity_id: 
          - input_number.frigate_last_detection_time
          - input_number.reolink_last_detection_time

    condition:
      # Only analyze if both have detected within the last 2 minutes (to ensure simultaneous detection)
      - condition: template
        value_template: |
          {% set frigate_time = state_attr('input_number.frigate_last_detection_time', 'last_changed') %}
          {% set reolink_time = state_attr('input_number.reolink_last_detection_time', 'last_changed') %}
          {% set now = now() %}
          {% if frigate_time and reolink_time %}
            {% set frigate_age = (now - frigate_time.replace(tzinfo=None)).total_seconds() %}
            {% set reolink_age = (now - reolink_time.replace(tzinfo=None)).total_seconds() %}
            {{ frigate_age < 120 and reolink_age < 120 }}
          {% else %}false{% endif %}

    action:
      - variables:
          frigate_time: "{{ states('input_number.frigate_last_detection_time') | int(0) }}"
          reolink_time: "{{ states('input_number.reolink_last_detection_time') | int(0) }}"
          time_difference: "{{ (frigate_time - reolink_time) | abs }}"
          faster_system: "{% if frigate_time > reolink_time %}Frigate{% else %}Reolink{% endif %}"

      # Send notification with analysis
      - service: notify.mobile_app_sm_a528b
        data:
          title: "⚡ Detection Speed Analysis"
          message: |
            {{ faster_system }} was faster!
            Difference: {{ time_difference }}ms
            Frigate: {{ frigate_time }}ms
            Reolink: {{ reolink_time }}ms

  ##########################################################
  ### Delete Old Snapshots (Older than 10 days)        ###
  ##########################################################
  - alias: "Delete Old Camera Snapshots"
    id: 'delete_old_snapshots'
    mode: single

    trigger:
      - platform: time
        at: '03:00:00'  # Run at 3 AM daily

    action:
      - service: shell_command.delete_old_frigate_snapshots
      - service: shell_command.delete_old_reolink_snapshots
      - service: notify.mobile_app_sm_a528b
        data:
          title: "🗑️ Snapshot Cleanup"
          message: "Old snapshots (>10 days) have been deleted"

##########################
### Shell Commands      ###
##########################
shell_command:
  create_snapshot_directories: mkdir -p /config/media/camera_compare/frigate/person /config/media/camera_compare/frigate/animal /config/media/camera_compare/reolink/person /config/media/camera_compare/reolink/animal && chmod -R 755 /config/media/camera_compare 2>/dev/null || true
  migrate_old_snapshots_frigate: 'mv /config/snapshots/frigate/person/* /config/media/camera_compare/frigate/person/ 2>/dev/null || true; mv /config/snapshots/frigate/animal/* /config/media/camera_compare/frigate/animal/ 2>/dev/null || true'
  migrate_old_snapshots_reolink: 'mv /config/snapshots/reolink/person/* /config/media/camera_compare/reolink/person/ 2>/dev/null || true; mv /config/snapshots/reolink/animal/* /config/media/camera_compare/reolink/animal/ 2>/dev/null || true'
  cleanup_old_snapshot_dirs: 'rm -rf /config/snapshots 2>/dev/null || true; rm -rf /config/www/camera_compare 2>/dev/null || true'
  delete_old_frigate_snapshots: 'find /config/media/camera_compare/frigate -type f -mtime +10 -delete 2>/dev/null || true'
  delete_old_reolink_snapshots: 'find /config/media/camera_compare/reolink -type f -mtime +10 -delete 2>/dev/null || true'