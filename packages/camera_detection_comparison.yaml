#############################################
### Template Sensors - Daily Statistics  ###
#############################################
template:
  - sensor:
      # Frigate Total Detections
      - name: "Frigate Cam3 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam3_person_count') | int(0) }}"
        attributes:
          friendly_name: "Frigate Camera 3 Person Detections Today"

      - name: "Frigate Cam3 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam3_animal_count') | int(0) }}"

      - name: "Frigate Cam5 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam5_person_count') | int(0) }}"

      - name: "Frigate Cam5 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam5_animal_count') | int(0) }}"

      - name: "Frigate Cam6 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam6_person_count') | int(0) }}"

      - name: "Frigate Cam6 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam6_animal_count') | int(0) }}"

      - name: "Frigate Cam7 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam7_person_count') | int(0) }}"

      - name: "Frigate Cam7 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam7_animal_count') | int(0) }}"

      - name: "Frigate Cam8 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam8_person_count') | int(0) }}"

      - name: "Frigate Cam8 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.frigate_cam8_animal_count') | int(0) }}"

      - name: "Frigate Total Person Detections"
        state_class: measurement
        unit_of_measurement: "detections"
        state: >
          {{
            states('input_number.frigate_cam3_person_count') | int(0) +
            states('input_number.frigate_cam5_person_count') | int(0) +
            states('input_number.frigate_cam6_person_count') | int(0) +
            states('input_number.frigate_cam7_person_count') | int(0) +
            states('input_number.frigate_cam8_person_count') | int(0)
          }}

      - name: "Frigate Total Animal Detections"
        state_class: measurement
        unit_of_measurement: "detections"
        state: >
          {{
            states('input_number.frigate_cam3_animal_count') | int(0) +
            states('input_number.frigate_cam5_animal_count') | int(0) +
            states('input_number.frigate_cam6_animal_count') | int(0) +
            states('input_number.frigate_cam7_animal_count') | int(0) +
            states('input_number.frigate_cam8_animal_count') | int(0)
          }}

      # Reolink Total Detections
      - name: "Reolink Cam3 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam3_person_count') | int(0) }}"

      - name: "Reolink Cam3 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam3_animal_count') | int(0) }}"

      - name: "Reolink Cam5 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam5_person_count') | int(0) }}"

      - name: "Reolink Cam5 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam5_animal_count') | int(0) }}"

      - name: "Reolink Cam6 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam6_person_count') | int(0) }}"

      - name: "Reolink Cam6 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam6_animal_count') | int(0) }}"

      - name: "Reolink Cam7 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam7_person_count') | int(0) }}"

      - name: "Reolink Cam7 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam7_animal_count') | int(0) }}"

      - name: "Reolink Cam8 Person Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam8_person_count') | int(0) }}"

      - name: "Reolink Cam8 Animal Daily Count"
        state_class: measurement
        unit_of_measurement: "detections"
        state: "{{ states('input_number.reolink_cam8_animal_count') | int(0) }}"

      - name: "Reolink Total Person Detections"
        state_class: measurement
        unit_of_measurement: "detections"
        state: >
          {{
            states('input_number.reolink_cam3_person_count') | int(0) +
            states('input_number.reolink_cam5_person_count') | int(0) +
            states('input_number.reolink_cam6_person_count') | int(0) +
