            {% if temperature is not number or humidity is not number or risk is not number %}Data saknas: {{ missing | join(', ') if missing else 'mögelrisken kan inte beräknas från källvärdena' }}
            {% elif states('sensor.friggebod_mogelrisk') | float(0) > 50 %}Mögelrisk över varningsgränsen 50 %
