            {{ missing | join(', ') if missing else 'Inga' }}
          calculated_humidity_threshold: >-
            {% set temperature = states('sensor.ute') | float(none) %}
            {% if temperature is not number %}unavailable
            {% elif temperature <= 0 %}Ej tillämplig: mögelrisk sätts till 0 vid temperatur <= 0 C
            {% else %}
              {% set threshold = 85 - (temperature * 0.5) %}
              {{ [[threshold, 75] | max, 95] | min | round(1) }} % RH
            {% endif %}
          warning_threshold: 50