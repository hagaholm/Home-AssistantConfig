####################################################
#                                                  #
#             CLIMATE DIAGNOSTICS                  #
#                                                  #
####################################################
# BESKRIVNING:
# Läsande status för klimatzonerna. Sensorerna återger
# befintliga mätningar och larmgränser utan att styra värme.
#

template:
  - sensor:
      - name: diagnostics_climate_health
        unique_id: diagnostics_climate_health
        icon: >-
          {% if this.state == 'OK' %}mdi:home-thermometer-outline
          {% elif this.state == 'Varning' %}mdi:home-alert-outline
          {% else %}mdi:home-off-outline{% endif %}
        state: >-
          {% set zones = ['sensor.diagnostics_climate_forrad', 'sensor.diagnostics_climate_friggebod', 'sensor.diagnostics_climate_garage', 'sensor.diagnostics_climate_husvagn', 'sensor.diagnostics_climate_uterum', 'sensor.diagnostics_climate_ute'] %}
          {% if zones | select('is_state', 'Data saknas') | list or zones | select('is_state', 'unknown') | list or zones | select('is_state', 'unavailable') | list %}Fel
          {% elif zones | select('is_state', 'Varning') | list %}Varning
          {% else %}OK{% endif %}
        attributes:
          reason: >-
            {% if this.state == 'Fel' %}Minst en klimatzon saknar data eller kan inte rapportera
            {% elif this.state == 'Varning' %}Minst en klimatzon har förhöjd mögelrisk
            {% else %}Alla klimatzoner har data och inga varningar{% endif %}
          active_issues: >-
            {% set zones = [
              {'name': 'Förråd', 'entity': 'sensor.diagnostics_climate_forrad'}, {'name': 'Friggebod', 'entity': 'sensor.diagnostics_climate_friggebod'}, {'name': 'Garage', 'entity': 'sensor.diagnostics_climate_garage'}, {'name': 'Husvagn', 'entity': 'sensor.diagnostics_climate_husvagn'}, {'name': 'Uterum', 'entity': 'sensor.diagnostics_climate_uterum'}, {'name': 'Ute', 'entity': 'sensor.diagnostics_climate_ute'}
            ] %}
            {% set issues = namespace(items=[]) %}
            {% for zone in zones %}{% if states(zone.entity) in ['Data saknas', 'unknown', 'unavailable'] %}{% set issues.items = issues.items + ['Fel: ' ~ zone.name ~ ': ' ~ (state_attr(zone.entity, 'reason') or states(zone.entity)) %}{% elif is_state(zone.entity, 'Varning') %}{% set issues.items = issues.items + ['Varning: ' ~ zone.name ~ ': ' ~ (state_attr(zone.entity, 'reason') or 'förhöjd mögelrisk') %}{% endif %}{% endfor %}
            {{ issues.items | join('\n') if issues.items else 'Inga' }}
          checked_at: "{{ now().isoformat() }}"

      - name: diagnostics_climate_forrad
        unique_id: diagnostics_climate_forrad
        state: >-
          {% set temperature = states('sensor.forrad_temperature') | float(none) %}
          {% set humidity = states('sensor.forrad_luftfuktighet') | float(none) %}
          {% set risk = states('sensor.forrad_mogelrisk') | float(none) %}
          {% if temperature is not number or humidity is not number or risk is not number %}Data saknas
          {% elif risk > 50 %}Varning
          {% elif is_state('switch.forrad_elvarme', 'on') %}Värmer
          {% else %}OK{% endif %}
        attributes:
          reason: >-
            {% set temperature = states('sensor.forrad_temperature') | float(none) %}
            {% set humidity = states('sensor.forrad_luftfuktighet') | float(none) %}
            {% set risk = states('sensor.forrad_mogelrisk') | float(none) %}
            {% set missing = [] %}
            {% if states('sensor.forrad_temperature') in ['unknown', 'unavailable', ''] %}{% set missing = missing + ['sensor.forrad_temperature (temperatur)'] %}{% endif %}
            {% if states('sensor.forrad_luftfuktighet') in ['unknown', 'unavailable', ''] %}{% set missing = missing + ['sensor.forrad_luftfuktighet (luftfuktighet)'] %}{% endif %}
            {% if temperature is not number or humidity is not number or risk is not number %}Data saknas: {{ missing | join(', ') if missing else 'mögelrisken kan inte beräknas från källvärdena' }}
            {% elif states('sensor.forrad_mogelrisk') | float(0) > 50 %}Mögelrisk över varningsgränsen 50 %
            {% elif is_state('switch.forrad_elvarme', 'on') %}Elvärmen är aktiv enligt befintlig värmestyrning
            {% else %}Mögelrisk under varningsgränsen och elvärmen är av{% endif %}
          temperature: "{{ states('sensor.forrad_temperature') }}"
          humidity: "{{ states('sensor.forrad_luftfuktighet') }}"
          mold_risk: "{{ states('sensor.forrad_mogelrisk') }}"
          heat_active: "{{ is_state('switch.forrad_elvarme', 'on') }}"
          missing_inputs: >-
            {% set missing = [] %}
            {% if states('sensor.forrad_temperature') in ['unknown', 'unavailable', ''] %}{% set missing = missing + ['sensor.forrad_temperature (temperatur)'] %}{% endif %}
            {% if states('sensor.forrad_luftfuktighet') in ['unknown', 'unavailable', ''] %}{% set missing = missing + ['sensor.forrad_luftfuktighet (luftfuktighet)'] %}{% endif %}
            {{ missing | join(', ') if missing else 'Inga' }}
          warning_threshold: 50
          automation: automation.forrad_mogelvarning

