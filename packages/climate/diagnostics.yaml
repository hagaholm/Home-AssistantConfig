####################################################
#                                                  #
#             CLIMATE DIAGNOSTICS                  #
#                                                  #
####################################################
# BESKRIVNING:
# Läsande status för klimatzonerna. Sensorerna återger
# befintliga mätningar och larmgränser utan att styra värme.
#

template:
  - sensor:
      - name: diagnostics_climate_forrad
        unique_id: diagnostics_climate_forrad
        state: >-
          {% set temperature = states('sensor.forrad_temperature') | float(none) %}
          {% set humidity = states('sensor.forrad_luftfuktighet') | float(none) %}
          {% set risk = states('sensor.forrad_mogelrisk') | float(none) %}
          {% if temperature is not number or humidity is not number or risk is not number %}Data saknas
          {% elif risk > 50 %}Varning
          {% elif is_state('switch.forrad_elvarme', 'on') %}Värmer
          {% else %}OK{% endif %}
        attributes:
          reason: >-
            {% set temperature = states('sensor.forrad_temperature') | float(none) %}
            {% set humidity = states('sensor.forrad_luftfuktighet') | float(none) %}
            {% set risk = states('sensor.forrad_mogelrisk') | float(none) %}
            {% set missing = [] %}
            {% if states('sensor.forrad_temperature') in ['unknown', 'unavailable', ''] %}{% set missing = missing + ['sensor.forrad_temperature (temperatur)'] %}{% endif %}
            {% if states('sensor.forrad_luftfuktighet') in ['unknown', 'unavailable', ''] %}{% set missing = missing + ['sensor.forrad_luftfuktighet (luftfuktighet)'] %}{% endif %}
            {% if temperature is not number or humidity is not number or risk is not number %}Data saknas: {{ missing | join(', ') if missing else 'mögelrisken kan inte beräknas från källvärdena' }}
            {% elif states('sensor.forrad_mogelrisk') | float(0) > 50 %}Mögelrisk över varningsgränsen 50 %
            {% elif is_state('switch.forrad_elvarme', 'on') %}Elvärmen är aktiv enligt befintlig värmestyrning
            {% else %}Mögelrisk under varningsgränsen och elvärmen är av{% endif %}
          temperature: "{{ states('sensor.forrad_temperature') }}"
          humidity: "{{ states('sensor.forrad_luftfuktighet') }}"
          mold_risk: "{{ states('sensor.forrad_mogelrisk') }}"
          heat_active: "{{ is_state('switch.forrad_elvarme', 'on') }}"
          missing_inputs: >-
            {% set missing = [] %}
            {% if states('sensor.forrad_temperature') in ['unknown', 'unavailable', ''] %}{% set missing = missing + ['sensor.forrad_temperature (temperatur)'] %}{% endif %}
            {% if states('sensor.forrad_luftfuktighet') in ['unknown', 'unavailable', ''] %}{% set missing = missing + ['sensor.forrad_luftfuktighet (luftfuktighet)'] %}{% endif %}
            {{ missing | join(', ') if missing else 'Inga' }}
          warning_threshold: 50
          automation: automation.forrad_mogelvarning

