            {% if temperature is not number or humidity is not number or risk is not number %}Data saknas: {{ missing | join(', ') if missing else 'mögelrisken kan inte beräknas' }}
            {% elif risk > 50 %}Mögelrisken är {{ risk | round(0) }} %, vilket är över Diagnostiks varningsgräns 50 %
            {% else %}Utomhusmätningarna är tillgängliga{% endif %}
          temperature: "{{ states('sensor.ute') }}"
          humidity: "{{ states('sensor.ute_friggebod_humidity') }}"
          mold_risk: "{{ states('sensor.ute_mogelrisk') }}"
          data_status: >-
            {% set temperature = states('sensor.ute') | float(none) %}
            {% set humidity = states('sensor.ute_friggebod_humidity') | float(none) %}
            {% if temperature is not number or humidity is not number %}Data saknas{% else %}Data tillgänglig{% endif %}
