####################################################
#                                                  #
#                GARAGE (CLIMATE) PACKAGE           #
#                                                  #
####################################################
# Styrning av garage: elvärme + avfuktare.
#
# Källor:
# - automations/garage_heater.yaml
# - automations/garage_air_dryer.yaml
####################################################

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#              FÖRRÅD ELVÄRME AUTOMATION              #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Samlad automation för garagets elvärmare baserat på
# temperaturnivåer i garage, förråd och ute.
#######################################################

  - alias: Elvärme garage
    id: '1735304100014'
    mode: single

    trigger:
      - platform: template
        value_template: "{{ states('sensor.forrad_temperature') not in ['unknown','unavailable',''] and (states('sensor.forrad_temperature')|float) < 12 }}"
      - platform: template
        value_template: "{{ states('sensor.garage_temperature') not in ['unknown','unavailable',''] and (states('sensor.garage_temperature')|float) < 12 }}"
      - platform: template
        value_template: "{{ states('sensor.forrad_temperature') not in ['unknown','unavailable',''] and (states('sensor.forrad_temperature')|float) > 9 }}"
      - platform: template
        value_template: "{{ states('sensor.garage_temperature') not in ['unknown','unavailable',''] and (states('sensor.garage_temperature')|float) > 9 }}"

    action:
      - choose:
          # TÄND - Temp < 7 grader
          - conditions:
              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ states('sensor.forrad_temperature') not in ['unknown','unavailable',''] and (states('sensor.forrad_temperature')|float) < 7 }}"
                  - condition: template
                    value_template: "{{ states('sensor.garage_temperature') not in ['unknown','unavailable',''] and (states('sensor.garage_temperature')|float) < 7 }}"
              - condition: numeric_state
                entity_id: sensor.ute
                below: 6
            sequence:
              - service: homeassistant.turn_on
                entity_id: switch.forrad_elvarme

          # TÄND - Temp < 12 grader
          - conditions:
              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ states('sensor.forrad_temperature') not in ['unknown','unavailable',''] and (states('sensor.forrad_temperature')|float) < 12 }}"
                  - condition: template
                    value_template: "{{ states('sensor.garage_temperature') not in ['unknown','unavailable',''] and (states('sensor.garage_temperature')|float) < 12 }}"
              - condition: numeric_state
                entity_id: sensor.ute
                below: 10
            sequence:
              - service: homeassistant.turn_on
                entity_id: switch.forrad_elvarme

          # SLÄCK - Temp > 14 grader
          - conditions:
              - condition: and
                conditions:
                  - condition: template
                    value_template: "{{ states('sensor.forrad_temperature') not in ['unknown','unavailable',''] and (states('sensor.forrad_temperature')|float) > 14 }}"
                  - condition: template
                    value_template: "{{ states('sensor.garage_temperature') not in ['unknown','unavailable',''] and (states('sensor.garage_temperature')|float) > 14 }}"
            sequence:
              - service: homeassistant.turn_off
                entity_id: switch.forrad_elvarme

          # SLÄCK - Temp > 9 grader
          - conditions:
              - condition: and
                conditions:
                  - condition: template
                    value_template: "{{ states('sensor.forrad_temperature') not in ['unknown','unavailable',''] and (states('sensor.forrad_temperature')|float) > 9 }}"
                  - condition: template
                    value_template: "{{ states('sensor.garage_temperature') not in ['unknown','unavailable',''] and (states('sensor.garage_temperature')|float) > 9 }}"
            sequence:
              - service: homeassistant.turn_off
                entity_id: switch.forrad_elvarme

#######################################################
#                                                     #
#       GARAGE AVFUKTARE (DEHUMIDIFIER) AUTOMATION   #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 2.0
# Författare: Home Assistant Config
#######################################################

  - alias: Garage avfuktare styrning
    id: '1735304100002'
    mode: single

    trigger:
      # Starta vid hög luftfuktighet
      - platform: template
        value_template: "{{ states('sensor.garage_humidity') not in ['unknown','unavailable',''] and (states('sensor.garage_humidity')|float) > 66 }}"
        id: start_dehumidifier

      # Stoppa vid låg luftfuktighet
      - platform: template
        value_template: "{{ states('sensor.garage_humidity') not in ['unknown','unavailable',''] and (states('sensor.garage_humidity')|float) < 64 }}"
        id: stop_dehumidifier

    action:
      - choose:
          # STARTA AVFUKTARE
          - alias: Starta avfuktare vid hög fukt
            conditions:
              - condition: trigger
                id: start_dehumidifier
              - condition: state
                entity_id: switch.garage_avfuktare
                state: 'off'
              - condition: template
                value_template: "{{ states('sensor.garage_temperature') not in ['unknown','unavailable',''] and (states('sensor.garage_temperature')|float) > 10 }}"
            sequence:
              - service: homeassistant.turn_on
                entity_id: switch.garage_avfuktare

          # STOPPA AVFUKTARE
          - alias: Stoppa avfuktare vid låg fukt
            conditions:
              - condition: trigger
                id: stop_dehumidifier
              - condition: state
                entity_id: switch.garage_avfuktare
                state: 'on'
            sequence:
              - service: homeassistant.turn_off
                entity_id: switch.garage_avfuktare
