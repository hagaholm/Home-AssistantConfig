####################################################
#                                                  #
#       FRIGGEBOD (STORAGE) CLIMATE PACKAGE        #
#                                                  #
####################################################
# Styrning av elvärme i friggebod baserat på temperatur och fukt.
# Systemet skyddar mot frost och hög fuktighet samt räknar värmetid.
#
# EXTERNA BEROENDEN (sensorer definierade på annat håll):
# - sensor.friggebod_temperatur (temperatur inne, °C)
# - sensor.friggebod_luftfuktighet (relativ fukt inne, %)
# - sensor.ute (utomhustemperatur, °C)
# - sensor.ute_friggebod_humidity (relativ fukt ute, %)
# - switch.friggebod_elvarme (main power switch för elvärme)
# - notify.* (notification service, se input_text.friggebod_notification_target)
#
# Funktioner:
# - Frostskydd vid låg temperatur
# - Fuktdriven värmestyrning
# - Mögelriskberäkning (absolut fukt + relativ fukt)
# - Automatisk värmetidsräkning per dag
# - Daglig begränsning av värmekörning
# - Mögelvarning vid högt värde

# METADATA:
# Skapad: okänt
# Senast ändrad: 2026-02-05
# Version: 2.1
####################################################

############################################
# NOTIFIKATION-KONFIGURATION
############################################
# Ändra denna till din notification service (notify.email, notify.ntfy, etc.)
input_text:
  friggebod_notification_target:
    name: Friggebod notifikation-target
    initial: "notify.mobile_app_sm_a528b"
    icon: mdi:bell

############################################
# KONFIGURERBARA VARIABLER
############################################
# Temperaturvärden (°C)
homeassistant:
  customize:
    package.node_anchors:
      # Temperaturvärden
      temp_frostskydd: &temp_frostskydd 3
      temp_min_for_fuktvarme: &temp_min_for_fuktvarme 0
      
      # Fuktvärden (%)
      rh_aktivering: &rh_aktivering 60
      rh_avaktivering: &rh_avaktivering 55
      
      # Absolut fukt (g/m³)
      delta_abs_aktivering: &delta_abs_aktivering 1.0
      delta_abs_avaktivering: &delta_abs_avaktivering 0.5
      
      # Mögelrisk
      mogelrisk_troskel: &mogelrisk_troskel 75
      mogelrisk_varning: &mogelrisk_varning 60
      mogelrisk_varning_tid: &mogelrisk_varning_tid 6  # timmar
      
      # Värmestyrning
      max_varmetid_per_dag: &max_varmetid_per_dag 12  # antal 10-min perioder (= 2h)
      min_gangtid: &min_gangtid "00:30:00"  # minuter värmen ska köra minst
      
      # Övervakningsintervall
      kontroll_intervall: &kontroll_intervall 5  # minuter
      varmetid_ratt_intervall: &varmetid_ratt_intervall 10  # minuter
      
      # Matematiska konstanter för fuktberäkning
      magnus_a: &magnus_a 17.67
      magnus_b: &magnus_b 243.5
      absolut_noll: &absolut_noll 273.15
      ideal_gas_konstant: &ideal_gas_konstant 2.1674
      magnus_konstant: &magnus_konstant 6.112

############################################
# FRIGGEBOD – SMART FUKT & VÄRMESTYRNING
############################################

############################################
# TEMPLATE SENSORER
############################################
# Beräknar absolut fukt och mögelrisk baserat på temperatur och relativ fuktighet.
# Formler:
# - Absolut fukt: Magnus-Tetens formel för mättnadstryck + idealgas-approximation
# - Mögelrisk: Linjär funktion baserad på RH över tröskelvärde

template:
  - sensor:
      # Beräknar absolut fukt inne i friggeboden (g/m³)
      # FORMEL: Magnus-Tetens approximation (gäller -40 till +60°C)
      # - Mättnadstryck: es = 6.112 * e^((17.67*T)/(T+243.5))
      # - Absolut fukt: AH = es * RH * 2.1674 / (273.15 + T)
      # ANVÄNDNING: Jämför inne vs ute för fuktstyrning
      - name: "Friggebod absolut fukt inne"
        unit_of_measurement: "g/m³"
        state_class: "measurement"
        icon: mdi:water
        availability: >
          {{ states('sensor.friggebod_temperatur') not in ['unknown', 'unavailable', '']
             and states('sensor.friggebod_luftfuktighet') not in ['unknown', 'unavailable', ''] }}
        state: >
          {% set T = states('sensor.friggebod_temperatur') | float(none) %}
          {% set RH = states('sensor.friggebod_luftfuktighet') | float(none) %}
          {% if T is none or RH is none %}
            {{ none }}
          {% else %}
            {% set a = 17.67 %}
            {% set b = 243.5 %}
            {% set R_sp = 2.1674 %}
            {% set T_abs = 273.15 %}
            {% set K = 6.112 %}
            {% set exp_val = (a * T) / (T + b) %}
            {% set e = 2.718281828459045 %}
            {{ (K * (e ** exp_val) * RH * R_sp / (T_abs + T)) | round(2) }}
          {% endif %}

      # Beräknar mögelrisk baserat på relativ fuktighet
      # LOGIK:
      # - T < 0°C: Risk = 0% (ingen svampväxt i kallt)
      # - RH < 75%: Risk = 0% (under tröskel)
      # - RH >= 75%: Risk = (RH - 75) * 2 (linjär ökning)
      # EXEMPEL: RH=80% => 10%, RH=90% => 30%
      - name: "Friggebod mögelrisk"
        unit_of_measurement: "%"
        device_class: "humidity"
        icon: mdi:mushroom
        availability: >
          {{ states('sensor.friggebod_temperatur') not in ['unknown', 'unavailable', '']
             and states('sensor.friggebod_luftfuktighet') not in ['unknown', 'unavailable', ''] }}
        state: >
          {% set T = states('sensor.friggebod_temperatur') | float(0) %}
          {% set RH = states('sensor.friggebod_luftfuktighet') | float(0) %}
          {% set troskel = 75 %}
          {% if T < 0 %}
            0
          {% else %}
            {% set risk = ((RH - troskel) * 2) %}
            {% if risk < 0 %}
              0
            {% elif risk > 100 %}
              100
            {% else %}
              {{ risk | round(0) }}
            {% endif %}
          {% endif %}

      # ENERGIFÖRBRUKNING - Aktuell effekt när elementet är på
      - name: "Friggebod aktuell effekt"
        unit_of_measurement: "W"
        device_class: "power"
        state_class: "measurement"
        icon: mdi:flash
        state: >
          {% if is_state('switch.friggebod_elvarme', 'on') %}
            {{ states('input_number.friggebod_element_effekt') | float(750) }}
          {% else %}
            0
          {% endif %}

      # ENERGIFÖRBRUKNING - kWh sedan senaste reset
      - name: "Friggebod energiförbrukning total"
        unit_of_measurement: "kWh"
        device_class: "energy"
        state_class: "total_increasing"
        icon: mdi:lightning-bolt-circle
        state: >
          {% set runtime = states('counter.friggebod_varme_tid') | int(0) %}
          {% set effekt_kw = states('input_number.friggebod_element_effekt') | float(750) / 1000 %}
          {{ (runtime * 10 / 60 * effekt_kw) | round(2) }}

      # KOSTNAD - Total kostnad baserat på energiförbrukning
      - name: "Friggebod värmekostnad total"
        unit_of_measurement: "SEK"
        icon: mdi:currency-sek
        state: >
          {% set kwh = states('sensor.friggebod_energiforbrukning_total') | float(0) %}
          {% set pris = states('input_number.friggebod_elpris') | float(1.5) %}
          {{ (kwh * pris) | round(2) }}

      # FYSIK - Värmebehov per grad temperaturskillnad (W/°C)
      - name: "Friggebod värmebehov per grad"
        unit_of_measurement: "W/°C"
        icon: mdi:thermometer-lines
        availability: >
          {{ states('sensor.friggebod_temperatur') not in ['unknown', 'unavailable', '']
             and states('sensor.ute') not in ['unknown', 'unavailable', ''] }}
        state: >
          {% set t_in = states('sensor.friggebod_temperatur') | float(0) %}
          {% set t_out = states('sensor.ute') | float(0) %}
          {% set delta_t = t_in - t_out %}
          {% set effekt = states('input_number.friggebod_element_effekt') | float(750) %}
          {% if delta_t > 0.1 %}
            {{ (effekt / delta_t) | round(1) }}
          {% else %}
            0
          {% endif %}

      # FYSIK - Uppskattat U-värde (W/(m²·K))
      - name: "Friggebod uppskattat U-värde"
        unit_of_measurement: "W/(m²·K)"
        icon: mdi:home-thermometer
        availability: >
          {{ states('sensor.friggebod_temperatur') not in ['unknown', 'unavailable', '']
             and states('sensor.ute') not in ['unknown', 'unavailable', ''] }}
        state: >
          {% set varmebehov_per_grad = states('sensor.friggebod_varmebehov_per_grad') | float(0) %}
          {% set area_vagg = 32 %}
          {% set area_tak = 15 %}
          {% set area_golv = 15 %}
          {% set total_area = area_vagg + area_tak + area_golv %}
          {% if total_area > 0 %}
            {{ (varmebehov_per_grad / total_area) | round(3) }}
          {% else %}
            unavailable
          {% endif %}

      # FYSIK - Specifik värmeprestanda (W/m²)
      - name: "Friggebod specifik värmeprestanda"
        unit_of_measurement: "W/m²"
        icon: mdi:home-lightning-bolt
        state: >
          {% set effekt = states('sensor.friggebod_aktuell_effekt') | float(0) %}
          {% set area = 15 %}
          {{ (effekt / area) | round(1) }}

      # FYSIK - Graddagar (°C·dag)
      - name: "Friggebod graddagar idag"
        unit_of_measurement: "°C·dag"
        icon: mdi:thermometer-minus
        state: >
          {% set t_in = states('sensor.friggebod_temperatur') | float(0) %}
          {% set t_out = states('sensor.ute') | float(0) %}
          {% set delta_t = t_in - t_out %}
          {% set runtime_hours = states('counter.friggebod_varme_tid') | int(0) * 10 / 60 %}
          {{ (delta_t * runtime_hours / 24) | round(2) }}

      # EFFEKTIVITET - COP (Coefficient of Performance)
      - name: "Friggebod COP"
        icon: mdi:chart-line
        state: "1.0"
        attributes:
          typ: "Direktelvärme"
          förklaring: "Direktelvärme har alltid COP=1.0 (100% av elen blir värme)"

      # EFFEKTIVITET - Energi per kubikmeter
      - name: "Friggebod energi per volym"
        unit_of_measurement: "Wh/m³"
        icon: mdi:cube-outline
        state: >
          {% set effekt = states('sensor.friggebod_aktuell_effekt') | float(0) %}
          {% set volym = 30 %}
          {{ (effekt / volym) | round(1) }}

      # PROGNOS - Uppskattad daglig kostnad vid kontinuerlig drift
      - name: "Friggebod daglig kostnad prognos"
        unit_of_measurement: "SEK/dag"
        icon: mdi:cash-clock
        state: >
          {% set effekt_kw = states('input_number.friggebod_element_effekt') | float(750) / 1000 %}
          {% set pris = states('input_number.friggebod_elpris') | float(1.5) %}
          {% set max_runtime_hours = 2 %}
          {{ (effekt_kw * max_runtime_hours * pris) | round(2) }}

      # PROGNOS - Effektbehov vid -10°C ute (för dimensionering)
      - name: "Friggebod effektbehov vid minus 10"
        unit_of_measurement: "W"
        icon: mdi:snowflake-thermometer
        availability: >
          {{ states('sensor.friggebod_temperatur') not in ['unknown', 'unavailable', '']
             and states('sensor.ute') not in ['unknown', 'unavailable', ''] }}
        state: >
          {% set t_inne_onskat = 5 %}
          {% set t_ute = -10 %}
          {% set delta_t = t_inne_onskat - t_ute %}
          {% set varmebehov_per_grad = states('sensor.friggebod_varmebehov_per_grad') | float(50) %}
          {{ (varmebehov_per_grad * delta_t) | round(0) }}

      # ANALYS - Temperaturfall per timme när värmen är av
      - name: "Friggebod temperaturfall per timme"
        unit_of_measurement: "°C/h"
        icon: mdi:thermometer-chevron-down
        state: >
          {% set t_in = states('sensor.friggebod_temperatur') | float(0) %}
          {% set t_out = states('sensor.ute') | float(0) %}
          {% set u_varde = states('sensor.friggebod_uppskattat_u_varde') | float(0.5) %}
          {% set volym = 30 %}
          {% set luftdensitet = 1.2 %}
          {% set cp_luft = 1005 %}
          {% set termisk_massa = volym * luftdensitet * cp_luft %}
          {% set varmeforlust_w = u_varde * 62 * (t_in - t_out) %}
          {% if termisk_massa > 0 %}
            {{ (varmeforlust_w * 3600 / termisk_massa) | round(2) }}
          {% else %}
            unavailable
          {% endif %}

      # STATISTIK - Drift-tid i procent idag
      - name: "Friggebod drifttid procent"
        unit_of_measurement: "%"
        icon: mdi:percent
        state: >
          {% set runtime_periods = states('counter.friggebod_varme_tid') | int(0) %}
          {% set hour = now().hour %}
          {% set minutes = now().minute %}
          {% set elapsed_periods = (hour * 60 + minutes) / 10 %}
          {% if elapsed_periods > 0 %}
            {{ ((runtime_periods / elapsed_periods) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}

############################################
# ENERGIBERÄKNINGAR & FYSIK
############################################
# Beräknar energiförbrukning, värmebehov, U-värde och andra fysiska parametrar
# Byggnadsdata: 15m² golvyta, 2.2m takhöjd = 33m³ volym

input_number:
  friggebod_element_effekt:
    name: Friggebod elementeffekt
    min: 0
    max: 2000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:lightning-bolt
    mode: box
    initial: 750

  friggebod_elpris:
    name: Friggebod elpris
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: "SEK/kWh"
    icon: mdi:currency-sek
    mode: box
    initial: 1.5

############################################
# UTILITY METERS - Daglig/Månatlig statistik
############################################
utility_meter:
  friggebod_energi_daglig:
    source: sensor.friggebod_energiforbrukning_total
    cycle: daily
    name: Friggebod energi idag
    
  friggebod_energi_manatlig:
    source: sensor.friggebod_energiforbrukning_total
    cycle: monthly
    name: Friggebod energi denna månad

  friggebod_kostnad_daglig:
    source: sensor.friggebod_varmekostnad_total
    cycle: daily
    name: Friggebod kostnad idag
    
  friggebod_kostnad_manatlig:
    source: sensor.friggebod_varmekostnad_total
    cycle: monthly
    name: Friggebod kostnad denna månad

############################################
# HELPERS
############################################
# Input boolean för att aktivera/avaktivera automatisk värmestyrning
# Timer för minimum gångtid
# Counter för att räkna värmetid per dag

input_boolean:
  friggebod_varme_auto:
    name: Friggebod värme automatik
    icon: mdi:radiator

timer:
  friggebod_min_runtime:
    name: Friggebod min gångtid
    duration: "00:30:00"  # 30 minuter minimum gångtid

counter:
  friggebod_varme_tid:
    name: Friggebod värmetid idag
    initial: 0
    step: 1  # Räknar antalet 10-minuters perioder

############################################
# AUTOMATIONER
############################################
# NOTERING: Konfigurerbara värden definieras i node_anchors ovan.
# De upprepas i automation-variablerna för att vara explicita och lätta att justera.

# AUTO 1: Räkna värmetid (körs var 10:e minut)
# Räknar upp counter för att begränsa total värmetid per dag
automation:
  - alias: Friggebod – räkna värmetid
    description: Räknar upp värmetid varje 10:e minut när värmaren är på
    trigger:
      - platform: time_pattern
        minutes: "/10"  # Var 10:e minut
    condition:
      - condition: state
        entity_id: switch.friggebod_elvarme
        state: "on"
    action:
      - service: counter.increment
        target:
          entity_id: counter.friggebod_varme_tid

  # AUTO 2: Reset värmetid vid midnatt
  - alias: Friggebod – reset värmetid
    description: Nollställer värmetidsräknaren varje midnatt
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: counter.reset
        target:
          entity_id: counter.friggebod_varme_tid

  # AUTO 3: HUVUDLOGIK - Smart värmestyrning
  # Prioritetsordning:
  # 1. FROSTSKYDD - Aktiveras vid låg temperatur
  # 2. FUKTDRIVEN VÄRME - Reglerar för fuktbalans
  # 3. AVAKTIVERING - Stänger av när villkor inte uppfyllda
  - alias: Friggebod – komplett smart värmestyrning
    description: Styr värmaren baserat på temperatur, fukt och daglig körning
    mode: restart
    trigger:
      - platform: time_pattern
        minutes: "/5"  # Kontrollerar var 5:e minut
      - platform: state
        entity_id:
          - sensor.friggebod_temperatur
          - sensor.friggebod_luftfuktighet
          - sensor.ute
          - sensor.ute_friggebod_humidity

    condition:
      - condition: state
        entity_id: input_boolean.friggebod_varme_auto
        state: "on"

    action:
      - variables:
          # Konfigurerbara värden
          temp_frostskydd: 3
          temp_min_for_fuktvarme: 0
          rh_aktivering: 60
          rh_avaktivering: 55
          delta_abs_aktivering: 1.0
          delta_abs_avaktivering: 0.5
          max_varmetid: 12
          
          # Sensorvärden
          temp_in: "{{ states('sensor.friggebod_temperatur') | float(0) }}"
          rh_in: "{{ states('sensor.friggebod_luftfuktighet') | float(0) }}"
          abs_in: "{{ states('sensor.friggebod_absolut_fukt_inne') | float(0) }}"
          abs_out: "{{ states('sensor.utomhus_absolut_fukt') | float(0) }}"
          delta_abs: "{{ abs_in - abs_out }}"
          runtime_ok: "{{ states('counter.friggebod_varme_tid') | int(0) < max_varmetid }}"

      - choose:

          # PRIORITET 1: FROSTSKYDD
          # Aktiveras vid låg temperatur för att skydda mot frostskador
          - conditions:
              - condition: template
                value_template: "{{ temp_in < temp_frostskydd }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.friggebod_elvarme
              - condition: state
                entity_id: timer.friggebod_min_runtime
                state: "idle"
              - service: timer.start
                target:
                  entity_id: timer.friggebod_min_runtime

          # PRIORITET 2: FUKTDRIVEN VÄRME
          # Aktiveras när:
          # - Relativ fukt > 60%
          # - Absolut fukt inne > ute + 1.0 g/m³
          # - Temperatur > 0°C
          # - Daglig körtid < 12 perioder (2h)
          - conditions:
              - condition: template
                value_template: >
                  {{ rh_in > rh_aktivering
                     and delta_abs > delta_abs_aktivering
                     and temp_in > temp_min_for_fuktvarme
                     and runtime_ok }}
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.friggebod_elvarme
              - condition: state
                entity_id: timer.friggebod_min_runtime
                state: "idle"
              - service: timer.start
                target:
                  entity_id: timer.friggebod_min_runtime

          # PRIORITET 3: STÄNG AV
          # Avaktiveras när:
          # - Relativ fukt < 55% ELLER
          # - Absolut fukt-delta < 0.5 g/m³ ELLER
          # - Daglig körtid uppnådd
          # OCH minimum gångtid är över
          - conditions:
              - condition: template
                value_template: >
                  {{ rh_in < rh_avaktivering or delta_abs < delta_abs_avaktivering or not runtime_ok }}
              - condition: state
                entity_id: timer.friggebod_min_runtime
                state: "idle"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.friggebod_elvarme

  # AUTO 4: MÖGELVARNING
  # Skickar notifikation om mögelrisken är högt under längre tid.
  # Notification-target kan ändras via input_text.friggebod_notification_target
  - alias: Friggebod – mögelvarning
    description: Varnar när mögelrisken är över 60% i mer än 6 timmar
    trigger:
      - platform: numeric_state
        entity_id: sensor.friggebod_mogelrisk
        above: 60
        for:
          hours: 6
    action:
      - service: "{{ states('input_text.friggebod_notification_target') }}"
        data:
          message: >
            ⚠️ Hög mögelrisk i friggeboden!
            Temp: {{ states('sensor.friggebod_temperatur') }}°C
            RH: {{ states('sensor.friggebod_luftfuktighet') }}%
            Mögelrisk: {{ states('sensor.friggebod_mogelrisk') }}%
            Åtgärd: Öka ventilation eller värmning för att sänka fuktigheten.
            Mögelrisk: {{ states('sensor.friggebod_mogelrisk') }} %
