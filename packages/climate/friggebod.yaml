####################################################
#                                                  #
#              FRIGGEBOD (CLIMATE) PACKAGE          #
#                                                  #
####################################################
# Styrning av elvärme i friggebod baserat på temperatur och fukt.
# Systemet skyddar mot frost och hög fuktighet samt räknar värmetid.
#
# EXTERNA BEROENDEN (sensorer definierade på annat håll):
# - sensor.friggebod_temperature (temperatur inne, °C)
# - sensor.friggebod_humidity (relativ fukt inne, %)
# - sensor.ute (utomhustemperatur, °C)
# - sensor.ute_friggebod_humidity (relativ fukt ute, %)
# - switch.friggebod_elvarme (main power switch för elvärme)
# - notify.* (notification service, se input_text.friggebod_notification_target)
#
# Funktioner:
# - Frostskydd vid låg temperatur
# - Fuktdriven värmestyrning
# - Mögelriskberäkning (absolut fukt + relativ fukt)
# - Automatisk värmetidsräkning per dag
# - Daglig begränsning av värmekörning
# - Mögelvarning vid högt värde

# METADATA:
# Skapad: okänt
# Senast ändrad: 2026-01-06
# Version: 2.1
# Författare: Home Assistant Config
####################################################

############################################
# NOTIFIKATION-KONFIGURATION
############################################
# Ändra denna till din notification service (notify.email, notify.ntfy, etc.)
input_text:
  friggebod_notification_target:
    name: Friggebod notifikation-target
    initial: "notify.mobile_app_sm_a528b"
    icon: mdi:bell

############################################
# KONFIGURERBARA VARIABLER
############################################
# Temperaturvärden (°C)
homeassistant:
  customize:
    package.node_anchors:
      # Temperaturvärden
      temp_frostskydd: &temp_frostskydd 3
      temp_min_for_fuktvarme: &temp_min_for_fuktvarme 0
      
      # Fuktvärden (%)
      rh_aktivering: &rh_aktivering 60
      rh_avaktivering: &rh_avaktivering 55
      
      # Absolut fukt (g/m³)
      delta_abs_aktivering: &delta_abs_aktivering 1.0
      delta_abs_avaktivering: &delta_abs_avaktivering 0.5
      
      # Mögelrisk
      mogelrisk_troskel: &mogelrisk_troskel 75
      mogelrisk_varning: &mogelrisk_varning 60
      mogelrisk_varning_tid: &mogelrisk_varning_tid 6  # timmar
      
      # Värmestyrning
      max_varmetid_per_dag: &max_varmetid_per_dag 12  # antal 10-min perioder (= 2h)
      min_gangtid: &min_gangtid "00:30:00"  # minuter värmen ska köra minst
      
      # Övervakningsintervall
      kontroll_intervall: &kontroll_intervall 5  # minuter
      varmetid_ratt_intervall: &varmetid_ratt_intervall 10  # minuter
      
      # Matematiska konstanter för fuktberäkning
      magnus_a: &magnus_a 17.67
      magnus_b: &magnus_b 243.5
      absolut_noll: &absolut_noll 273.15
      ideal_gas_konstant: &ideal_gas_konstant 2.1674
      magnus_konstant: &magnus_konstant 6.112

############################################
# FRIGGEBOD – SMART FUKT & VÄRMESTYRNING
############################################

############################################
# TEMPLATE SENSORER
############################################
# Beräknar absolut fukt och mögelrisk baserat på temperatur och relativ fuktighet.
# Formler:
# - Absolut fukt: Magnus-Tetens formel för mättnadstryck + idealgas-approximation
# - Mögelrisk: Linjär funktion baserad på RH över tröskelvärde

template:
  - sensor:
      # Beräknar absolut fukt inne i friggeboden (g/m³)
      # FORMEL: Magnus-Tetens approximation (gäller -40 till +60°C)
      # - Mättnadstryck: es = 6.112 * e^((17.67*T)/(T+243.5))
      # - Absolut fukt: AH = es * RH * 2.1674 / (273.15 + T)
      # ANVÄNDNING: Jämför inne vs ute för fuktstyrning
      - name: "Friggebod absolut fukt inne"
        unit_of_measurement: "g/m³"
        state_class: "measurement"
        icon: mdi:water
        state: >
          {% set T = states('sensor.friggebod_temperature') | float(none) %}
          {% set RH = states('sensor.friggebod_humidity') | float(none) %}
          {% if T is none or RH is none %}
            unavailable
          {% else %}
            {% set a = 17.67 %}
            {% set b = 243.5 %}
            {% set R_sp = 2.1674 %}
            {% set T_abs = 273.15 %}
            {% set K = 6.112 %}
            {% set exp_val = (a * T) / (T + b) %}
            {% set e = 2.718281828459045 %}
            {{ (K * (e ** exp_val) * RH * R_sp / (T_abs + T)) | round(2) }}
          {% endif %}

      # Beräknar absolut fukt utomhus (g/m³)
      # Samma Magnus-Tetens formel, men använder ute-temperaturer.
      # Används för att beräkna delta_abs = AH_inne - AH_ute
      - name: "Utomhus absolut fukt"
        unit_of_measurement: "g/m³"
        state_class: "measurement"
        icon: mdi:water
        state: >
          {% set T = states('sensor.ute') | float(none) %}
          {% set RH = states('sensor.ute_friggebod_humidity') | float(none) %}
          {% if T is none or RH is none %}
            unavailable
          {% else %}
            {% set a = 17.67 %}
            {% set b = 243.5 %}
            {% set R_sp = 2.1674 %}
            {% set T_abs = 273.15 %}
            {% set K = 6.112 %}
            {% set exp_val = (a * T) / (T + b) %}
            {% set e = 2.718281828459045 %}
            {{ (K * (e ** exp_val) * RH * R_sp / (T_abs + T)) | round(2) }}
          {% endif %}

      # Beräknar mögelrisk baserat på relativ fuktighet
      # LOGIK:
      # - T < 0°C: Risk = 0% (ingen svampväxt i kallt)
      # - RH < 75%: Risk = 0% (under tröskel)
      # - RH >= 75%: Risk = (RH - 75) * 2 (linjär ökning)
      # EXEMPEL: RH=80% => 10%, RH=90% => 30%
      - name: "Friggebod mögelrisk"
        unit_of_measurement: "%"
        device_class: "humidity"
        icon: mdi:mushroom
        availability: >
          {{ states('sensor.friggebod_temperature') not in ['unknown', 'unavailable', '']
             and states('sensor.friggebod_humidity') not in ['unknown', 'unavailable', ''] }}
        state: >
          {% set T = states('sensor.friggebod_temperature') | float(none) %}
          {% set RH = states('sensor.friggebod_humidity') | float(none) %}
          {% set troskel = 75 %}
          {% if T is none or RH is none %}
            unavailable
          {% elif T < 0 %}
            0
          {% else %}
            {% set risk = ((RH - troskel) * 2) %}
            {% if risk < 0 %}
              0
            {% elif risk > 100 %}
              100
            {% else %}
              {{ risk | round(0) }}
            {% endif %}
          {% endif %}

############################################
# HELPERS
############################################
# Input boolean för att aktivera/avaktivera automatisk värmestyrning
# Timer för minimum gångtid
# Counter för att räkna värmetid per dag

input_boolean:
  friggebod_varme_auto:
    name: Friggebod värme automatik
    icon: mdi:radiator

timer:
  friggebod_min_runtime:
    name: Friggebod min gångtid
    duration: "00:30:00"  # 30 minuter minimum gångtid

counter:
  friggebod_varme_tid:
    name: Friggebod värmetid idag
    initial: 0
    step: 1  # Räknar antalet 10-minuters perioder

############################################
# AUTOMATIONER
############################################
# NOTERING: Konfigurerbara värden definieras i node_anchors ovan.
# De upprepas i automation-variablerna för att vara explicita och lätta att justera.

# AUTO 1: Räkna värmetid (körs var 10:e minut)
# Räknar upp counter för att begränsa total värmetid per dag
automation:
  - alias: Friggebod – räkna värmetid
    description: Räknar upp värmetid varje 10:e minut när värmaren är på
    trigger:
      - platform: time_pattern
        minutes: "/10"  # Var 10:e minut
    condition:
      - condition: state
        entity_id: switch.friggebod_elvarme
        state: "on"
    action:
      - service: counter.increment
        target:
          entity_id: counter.friggebod_varme_tid

  # AUTO 2: Reset värmetid vid midnatt
  - alias: Friggebod – reset värmetid
    description: Nollställer värmetidsräknaren varje midnatt
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: counter.reset
        target:
          entity_id: counter.friggebod_varme_tid

  # AUTO 3: HUVUDLOGIK - Smart värmestyrning
  # Prioritetsordning:
  # 1. FROSTSKYDD - Aktiveras vid låg temperatur
  # 2. FUKTDRIVEN VÄRME - Reglerar för fuktbalans
  # 3. AVAKTIVERING - Stänger av när villkor inte uppfyllda
  - alias: Friggebod – komplett smart värmestyrning
    description: Styr värmaren baserat på temperatur, fukt och daglig körning
    mode: restart
    trigger:
      - platform: time_pattern
        minutes: "/5"  # Kontrollerar var 5:e minut
      - platform: state
        entity_id:
          - sensor.friggebod_temperature
          - sensor.friggebod_humidity
          - sensor.ute
          - sensor.ute_friggebod_humidity

    condition:
      - condition: state
        entity_id: input_boolean.friggebod_varme_auto
        state: "on"

    action:
      - variables:
          # Konfigurerbara värden
          temp_frostskydd: 3
          temp_min_for_fuktvarme: 0
          rh_aktivering: 60
          rh_avaktivering: 55
          delta_abs_aktivering: 1.0
          delta_abs_avaktivering: 0.5
          max_varmetid: 12
          
          # Sensorvärden
          temp_in: "{{ states('sensor.friggebod_temperature') | float(0) }}"
          rh_in: "{{ states('sensor.friggebod_humidity') | float(0) }}"
          abs_in: "{{ states('sensor.friggebod_absolut_fukt_inne') | float(0) }}"
          abs_out: "{{ states('sensor.utomhus_absolut_fukt') | float(0) }}"
          delta_abs: "{{ abs_in - abs_out }}"
          runtime_ok: "{{ states('counter.friggebod_varme_tid') | int(0) < max_varmetid }}"

      - choose:

          # PRIORITET 1: FROSTSKYDD
          # Aktiveras vid låg temperatur för att skydda mot frostskador
          - conditions:
              - condition: template
                value_template: "{{ temp_in < temp_frostskydd }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.friggebod_elvarme
              - condition: state
                entity_id: timer.friggebod_min_runtime
                state: "idle"
              - service: timer.start
                target:
                  entity_id: timer.friggebod_min_runtime

          # PRIORITET 2: FUKTDRIVEN VÄRME
          # Aktiveras när:
          # - Relativ fukt > 60%
          # - Absolut fukt inne > ute + 1.0 g/m³
          # - Temperatur > 0°C
          # - Daglig körtid < 12 perioder (2h)
          - conditions:
              - condition: template
                value_template: >
                  {{ rh_in > rh_aktivering
                     and delta_abs > delta_abs_aktivering
                     and temp_in > temp_min_for_fuktvarme
                     and runtime_ok }}
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.friggebod_elvarme
              - condition: state
                entity_id: timer.friggebod_min_runtime
                state: "idle"
              - service: timer.start
                target:
                  entity_id: timer.friggebod_min_runtime

          # PRIORITET 3: STÄNG AV
          # Avaktiveras när:
          # - Relativ fukt < 55% ELLER
          # - Absolut fukt-delta < 0.5 g/m³ ELLER
          # - Daglig körtid uppnådd
          # OCH minimum gångtid är över
          - conditions:
              - condition: template
                value_template: >
                  {{ rh_in < rh_avaktivering or delta_abs < delta_abs_avaktivering or not runtime_ok }}
              - condition: state
                entity_id: timer.friggebod_min_runtime
                state: "idle"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.friggebod_elvarme

  # AUTO 4: MÖGELVARNING
  # Skickar notifikation om mögelrisken är högt under längre tid.
  # Notification-target kan ändras via input_text.friggebod_notification_target
  - alias: Friggebod – mögelvarning
    description: Varnar när mögelrisken är över 60% i mer än 6 timmar
    trigger:
      - platform: numeric_state
        entity_id: sensor.friggebod_mogelrisk
        above: 60
        for:
          hours: 6
    action:
      - service: "{{ states('input_text.friggebod_notification_target') }}"
        data:
          message: >
            ⚠️ Hög mögelrisk i friggeboden!
            Temp: {{ states('sensor.friggebod_temperature') }}°C
            RH: {{ states('sensor.friggebod_humidity') }}%
            Mögelrisk: {{ states('sensor.friggebod_mogelrisk') }}%
            Åtgärd: Öka ventilation eller värmning för att sänka fuktigheten.
            Mögelrisk: {{ states('sensor.friggebod_mogelrisk') }} %
