####################################################
#                                                  #
#          FRIGATE ANIMAL DETECTION               #
#                                                  #
####################################################
# Frigate-paket - se även: frigate_sensors.yaml (sammanställningssensorer) |
# frigate_person_detected.yaml, frigate_face_detection.yaml (övrig detektion) |
# frigate_media.yaml (lagring) | frigate_temp_presence.yaml (närvaro) | frigate_intruder_alarm.yaml (larm)
#
# Frigate NVR animal detection helpers for the backside (rear yard):
# lighting, notification, and a reset helper.
#
# Primary signals (from packages/frigate_sensors.yaml):
# - binary_sensor.cams_animal_backside_active  (animal detection summary)
# - binary_sensor.cams_all_backside_active     (any detection summary)
#
# Main automations:
# - Animal Motion Radio Control Backside
#   - Trigger: cams_animal_backside_active (on/off)
#   - Turn ON: waits 10s, then turns on light.tradack_ute if detection persists
#     during night hours (20:00-08:00) or when lux is below 10.
#     Note: light.tradack_ute is physically a radio (animal deterrent), not a light fixture.
#   - Turn OFF: after 20s with no detection.
#
# - Animal Motion Light Control
#   - Trigger: cams_animal_backside_active (on/off)
#   - Turn ON: after 2s delay, turns on floodlights when (night hours OR low lux).
#   - Turn OFF: after 30s with no detection.
#
# Test automations (using cams_all_backside_active):
# - Test Motion Light Control (floodlights): on immediately, off after 10s clear.
# - Test Motion Radio Control Backside (radio): on immediately, off after 30s clear.
#
# Notifications:
# - Animal Detection Notify
#   - Trigger: cams_animal_backside_active -> on
#   - Condition: night hours OR home_status is Borta OR low lux
#
# Failsafe:
# - Turn Off Deck Light After 10 Minutes (failsafe)
#   - If cams_animal_backside_active stays on for 10 minutes, force light.tradack_ute (radio) off
#
# Controlled entities:
# - light.tradack_ute (physically a radio - animal deterrent, not a light fixture)
# - light.stralkastare_husgavel
# - light.kamera5_stralkastare
# - light.kamera6_stralkastare
# - light.kamera8_stralkastare
#
####################################################

# Källor:
# - Frigate NVR (paketfil)
#
# BESKRIVNING:
# Automationer för Frigate-detektering (baksidan):
# - Tänder/släcker belysning (trädäck + strålkastare) vid djurdetektering
# - Testautomationer kopplade till “all backside active”
# - Pushnotis vid djurdetektering (med villkor)
# - Failsafe + reset-script för att nollställa läget
#

##############
### Sensor ###
##############
# Debug/diagnostik-sensor - visar varför radion (light.tradack_ute) och strålkastarna
# är på/av just nu, analogt med packages/lights/debug.yaml-mönstret.
template:
  - sensor:
      - name: frigate_debug_animal_backside
        unique_id: frigate_debug_animal_backside
        state: >-
          Radio: {{ states('light.tradack_ute') }}, Strålkastare: {{ 'on' if is_state('light.stralkastare_husgavel', 'on') or is_state('light.kamera5_stralkastare', 'on') or is_state('light.kamera6_stralkastare', 'on') or is_state('light.kamera8_stralkastare', 'on') else 'off' }}
        attributes:
          animal_detected: "{{ is_state('binary_sensor.cams_animal_backside_active', 'on') }}"
          lux: "{{ states('sensor.ljusstyrka') }}"
          is_night: >-
            {% from 'time_windows.jinja' import in_time_range %}
            {{ in_time_range(20, 0, 8, 0) }}
          radio_automation_enabled: "{{ is_state('automation.animal_motion_radio_on', 'on') }}"
          floodlight_automation_enabled: "{{ is_state('automation.animal_motion_light_control', 'on') }}"
          reason: >-
            {% from 'time_windows.jinja' import in_time_range %}
            {% set detected = is_state('binary_sensor.cams_animal_backside_active', 'on') %}
            {% set lux = states('sensor.ljusstyrka') | float(none) %}
            {% set is_night = (in_time_range(20, 0, 8, 0) | trim) == 'True' %}
            {% set dark_enough = is_night or (lux is number and lux < 10) %}
            {% if not is_state('automation.animal_motion_radio_on', 'on') %}
              Automationen "Animal Motion Radio Control Backside" är avstängd -> radion styrs inte automatiskt
            {% elif not detected %}
              Ingen djurdetektering just nu (cams_animal_backside_active=off) -> radio släcks 20s efter senaste detektion
            {% elif dark_enough %}
              Djur upptäckt + mörkt (natt 20-08 eller lux<10) -> radio tänds 10s efter detektion om det kvarstår
            {% else %}
              Djur upptäckt men för ljust (lux>=10, inte natt) -> radion tänds INTE
            {% endif %}

##################
### Automation ###
##################
automation:
  ############################################
  ### Animal Motion Radio Control Backside ###
  ############################################
  - alias: Animal Motion Radio Control Backside
    id: '1416857464463'
    mode: restart

    trigger:
      # Triggers for animal detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_animal_backside_active

    condition: []

    action:
      - choose:

          # Wait 10 seconds and check if motion is still detected before turning on the light
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_animal_backside_active
                    state: 'on'
                  - condition: or
                    conditions:
                      - condition: time
                        after: '20:00:00'
                        before: '08:00:00'
                      - condition: numeric_state
                        entity_id: sensor.ljusstyrka
                        below: 10
            sequence:
              - delay: '00:00:10'
              - condition: state
                entity_id: binary_sensor.cams_animal_backside_active
                state: 'on'
              - condition: or
                conditions:
                  - condition: time
                    after: '20:00:00'
                    before: '08:00:00'
                  - condition: numeric_state
                    entity_id: sensor.ljusstyrka
                    below: 10
              - service: light.turn_on
                target:
                  entity_id: light.tradack_ute

          # Turn off light if no motion is detected after 20 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cams_animal_backside_active
                state: 'off'
            sequence:
              - delay: '00:00:20'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_animal_backside_active
                    state: 'off'
              - service: light.turn_off
                target:
                  entity_id: light.tradack_ute

  ###################################
  ### Animal Motion Light Control ###
  ###################################
  - alias: Animal Motion Light Control
    id: '1416857464346'
    mode: restart

    trigger:
      # Triggers for animal detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_animal_backside_active

    condition: []

    action:
      - choose:

          # Turn on light when motion is detected and light level is low
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_animal_backside_active
                    state: 'on'
                  - condition: or
                    conditions:
                      - condition: time
                        after: '20:00:00'
                        before: '08:00:00'
                      - condition: numeric_state
                        entity_id: sensor.ljusstyrka
                        below: 10
            sequence:

              # Add 2 second delay before turning on lights
              - delay: "00:00:02"

              # Turn on lights as before
              - service: light.turn_on
                target:
                  entity_id: light.stralkastare_husgavel
              - service: light.turn_on
                target:
                  entity_id: light.kamera5_stralkastare
              - service: light.turn_on
                target:
                  entity_id: light.kamera6_stralkastare
              - service: light.turn_on
                target:
                  entity_id: light.kamera8_stralkastare

          # Turn off light if no motion is detected after 30 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cams_animal_backside_active
                state: 'off'
            sequence:
              - delay: '00:00:30'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_animal_backside_active
                    state: 'off'

              # Turn off lights as before
              - service: light.turn_off
                target:
                  entity_id: light.stralkastare_husgavel
              - service: light.turn_off
                target:
                  entity_id: light.kamera5_stralkastare
              - service: light.turn_off
                target:
                  entity_id: light.kamera6_stralkastare
              - service: light.turn_off
                target:
                  entity_id: light.kamera8_stralkastare

  ###################################
  ### Test Motion Light Control ###
  ###################################
  - alias: Test Motion Light Control
    id: '1416857464347'
    mode: restart

    trigger:
      # Triggers for all detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_all_backside_active

    condition: []

    action:
      - choose:

          # Turn on light when motion is detected and light level is low
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_all_backside_active
                    state: 'on'
            sequence:

              # Add 2 second delay before turning on lights
              - delay: "00:00:02"

              # Turn on lights as before
              - service: light.turn_on
                target:
                  entity_id: light.stralkastare_husgavel
              - service: light.turn_on
                target:
                  entity_id: light.kamera5_stralkastare
              - service: light.turn_on
                target:
                  entity_id: light.kamera6_stralkastare
              - service: light.turn_on
                target:
                  entity_id: light.kamera8_stralkastare

          # Turn off light if no motion is detected after 10 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cams_all_backside_active
                state: 'off'
            sequence:
              - delay: '00:00:10'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_all_backside_active
                    state: 'off'

              # Turn off lights as before
              - service: light.turn_off
                target:
                  entity_id: light.stralkastare_husgavel
              - service: light.turn_off
                target:
                  entity_id: light.kamera5_stralkastare
              - service: light.turn_off
                target:
                  entity_id: light.kamera6_stralkastare
              - service: light.turn_off
                target:
                  entity_id: light.kamera8_stralkastare

  ##########################################
  ### Test Motion Radio Control Backside ###
  ##########################################
  - alias: Test Motion Radio Control Backside
    id: '1416857464444'
    mode: restart

    trigger:
      # Triggers for all detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_all_backside_active

    condition: []

    action:
      - choose:

          # Turn on light when motion is detected and light level is low
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_all_backside_active
                    state: 'on'
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.tradack_ute

          # Turn off light if no motion is detected after 30 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cams_all_backside_active
                state: 'off'
            sequence:
              - delay: '00:00:30'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_all_backside_active
                    state: 'off'
              - service: light.turn_off
                target:
                  entity_id: light.tradack_ute

  ###############################
  ### Animal Detection Notify ###
  ###############################
  - alias: Animal Detection Notify
    id: '81119011564329' 
    mode: single

    trigger:
      # Triggers for animal detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_animal_backside_active
        to: 'on'

    condition:
      condition: or
      conditions:
        - condition: time
          after: '20:00:00'
          before: '08:00:00'
        - condition: state
          entity_id: input_select.home_status
          state: 'Borta'
        - condition: numeric_state
          entity_id: sensor.ljusstyrka
          below: 10

    action:
      - service: notify.mobile_app_sm_a528b
        data_template:
          title: >
            "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: >
            Camera 5, 6 or 8 has detected. lux: {{ states('sensor.ljusstyrka') | int(0) }}:
            - Bear:     {{ states('sensor.cam5_bear_count') | int(0) }} {{ states('sensor.cam6_bear_count') | int(0) }} {{ states('sensor.cam8_bear_count') | int(0) }}
            - Cow:      {{ states('sensor.cam5_cat_count') | int(0) }} {{ states('sensor.cam6_cat_count') | int(0) }} {{ states('sensor.cam8_cat_count') | int(0) }}
            - Dog:      {{ states('sensor.cam5_dog_count') | int(0) }} {{ states('sensor.cam6_dog_count') | int(0) }} {{ states('sensor.cam8_dog_count') | int(0) }}
            - Horse:    {{ states('sensor.cam5_horse_count') | int(0) }} {{ states('sensor.cam6_horse_count') | int(0) }} {{ states('sensor.cam8_horse_count') | int(0) }}
            - Sheep:    {{ states('sensor.cam5_sheep_count') | int(0) }} {{ states('sensor.cam6_sheep_count') | int(0) }} {{ states('sensor.cam8_sheep_count') | int(0) }}

  #######################################
  ### Turn Off Deck Light After 10 Minutes (failsafe) ###
  #######################################
  - alias: Turn Off Deck Light After 10 Minutes (failsafe)
    id: '1416857469999'
    mode: single

    trigger:
      # Use Frigate detection as the signal (avoid cross-package trigger on light state)
      - platform: state
        entity_id: binary_sensor.cams_animal_backside_active
        to: 'on'
        for: '00:10:00'

    condition: []

    action:
      - service: light.turn_off
        target:
          entity_id: light.tradack_ute

######################################
### Script: Reset Animal detection ###
######################################

script:
  reset_animal_detection:
    alias: Reset Animal Detection
    sequence:
      # Store initial automation states
      - variables:
          auto_backside: "{{ is_state('automation.animal_motion_radio_on', 'on') }}"
          auto_light: "{{ is_state('automation.animal_motion_light_control', 'on') }}"
          auto_notify: "{{ is_state('automation.animal_detection_notify', 'on') }}"
          auto_blink: "{{ is_state('automation.blink_light_when_detcection_cam_5', 'on') }}"

      # Turn off all automations
      - service: automation.turn_off
        target:
          entity_id:
            - automation.animal_motion_radio_on
            - automation.animal_motion_light_control
            - automation.animal_detection_notify
            - automation.blink_light_when_detcection_cam_5

      # Turn off all lights controlled by the automations
      - service: light.turn_off
        target:
          entity_id:
            - light.tradack_ute
            - light.stralkastare_husgavel
            - light.kamera5_stralkastare
            - light.kamera6_stralkastare
            - light.kamera8_stralkastare

      # Wait for 30 seconds
      - delay: "00:00:30"

      # Only turn on automations that were on before
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ auto_backside }}"
            sequence:
              - service: automation.turn_on
                target:
                  entity_id: automation.animal_motion_radio_on
          - conditions:
              - condition: template
                value_template: "{{ auto_light }}"
            sequence:
              - service: automation.turn_on
                target:
                  entity_id: automation.animal_motion_light_control
          - conditions:
              - condition: template
                value_template: "{{ auto_notify }}"
            sequence:
              - service: automation.turn_on
                target:
                  entity_id: automation.animal_detection_notify
          - conditions:
              - condition: template
                value_template: "{{ auto_blink }}"
            sequence:
              - service: automation.turn_on
                target:
                  entity_id: automation.blink_light_when_detcection_cam_5
