####################################################
#                                                  #
#           FRIGATE FACE DETECTION MQTT            #
#                                                  #
####################################################
# Frigate-paket - se även: frigate_sensors.yaml (sammanställningssensorer) |
# frigate_person_detected.yaml, frigate_animal_detected.yaml (detektion) |
# frigate_media.yaml (lagring) | frigate_temp_presence.yaml (närvaro) |
# frigate_intruder_alarm.yaml (larm)
#
# Frigate face recognition support for Home Assistant
# via MQTT tracked object updates.
#
# This package creates a face-detection binary sensor and
# helper sensors for the most recent face recognition event.
#
# Latest Frigate publishes face recognition updates on
# `frigate/tracked_object_update` with payload type `face`.
# Adjust `state_topic` if your MQTT topic prefix is different.
#
mqtt:
  sensor:
    - name: "Frigate Face Name"
      unique_id: frigate_face_name
      state_topic: "frigate/tracked_object_update"
      value_template: >
        {% if value_json.type == 'face' %}
          {{ value_json.name | default('unknown') }}
        {% else %}
          unknown
        {% endif %}

    - name: "Frigate Face Camera"
      unique_id: frigate_face_camera
      state_topic: "frigate/tracked_object_update"
      value_template: >
        {% if value_json.type == 'face' %}
          {{ value_json.camera | default('unknown') }}
        {% else %}
          unknown
        {% endif %}

    - name: "Frigate Face Score"
      unique_id: frigate_face_score
      state_topic: "frigate/tracked_object_update"
      unit_of_measurement: ""
      value_template: >
        {% if value_json.type == 'face' %}
          {{ value_json.score | default('') }}
        {% else %}
          unknown
        {% endif %}

    - name: "Frigate Face Timestamp"
      unique_id: frigate_face_timestamp
      state_topic: "frigate/tracked_object_update"
      value_template: >
        {% if value_json.type == 'face' %}
          {{ value_json.timestamp | default('') }}
        {% else %}
          unknown
        {% endif %}

    - name: "Frigate Face Event Raw"
      unique_id: frigate_face_event_raw
      state_topic: "frigate/tracked_object_update"
      value_template: "{{ value_json | tojson }}"
