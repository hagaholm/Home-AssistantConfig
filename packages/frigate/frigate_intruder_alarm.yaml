# Frigate-paket - se även: frigate_sensors.yaml (sammanställningssensorer) |
# frigate_person_detected.yaml, frigate_animal_detected.yaml, frigate_face_detection.yaml (detektion) |
# frigate_media.yaml (lagring) | frigate_temp_presence.yaml (närvaro)
#
# Camera 5 and 6 intruder alarm automation
# Separate package for Frigate alarm controls so future cameras can be added consistently.

### counter ###
counter:
  intruder_alarm_cam5_daily_count:
    name: "Cam5 Intruder Alarm Daily Count"
    initial: 0
    step: 1

  intruder_alarm_cam6_daily_count:
    name: "Cam6 Intruder Alarm Daily Count"
    initial: 0
    step: 1

  intruder_alarm_cam9_daily_count:
    name: "Cam9 Intruder Alarm Daily Count"
    initial: 0
    step: 1

### input_datetime ###
input_datetime:
  intruder_alarm_cam5_last_trigger:
    name: "Cam5 Intruder Alarm Last Trigger"
    has_date: true
    has_time: true

  intruder_alarm_cam6_last_trigger:
    name: "Cam6 Intruder Alarm Last Trigger"
    has_date: true
    has_time: true

  intruder_alarm_cam9_last_trigger:
    name: "Cam9 Intruder Alarm Last Trigger"
    has_date: true
    has_time: true

### automation ###
automation:
#####################################
  - alias: Cam Siren Reset On HA Start
    id: "cam_siren_reset_on_ha_start"
    mode: single
    trigger:
      - platform: homeassistant
        event: start

    action:
      - service: siren.turn_off
        target:
          entity_id: siren.kamera5_siren
      - service: siren.turn_off
        target:
          entity_id: siren.kamera6_siren
      - service: siren.turn_off
        target:
          entity_id: siren.kamera8_siren
      - service: siren.turn_off
        target:
          entity_id: siren.kamera9_siren
      - service: siren.turn_off
        target:
          entity_id: siren.kamera10_siren

      - delay: "00:00:01"

      - service: number.set_value
        target:
          entity_id: number.kamera5_volym
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.kamera6_volym
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.kamera8_volym
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.kamera9_volym
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.kamera10_volym
        data:
          value: 0

#############
### cam 5 ###
#############
  - alias: Cam5 Person Intruder Alarm
    id: '81119011564400'
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.cam5_person_occupancy
        to: "on"

    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.home_status
            state: "Sover"

          - condition: state
            entity_id: input_select.home_status
            state: "Borta"

      - condition: template
        value_template: >
          {{ states('counter.intruder_alarm_cam5_daily_count') | int(0) < 2 }}

      - condition: template
        value_template: >
          {% set last = states('input_datetime.intruder_alarm_cam5_last_trigger') %}
          {% if last in ['unknown', 'unavailable', '', none] %}
            true
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(last, 0)) > 20 }}
          {% endif %}

    action:
      - service: number.set_value
        target:
          entity_id: number.kamera5_volym
        data:
          value: 50

      - service: siren.turn_on
        target:
          entity_id: siren.kamera5_siren

      - delay: "00:00:05"

      - service: siren.turn_off
        target:
          entity_id: siren.kamera5_siren

      - delay: "00:00:01"

      - service: number.set_value
        target:
          entity_id: number.kamera5_volym
        data:
          value: 0

      - service: counter.increment
        target:
          entity_id: counter.intruder_alarm_cam5_daily_count

      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.intruder_alarm_cam5_last_trigger
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      - service: notify.mobile_app_sm_a528b
        data:
          title: "Cam5 Intruder Alarm"
          message: >-
            Person detected by Cam5 occupancy sensor while {{ states('input_select.home_status') }}.
            Siren activated for 5 seconds at 50%.

  - alias: Cam5 Intruder Alarm Daily Reset
    id: '81119011564401'
    mode: single
    trigger:
      - platform: time
        at: '00:00:00'
    action:
      - service: counter.reset
        target:
          entity_id: counter.intruder_alarm_cam5_daily_count

  - alias: Cam5 Siren Failsafe Off
    id: 'cam5_siren_failsafe_off'
    mode: single
    trigger:
      - platform: state
        entity_id: siren.kamera5_siren
        to: "on"
        for: "00:00:06"

    action:
      - service: siren.turn_off
        target:
          entity_id: siren.kamera5_siren

      - delay: "00:00:01"

      - service: number.set_value
        target:
          entity_id: number.kamera5_volym
        data:
          value: 0

      - service: notify.mobile_app_sm_a528b
        data:
          title: "Cam5 Siren Failsafe"
          message: >-
            Failsafe turned off Cam5 siren because it remained on for more than 6 seconds.

