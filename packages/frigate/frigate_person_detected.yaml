####################################################
#                                                  #
#          FRIGATE PERSON DETECTION                #
#                                                  #
####################################################
# Person detection notifications from Frigate NVR
# AI-powered person detection on security cameras
# Documentation: https://docs.frigate.video/
#
# Camera Coverage:
# - Cam 10: Uppfart (driveway) - Front approach
# - Cam 5: Baksida (backside) - Rear yard priority
# - Cam 6: Baksida (backside) - Rear entrance priority
# - Cam 7: Friggebod (garden shed) - Outbuilding
# - Cam 8: Entre (entrance) - Main entry
# - Cam 9: Garage infront - Garage entrance
#
# Notification Logic:
# - Immediate alerts: Sleep mode (Sover) or Away + Priority cameras
# - Priority cameras: Cam 5, Cam 6 (backside - vulnerable)
# - Delayed alerts: Away mode + non-priority cameras (reduce false positives)
# - Away delay: 2 minutes (allows motion to stabilize)
#
# Conditions:
# - Sover (Sleep): Notify on any person detection
# - Borta (Away) + Priority: Immediate notification
# - Borta (Away) + Other: 2-minute delay notification
# - Hemma (Home active): No notifications
#
# Safety Notes:
# - Mode: single (prevent notification spam)
# - max_exceeded: silent (drop concurrent triggers)
# - Detection counts included in notification
# - Timestamp in notification title
#
####################################################

# Källor:
# - Frigate NVR (paketfil)
#
# BESKRIVNING:
# Notifieringar/automationer för person-detektering från Frigate.
#

##################
### Automation ###
##################
automation:
  # Immediate notifications for priority cameras and sleep mode
  - alias: Person Detection Notify Immediate
    id: '81119011564368'
    mode: single
    max_exceeded: silent

    trigger:
      - platform: state
        entity_id: 
          - binary_sensor.cams_person_active
        to: 'on'

    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.home_status
            state: 'Sover'
          - condition: and
            conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Borta'
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.cam5_person_count
                    above: 0
                  - condition: numeric_state
                    entity_id: sensor.cam6_person_count
                    above: 0

    action:
      - variables:
          detection_message: >
            {% set detections = [] %}
            {% if states('sensor.cam10_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 10 Uppfart: ' + states('sensor.cam10_person_count')] %}
            {% endif %}
            {% if states('sensor.cam5_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 5 Baksida: ' + states('sensor.cam5_person_count')] %}
            {% endif %}
            {% if states('sensor.cam6_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 6 Baksida: ' + states('sensor.cam6_person_count')] %}
            {% endif %}
            {% if states('sensor.cam7_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 7 Frigge: ' + states('sensor.cam7_person_count')] %}
            {% endif %}
            {% if states('sensor.cam8_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 8 Entre: ' + states('sensor.cam8_person_count')] %}
            {% endif %}
            {% if states('sensor.cam9_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 9 Garage: ' + states('sensor.cam9_person_count')] %}
            {% endif %}
            {{ detections | join('\n') }}
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Sover'
            sequence:
              - service: notify.mobile_app_sm_a528b
                data_template:
                  title: >
                    "Person Detection Sleep Alert {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: >
                    Person detected:
                    {{ detection_message }}
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Borta'
            sequence:
              - service: notify.mobile_app_sm_a528b
                data_template:
                  title: >
                    "Person Detection Away Alert (Priority) {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: >
                    Person detected (priority cameras):
                    {{ detection_message }}

  # Delayed notifications for non-priority cameras when away
  - alias: Person Detection Notify Delayed
    id: '81119011564369'
    mode: parallel
    max: 5

    trigger:
      - platform: state
        entity_id: 
          - binary_sensor.cams_person_active
        to: 'on'

    condition:
      - condition: state
        entity_id: input_select.home_status
        state: 'Borta'
      - condition: and
        conditions:
          - condition: numeric_state
            entity_id: sensor.cam5_person_count
            below: 1
          - condition: numeric_state
            entity_id: sensor.cam6_person_count
            below: 1

    action:
      # Capture detection info at trigger time
      - variables:
          trigger_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          detection_message: >
            {% set detections = [] %}
            {% if states('sensor.cam10_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 10 Uppfart: ' + states('sensor.cam10_person_count')] %}
            {% endif %}
            {% if states('sensor.cam5_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 5 Baksida: ' + states('sensor.cam5_person_count')] %}
            {% endif %}
            {% if states('sensor.cam6_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 6 Baksida: ' + states('sensor.cam6_person_count')] %}
            {% endif %}
            {% if states('sensor.cam7_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 7 Frigge: ' + states('sensor.cam7_person_count')] %}
            {% endif %}
            {% if states('sensor.cam8_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 8 Entre: ' + states('sensor.cam8_person_count')] %}
            {% endif %}
            {% if states('sensor.cam9_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 9 Garage: ' + states('sensor.cam9_person_count')] %}
            {% endif %}
            {{ detections | join('\n') }}
      # Wait 3 minutes
      - delay: "00:03:00"
      # Check if still away and no immediate notification was sent in the meantime
      - condition: state
        entity_id: input_select.home_status
        state: 'Borta'
      # Check if priority cameras are still inactive (to avoid duplicate with immediate notification)
      - condition: and
        conditions:
          - condition: numeric_state
            entity_id: sensor.cam5_person_count
            below: 1
          - condition: numeric_state
            entity_id: sensor.cam6_person_count
            below: 1
      - service: notify.mobile_app_sm_a528b
        data_template:
          title: >
            "Person Detection Away Alert {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: >
            Person detected at {{ trigger_time }}:
            {{ detection_message }}

  ####################################
  ### Blink Light Person Detcected ###
  ####################################
  - alias: Blink Light Person Detected
    id: '81119011512349'
    mode: single

    trigger:
      # Triggers for person detection
      - platform: state
        entity_id: 
          - binary_sensor.cams_person_active
        to: 'on'

    action:
      - repeat:
          count: 6
          sequence:
            - service: light.toggle
              target:
                entity_id:
                  - light.sovrum_fonster
                  - light.hall_byra
                  - light.vardagsrum_skank
            - delay: '00:00:01'

      - service: automation.turn_off
        target:
          entity_id: automation.blink_light_person_detected

  ############################################
  ### Person Motion Radio Control Backside ###
  ############################################
  - alias: Person Motion Radio Control Backside
    id: '1416857464123'
    mode: restart

    trigger:
      # Triggers for person detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_person_backside_north_active

    condition: []

    action:
      - choose:

          # Wait 2 seconds and check if motion is still detected before turning on the light
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_person_backside_north_active
                    state: 'on'
                  - condition: or
                    conditions:
                      - condition: time
                        after: '20:00:00'
                        before: '08:00:00'
                      - condition: numeric_state
                        entity_id: sensor.ljusstyrka
                        below: 10
            sequence:
              - delay: '00:00:02'
              - condition: state
                entity_id: binary_sensor.cams_person_backside_north_active
                state: 'on'
              - condition: numeric_state
                entity_id: sensor.ljusstyrka
                below: 10
              - service: light.turn_on
                target:
                  entity_id: light.tradack_ute

          # Turn off light if no motion is detected after 20 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cams_person_backside_north_active
                state: 'off'
            sequence:
              - delay: '00:00:20'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_person_backside_north_active
                    state: 'off'
              - service: light.turn_off
                target:
                  entity_id: light.tradack_ute

  ###################################
  ### Person Motion Light Control ###
  ###################################
  - alias: Person Motion Light Control
    id: '1416857464124'
    mode: restart

    trigger:
      # Triggers for person detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_person_backside_north_active

    condition: []

    action:
      - choose:

          # Turn on light when motion is detected and light level is low
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_person_backside_north_active
                    state: 'on'
                  - condition: or
                    conditions:
                      - condition: time
                        after: '20:00:00'
                        before: '08:00:00'
                      - condition: numeric_state
                        entity_id: sensor.ljusstyrka
                        below: 10
            sequence:

              # Add 2 second delay before turning on lights
              - delay: "00:00:02"

              # Turn on lights as before
              - service: light.turn_on
                target:
                  entity_id: light.stralkastare_husgavel
              - service: light.turn_on
                target:
                  entity_id: light.kamera5_stralkastare
              - service: light.turn_on
                target:
                  entity_id: light.kamera6_stralkastare
              - service: light.turn_on
                target:
                  entity_id: light.kamera8_stralkastare

          # Turn off light if no motion is detected after 30 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cams_person_backside_north_active
                state: 'off'
            sequence:
              - delay: '00:00:30'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_person_backside_north_active
                    state: 'off'

              # Turn off lights as before
              - service: light.turn_off
                target:
                  entity_id: light.stralkastare_husgavel
              - service: light.turn_off
                target:
                  entity_id: light.kamera5_stralkastare
              - service: light.turn_off
                target:
                  entity_id: light.kamera6_stralkastare
              - service: light.turn_off
                target:
                  entity_id: light.kamera8_stralkastare

  ######################################################################
  ### Person Motion Light Control Frontside (Cam10 + Cam9) ###
  ######################################################################
  - alias: Person Motion Light Control Frontside
    id: '1416857464125'
    mode: restart

    trigger:
      # Triggers for person detection at camera 10 (Uppfart/driveway)
      - platform: state
        entity_id: 
          - binary_sensor.cam10_person_occupancy
      # Triggers for person detection at camera 9 (Garage infront)
      - platform: state
        entity_id:
          - binary_sensor.cam9_person_occupancy

    condition: []

    action:
      - choose:

          # ========== CAM 10 (Uppfart/Driveway) ==========
          # Turn on light when person is detected on cam10 and conditions are met
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cam10_person_occupancy
                    state: 'on'
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Borta'
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Sover'
                  - condition: numeric_state
                    entity_id: sensor.ljusstyrka
                    below: 10
            sequence:

              # Add 2 second delay before turning on light
              - delay: "00:00:02"

              # Verify conditions still valid after delay
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cam10_person_occupancy
                    state: 'on'
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Borta'
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Sover'
                  - condition: numeric_state
                    entity_id: sensor.ljusstyrka
                    below: 10

              # Turn on camera 10 light
              - service: light.turn_on
                target:
                  entity_id: light.kamera10_stralkastare

          # Turn off light if no person is detected on cam10 after 10 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cam10_person_occupancy
                state: 'off'
            sequence:
              - delay: '00:00:10'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cam10_person_occupancy
                    state: 'off'

              # Turn off camera 10 light
              - service: light.turn_off
                target:
                  entity_id: light.kamera10_stralkastare

          # ========== CAM 9 (Garage) ==========
          # Turn on light when person is detected on cam9 and conditions are met
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cam9_person_occupancy
                    state: 'on'
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Borta'
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Sover'
                  - condition: numeric_state
                    entity_id: sensor.ljusstyrka
                    below: 10
            sequence:

              # Add 2 second delay before turning on light
              - delay: "00:00:02"

              # Verify conditions still valid after delay
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cam9_person_occupancy
                    state: 'on'
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Borta'
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Sover'
                  - condition: numeric_state
                    entity_id: sensor.ljusstyrka
                    below: 10

              # Turn on camera 9 light
              - service: light.turn_on
                target:
                  entity_id: light.kamera9_stralkastare

          # Turn off light if no person is detected on cam9 after 10 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cam9_person_occupancy
                state: 'off'
            sequence:
              - delay: '00:00:10'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cam9_person_occupancy
                    state: 'off'

              # Turn off camera 9 light
              - service: light.turn_off
                target:
                  entity_id: light.kamera9_stralkastare

  ######################################################################
  ### Person Motion Light Control Frontside TEST (Cam10 + Cam9) ###
  ######################################################################
  - alias: Person Motion Light Control Frontside TEST
    id: '1416857464126'
    mode: restart

    trigger:
      # Triggers for person detection at camera 10 (Uppfart/driveway)
      - platform: state
        entity_id: 
          - binary_sensor.cam10_person_occupancy
      # Triggers for person detection at camera 9 (Garage infront)
      - platform: state
        entity_id:
          - binary_sensor.cam9_person_occupancy

    condition: []

    action:
      - choose:

          # ========== CAM 10 (Uppfart/Driveway) ==========
          # Turn on light when person is detected on cam10
          - conditions:
              - condition: state
                entity_id: binary_sensor.cam10_person_occupancy
                state: 'on'
            sequence:

              # Turn on camera 10 light
              - service: light.turn_on
                target:
                  entity_id: light.kamera10_stralkastare

              # Turn off automation to prevent re-trigger
              - service: automation.turn_off
                target:
                  entity_id: automation.person_motion_light_control_frontside_test

          # ========== CAM 9 (Garage) ==========
          # Turn on light when person is detected on cam9
          - conditions:
              - condition: state
                entity_id: binary_sensor.cam9_person_occupancy
                state: 'on'
            sequence:

              # Turn on camera 9 light
              - service: light.turn_on
                target:
                  entity_id: light.kamera9_stralkastare

              # Turn off automation to prevent re-trigger
              - service: automation.turn_off
                target:
                  entity_id: automation.person_motion_light_control_frontside_test

          # ========== CAM 10 (Uppfart/Driveway) - OFF ==========
          # Turn off light when person is no longer detected on cam10
          - conditions:
              - condition: state
                entity_id: binary_sensor.cam10_person_occupancy
                state: 'off'
            sequence:

              # Turn off camera 10 light
              - service: light.turn_off
                target:
                  entity_id: light.kamera10_stralkastare

              # Turn off automation
              - service: automation.turn_off
                target:
                  entity_id: automation.person_motion_light_control_frontside_test

          # ========== CAM 9 (Garage) - OFF ==========
          # Turn off light when person is no longer detected on cam9
          - conditions:
              - condition: state
                entity_id: binary_sensor.cam9_person_occupancy
                state: 'off'
            sequence:

              # Turn off camera 9 light
              - service: light.turn_off
                target:
                  entity_id: light.kamera9_stralkastare

              # Turn off automation
              - service: automation.turn_off
                target:
                  entity_id: automation.person_motion_light_control_frontside_test
