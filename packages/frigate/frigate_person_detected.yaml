####################################################
#                                                  #
#          FRIGATE PERSON DETECTION               #
#                                                  #
####################################################
# Person detection notifications from Frigate NVR
# AI-powered person detection on security cameras
# Documentation: https://docs.frigate.video/
#
# Camera Coverage:
# - Cam 3: Uppfart (driveway) - Front approach
# - Cam 5: Baksida (backside) - Rear yard priority
# - Cam 6: Baksida (backside) - Rear entrance priority
# - Cam 7: Friggebod (garden shed) - Outbuilding
# - Cam 8: Entre (entrance) - Main entry
#
# Notification Logic:
# - Immediate alerts: Sleep mode (Sover) or Away + Priority cameras
# - Priority cameras: Cam 5, Cam 6 (backside - vulnerable)
# - Delayed alerts: Away mode + non-priority cameras (reduce false positives)
# - Away delay: 2 minutes (allows motion to stabilize)
#
# Conditions:
# - Sover (Sleep): Notify on any person detection
# - Borta (Away) + Priority: Immediate notification
# - Borta (Away) + Other: 2-minute delay notification
# - Hemma (Home active): No notifications
#
# Safety Notes:
# - Mode: single (prevent notification spam)
# - max_exceeded: silent (drop concurrent triggers)
# - Detection counts included in notification
# - Timestamp in notification title
#
####################################################

# Källor:
# - Frigate NVR (paketfil)
#
# BESKRIVNING:
# Notifieringar/automationer för person-detektering från Frigate.
#

##################
### Automation ###
##################
automation:
  # Immediate notifications for priority cameras and sleep mode
  - alias: Person Detection Notify Immediate
    id: '81119011564368'
    mode: single
    max_exceeded: silent

    trigger:
      - platform: state
        entity_id: 
          - binary_sensor.cams_person_active
        to: 'on'

    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.home_status
            state: 'Sover'
          - condition: and
            conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Borta'
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.cam5_person_count
                    above: 0
                  - condition: numeric_state
                    entity_id: sensor.cam6_person_count
                    above: 0

    action:
      - variables:
          detection_message: >
            {% set detections = [] %}
            {% if states('sensor.cam3_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 3 Uppfart: ' + states('sensor.cam3_person_count')] %}
            {% endif %}
            {% if states('sensor.cam5_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 5 Baksida: ' + states('sensor.cam5_person_count')] %}
            {% endif %}
            {% if states('sensor.cam6_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 6 Baksida: ' + states('sensor.cam6_person_count')] %}
            {% endif %}
            {% if states('sensor.cam7_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 7 Frigge: ' + states('sensor.cam7_person_count')] %}
            {% endif %}
            {% if states('sensor.cam8_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 8 Entre: ' + states('sensor.cam8_person_count')] %}
            {% endif %}
            {{ detections | join('\n') }}
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Sover'
            sequence:
              - service: notify.mobile_app_sm_a528b
                data_template:
                  title: >
                    "Person Detection Sleep Alert {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: >
                    Person detected:
                    {{ detection_message }}
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: 'Borta'
            sequence:
              - service: notify.mobile_app_sm_a528b
                data_template:
                  title: >
                    "Person Detection Away Alert (Priority) {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: >
                    Person detected (priority cameras):
                    {{ detection_message }}

  # Delayed notifications for non-priority cameras when away
  - alias: Person Detection Notify Delayed
    id: '81119011564369'
    mode: parallel
    max: 5

    trigger:
      - platform: state
        entity_id: 
          - binary_sensor.cams_person_active
        to: 'on'

    condition:
      - condition: state
        entity_id: input_select.home_status
        state: 'Borta'
      - condition: and
        conditions:
          - condition: numeric_state
            entity_id: sensor.cam5_person_count
            below: 1
          - condition: numeric_state
            entity_id: sensor.cam6_person_count
            below: 1

    action:
      # Capture detection info at trigger time
      - variables:
          trigger_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          detection_message: >
            {% set detections = [] %}
            {% if states('sensor.cam3_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 3 Uppfart: ' + states('sensor.cam3_person_count')] %}
            {% endif %}
            {% if states('sensor.cam5_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 5 Baksida: ' + states('sensor.cam5_person_count')] %}
            {% endif %}
            {% if states('sensor.cam6_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 6 Baksida: ' + states('sensor.cam6_person_count')] %}
            {% endif %}
            {% if states('sensor.cam7_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 7 Frigge: ' + states('sensor.cam7_person_count')] %}
            {% endif %}
            {% if states('sensor.cam8_person_count') | int(0) > 0 %}
              {% set detections = detections + ['- Cam 8 Entre: ' + states('sensor.cam8_person_count')] %}
            {% endif %}
            {{ detections | join('\n') }}
      # Wait 3 minutes
      - delay: "00:03:00"
      # Check if still away and no immediate notification was sent in the meantime
      - condition: state
        entity_id: input_select.home_status
        state: 'Borta'
      # Check if priority cameras are still inactive (to avoid duplicate with immediate notification)
      - condition: and
        conditions:
          - condition: numeric_state
            entity_id: sensor.cam5_person_count
            below: 1
          - condition: numeric_state
            entity_id: sensor.cam6_person_count
            below: 1
      - service: notify.mobile_app_sm_a528b
        data_template:
          title: >
            "Person Detection Away Alert {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: >
            Person detected at {{ trigger_time }}:
            {{ detection_message }}

  ####################################
  ### Blink Light Person Detcected ###
  ####################################
  - alias: Blink Light Person Detected
    id: '81119011512349'
    mode: single

    trigger:
      # Triggers for person detection
      - platform: state
        entity_id: 
          - binary_sensor.cams_person_active
        to: 'on'

    action:
      - repeat:
          count: 6
          sequence:
            - service: light.toggle
              target:
                entity_id:
                  - light.sovrum_fonster
                  - light.hall_byra
                  - light.vardagsrum_skank
            - delay: '00:00:01'

      - service: automation.turn_off
        target:
          entity_id: automation.blink_light_person_detected
