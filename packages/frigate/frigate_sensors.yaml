          {{
            states('sensor.cam5_person_count') | int(0) +
            states('sensor.cam6_person_count') | int(0) +
            states('sensor.cam8_person_count') | int(0)
          }}

      - name: "Cams Person Backside North Count"
        state_class: measurement
        state: >
          {{
            states('sensor.cam5_person_count') | int(0) +
            states('sensor.cam6_person_count') | int(0)
          }}


      - name: "Cams Person Frontside Count"
        state_class: measurement
        state: >
          {{
            states('sensor.cam10_person_count') | int(0) +
            states('sensor.cam7_person_count') | int(0) +
            states('sensor.cam9_person_count') | int(0)
          }}
##################################################################################
      - name: "Cam10 Animal Count"
