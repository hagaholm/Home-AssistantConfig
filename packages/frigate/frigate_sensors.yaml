          {{
            states('sensor.cam5_bear_count') | int(0) +
            states('sensor.cam5_cat_count') | int(0) +
            states('sensor.cam5_dog_count') | int(0) +
            states('sensor.cam5_horse_count') | int(0) +
            states('sensor.cam5_sheep_count') | int(0)
          }}

      - name: "Cam6 Animal Count"
