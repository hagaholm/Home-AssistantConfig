            states('sensor.cam10_cat_count') | int(0) +
            states('sensor.cam10_dog_count') | int(0) +
            states('sensor.cam10_horse_count') | int(0) +
            states('sensor.cam10_sheep_count') | int(0)
          }}

      - name: "Cam5 Animal Count"
        state_class: measurement
