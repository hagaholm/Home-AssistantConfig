# Källor:
# - Frigate-konfiguration i detta repo (paketfil)
#
# BESKRIVNING:
# Sammanställningssensorer för Frigate (counts och activity) via templates.
#

################
### Template ###
################
template:
  - binary_sensor:
##################################################################################
      - name: "Cams All Active"
        state: "{{ states('sensor.cams_all_count')|int(0) > 0 }}"

      - name: "Cams All Backside Active"
        state: "{{ states('sensor.cams_all_backside_count')|int(0) > 0 }}"

      - name: "Cams All Frontside Active"
        state: "{{ states('sensor.cams_all_frontside_count')|int(0) > 0 }}"
##################################################################################
      - name: "Cams Person Active"
        state: "{{ states('sensor.cams_person_count')|int(0) > 0 }}"

      - name: "Cams Person Backside Active"
        state: "{{ states('sensor.cams_person_backside_count')|int(0) > 0 }}"

      - name: "Cams Person Backside North Active"
        state: "{{ states('sensor.cams_person_backside_north_count')|int(0) > 0 }}"

      - name: "Cams Person Frontside Active"
        state: "{{ states('sensor.cams_person_frontside_count')|int(0) > 0 }}"
##################################################################################
      - name: "Cam10 Animal Active"
        state: "{{ states('sensor.cam10_animal_count')|int(0) > 0 }}"

      - name: "Cam5 Animal Active"
        state: "{{ states('sensor.cam5_animal_count')|int(0) > 0 }}"

      - name: "Cam6 Animal Active"
        state: "{{ states('sensor.cam6_animal_count')|int(0) > 0 }}"

      - name: "Cam7 Animal Active"
        state: "{{ states('sensor.cam7_animal_count')|int(0) > 0 }}"

      - name: "Cam8 Animal Active"
        state: "{{ states('sensor.cam8_animal_count')|int(0) > 0 }}"

      - name: "Cam9 Animal Active"
        state: "{{ states('sensor.cam9_animal_count')|int(0) > 0 }}"

      - name: "Cams Animal Active"
        state: "{{ states('sensor.cams_animal_count')|int(0) > 0 }}"

      - name: "Cams Animal Backside Active"
        state: "{{ states('sensor.cams_animal_backside_count')|int(0) > 0 }}"

      - name: "Cams Animal Frontside Active"
        state: "{{ states('sensor.cams_animal_frontside_count')|int(0) > 0 }}"
##################################################################################

  - sensor:
      - name: "Cams All Count"
        state_class: measurement
        state: >
          {{
            states('sensor.cam10_all_count') | int(0) +
            states('sensor.cam5_all_count') | int(0) +
            states('sensor.cam6_all_count') | int(0) +
            states('sensor.cam7_all_count') | int(0) +
            states('sensor.cam8_all_count') | int(0) +
            states('sensor.cam9_all_count') | int(0)
          }}

      - name: "Cams All Backside Count"
        state_class: measurement
        state: >
          {{
            states('sensor.cam5_all_count') | int(0) +
            states('sensor.cam6_all_count') | int(0) +
            states('sensor.cam8_all_count') | int(0)
          }}

      - name: "Cams All Frontside Count"
        state_class: measurement
        state: >
          {{
            states('sensor.cam10_all_count') | int(0) +
            states('sensor.cam7_all_count') | int(0) +
            states('sensor.cam9_all_count') | int(0)
          }}
##################################################################################
      - name: "Cams Person Count"
        state_class: measurement
        state: >
          {{
            states('sensor.cam10_person_count') | int(0) +
            states('sensor.cam5_person_count') | int(0) +
            states('sensor.cam6_person_count') | int(0) +
            states('sensor.cam7_person_count') | int(0) +
            states('sensor.cam8_person_count') | int(0) +
            states('sensor.cam9_person_count') | int(0)
          }}

      - name: "Cams Person Backside Count"
