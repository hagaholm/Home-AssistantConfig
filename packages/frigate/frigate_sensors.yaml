            states('sensor.cam8_bear_count') | int(0) +
            states('sensor.cam8_cat_count') | int(0) +
            states('sensor.cam8_dog_count') | int(0) +
            states('sensor.cam8_horse_count') | int(0) +
            states('sensor.cam8_sheep_count') | int(0)
          }}

      - name: "Cam9 Animal Count"
        state_class: measurement
        state: >
          {{
            states('sensor.cam9_bear_count') | int(0) +
            states('sensor.cam9_cat_count') | int(0) +
            states('sensor.cam9_dog_count') | int(0) +
            states('sensor.cam9_horse_count') | int(0) +
