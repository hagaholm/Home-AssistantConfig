####################################################
#                                                  #
#     FRIGATE TEMPORARY PRESENCE DETECTION         #
#                                                  #
####################################################
# Frigate-paket - se även: frigate_sensors.yaml (sammanställningssensorer) |
# frigate_person_detected.yaml, frigate_animal_detected.yaml, frigate_face_detection.yaml (detektion) |
# frigate_media.yaml (lagring) | frigate_intruder_alarm.yaml (larm)
#
# Frigate face detection > Temporary presence for WiFi connection
# 
# Purpose:
# Speed up home presence detection by using Reolink camera face recognition.
# When Micke or Annelie is detected by Frigate, immediately set home status
# to 'Hemma' (Home) for 5 minutes. This gives WiFi-based device tracking time
# to detect the phone connection before reverting to away mode if needed.
#
# Problem Solved:
# - WiFi presence detection has inherent delay (phone needs time to connect)
# - Without this: User detects -> Lighting changes with 30-60s delay
# - With this: Face detection -> Immediate status change -> Instant lighting
#
# Implementation:
# 1. Frigate detects a face for Micke/Annelie on entry cameras (cam10, cam8, cam9).
# 2. Only if home_status is still 'Borta' and the match is strong enough,
#    the automation starts a temporary 5-minute home window.
# 3. The automation waits for two matching detections before changing status,
#    which reduces false positives.
# 4. Once the temporary window is active, later detections do not extend the timer.
# 5. After 5 minutes, if WiFi is still not connected, the status reverts to 'Borta'.
# 6. If WiFi connects before the timeout, the normal presence logic keeps the status 'Hemma'.
#
# Cameras Monitored:
# - cam10: Uppfart (driveway entrance)
# - cam8: Entre (front entrance)
# - cam9: Garage infront (garage entrance)
# All are primary entry points where people should be detected
#
# Faces Monitored:
# - Micke
# - Annelie
#
# Safety:
# - Only activates when home_status is already 'Borta'
# - Only uses entry cameras (prevents detection from cam5/6/7)
# - Requires a high-confidence match and two consecutive detections
# - 5-minute timeout ensures the temporary state does not stay active forever
# - If WiFi connects during the 5-minute window, no revert happens
#
# Status Flow:
# Borta (away) → [2 confirmed face detections] → Hemma (home, temporary)
#              ↓ (5 min timeout & no WiFi)
#              Borta (away, reverted)
#              ↑ (or WiFi connects before timeout)
#              Hemma (home, maintained by WiFi)
#
# Integrations:
# - Requires: frigate MQTT integration + face detection setup
# - Updates: input_select.home_status (primary status selector)
# - Tracks: input_boolean.frigate_temp_presence (active flag)
# - Timeout: input_datetime.frigate_temp_presence_timeout
#
# Testing:
# 1. Ensure you're away: home_status='Borta', group.track_for_home_devices='not_home'
# 2. Step in front of cam10, cam8, or cam9 and let two matching detections occur
# 3. Verify: home_status becomes 'Hemma' + notification sent
# 4. Don't connect WiFi: status reverts to 'Borta' after 5 min
# 5. Re-test with WiFi connecting: status stays 'Hemma' (WiFi wins)
#
####################################################

# Counter used to require two consecutive matching detections
# before the temporary presence logic changes the home status.
counter:
  frigate_temp_presence_confirmation:
    name: "Frigate Temporary Presence Confirmation"
    initial: 0
    step: 1

automation:

  # ============================================
  # HOW IT WORKS
  # ============================================
  # 1. Frigate sends a face event for Micke/Annelie.
  # 2. If the home status is still Borta, the automation starts
  #    a temporary 5-minute window that keeps the status at Hemma.
  # 3. If WiFi presence is not detected within that window,
  #    the automation reverts the status back to Borta.
  # 4. If WiFi is detected before the timeout, the normal
  #    presence logic keeps the status at Hemma.
  # ============================================

  # ============================================
  # FRIGATE FACE DETECTION → TEMPORARY PRESENCE
  # ============================================
  - alias: Frigate Face Detection Triggers Temporary Presence
    id: 'frigate_temp_presence_trigger'
    description: "Set home status to Hemma when face detected at entry cameras"
    mode: queued
    max: 10

    trigger:
      - platform: mqtt
        topic: "frigate/tracked_object_update"

    condition:
      # Only face-recognition events
      - condition: template
        value_template: "{{ trigger.payload_json.type == 'face' }}"

      # Only activate when currently away
      - condition: state
        entity_id: input_select.home_status
        state: 'Borta'

      # Only entry cameras
      - condition: template
        value_template: "{{ trigger.payload_json.camera in ['cam10', 'cam8', 'cam9'] }}"

      # Only accept explicitly recognized Micke/Annelie faces
      # and require a much higher confidence threshold to avoid false positives.
      - condition: template
        value_template: >
          {% set face_name = (trigger.payload_json.name
            | default(trigger.payload_json.sub_label | default(''))
            | string).strip() %}
          {% set score = trigger.payload_json.score | default(0) | float(0) %}
          {{ face_name | lower in ['micke', 'annelie'] and score >= 0.95 }}

    action:
      - variables:
          temporary_presence_active: "{{ is_state('input_boolean.frigate_temp_presence', 'on') }}"

      - service: counter.increment
        target:
          entity_id: counter.frigate_temp_presence_confirmation

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ temporary_presence_active }}"
            sequence:
              - service: system_log.write
                data:
                  level: info
                  logger: frigate_temp_presence
                  message: >
                    Temporary presence already active for this window.
                    Keeping the existing 5-minute timeout.

              - service: counter.reset
                target:
                  entity_id: counter.frigate_temp_presence_confirmation

          - conditions:
              - condition: template
                value_template: >
                  {{ states('counter.frigate_temp_presence_confirmation') | int(0) >= 2 }}
            sequence:
              - service: system_log.write
                data:
                  level: info
                  logger: frigate_temp_presence
                  message: >
                    Frigate detected {{ trigger.payload_json.name }}
                    on {{ trigger.payload_json.camera }}
                    (score: {{ trigger.payload_json.score }})

              # Set temporary status to home
              - service: input_select.select_option
                target:
                  entity_id: input_select.home_status
                data:
                  option: "Hemma"

              # Activate temporary presence flag
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.frigate_temp_presence

              # Set timeout to now + 5 minutes
              # Using a template to calculate 5 minutes from now
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.frigate_temp_presence_timeout
                data:
                  datetime: >
                    {% set now = now() %}
                    {% set five_min_later = now.replace(microsecond=0) + timedelta(minutes=5) %}
                    {{ five_min_later.strftime('%Y-%m-%d %H:%M:%S') }}

              # Send notification to user
              - service: notify.mobile_app_sm_a528b
                data:
                  title: "🏠 Hemkomst Detekterad {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  message: >
                    {{ trigger.payload_json.name }} detekterad vid
                    {{ trigger.payload_json.camera | upper }}
                    (score: {{ trigger.payload_json.score }}).
                    Status: Hemma (temp. 5 min). WiFi-anslutning väntas...
                  data:
                    tag: "frigate_presence"
                    priority: "high"

              - service: counter.reset
                target:
                  entity_id: counter.frigate_temp_presence_confirmation

  # ============================================
  # TEMPORARY PRESENCE TIMEOUT → REVERT TO AWAY
  # ============================================
  - alias: Frigate Temporary Presence Timeout Revert
    id: 'frigate_temp_presence_timeout'
    description: "Revert to Borta after 5-min timeout if WiFi not connected"
    mode: single
    max_exceeded: silent

    trigger:
      # Use time_pattern to check every minute if timeout is reached
      - platform: time_pattern
        minutes: "/1"

    condition:
      # Only run if temporary presence is active
      - condition: state
        entity_id: input_boolean.frigate_temp_presence
        state: 'on'
      
      # Check if current time >= timeout time
      - condition: template
        value_template: >
          {% set timeout_str = states('input_datetime.frigate_temp_presence_timeout') %}
          {% if timeout_str and timeout_str not in ['unknown', 'unavailable', ''] %}
            {% set timeout = strptime(timeout_str, '%Y-%m-%d %H:%M:%S') %}
            {{ as_timestamp(now()) >= as_timestamp(timeout) }}
          {% else %}
            false
          {% endif %}
      
      # WiFi NOT connected: group.track_for_home_devices is not 'home'
      # If WiFi connected, we don't revert (WiFi logic takes over)
      - condition: state
        entity_id: group.track_for_home_devices
        state: 'not_home'

    action:
      # Log timeout event
      - service: system_log.write
        data:
          level: info
          logger: frigate_temp_presence
          message: >
            Frigate temporary presence timeout reached. 
            WiFi not connected. Reverting to Borta.

      # Revert status to away
      - service: input_select.select_option
        target:
          entity_id: input_select.home_status
        data:
          option: "Borta"

      # Deactivate temporary presence flag
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.frigate_temp_presence

      - service: counter.reset
        target:
          entity_id: counter.frigate_temp_presence_confirmation

      # Clear timeout (set to far past)
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.frigate_temp_presence_timeout
        data:
          datetime: "2000-01-01 00:00:00"

      # Send notification
      - service: notify.mobile_app_sm_a528b
        data:
          title: "🏠 Hemstatus Revert"
          message: >
            WiFi ej ansluten inom 5 min. 
            Status: Borta (igen). 
            Försök WiFi-anslutning eller visa upp ansiktet igen.
          data:
            tag: "frigate_presence"
            priority: "normal"
