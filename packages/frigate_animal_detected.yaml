                    entity_id: binary_sensor.cams_animal_backside_active
                    state: 'off'
              - service: light.turn_off
                target:
                  entity_id: light.stralkastare_husgavel
              - service: light.turn_off
                target:
                  entity_id: light.kamera5_stralkastare
              - service: light.turn_off
                target:
                  entity_id: light.kamera6_stralkastare
              - service: light.turn_off
                target:
                  entity_id: light.spabad_v
              - service: light.turn_off
                target:
                  entity_id: light.spabad_m
              - service: light.turn_off
                target:
                  entity_id: light.spabad_h

