##################
### Automation ###
##################
automation:
  ##############################
  ### Animal Motion Light on ###
  ##############################
  - alias: Animal Motion Light on 
    id: '1416857464436' 
    mode: single

    trigger:
      - platform: state
        entity_id: binary_sensor.cam5_all_occupancy
        to: 'on'

    condition:
      condition: and
      conditions:
        - condition: numeric_state
          entity_id: sensor.ljusstyrka
          below: 5

    action:
      - service: light.turn_on
        target:
          entity_id: light.stralkastare_husgavel

  ###############################
  ### Animal Motion Light off ###
  ###############################
  - alias: Animal Motion Light off 
    id: '1415557464436' 
    mode: single

    trigger:
      - platform: state
        entity_id: binary_sensor.cam5_all_occupancy
        to: 'off'

    conditions:
      - condition: state
        entity_id: light.stralkastare_husgavel
        state: 'on'

    action:
      - service: light.turn_off
        target:
          entity_id: light.stralkastare_husgavel

  #####################################
  ### Animal Detection Cam 5 Notify ###
  #####################################
  - alias: Animal Detection Cam 5 Notify
    id: '81119011564329' 
    mode: single

    trigger:
      - platform: numeric_state
        entity_id:
          - sensor.cam5_all_count
        above: 0

    condition:
      condition: or
      conditions:
        - condition: time
          after: '21:00:00'
          before: '08:00:00'
        - condition: state
          entity_id: input_select.home_status
          state: 'Borta'
        - condition: numeric_state
          entity_id: sensor.ljusstyrka
          below: 10

    action:
      - service: notify.mobile_app_sm_a528b
        data_template:
          title: >
            "Detection Alert {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: >
            Camera 5 has detected. lux: {{ states('sensor.ljusstyrka') | int }}:
            - All:      {{ states('sensor.cam5_all_count') | int }}
            - Person:   {{ states('sensor.cam5_person_count') | int }}
            - Bear:     {{ states('sensor.cam5_bear_count') | int }}
            - Bird:     {{ states('sensor.cam5_bird_count') | int }}
            - Cow:      {{ states('sensor.cam5_cat_count') | int }}
            - Dog:      {{ states('sensor.cam5_dog_count') | int }}
            - Elephant: {{ states('sensor.cam5_elephant_count') | int }}
            - Giraffe:  {{ states('sensor.cam5_giraffe_count') | int }}
            - Horse:    {{ states('sensor.cam5_horse_count') | int }}
            - Sheep:    {{ states('sensor.cam5_sheep_count') | int }}
            - Zebra:    {{ states('sensor.cam5_zebra_count') | int }}