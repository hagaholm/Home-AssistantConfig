##################
### Automation ###
##################
automation:
  ###################################
  ### Animal Motion Radio Control ###
  ###################################
  - alias: Animal Motion Radio Control
    id: '1416857464463'
    mode: restart

    trigger:
      # Triggers for animal detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_animal_backside_active

    condition: []

    action:
      - choose:

          # Turn on light when motion is detected and light level is low
          - conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_animal_backside_active
                    state: 'on'
                  - condition: numeric_state
                    entity_id: sensor.ljusstyrka
                    below: 10
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.tradack_ute

          # Turn off light if no motion is detected after 30 seconds
          - conditions:
              - condition: state
                entity_id: binary_sensor.cams_animal_backside_active
                state: 'off'
            sequence:
              - delay: '00:00:30'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.cams_animal_backside_active
                    state: 'off'
              - service: light.turn_off
                target:
                  entity_id: light.tradack_ute

  ###################################
  ### Animal Motion Light Control ###
  ###################################
  - alias: Animal Motion Light Control
    id: '1416857464346'
    mode: restart

    trigger:
      # Triggers for animal detection on backside
      - platform: state
