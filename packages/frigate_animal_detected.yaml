  ###############################
  ### Animal Detection Notify ###
  ###############################
  - alias: Animal Detection Notify
    id: '81119011564329' 
    mode: single

    trigger:
      # Triggers for animal detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_animal_backside_active
        to: 'on'

    condition:
      condition: or
      conditions:
        - condition: time
          after: '21:00:00'
          before: '08:00:00'
        - condition: state
          entity_id: input_select.home_status
          state: 'Borta'
        - condition: numeric_state
          entity_id: sensor.ljusstyrka
          below: 10

    action:
      - service: notify.mobile_app_sm_a528b
        data_template:
          title: >
            "Detection Alert {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: >
            Camera 5, 6 or 7 has detected. lux: {{ states('sensor.ljusstyrka') | int }}:
            - Bear:     {{ states('sensor.cam5_bear_count') | int }} {{ states('sensor.cam6_bear_count') | int }} {{ states('sensor.cam7_bear_count') | int }}
            - Cow:      {{ states('sensor.cam5_cat_count') | int }} {{ states('sensor.cam6_cat_count') | int }} {{ states('sensor.cam7_cat_count') | int }}
            - Dog:      {{ states('sensor.cam5_dog_count') | int }} {{ states('sensor.cam6_dog_count') | int }} {{ states('sensor.cam7_dog_count') | int }}
            - Elephant: {{ states('sensor.cam5_elephant_count') | int }} {{ states('sensor.cam6_elephant_count') | int }} {{ states('sensor.cam7_elephant_count') | int }}
            - Giraffe:  {{ states('sensor.cam5_giraffe_count') | int }} {{ states('sensor.cam6_giraffe_count') | int }} {{ states('sensor.cam7_giraffe_count') | int }}
            - Horse:    {{ states('sensor.cam5_horse_count') | int }} {{ states('sensor.cam6_horse_count') | int }} {{ states('sensor.cam7_horse_count') | int }}
            - Sheep:    {{ states('sensor.cam5_sheep_count') | int }} {{ states('sensor.cam6_sheep_count') | int }} {{ states('sensor.cam7_sheep_count') | int }}
            - Zebra:    {{ states('sensor.cam5_zebra_count') | int }} {{ states('sensor.cam6_zebra_count') | int }} {{ states('sensor.cam7_zebra_count') | int }}

  ###################################
  ### Blink Light When Detcection ###
  ###################################
  - alias: Blink Light When Detcection
    id: '81119011512345'
    mode: single

    trigger:
      # Triggers for animal detection on backside
      - platform: state
        entity_id: 
          - binary_sensor.cams_animal_backside_active
        to: 'on'

    condition:
      condition: or
      conditions:
        - condition: state
          entity_id: input_select.home_status
          state: 'Hemma av'
        - condition: state
          entity_id: input_select.home_status
          state: 'Hemma på'

    action:
      - delay: "00:00:01"
      - variables:
          sovrum_initial_state: "{{ is_state('light.sovrum_fonster', 'on') }}"
          hall_initial_state: "{{ is_state('light.hall_byra', 'on') }}"
          vardagsrum_initial_state: "{{ is_state('light.vardagsrum_skank', 'on') }}"

      - repeat:
          while:
            - condition: numeric_state
              entity_id: sensor.cams_animal_backside_count
              above: 0
          sequence:
            # Handle light.sovrum_fonster
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ sovrum_initial_state }}"
                  sequence:
                    - service: light.turn_off
                      target:
                        entity_id: light.sovrum_fonster
                - conditions:
                    - condition: template
                      value_template: "{{ not sovrum_initial_state }}"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: light.sovrum_fonster
            - delay: "00:00:01"
            - service: light.toggle
              target:
                entity_id: light.sovrum_fonster

            # Handle light.hall_byra
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ hall_initial_state }}"
                  sequence:
                    - service: light.turn_off
                      target:
                        entity_id: light.hall_byra
                - conditions:
                    - condition: template
                      value_template: "{{ not hall_initial_state }}"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: light.hall_byra
            - delay: "00:00:01"
            - service: light.toggle
              target:
                entity_id: light.hall_byra

            # Handle light.vardagsrum_skank
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ vardagsrum_initial_state }}"
                  sequence:
                    - service: light.turn_off
                      target:
                        entity_id: light.vardagsrum_skank
                - conditions:
                    - condition: template
                      value_template: "{{ not vardagsrum_initial_state }}"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: light.vardagsrum_skank
            - delay: "00:00:01"
            - service: light.toggle
              target:
                entity_id: light.vardagsrum_skank

            - delay: "00:00:01"

      # Restore lights to their initial states
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ sovrum_initial_state }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.sovrum_fonster
          - conditions:
              - condition: template
                value_template: "{{ not sovrum_initial_state }}"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.sovrum_fonster

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ hall_initial_state }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.hall_byra
          - conditions:
              - condition: template
                value_template: "{{ not hall_initial_state }}"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.hall_byra

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ vardagsrum_initial_state }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.vardagsrum_skank
          - conditions:
              - condition: template
                value_template: "{{ not vardagsrum_initial_state }}"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.vardagsrum_skank
