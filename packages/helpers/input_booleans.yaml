####################################################
#                                                  #
#                  INPUT BOOLEANS                  #
#                                                  #
####################################################
# Input boolean helpers for toggle-based home automation
# Used for scene selection, feature flags, and conditional logic
# Documentation: https://www.home-assistant.io/integrations/input_boolean/
#
# Usage:
# - Triggered by automations and UI interactions
# - Used in conditional templates and scenes
# - Persisted across Home Assistant restarts
#
####################################################

input_boolean:
  christmas_light:
    name: Använd julbelysning
    icon: mdi:pine-tree
    # Controls whether to use Christmas lighting scenes or standard scenes
    # When ON: Christmas-themed lighting modes active
    # When OFF: Standard seasonal lighting active
    # Updated by: light_day, light_evening, light_morning automations
    # Referenced by: Templates, lighting scenes

  frigate_temp_presence:
    name: Frigate Temporary Presence
    icon: mdi:camera-account
    # Indicates when Frigate face detection has triggered temporary presence
    # When ON: Person detected via camera, temporary home status active
    # When OFF: Temporary presence inactive, normal WiFi detection
    # Updated by: frigate_temp_presence automation (face detection trigger)
    # Used by: Timeout automation to track active temporary presence sessions
    # Purpose: Brief 5-minute window for WiFi connection after face detection

  documentation_language_swedish:
    name: Swedish text
    initial: false
    icon: mdi:translate
