# Input boolean helpers for toggle-based home automation
# Used for scene selection, feature flags, and conditional logic
# Documentation: https://www.home-assistant.io/integrations/input_boolean/
#
# Usage:
# - Triggered by automations and UI interactions
# - Used in conditional templates and scenes
# - Persisted across Home Assistant restarts
#
