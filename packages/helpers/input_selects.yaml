  light_garden: 
    name: Trädgårdsbelysning 
    options: 
     - Släckt 
     - Tänt 
    icon: mdi:lightbulb 

  light_outside:
    name: Utebelysning
    options:
     - Släckt
     - Tänt
    icon: mdi:lightbulb

  light_bathroom:
    name: Badrumsbelysning
    options: 
     - Släckt
     - Dag
     - Dag närvaro
     - Natt närvaro
