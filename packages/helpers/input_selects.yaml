# Input select helpers for lighting and home status
# https://www.home-assistant.io/integrations/input_select/

input_select:
  light_inside:
    name: Innebelysning
    options:
     - Släckt
     - Morgonbelysning
     - Förmiddagsbelysning
     - Dagbelysning
     - Kvällsbelysning
     - Nattbelysning
     - Bortabelysning
     - Arbetsbelysning
     - Fönsterbelysning
    icon: mdi:lightbulb

  light_kitchen:
    name: Köksbelysning
