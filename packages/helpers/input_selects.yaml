  light_uterum:
    name: Uterumsbelysing
    options:
     - Släckt
     - Tänt
    icon: mdi:lightbulb

  facade_lights: 
    name: Fasadbelysning 
    options: 
     - Släckt 
     - Tänt
     - Natt 
     - Max
