####################################################
#                                                  #
#                  INPUT SELECTS                   #
#                                                  #
####################################################
# Input select helpers for multi-state controls
# Used for lighting modes, home status, and scene selection
# Documentation: https://www.home-assistant.io/integrations/input_select/
#
# Design Pattern:
# - Each select helper represents a mode or state
# - Updated by automations based on time, occupancy, and triggers
# - Used as conditions and parameters in scripts
# - UI controls allow manual override of automatic selection
#
####################################################

input_select:
  home_status:
    name: Hemstatus
    # Primary home occupancy state machine
    # Borta (Away) = Nobody home, security mode active
    # Hemma (Home active) = Occupants present and awake
    # Sover (Sleep) = Occupants present but sleeping
    # Updated by: Person presence detection and manual overrides
    # Used by: All conditional automations as primary state indicator
    options:
     - Borta
     - Hemma
     - Sover
