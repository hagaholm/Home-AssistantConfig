####################
### Input Number ###
####################
input_number:

  #############################
  # Values from inside sensor #
  #############################
  inside_kitchen_light_on:
    name: Inside kitchen light On
    initial: 320
    max: 600
    min: 20
    step: 20
    mode: box

  inside_kitchen_light_off:
    name: Inside kitchen light Off
    initial: 400
    max: 600
    min: 20
    step: 20
    mode: box

  inside_morning_light_on:
    name: Inside morning light On
    initial: 16
    max: 80
    min: 8
    step: 4
    mode: box

  inside_morning_light_off:
    name: Inside morning light Off
    initial: 20
    max: 80
    min: 16
    step: 4
    mode: box
    
  inside_daylight_on:
    name: Inside daylight On
    initial: 36
    max: 80
    min: 24
    step: 8
    mode: box

  inside_daylight_off:
    name: Inside daylight Off
    initial: 80
    max: 100
    min: 36
    step: 8
    mode: box

  inside_awaylight_on:
    name: Inside awaylight On
    initial: 12
    max: 20
    min: 4
    step: 4
    mode: box

  inside_awaylight_off:
    name: Inside awaylight Off
    initial: 16
    max: 20
    min: 8
    step: 4
    mode: box

  ##############################
  # Values from outside sensor #
  ##############################
  kitchen_light_on:
    name: On (3000,4000)
    initial: 3000
    max: 5000
    min: 2500
    step: 500
    mode: box

  kitchen_light_off:
    name: Off (3500,5000)
    initial: 3500
    max: 6000
    min: 3000
    step: 500
    mode: box

  morning_light_on:
    name: On (2000,3000)
    initial: 2000
    max: 4000
    min: 2000
    step: 500
    mode: box

  morning_light_off:
    name: Off (2500,4000)
    initial: 2500
    max: 5000
    min: 2000
    step: 500
    mode: box

  daylight_on:
    name: On (2000,3500)
    initial: 2000
    max: 5000
    min: 1500
    step: 500
    mode: box

  daylight_off:
    name: Off (2500,4500)
    initial: 2500
    max: 5000
    min: 2000
    step: 500
    mode: box

  awaylight_on:
    name: On (200)
    initial: 200
    max: 500
    min: 100
    step: 50
    mode: box

  awaylight_off:
    name: Off (250)
    initial: 250
    max: 500
    min: 100
    step: 50
    mode: box
#####################
### Input Boolean ###
#####################
input_boolean:
  snow_outside:
    name: Snö ute, anpassa ljusstyrka
    icon: mdi:pine-tree

  kitchen_light_on:
    name: Köksbelysning on

  morning_light_on:
    name: Morgonbelysning on

  daylight_on:
    name: Dagbelysning on

  awaylight_on:
    name: Bortabelysning on

##################
### Automation ###
##################

automation:
  ##################################
  - alias: Old new lux sensor in kitchen
    id: '4720950564477' 

    trigger:
      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) < (states('input_number.inside_kitchen_light_on') | int(0) )}}"
      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) > (states('input_number.inside_kitchen_light_off') | int(0) )}}"

      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) < (states('input_number.inside_morning_light_on') | int(0) )}}"
      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) > (states('input_number.inside_morning_light_off') | int(0) )}}"

      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) < (states('input_number.inside_daylight_on') | int(0) )}}"
      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) > (states('input_number.inside_daylight_off') | int(0) )}}"

      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) < (states('input_number.inside_awaylight_on') | int(0) )}}"
      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) > (states('input_number.inside_awaylight_off') | int(0) )}}"

    condition: []

    action:
      - service: notify.mobile_app_sm_a528b
        data_template:
          title: >
            "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: >
            Old sensor lux: {{ states('sensor.kokets_ljusniva') | int }}
            New sensor lux: {{ states('sensor.presence_sensor_fp2_9a29_light_sensor_light_level') | int }}
            Outside lux:    {{ states('sensor.ljusstyrka') | int }}
            inside_kitchen_light_on:  {{ states('input_number.inside_kitchen_light_on') | int }}
            inside_kitchen_light_off: {{ states('input_number.inside_kitchen_light_off') | int }}
            inside_morning_light_on:  {{ states('input_number.inside_morning_light_on') | int }}
            inside_morning_light_off: {{ states('input_number.inside_morning_light_off') | int }}
            inside_daylight_on:       {{ states('input_number.inside_daylight_on') | int }}
            inside_daylight_off:      {{ states('input_number.inside_daylight_off') | int }}
            inside_awaylight_on:      {{ states('input_number.inside_awaylight_on') | int }}
            inside_awaylight_off:     {{ states('input_number.inside_awaylight_off') | int }}

  ##################################
  - alias: Kitchen light on - inside
    id: '4720950564444' 

    trigger:
      - platform: template
        value_template: "{{((states('sensor.kokets_ljusniva') | int) | int(0)) < (states('input_number.inside_kitchen_light_on') | int(0) )}}"

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id:  input_boolean.kitchen_light_on
          state: 'off'

    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.kitchen_light_on

  ###################################
