####################################################
#                                                  #
#             MQTT PUBLISH VALUES                 #
#                                                  #
####################################################
# MQTT value publishing for external integrations
# Publishes sensor values to MQTT topics for remote consumption
# Documentation: https://www.home-assistant.io/integrations/mqtt/
#
# Purpose:
# - Share sensor data with external systems
# - Integration with neighbor's system (Thomas C.)
# - Real-time sensor value synchronization
#
# Published Values:
# - Outside temperature (sensor.ute) → External MQTT topic
# - Filtered lux reading (sensor.ljusstyrka) → External MQTT topic
#
# Design Pattern:
# - State change triggers immediate MQTT publish
# - Mode: single (prevent concurrent publishing)
# - Topic paths defined in secrets.yaml
# - Template payload contains current sensor state
#
# Usage:
# - External systems subscribe to published topics
# - Neighbor system uses temp/lux for their automations
# - No retention to avoid stale data
#
####################################################

# Källor:
# - Tidigare mqtt_publish_values-konfiguration i detta repo (paketfil)
#
# BESKRIVNING:
# Publicerar utvalda sensordata på MQTT-topics för externa konsumenter.
#

##################
### Automation ###
##################
automation:
  ########################################
  ### MQTT Publish outside temperature ###
  ### Used by Thomas C.                ###
  ########################################
  - alias: MQTT Publish outside temperature
    id: '9256370676537'
    mode: single

    trigger:
      - platform: state
        entity_id: sensor.ute
    
    action:
      - service: mqtt.publish
        data_template:
          payload: "{{trigger.to_state.state}}"
          topic: !secret mqtt_path_publish_outside_temperaure

  #########################################
  ### MQTT Publish filtered outside lux ###
  ### Used by Thomas C.                 ###
  #########################################
  - alias: MQTT Publish filtered outside lux
    id: '9256370678754'
    mode: single

    trigger:
      - platform: state
        entity_id: sensor.ljusstyrka
    
    condition:

    action:
      - service: mqtt.publish
        data_template:
          payload: "{{trigger.to_state.state}}"
          topic: !secret mqtt_path_publish_outside_filtered_outside_lux