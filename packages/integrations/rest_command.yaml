rest_command:
  send_hagaholm_ambient_temperature:
    url: "https://www.flacksta.com/api/misc/set_data.php"
    method: POST
    timeout: 10
    headers:
      Content-Type: "application/json"
    payload: >
      {% set temp = states('sensor.ute') %}
      {% set temp_value = none if temp in ['unknown', 'unavailable', ''] else (temp | float(0.0)) %}
      {{ {
        "api_key": api_key,
        "type": "hagaholm_amb_temp",
        "value": temp_value
      } | tojson }}

  send_hagaholm_ambient_lux:
    url: "https://www.flacksta.com/api/misc/set_data.php"
    method: POST
    timeout: 10
    headers:
      Content-Type: "application/json"
    payload: >
      {% set lux = states('sensor.ljusstyrka') %}
      {% set lux_value = none if lux in ['unknown', 'unavailable', ''] else (lux | int(0)) %}
      {{ {
        "api_key": api_key,
        "type": "hagaholm_lux",
        "value": lux_value
      } | tojson }}

automation:
  - alias: "Skicka utetemp till Flacksta"
    id: "send_hagaholm_ambient_temperature_on_state_change"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.ute
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >
          {% set new_value = trigger.to_state.state if trigger.platform == 'state' else states('sensor.ute') %}
          {% if new_value in ['unknown', 'unavailable', ''] %}
            {{ false }}
          {% else %}
            {{ true }}
          {% endif %}
      - condition: template
        value_template: >
          {% set last = state_attr('automation.send_hagaholm_ambient_temperature_on_state_change', 'last_triggered') %}
          {% if last is none %}
            true
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(last)) >= 60 }}
          {% endif %}
    action:
      - service: rest_command.send_hagaholm_ambient_temperature
        data:
          api_key: !secret flacksta_api_key
      - delay: "00:01:00"

  - alias: "Skicka ljusstyrka till Flacksta"
    id: "send_hagaholm_ambient_lux_on_state_change"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.ljusstyrka
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >
          {% set new_value = trigger.to_state.state if trigger.platform == 'state' else states('sensor.ljusstyrka') %}
          {% if new_value in ['unknown', 'unavailable', ''] %}
            {{ false }}
          {% else %}
            {{ true }}
          {% endif %}
      - condition: template
        value_template: >
          {% set last = state_attr('automation.send_hagaholm_ambient_lux_on_state_change', 'last_triggered') %}
          {% if last is none %}
            true
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(last)) >= 60 }}
          {% endif %}
    action:
      - service: rest_command.send_hagaholm_ambient_lux
        data:
          api_key: !secret flacksta_api_key
      - delay: "00:01:00"