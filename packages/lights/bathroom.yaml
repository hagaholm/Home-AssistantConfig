####################################################
#                                                  #
#            BADRUMSBELYSNING PACKAGE              #
#                                                  #
####################################################
# Samlar all badrumsbelysningslogik i ett paket:
# - Input select för ljuslägen
# - Automations för närvaro- och state-machine-styrning
# - Scripts för faktiska ljusnivåer
#
# Källor:
# - automations/light_bathroom.yaml
# - automations/input_select_light_bathroom.yaml
# - script/light_bathroom.yaml
# - helpers/input_selects.yaml (light_bathroom)
#
# Hårdvara/Entiteter:
# - Närvarosensor: binary_sensor.motion_sensor
# - Ljussensor: sensor.kokets_ljusniva
# - Belysning: light.fonster_spott
# - input_select.light_bathroom (Släckt/Dag/Dag närvaro/Natt närvaro)
#
# Säkerhet:
# - IDs och alias bibehållna för bakåtkompatibilitet
# - Mode single/restart enligt original

# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  light_bathroom:
    name: Badrum
    # Bathroom lighting with occupancy-aware modes
    # Four modes: Off, Day (full), Day with presence, Night with presence
    # Used by: Bathroom automation for motion-sensitive lighting
    options:
      - Släckt
      - Dag
      - Dag närvaro
      - Natt närvaro
    icon: mdi:lightbulb

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#                BADRUMSBELYSNING AUTOMATION          #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Badrumsbelysning är uppbyggd i två lager:
# - Resolver: triggas av sensorer/hemstatus och anropar script.bathroom_set_correct_mode
# - State machine: input_select.light_bathroom ändringar exekverar rätt ljusskript
#
# Beslutslogik (vilket läge som ska gälla) ligger i script.bathroom_set_correct_mode
# som sätter input_select.light_bathroom vid behov.
#
# HÅRDVARA:
# - Närvarosensor: binary_sensor.motion_sensor
# - Ljussensor: sensor.kokets_ljusniva
# - Belysning: light.fonster_spott
#
# TILLSTÅND (input_select.light_bathroom):
# - Släckt:
#   Ingen belysning. Används vid hemstatus Borta
#   eller när det är för ljust.
#
# - Dag:
#   Dagsljus när det är mörkt, hemstatus är Hemma
#   och ingen närvaro detekteras.
#
# - Dag närvaro:
#   Dagsljus med närvaro när hemstatus är Hemma.
#
# - Natt närvaro:
#   Dämpat nattljus vid närvaro när hemstatus är Sover
#   och det är mörkt.
#
# ÖVERGÅNGAR:
# - Släckt → Dag:
#   När det är mörkt och hemstatus är Hemma.
#
# - Släckt → Natt närvaro:
#   När närvaro detekteras, hemstatus är Sover
#   och det är mörkt.
#
# - Dag → Dag närvaro:
#   När närvaro detekteras.
#
# - Dag → Släckt:
#   När det blir för ljust eller hemstatus ändras till Borta.
#
# - Dag närvaro → Dag:
#   När närvaro försvinner (60 s timeout).
#
# - Natt närvaro → Släckt:
#   När närvaro försvinner (60 s timeout).
#
# - * → Släckt:
#   När hemstatus ändras till Borta.
#
# INTEGRATION:
# - Hemstatus hämtas från input_select.home_status
# - Resolvern synkar input_select.light_bathroom via script.bathroom_set_correct_mode
#######################################################

  ######################################
  ### Badrumsbelysning resolver (single)
  ######################################
  - alias: Badrumsbelysning resolver
    id: '1735604100093'
    description: >
      Resolver som synkar input_select.light_bathroom via script.bathroom_set_correct_mode
      (en källa till sanning för beslutslogiken).
    mode: restart
    trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id: input_select.home_status

      - platform: state
        entity_id: binary_sensor.motion_sensor
        to: 'on'

      - platform: state
        entity_id: binary_sensor.motion_sensor
        to: 'off'
        for:
          seconds: 60

      - platform: numeric_state
        entity_id: sensor.kokets_ljusniva
        below: 100

      - platform: numeric_state
        entity_id: sensor.kokets_ljusniva
        above: 150

    action:
      - service: script.bathroom_set_correct_mode

#######################################################
#                                                     #
#       BADRUMSBELYSNING INPUT_SELECT AUTOMATION      #
#                                                     #
#######################################################
#
# BESKRIVNING:
# State machine automation för badrumsbelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande ljusskript.
#
# HÅRDVARA:
# - Styrs via: input_select.light_bathroom
# - Exekveras av: script.bathroom_light_*
#
# TILLSTÅND:
# - Släckt: Ingen belysning
# - Dag: Normalt dagsljus utan närvaro
# - Dag närvaro: Dagsljus med närvaro
# - Natt närvaro: Dämpat nattljus vid närvaro
#
# LOGIK:
# När input_select.light_bathroom ändras:
# - Identifiera nytt tillstånd
# - Anropa motsvarande script
# - Scriptet hanterar faktisk ljuskontroll
#
# INTEGRATION:
# - Kopplad till input_select.light_bathroom
# - Triggar script för faktisk ljuskontroll
# - Styrs av automation i light_bathroom.yaml
#######################################################

  - alias: Badrumsbelysning
    id: '1735304100018'
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.light_bathroom
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_bathroom
                state: Släckt
            sequence:
              - service: script.bathroom_light_off
          - conditions:
              - condition: state
                entity_id: input_select.light_bathroom
                state: Dag
            sequence:
              - service: script.bathroom_light_day
          - conditions:
              - condition: state
                entity_id: input_select.light_bathroom
                state: Dag närvaro
            sequence:
              - service: script.bathroom_light_day_presence
          - conditions:
              - condition: state
                entity_id: input_select.light_bathroom
                state: Natt närvaro
            sequence:
              - service: script.bathroom_light_night_presence

##############
### Script ###
##############
script:

  bathroom_set_correct_mode:
    alias: Återställ badrumsbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          motion: "{{ is_state('binary_sensor.motion_sensor', 'on') }}"
          lux: "{{ states('sensor.kokets_ljusniva') | float(none) }}"
          current_option: "{{ states('input_select.light_bathroom') }}"

          is_dark: "{{ lux is number and lux < 100 }}"
          is_bright: "{{ lux is number and lux > 150 }}"

          valid_options:
            - Släckt
            - Dag
            - Dag närvaro
            - Natt närvaro

          desired_option: >-
            {% if home_status == 'Borta' %}
              Släckt
            {% elif is_bright %}
              Släckt
            {% elif home_status == 'Sover' %}
              {% if motion and is_dark %}
                Natt närvaro
              {% else %}
                Släckt
              {% endif %}
            {% elif home_status == 'Hemma' and is_dark %}
              {% if motion %}
                Dag närvaro
              {% else %}
                Dag
              {% endif %}
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_bathroom
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#            BADRUMSBELYSNING SCRIPTS                 #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Styr badrumsbelysning med olika nivåer beroende på
# tid på dygnet och närvaro.
#
# HÅRDVARA:
# - Fönsterspottar: light.fonster_spott
#
# SCRIPTS:
# - bathroom_light_off: Släcker all belysning
# - bathroom_light_day: 20% - Mjukt dagsljus
# - bathroom_light_day_presence: 80% - Fullt dagsljus vid närvaro
# - bathroom_light_night_presence: 2% - Minimalt nattljus vid närvaro
#
# SÄKERHET:
# - Mode: restart - avbryter tidigare körning vid ny trigger
# - Tillgänglighetskontroll av ljusenheter
# - Mjuka övergångar (1s) för att undvika abrupt ljusväxling
#
# ANVÄNDNING:
# Anropas från input_select_light_bathroom.yaml automation
# baserat på tid och rörelsedetektering.
#######################################################

  ###############################
  ### Badrumsbelysning släckt ###
  ###############################
  bathroom_light_off:
    alias: Badrumsbelysning släckt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.fonster_spott') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.fonster_spott
          transition: 1

  ############################
  ### Badrumsbelysning dag ###
  ############################
  bathroom_light_day:
    alias: Badrumsbelysning dag
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.fonster_spott') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.fonster_spott
          brightness_pct: 20
          transition: 1

  ####################################
  ### Badrumsbelysning dag närvaro ###
  ####################################
  bathroom_light_day_presence:
    alias: Badrumsbelysning dag närvaro
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.fonster_spott') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.fonster_spott
          brightness_pct: 80
          transition: 1

  #####################################
  ### Badrumsbelysning natt närvaro ###
  #####################################
  bathroom_light_night_presence:
    alias: Badrumsbelysning natt närvaro
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.fonster_spott') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.fonster_spott
          brightness_pct: 2
          transition: 2
