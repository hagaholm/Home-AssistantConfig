      - name: lights_debug_uterum
        unique_id: lights_debug_uterum
        state: >-
          {% set home_status = states('input_select.home_status') %}
          {% set track_state = states('group.track_for_home_devices') %}
          {% set lux = states('sensor.ljusstyrka') | float(none) %}
          {% set lux_150 = states('input_number.ljusstyrka_150') | float(150) %}
          {% set temp = states('sensor.uterum_temperatur') | float(none) %}
          {% set is_time_12_2145 = (now().hour > 12 or (now().hour == 12 and now().minute >= 0)) and (now().hour < 21 or (now().hour == 21 and now().minute <= 45)) %}
          {% set is_dark = lux is number and lux < lux_150 %}
          {% set temp_ok = temp is number and temp > 18 %}
          {% set temp_too_cold = temp is number and temp < 17 %}
          {% if home_status == 'Sover' %}
            Släckt
          {% elif track_state != 'home' %}
            Släckt
          {% elif temp_too_cold %}
            Släckt
          {% elif is_time_12_2145 and is_dark and temp_ok %}
            Tänd
          {% else %}
