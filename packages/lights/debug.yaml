            {% set is_not_too_bright = lux is number and lux < lux_60 %}

            {% set lines = [
              'Släckt: ' ~ ('VALD' if desired == 'Släckt' else 'Tvingas endast vid för ljust (lux>60)'),
              'Person upptäckt: ' ~ ('VALD' if desired == 'Person upptäckt' else ('Kräver person_any + lux<60' ~ ('' if (person_any and is_not_too_bright) else ' (false)'))),
              'Natt: ' ~ ('VALD' if desired == 'Natt' else ('Kräver Sover + lux<60 + ingen person' ~ ('' if (home_status == 'Sover' and is_not_too_bright and not person_any) else ' (false)'))),
              'Morgon/Kväll: ' ~ ('VALD' if desired == 'Morgon/Kväll' else ('Kräver mörkt (lux<40) + ej Sover + ingen person' ~ ('' if (is_dark and home_status != 'Sover' and not person_any and not is_bright) else ' (false)'))),
            ] %}

            {% if is_bright %}
              {% set lines = lines + ['Blocker: För ljust => Släckt prioriteras'] %}
            {% elif person_any and is_not_too_bright %}
              {% set lines = lines + ['Prioritet: Person upptäckt går före Natt/Morgon-Kväll'] %}
            {% elif home_status == 'Sover' and is_not_too_bright %}
              {% set lines = lines + ['Prioritet: Natt går före Morgon/Kväll vid Sover'] %}
            {% endif %}

            {{ lines | join('\n') }}

      # -----------------
      # HALL
      # -----------------
      - name: lights_debug_hall
        unique_id: lights_debug_hall
        state: >-
          {% set home_status = states('input_select.home_status') %}
          {% set hall_state = states('light.hall_tak') %}
          {% set bri = state_attr('light.hall_tak', 'brightness') %}
          {% set bri_pct = ((bri | float(0)) * 100 / 255) | round(0) | int if (bri is number) else -1 %}
          {% if home_status != 'Hemma' %}
            Släckt
          {% elif hall_state != 'on' %}
            Släckt
          {% elif bri_pct < 0 %}
            100%
          {% elif bri_pct <= 5 %}
            1%
          {% elif bri_pct <= 25 %}
            10%
          {% elif bri_pct <= 75 %}
            50%
          {% else %}
            100%
          {% endif %}
        attributes:
          current_option: "{{ states('input_select.light_hall') | trim }}"
          home_status: "{{ states('input_select.home_status') | trim }}"
          hall_state: "{{ states('light.hall_tak') }}"
          brightness: "{{ state_attr('light.hall_tak', 'brightness') }}"
          brightness_pct: >-
            {% set bri = state_attr('light.hall_tak', 'brightness') %}
            {% if bri is number %}
              {{ ((bri | float(0)) * 100 / 255) | round(0) | int }}
            {% else %}
              -1
            {% endif %}
          reason: >-
            {% set home_status = states('input_select.home_status') %}
            {% set hall_state = states('light.hall_tak') %}
            {% set bri = state_attr('light.hall_tak', 'brightness') %}
            {% set bri_pct = ((bri | float(0)) * 100 / 255) | round(0) | int if (bri is number) else -1 %}
            {% if home_status != 'Hemma' %}
              Hemstatus != Hemma => Släckt
            {% elif hall_state != 'on' %}
              Lampan är av => Släckt
            {% elif bri_pct < 0 %}
              Okänd brightness => anta 100%
            {% elif bri_pct <= 5 %}
              brightness<=5% => 1%
            {% elif bri_pct <= 25 %}
              brightness<=25% => 10%
            {% elif bri_pct <= 75 %}
              brightness<=75% => 50%
            {% else %}
              brightness>75% => 100%
            {% endif %}
          why_not: >-
            {% set desired = (states('sensor.lights_debug_hall') | trim) %}
            {% set home_status = states('input_select.home_status') %}
            {% set hall_state = states('light.hall_tak') %}
            {% set bri = state_attr('light.hall_tak', 'brightness') %}
            {% set bri_pct = ((bri | float(0)) * 100 / 255) | round(0) | int if (bri is number) else -1 %}

            {% set lines = [
              'Släckt: ' ~ ('VALD' if desired == 'Släckt' else 'Kräver hemstatus!=Hemma eller lampan av'),
              '1%: ' ~ ('VALD' if desired == '1%' else ('Kräver brightness<=5% (och Hemma + lampan på)' ~ ('' if (home_status == 'Hemma' and hall_state == 'on' and bri_pct >= 0 and bri_pct <= 5) else ' (false)'))),
              '10%: ' ~ ('VALD' if desired == '10%' else ('Kräver 6-25% (och Hemma + lampan på)' ~ ('' if (home_status == 'Hemma' and hall_state == 'on' and bri_pct >= 0 and 5 < bri_pct <= 25) else ' (false)'))),
              '50%: ' ~ ('VALD' if desired == '50%' else ('Kräver 26-75% (och Hemma + lampan på)' ~ ('' if (home_status == 'Hemma' and hall_state == 'on' and bri_pct >= 0 and 25 < bri_pct <= 75) else ' (false)'))),
              '100%: ' ~ ('VALD' if desired == '100%' else ('Kräver >75% eller okänd brightness (och Hemma + lampan på)' ~ ('' if (home_status == 'Hemma' and hall_state == 'on' and (bri_pct < 0 or bri_pct > 75)) else ' (false)'))),
            ] %}

            {% if home_status != 'Hemma' %}
              {% set lines = lines + ['Blocker: Hemstatus!=' ~ home_status ~ ' => Släckt'] %}
            {% elif hall_state != 'on' %}
              {% set lines = lines + ['Blocker: Lampan är av => Släckt'] %}
            {% endif %}

            {{ lines | join('\n') }}
