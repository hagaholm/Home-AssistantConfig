####################################################
#                                                  #
#             LIGHTS DEBUG (TEMPLATE)              #
#                                                  #
####################################################
# BESKRIVNING:
# Debug-sensorer som förklarar varför ett visst belysningsläge är valt.
# Tanken är att UI kan visa:
# - önskat läge (desired_option)
# - aktuellt läge (current_option)
# - vilka villkor som är sanna/falska
# - en kort text "reason" för vald gren
#
# Säkerhet:
# - Endast läsning (template sensors). Påverkar inte automationer.
# - Använder float(none) + is number där sensorer kan vara unknown/unavailable.
#
####################################################

template:
  - sensor:
      # -----------------
      # INSIDE (Innebelysning)
      # -----------------
      - name: lights_debug_inside
        unique_id: lights_debug_inside
        state: "{{ states('sensor.light_inside_desired_option') | trim }}"
        attributes:
          current_option: "{{ states('input_select.light_inside') | trim }}"
          home_status: "{{ states('input_select.home_status') | trim }}"
          manual_evening_lock: >-
            {{ (states('input_select.light_inside') | trim) == 'Kvällsbelysning'
              and (states('input_select.home_status') | trim) == 'Hemma'
            }}
          seconds_since_home_status_changed: >-
            {% from 'home_status.jinja' import seconds_since_home_status_change %}
            {{ seconds_since_home_status_change() }}
          pause_day_window_transition: "{{ is_state('input_boolean.inside_pause_day_window_transition', 'on') }}"
          morning_on: "{{ is_state('input_boolean.morning_light_on', 'on') }}"
          daylight_on: "{{ is_state('input_boolean.daylight_on', 'on') }}"
          awaylight_on: "{{ is_state('input_boolean.awaylight_on', 'on') }}"
          christmas_on: "{{ is_state('input_boolean.christmas_light', 'on') }}"
          kitchen_motion: "{{ is_state('binary_sensor.kok_narvaro', 'on') }}"
          is_time_05_09: >-
            {% from 'time_windows.jinja' import in_time_range %}
            {{ in_time_range(5, 0, 9, 0) }}
          is_time_09_05: >-
            {% from 'time_windows.jinja' import in_time_range %}
            {{ in_time_range(9, 0, 5, 0) }}
          is_time_08_22: >-
            {% from 'time_windows.jinja' import in_time_range %}
            {{ in_time_range(8, 0, 22, 0) }}
          reason: >-
            {% from 'home_status.jinja' import borta_long_enough %}
            {% from 'time_windows.jinja' import in_time_range %}
            {% set home_status = states('input_select.home_status') %}
            {% set borta_long_enough = (borta_long_enough(60) | trim) == 'True' %}
            {% set pause_day_window_transition = is_state('input_boolean.inside_pause_day_window_transition', 'on') %}
            {% set current_option = states('input_select.light_inside') %}
            {% set is_time_05_09 = (in_time_range(5, 0, 9, 0) | trim) == 'True' %}
            {% set is_time_09_05 = (in_time_range(9, 0, 5, 0) | trim) == 'True' %}
            {% set is_time_08_22 = (in_time_range(8, 0, 22, 0) | trim) == 'True' %}
            {% set morning_on = is_state('input_boolean.morning_light_on', 'on') %}
            {% set daylight_on = is_state('input_boolean.daylight_on', 'on') %}
            {% set awaylight_on = is_state('input_boolean.awaylight_on', 'on') %}
            {% set christmas_on = is_state('input_boolean.christmas_light', 'on') %}
            {% set kitchen_motion = is_state('binary_sensor.kok_narvaro', 'on') %}
            {% if (current_option | trim) == 'Kvällsbelysning' and (home_status | trim) == 'Hemma' %}
              Manuell Kvällsbelysning (låst)
            {% elif home_status == 'Borta' and awaylight_on and is_time_08_22 and borta_long_enough %}
              Borta + awaylight_on + tid 08-22 + borta>=60s
            {% elif home_status == 'Sover' %}
              Sover (nattljus bara om köksrörelse + daylight_on)
            {% elif home_status == 'Hemma' and morning_on and is_time_05_09 %}
              Hemma + morning_on + tid 05-09
            {% elif pause_day_window_transition and home_status == 'Hemma' and is_time_09_05 and daylight_on %}
              Pausad dag/fönster-övergång (behåll nuvarande)
            {% elif home_status == 'Hemma' and daylight_on and is_time_09_05 %}
              Hemma + daylight_on + tid 09-05
            {% elif home_status == 'Hemma' and is_time_09_05 %}
              Hemma + tid 09-05
            {% else %}
              Fallback: Släckt
            {% endif %}
          why_not: >-
            {% from 'home_status.jinja' import borta_long_enough %}
            {% from 'time_windows.jinja' import in_time_range %}
            {% set desired = states('sensor.light_inside_desired_option') | trim %}
            {% set home_status = states('input_select.home_status') %}
            {% set borta_long_enough = (borta_long_enough(60) | trim) == 'True' %}
            {% set pause_day_window_transition = is_state('input_boolean.inside_pause_day_window_transition', 'on') %}

            {% set is_time_05_09 = (in_time_range(5, 0, 9, 0) | trim) == 'True' %}
            {% set is_time_09_05 = (in_time_range(9, 0, 5, 0) | trim) == 'True' %}
            {% set is_time_08_22 = (in_time_range(8, 0, 22, 0) | trim) == 'True' %}

            {% set morning_on = is_state('input_boolean.morning_light_on', 'on') %}
            {% set daylight_on = is_state('input_boolean.daylight_on', 'on') %}
            {% set awaylight_on = is_state('input_boolean.awaylight_on', 'on') %}
            {% set christmas_on = is_state('input_boolean.christmas_light', 'on') %}
            {% set kitchen_motion = is_state('binary_sensor.kok_narvaro', 'on') %}

            {% set lines = [
              'Släckt: ' ~ ('VALD' if desired == 'Släckt' else 'Inte vald (någon regel matchade: ' ~ desired ~ ')'),
              'Morgonbelysning: ' ~ ('VALD' if desired == 'Morgonbelysning' else (
                'Kräver Hemma + morning_on + tid 05-09' ~ (
                  '' if (home_status == 'Hemma' and morning_on and is_time_05_09) else
                  ' (saknas: ' ~ (
                    ('hemstatus!=' ~ home_status) if home_status != 'Hemma' else
                    ('morning_on=off') if not morning_on else
                    ('tid ej 05-09') if not is_time_05_09
                  ) ~ ')'
                )
              )),
              'Dagbelysning: ' ~ ('VALD' if desired == 'Dagbelysning' else (
                'Kräver Hemma + daylight_on + tid 09-05 + ej pausad' ~ (
                  '' if (home_status == 'Hemma' and daylight_on and is_time_09_05 and not pause_day_window_transition) else
                  ' (saknas: ' ~ (
                    ('hemstatus!=' ~ home_status) if home_status != 'Hemma' else
                    ('daylight_on=off') if not daylight_on else
                    ('tid ej 09-05') if not is_time_09_05 else
                    ('pausad') if pause_day_window_transition
                  ) ~ ')'
                )
              )),
              'Nattbelysning: ' ~ ('VALD' if desired == 'Nattbelysning' else (
                'Kräver Sover + köksrörelse + daylight_on' ~ (
                  '' if (home_status == 'Sover' and kitchen_motion and daylight_on) else
                  ' (saknas: ' ~ (
                    ('hemstatus!=' ~ home_status) if home_status != 'Sover' else
                    ('köksrörelse=off') if not kitchen_motion else
                    ('daylight_on=off') if not daylight_on
                  ) ~ ')'
                )
              )),
              'Bortabelysning: ' ~ ('VALD' if desired == 'Bortabelysning' else (
                'Kräver Borta + awaylight_on + tid 08-22 + borta>=60s' ~ (
                  '' if (home_status == 'Borta' and awaylight_on and is_time_08_22 and borta_long_enough) else
                  ' (saknas: ' ~ (
                    ('hemstatus!=' ~ home_status) if home_status != 'Borta' else
                    ('awaylight_on=off') if not awaylight_on else
                    ('tid ej 08-22') if not is_time_08_22 else
                    ('borta<60s') if not borta_long_enough
                  ) ~ ')'
                )
              )),
              'Fönsterbelysning: ' ~ ('VALD' if desired == 'Fönsterbelysning' else (
                'Kräver Hemma + christmas_on + tid 09-05 + ej pausad' ~ (
                  '' if (home_status == 'Hemma' and christmas_on and is_time_09_05 and not pause_day_window_transition) else
                  ' (saknas: ' ~ (
                    ('hemstatus!=' ~ home_status) if home_status != 'Hemma' else
                    ('christmas_on=off') if not christmas_on else
                    ('tid ej 09-05') if not is_time_09_05 else
                    ('pausad') if pause_day_window_transition
                  ) ~ ')'
                )
              )),
              'Förmiddagsbelysning: ' ~ ('VALD' if desired == 'Förmiddagsbelysning' else 'Väljs normalt inte av resolver (manuell/legacy)'),
              'Arbetsbelysning: ' ~ ('VALD' if desired == 'Arbetsbelysning' else 'Väljs normalt inte av resolver (manuell)'),
            ] %}

            {% if pause_day_window_transition and home_status == 'Hemma' and is_time_09_05 and daylight_on and desired == states('input_select.light_inside') | trim %}
              {% set lines = lines + ['OBS: Övergång pausad => behåller nuvarande (' ~ desired ~ ')'] %}
            {% endif %}

            {{ lines | join('\n') }}

      # -----------------
      # KITCHEN
      # -----------------
      - name: lights_debug_kitchen
        unique_id: lights_debug_kitchen
        state: >-
          {% set home_status = states('input_select.home_status') %}
          {% set presence_all = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_1', 'on') %}
          {% set presence_zone_2 = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_2', 'on') %}
          {% set presence_zone_3 = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_3', 'on') %}
          {% set kitchen_light_on = is_state('input_boolean.kitchen_light_on', 'on') %}
          {% set morning_light_on = is_state('input_boolean.morning_light_on', 'on') %}
          {% set current_option = states('input_select.light_kitchen') | trim %}
          {% if not presence_all %}
            Släckt
          {% elif home_status == 'Sover' %}
            25%
          {% elif home_status in ['Hemma', 'Borta'] and kitchen_light_on and (presence_zone_2 or presence_zone_3) %}
            100%
          {% elif home_status in ['Hemma', 'Borta'] and morning_light_on and current_option in ['Släckt'] %}
            50%
          {% else %}
            {{ states('input_select.light_kitchen') | trim }}
          {% endif %}
        attributes:
          current_option: "{{ states('input_select.light_kitchen') | trim }}"
          home_status: "{{ states('input_select.home_status') | trim }}"
          presence_all: "{{ is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_1', 'on') }}"
          presence_zone_2: "{{ is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_2', 'on') }}"
          presence_zone_3: "{{ is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_3', 'on') }}"
          kitchen_light_on: "{{ is_state('input_boolean.kitchen_light_on', 'on') }}"
          morning_light_on: "{{ is_state('input_boolean.morning_light_on', 'on') }}"
          reason: >-
            {% set home_status = states('input_select.home_status') %}
            {% set presence_all = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_1', 'on') %}
            {% set presence_zone_2 = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_2', 'on') %}
            {% set presence_zone_3 = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_3', 'on') %}
            {% set kitchen_light_on = is_state('input_boolean.kitchen_light_on', 'on') %}
            {% set morning_light_on = is_state('input_boolean.morning_light_on', 'on') %}
            {% set current_option = states('input_select.light_kitchen') | trim %}
            {% if not presence_all %}
              Ingen närvaro (sensor_1=off) => Släckt
            {% elif home_status == 'Sover' %}
              Sover => 25%
            {% elif home_status in ['Hemma', 'Borta'] and kitchen_light_on and (presence_zone_2 or presence_zone_3) %}
              Z2/Z3 närvaro + kitchen_light_on => 100%
            {% elif home_status in ['Hemma', 'Borta'] and morning_light_on and current_option in ['Släckt'] %}
              morning_light_on + current=Släckt => 50%
            {% else %}
              Behåll nuvarande
            {% endif %}
          why_not: >-
            {% set desired = (states('sensor.lights_debug_kitchen') | trim) %}
            {% set home_status = states('input_select.home_status') %}
            {% set presence_all = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_1', 'on') %}
            {% set presence_zone_2 = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_2', 'on') %}
            {% set presence_zone_3 = is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_3', 'on') %}
            {% set kitchen_light_on = is_state('input_boolean.kitchen_light_on', 'on') %}
            {% set morning_light_on = is_state('input_boolean.morning_light_on', 'on') %}
            {% set current_option = states('input_select.light_kitchen') | trim %}

            {% set lines = [
              'Släckt: ' ~ ('VALD' if desired == 'Släckt' else 'Tvingas bara vid ingen närvaro (sensor_1=off)'),
              '25%: ' ~ ('VALD' if desired == '25%' else ('Kräver Sover + närvaro' ~ ('' if (home_status == 'Sover' and presence_all) else ' (false)'))),
              '50%: ' ~ ('VALD' if desired == '50%' else ('Kräver morning_light_on + current=Släckt + närvaro (och ej 100%-regel)' ~ ('' if (presence_all and home_status in ['Hemma','Borta'] and morning_light_on and current_option == 'Släckt' and not (kitchen_light_on and (presence_zone_2 or presence_zone_3))) else ' (false)'))),
              '100%: ' ~ ('VALD' if desired == '100%' else ('Kräver kitchen_light_on + Z2/Z3 närvaro' ~ ('' if (presence_all and home_status in ['Hemma','Borta'] and kitchen_light_on and (presence_zone_2 or presence_zone_3)) else ' (false)'))),
            ] %}

            {% if desired == states('input_select.light_kitchen') | trim and presence_all and home_status != 'Sover' and not (kitchen_light_on and (presence_zone_2 or presence_zone_3)) and not morning_light_on %}
              {% set lines = lines + ['OBS: Ingen regel tvingade ändring => behåller nuvarande (' ~ desired ~ ')'] %}
            {% endif %}

            {{ lines | join('\n') }}

      # -----------------
      # BATHROOM
      # -----------------
      - name: lights_debug_bathroom
        unique_id: lights_debug_bathroom
        state: >-
          {% set home_status = states('input_select.home_status') %}
          {% set motion = is_state('binary_sensor.motion_sensor', 'on') %}
          {% set lux = states('sensor.kokets_ljusniva') | float(none) %}
          {% set is_dark = lux is number and lux < 100 %}
          {% set is_bright = lux is number and lux > 150 %}
          {% if home_status == 'Borta' %}
            Släckt
          {% elif is_bright %}
            Släckt
          {% elif home_status == 'Sover' %}
            {% if motion and is_dark %}
              Natt närvaro
            {% else %}
              Släckt
            {% endif %}
          {% elif home_status == 'Hemma' and is_dark %}
            {% if motion %}
              Dag närvaro
            {% else %}
              Dag
            {% endif %}
          {% else %}
            {{ states('input_select.light_bathroom') | trim }}
          {% endif %}
        attributes:
          current_option: "{{ states('input_select.light_bathroom') | trim }}"
          home_status: "{{ states('input_select.home_status') | trim }}"
          motion: "{{ is_state('binary_sensor.motion_sensor', 'on') }}"
          lux: "{{ states('sensor.kokets_ljusniva') }}"
          is_dark: >-
            {% set lux = states('sensor.kokets_ljusniva') | float(none) %}
            {{ lux is number and lux < 100 }}
          is_bright: >-
            {% set lux = states('sensor.kokets_ljusniva') | float(none) %}
            {{ lux is number and lux > 150 }}
          reason: >-
            {% set home_status = states('input_select.home_status') %}
            {% set motion = is_state('binary_sensor.motion_sensor', 'on') %}
            {% set lux = states('sensor.kokets_ljusniva') | float(none) %}
            {% set is_dark = lux is number and lux < 100 %}
            {% set is_bright = lux is number and lux > 150 %}
            {% if home_status == 'Borta' %}
              Hemstatus Borta => Släckt
            {% elif is_bright %}
              För ljust (lux>150) => Släckt
            {% elif home_status == 'Sover' %}
              Sover => Natt närvaro bara om rörelse+mörkt
            {% elif home_status == 'Hemma' and is_dark %}
              Hemma+mörkt => Dag (utan rörelse) / Dag närvaro (med rörelse)
            {% else %}
              Behåll nuvarande
            {% endif %}
          why_not: >-
            {% set desired = (states('sensor.lights_debug_bathroom') | trim) %}
            {% set home_status = states('input_select.home_status') %}
            {% set motion = is_state('binary_sensor.motion_sensor', 'on') %}
            {% set lux = states('sensor.kokets_ljusniva') | float(none) %}
            {% set is_dark = lux is number and lux < 100 %}
            {% set is_bright = lux is number and lux > 150 %}

            {% set lines = [
              'Släckt: ' ~ ('VALD' if desired == 'Släckt' else 'Tvingas vid Borta eller för ljust eller Sover utan rörelse+mörkt'),
              'Dag: ' ~ ('VALD' if desired == 'Dag' else ('Kräver Hemma + mörkt + ingen rörelse' ~ ('' if (home_status == 'Hemma' and is_dark and not motion) else ' (false)'))),
              'Dag närvaro: ' ~ ('VALD' if desired == 'Dag närvaro' else ('Kräver Hemma + mörkt + rörelse' ~ ('' if (home_status == 'Hemma' and is_dark and motion) else ' (false)'))),
              'Natt närvaro: ' ~ ('VALD' if desired == 'Natt närvaro' else ('Kräver Sover + mörkt + rörelse' ~ ('' if (home_status == 'Sover' and is_dark and motion) else ' (false)'))),
            ] %}

            {% if home_status == 'Hemma' and not is_dark and desired == states('input_select.light_bathroom') | trim %}
              {% set lines = lines + ['OBS: Behåller nuvarande (ej mörkt nog för automatik) => ' ~ desired] %}
            {% endif %}

            {% if is_bright %}
              {% set lines = lines + ['OBS: För ljust (lux>150) => Släckt prioriteras'] %}
            {% endif %}

            {{ lines | join('\n') }}

      # -----------------
      # GARDEN
      # -----------------
      - name: lights_debug_garden
        unique_id: lights_debug_garden
        state: >-
          {% set home_status = states('input_select.home_status') %}
          {% set track_state = states('group.track_for_home_devices') %}
          {% set lux = states('sensor.ljusstyrka') | float(none) %}
          {% set lux_40 = states('input_number.ljusstyrka_40') | float(40) %}
          {% set lux_60 = states('input_number.ljusstyrka_60') | float(60) %}
          {% set is_dark = lux is number and lux < lux_40 %}
          {% set is_bright = lux is number and lux > lux_60 %}
          {% set is_time_05_12 = 5 <= now().hour < 12 %}
          {% set is_time_12_05 = (now().hour >= 12) or (now().hour < 5) %}
          {% set is_time_21_06 = (now().hour >= 21) or (now().hour < 6) %}
          {% if home_status == 'Sover' %}
            Släckt
          {% elif is_bright %}
            Släckt
          {% elif track_state == 'home' and is_time_21_06 %}
            Släckt
          {% elif is_dark and is_time_05_12 and home_status == 'Hemma' %}
            Tänd
          {% elif is_dark and is_time_12_05 and track_state == 'home' and home_status == 'Hemma' %}
            Tänd
          {% elif is_dark and is_time_12_05 and track_state == 'not_home' %}
            Tänd
          {% else %}
            {{ states('input_select.light_garden') | trim }}
          {% endif %}
        attributes:
          current_option: "{{ states('input_select.light_garden') | trim }}"
          home_status: "{{ states('input_select.home_status') | trim }}"
          track_state: "{{ states('group.track_for_home_devices') | trim }}"
          lux: "{{ states('sensor.ljusstyrka') }}"
          lux_40: "{{ states('input_number.ljusstyrka_40') }}"
          lux_60: "{{ states('input_number.ljusstyrka_60') }}"
          is_dark: >-
            {% set lux = states('sensor.ljusstyrka') | float(none) %}
            {% set lux_40 = states('input_number.ljusstyrka_40') | float(40) %}
            {{ lux is number and lux < lux_40 }}
          is_bright: >-
            {% set lux = states('sensor.ljusstyrka') | float(none) %}
            {% set lux_60 = states('input_number.ljusstyrka_60') | float(60) %}
            {{ lux is number and lux > lux_60 }}
          is_time_05_12: "{{ 5 <= now().hour < 12 }}"
          is_time_12_05: "{{ (now().hour >= 12) or (now().hour < 5) }}"
          is_time_21_06: "{{ (now().hour >= 21) or (now().hour < 6) }}"
          reason: >-
            {% set home_status = states('input_select.home_status') %}
            {% set track_state = states('group.track_for_home_devices') %}
            {% set lux = states('sensor.ljusstyrka') | float(none) %}
            {% set lux_40 = states('input_number.ljusstyrka_40') | float(40) %}
            {% set lux_60 = states('input_number.ljusstyrka_60') | float(60) %}
            {% set is_dark = lux is number and lux < lux_40 %}
            {% set is_bright = lux is number and lux > lux_60 %}
            {% set is_time_05_12 = 5 <= now().hour < 12 %}
            {% set is_time_12_05 = (now().hour >= 12) or (now().hour < 5) %}
            {% set is_time_21_06 = (now().hour >= 21) or (now().hour < 6) %}
            {% if home_status == 'Sover' %}
              Sover => Släckt
            {% elif is_bright %}
              För ljust => Släckt
            {% elif track_state == 'home' and is_time_21_06 %}
              Hemma natt (21-06) => Släckt
            {% elif is_dark and is_time_05_12 and home_status == 'Hemma' %}
              Mörkt + morgon + Hemma => Tänd
            {% elif is_dark and is_time_12_05 and track_state == 'home' and home_status == 'Hemma' %}
              Mörkt + eftermiddag/kväll + Hemma => Tänd
            {% elif is_dark and is_time_12_05 and track_state == 'not_home' %}
              Mörkt + eftermiddag/kväll + Borta => Tänd (säkerhet)
            {% else %}
              Behåll nuvarande
            {% endif %}
          why_not: >-
            {% set desired = (states('sensor.lights_debug_garden') | trim) %}
            {% set home_status = states('input_select.home_status') %}
            {% set track_state = states('group.track_for_home_devices') %}
            {% set lux = states('sensor.ljusstyrka') | float(none) %}
            {% set lux_40 = states('input_number.ljusstyrka_40') | float(40) %}
            {% set lux_60 = states('input_number.ljusstyrka_60') | float(60) %}
            {% set is_dark = lux is number and lux < lux_40 %}
            {% set is_bright = lux is number and lux > lux_60 %}
            {% set is_time_05_12 = 5 <= now().hour < 12 %}
            {% set is_time_12_05 = (now().hour >= 12) or (now().hour < 5) %}
            {% set is_time_21_06 = (now().hour >= 21) or (now().hour < 6) %}

            {% set can_turn_on = (
              (is_dark and is_time_05_12 and home_status == 'Hemma')
              or (is_dark and is_time_12_05 and track_state == 'home' and home_status == 'Hemma')
              or (is_dark and is_time_12_05 and track_state == 'not_home')
            ) %}

            {% set lines = [
              'Tänd: ' ~ ('VALD' if desired == 'Tänd' else ('Kräver mörkt + korrekt tidläge + (Hemma eller Borta-säkerhet)' ~ ('' if can_turn_on else ' (false)'))),
              'Släckt: ' ~ ('VALD' if desired == 'Släckt' else 'Någon tänd-regel matchade'),
            ] %}

            {% if home_status == 'Sover' %}
              {% set lines = lines + ['Blocker: Hemstatus Sover => alltid Släckt'] %}
            {% elif is_bright %}
