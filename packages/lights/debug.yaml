            {{ lux is number and lux < lux_150 }}
          temp_ok: >-
            {% set temp = states('sensor.uterum_temperatur') | float(none) %}
            {{ temp is number and temp > 18 }}
          temp_too_cold: >-
            {% set temp = states('sensor.uterum_temperatur') | float(none) %}
            {{ temp is number and temp < 17 }}
          reason: >-
            {% set home_status = states('input_select.home_status') %}
            {% set track_state = states('group.track_for_home_devices') %}
            {% set lux = states('sensor.ljusstyrka') | float(none) %}
            {% set lux_150 = states('input_number.ljusstyrka_150') | float(150) %}
            {% set temp = states('sensor.uterum_temperatur') | float(none) %}
            {% set is_time_12_2145 = (now().hour > 12 or (now().hour == 12 and now().minute >= 0)) and (now().hour < 21 or (now().hour == 21 and now().minute <= 45)) %}
            {% set is_dark = lux is number and lux < lux_150 %}
            {% set temp_ok = temp is number and temp > 18 %}
            {% set temp_too_cold = temp is number and temp < 17 %}
            {% if home_status == 'Sover' %}
              Sover => Släckt
            {% elif track_state != 'home' %}
              Ingen hemma (track!=home) => Släckt
            {% elif temp_too_cold %}
              För kallt (temp<17) => Släckt
            {% elif is_time_12_2145 and is_dark and temp_ok %}
              Tid 12-21:45 + mörkt + varmt => Tänd
            {% else %}
              Behåll nuvarande
            {% endif %}
          why_not: >-
            {% set desired = (states('sensor.lights_debug_uterum') | trim) %}
            {% set home_status = states('input_select.home_status') %}
            {% set track_state = states('group.track_for_home_devices') %}
            {% set lux = states('sensor.ljusstyrka') | float(none) %}
            {% set lux_150 = states('input_number.ljusstyrka_150') | float(150) %}
            {% set temp = states('sensor.uterum_temperatur') | float(none) %}
            {% set is_time_12_2145 = (now().hour > 12 or (now().hour == 12 and now().minute >= 0)) and (now().hour < 21 or (now().hour == 21 and now().minute <= 45)) %}
            {% set is_dark = lux is number and lux < lux_150 %}
            {% set temp_ok = temp is number and temp > 18 %}
            {% set temp_too_cold = temp is number and temp < 17 %}
            {% set can_turn_on = (home_status != 'Sover' and track_state == 'home' and (not temp_too_cold) and is_time_12_2145 and is_dark and temp_ok) %}

            {% set lines = [
              'Tänd: ' ~ ('VALD' if desired == 'Tänd' else ('Kräver hemma + 12-21:45 + mörkt + temp>18' ~ ('' if can_turn_on else ' (false)'))),
              'Släckt: ' ~ ('VALD' if desired == 'Släckt' else 'Någon tänd-regel matchade'),
            ] %}

            {% if home_status == 'Sover' %}
              {% set lines = lines + ['Blocker: Sover => Släckt'] %}
            {% elif track_state != 'home' %}
              {% set lines = lines + ['Blocker: Ingen hemma (track!=home) => Släckt'] %}
            {% elif temp_too_cold %}
              {% set lines = lines + ['Blocker: För kallt (temp<17) => Släckt'] %}
            {% elif not is_time_12_2145 %}
              {% set lines = lines + ['Blocker: Utanför tidsfönster 12-21:45'] %}
            {% elif not is_dark %}
              {% set lines = lines + ['Blocker: Inte mörkt (lux>=150)'] %}
            {% elif not temp_ok %}
              {% set lines = lines + ['Blocker: Inte varmt nog (temp<=18)'] %}
            {% endif %}

            {{ lines | join('\n') }}

