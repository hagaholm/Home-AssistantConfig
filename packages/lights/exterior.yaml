####################################################
#                                                  #
#         EXTERIOR LIGHTING PACKAGE                #
#                                                  #
####################################################
# Samlar all fasad- och utebelysningslogik i ett paket:
# - Input selects för fasad och utebelysning
# - Automations för lux-, tid- och persondetektering
# - Scripts för faktisk ljuskontroll
#
# Källor:
# - automations/light_outside.yaml
# - automations/light_outside_facade.yaml
# - script/light_outside.yaml
# - script/light_outside_facade.yaml
# - helpers/input_selects.yaml (facade_lights, light_outside)
#
# Hårdvara/Entiteter:
# FASAD:
# - light.friggebod_fasad, light.forrad_fasad
# - light.tvattstugan_fasad, light.huvudentre2
# - binary_sensor.cam3/7/8_person_occupancy
# - input_select.facade_lights (Släckt/Tänt/Natt/Max)
#
# UTEBELYSNING:
# - light.friggebod_ute_2
# - light.spabad_v / _m / _h
# - switch.friggebod_fonster
# - sensor.ljusstyrka
# - binary_sensor.kok_narvaro
#
# Säkerhet:
# - IDs och alias bibehållna för bakåtkompatibilitet
# - Mode single/restart enligt original
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  facade_lights: 
    name: Fasadbelysning 
    # Facade and exterior accent lighting control
    # Four modes: Off, On, Night mode (dimmed), Maximum (full brightness)
    # Used by: Exterior lighting automation and evening/night scenes
    options: 
     - Släckt 
     - Tänt
     - Natt 
     - Max
    icon: mdi:lightbulb
     
  light_outside:
    name: Utebelysning
    # Exterior house lighting (porch, driveway, entrance)
    # Simple on/off for motion-detected exterior lighting
    # Updated by: PIR sensors and dusk/dawn automations
    options:
     - Släckt
     - Tänt
    icon: mdi:lightbulb

##################
### Automation ###
##################
automation:

####################################################
#                                                  #
#            FACADE LIGHT AUTOMATIONS              #
#                                                  #
####################################################
#
# Manages exterior facade lighting based on:
# - Ambient light levels (lux sensors)
# - Home occupancy status
# - Person detection from cameras
#
# Light States:
# - Släckt: Off (lux > 60)
# - Tänt: On (lux < 40, home active)
# - Natt: Night mode (home away)
# - Max: Maximum brightness (person detected)
#
# Related Entities:
# - sensor.ljusstyrka
# - input_select.facade_lights
# - input_select.home_status
# - binary_sensor.cam3/7/8_person_occupancy
# - script.fasadbelysning_*
####################################################

  ####################################################
  #         LIGHT OFF WHEN BRIGHT OUTSIDE            #
  ####################################################
  - alias: Facade Light Off When Bright Outside
    id: '6820471947302'
    mode: single
    trigger:
      platform: numeric_state
      entity_id: sensor.ljusstyrka
      above: input_number.ljusstyrka_60
      for: "00:02:00"
    condition:
      condition: not
      conditions:
        - condition: state
          entity_id: input_select.facade_lights
          state: 'Släckt'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Släckt

  ####################################################
  #          LIGHT ON WHEN DARK OUTSIDE              #
  ####################################################
  - alias: Facade Light On When Dark Outside
    id: '6820471947303'
    mode: single
    trigger:
      platform: numeric_state
      entity_id: sensor.ljusstyrka
      below: input_number.ljusstyrka_40
      for: "00:02:00"
    condition:
      condition: not
      conditions:
        - condition: state
          entity_id: input_select.facade_lights
          state: 'Tänt'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Tänt

  ####################################################
  #              NIGHT MODE ACTIVATION               #
  ####################################################
  - alias: Facade Light Night Mode
    id: '6820471947304'
    mode: single
    trigger:
      platform: state
      entity_id: input_select.home_status
      to: "Hemma av"
    condition:
      condition: and
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: input_select.facade_lights
              state: 'Natt'
        - condition: numeric_state
          entity_id: sensor.ljusstyrka
          below: input_number.ljusstyrka_60
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Natt

  ####################################################
  #         MAX LIGHT WHEN PERSON DETECTED           #
  ####################################################
  - alias: Facade Light Max When Person Detected
    id: '6820471947305'
    mode: single
    trigger:
      platform: state
      entity_id:
        - binary_sensor.cam3_person_occupancy
        - binary_sensor.cam7_person_occupancy
        - binary_sensor.cam8_person_occupancy
      to: 'on'
    condition:
      condition: and
      conditions:
        - condition: or
          conditions:
            - condition: state
              entity_id: input_select.facade_lights
              state: 'Tänt'
            - condition: state
              entity_id: input_select.facade_lights
              state: 'Natt'
        - condition: not
          conditions:
            - condition: state
              entity_id: input_select.facade_lights
              state: 'Max'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Max

  ####################################################
  #       RETURN TO NORMAL AFTER PERSON LEAVES       #
  ####################################################
  - alias: Facade Light On When No Person Detected
    id: '6820471947306'
    mode: restart
    trigger:
      platform: state
      entity_id:
        - binary_sensor.cam3_person_occupancy
        - binary_sensor.cam7_person_occupancy
        - binary_sensor.cam8_person_occupancy
      to: 'off'
      for: "00:00:30"
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_select.facade_lights
          state: 'Max'
        - condition: state
          entity_id: binary_sensor.cam3_person_occupancy
          state: 'off'
        - condition: state
          entity_id: binary_sensor.cam7_person_occupancy
          state: 'off'
        - condition: state
          entity_id: binary_sensor.cam8_person_occupancy
          state: 'off'
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: "Hemma av"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: Natt
        default:
          - service: input_select.select_option
            data:
              entity_id: input_select.facade_lights
              option: Tänt

  ####################################################
  #         EXIT NIGHT MODE WHEN HOME ACTIVE         #
  ####################################################
  - alias: Facade Light from Night to On
    id: '6820471947307'
    mode: single
    trigger:
      platform: state
      entity_id: input_select.home_status
      to: "Hemma på"
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_select.facade_lights
          state: 'Natt'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Tänt

  ####################################################
  #          EXECUTE SCRIPT ON STATE CHANGE          #
  ####################################################
  - alias: Facade Light changed
    id: '6820471947308'
    mode: single
    trigger:
      platform: state
      entity_id: input_select.facade_lights
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Släckt"
            sequence:
              - service: script.fasadbelysning_off
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Tänt"
            sequence:
              - service: script.fasadbelysning_on
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Natt"
            sequence:
              - service: script.fasadbelysning_night
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Max"
            sequence:
              - service: script.fasadbelysning_max

#######################################################
#                                                     #
#        OUTSIDE LIGHTING AUTOMATION                  #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 1.1
# Författare: Home Assistant Config
#
# BESKRIVNING:
# Automationer för olika utomhusbelysning:
# - Friggebod fasadbelysning
# - Späbelysning
# - Olika tidsbaserade scheman
#
# HÅRDVARA/ENTITETER:
# - light.friggebod_ute_2
# - light.friggebod_fasad
# - light.spa_belysning
# - sensor.ljusstyrka
# - binary_sensor.kok_narvaro
# - input_number.ljusstyrka_40/60
#
# TRIGGRAR:
# - Ljusnivå (lux sensorer)
# - Tid på dygnet
# - Rörelse i kök (morgon)
# - Helgstatus
#
# LOGIK:
# Olika automationer för:
# - Friggebod morgon (05:00-12:00, rörelse + mörkt)
# - Friggebod eftermiddag (12:00-21:45, mörkt)
# - Friggebod släckning (ljust eller sent)
# - Späbelysning tidsbaserad
# - Helgscheman
#
# INTEGRATION:
# - Använder ljusstyrka trösklar
# - Integrerad med köksensor för morgonaktivering
# - Olika scheman för vardag/helg
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga separata automationer
# v1.1 (2025-12-27): Lade till omfattande dokumentation
#######################################################

  ############################################################
  ### Tänder friggebod ute på morgonen vid rörelse i köket ###
  ### T: binary_sensor.kok_narvaro == on                   ###
  ### C: sensor.ljusstyrka < ljusstyrka_40                 ###
  ###    05:00:00 - 12:00:00                               ###
  ### A: light.friggebod_ute_2 = on                        ###
  ############################################################
  - alias: Friggebod ute on (sensor on, <ljusstyrka_40)
    id: '9369632281021'
    trigger:
      platform: state
      entity_id: binary_sensor.kok_narvaro
      to: 'on'
    condition:
      condition: and
      conditions:
        - condition: numeric_state
          entity_id: sensor.ljusstyrka
          below: input_number.ljusstyrka_40
        - condition: state
          entity_id: light.friggebod_fasad
          state: 'off'
        - condition: time
          after: '05:00:00'
          before: '12:00:00'
    action:
      - service: light.turn_on
        entity_id: light.friggebod_ute_2

  #############################################
  ### Tänder friggebod ute på eftermiddagen ###
  ### T: sensor.ljusstyrka < ljusstyrka_40  ###
  ### C: 12:00:00 - 21:45:00                ###
  ### A: light.friggebod_ute_2 = on         ###
  #############################################
  - alias: Friggebod ute on (<ljusstyrka_40)
    id: '2246049822272'
    trigger:
      platform: numeric_state
      entity_id: sensor.ljusstyrka
      below: input_number.ljusstyrka_40
    condition:
      condition: time
      after: '12:00:00'
      before: '21:45:00'
    action:
      - service: light.turn_on
        entity_id: light.friggebod_ute_2

  ################################################
  ### Släcker friggebod ute när det blir ljust ###
  ### T: sensor.ljusstyrka > ljusstyrka_60     ###
  ### C: light.friggebod_ute_2 == on           ###
  ### A: light.friggebod_ute_2 = off           ###
  ################################################
  - alias: Friggebod ute off (>ljusstyrka_60)
    id: '6395264032481'
    trigger:
      platform: numeric_state
      entity_id: sensor.ljusstyrka
      above: input_number.ljusstyrka_60
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: light.friggebod_ute_2
          state: 'on'
    action:
      - service: light.turn_off
        entity_id: light.friggebod_ute_2

  ####################################################
  ### Tänder belysning vid Spabad på eftermiddagen ###
  ### T: sensor.ljusstyrka < ljusstyrka_5          ###
  ### C: binary_sensor.workday_tomorrow = off      ###
  ### C: 12:00:00 - 21:45:00                       ###
  ### C: light.spabad_v = off                      ###
  ### C: light.spabad_m = off                      ###
  ### C: light.spabad_h= off                       ###
  ### A: script.night_light                        ###
  ####################################################
  - alias: Spabelysning on (<ljusstyrka_5)
    id: '8301399257818'
    trigger:
      platform: numeric_state
      entity_id: sensor.ljusstyrka
      below: input_number.ljusstyrka_5
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.workday_tomorrow
          state: 'off'
        - condition: time
          after: '12:00:00'
          before: '21:45:00'
        - condition: state
          entity_id: light.spabad_v
          state: 'off'
        - condition: state
          entity_id: light.spabad_m
          state: 'off'
        - condition: state
          entity_id: light.spabad_h
          state: 'off'
    action:
      - service: script.spa_light_on

  #####################################################
  ### Tänder belysning i Friggebod på eftermiddagen ###
  ### T: sensor.ljusstyrka < ljusstyrka_1           ###
  ### C: 12:00:00 - 21:45:00                        ###
  ### A: script.friggebod_light_on                  ###
  #####################################################
  - alias: Friggebod belysning on (<ljusstyrka_1)
    id: '5915819999254'
    trigger:
      platform: numeric_state
      entity_id: sensor.ljusstyrka
      below: input_number.ljusstyrka_1
    condition:
      condition: time
      after: '12:00:00'
      before: '21:45:00'
    action:
      - service: script.friggebod_light_on

  ##########################################################
  ### Släcker utebelysning på kvällen                     ###
  ### T: 22:00:00                                         ###
  ### C: styr efter hemma/borta och arbetsdag            ###
  ### A: service: script.outside_light_off               ###
  ##########################################################
  - alias: Utebelysning off (22:00)
    id: '2732476617933'
    trigger:
      platform: time
      at: '22:00:00'
    action:
      - choose:
          - alias: Borta
            conditions:
              - condition: state
                entity_id: group.track_for_home_devices
                state: 'not_home'
            sequence:
              - service: script.outside_light_off
          - alias: Hemma vardag
            conditions:
              - condition: state
                entity_id: group.track_for_home_devices
                state: 'home'
              - condition: state
                entity_id: binary_sensor.workday_tomorrow
                state: 'on'
            sequence:
              - service: script.outside_light_off

  ##############################################################
  ### Släcker utebelysning på helgkvällar när någon är hemma ###
  ### T: switch.kok_lilla_fonstret == off                    ###
  ### C: group.track_for_home_devices == home                ###
  ###    workday_tomorrow == off                             ###
  ### A: service: script.outside_light_off                   ###
  ###    Service: script.uterum_window_light_off             ###
  ##############################################################
  - alias: Utebelysning off (All off, hemma, helg)
    id: '5134859503467'
    trigger:
      platform: state
      entity_id: switch.kok_lilla_fonstret
      to: 'off'
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: group.track_for_home_devices
          state: 'home'
        - condition: state
          entity_id: binary_sensor.workday_tomorrow
          state: 'off'
    action:
      - service: script.outside_light_off

##############
### Script ###
##############
script:
#######################################################
#                                                     #
#             FASADBELYSNING SCRIPTS                  #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Scenarier för fasadbelysning (på, av, natt, max).
#
# HÅRDVARA:
# - light.friggebod_fasad
# - light.forrad_fasad
# - light.tvattstugan_fasad
# - light.huvudentre2
#
# SÄKERHET:
# - Mode: restart – förhindrar överlapp
# - Tillgänglighetskontroller per armatur
# - Mjuka övergångar (1s)
#######################################################

  fasadbelysning_off:
    alias: Fasadbelysning släckt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.forrad_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.tvattstugan_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.huvudentre2
          transition: 1

  fasadbelysning_on:
    alias: Fasadbelysning tänt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 50
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 50
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 75
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1

  fasadbelysning_night:
    alias: Fasadbelysning natt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 40
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 60
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 50
          transition: 1

  fasadbelysning_max:
    alias: Fasadbelysning max
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1

#######################################################
#                                                     #
#                 UTEBELYSNING SCRIPTS                #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Styr spa-lampor, friggebod-fönster och utebelysning.
#
# HÅRDVARA:
# - light.spabad_v / _m / _h
# - switch.friggebod_fonster
# - light.friggebod_ute_2
#
# SÄKERHET:
# - Mode: restart – avbryter tidigare körning vid ny trigger
# - Tillgänglighetskontroll per enhet
# - Mjuka övergångar (2s) på ljus
#######################################################

  #######################
  ### Spabelysning on ###
  #######################
  spa_light_on:
    alias: Spabelysning on
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.spabad_v') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_v
          brightness_pct: 40
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_m') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_m
          brightness_pct: 40
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_h') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_h
          brightness_pct: 40
          transition: 2

  ##############################
  ### Friggebod belysning on ###
  ##############################
  friggebod_light_on:
    alias: Friggebod belysning on
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('switch.friggebod_fonster') != 'unavailable' }}"
      - service: switch.turn_on
        entity_id: switch.friggebod_fonster

  ########################
  ### Utebelysning off ###
  ########################
  outside_light_off:
    alias: Utebelysning off
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('switch.friggebod_fonster') != 'unavailable' }}"
      - service: switch.turn_off
        data:
          entity_id: switch.friggebod_fonster
      - condition: template
        value_template: "{{ states('light.spabad_v') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_v
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_m') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_m
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_h') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_h
          transition: 2
      - condition: template
        value_template: "{{ states('light.friggebod_ute_2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_ute_2
          transition: 2
