####################################################
#                                                  #
#          FASADBELYSNING PACKAGE                  #
#                                                  #
####################################################
#
# BESKRIVNING:
# Samlar all logik för fasadbelysning i ett paket:
# - input_select.facade_lights (läge/scen)
# - resolver som synkar input_select via script.facade_set_correct_mode
# - state machine som exekverar rätt ljusskript
# - scripts för faktisk ljuskontroll
#
# Källor:
# - Tidigare: packages/lights/exterior.yaml
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  facade_lights:
    name: Fasad
    # Facade and exterior accent lighting control
    # Modes: Släckt, Morgon/Kväll, Natt, Person upptäckt
    # Used by: Exterior lighting automation and evening/night scenes
    options:
      - Släckt
      - Morgon/Kväll
      - Natt
      - Person upptäckt
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  lights_auto_fasad:
    name: Auto Fasad
    icon: mdi:home-outline
    initial: on

##################
### Automation ###
##################
automation:

####################################################
#                                                  #
#            FACADE LIGHT AUTOMATIONS              #
#                                                  #
####################################################
#
# Manages exterior facade lighting based on:
# - Ambient light levels (lux sensors)
# - Home occupancy status
# - Person detection from cameras
#
# Light States:
# - Släckt: Off (lux > 60)
# - Morgon/Kväll: On (lux < 40, home active)
# - Natt: Night mode (home away)
# - Person upptäckt: Maximum brightness (person detected)

  #######################################################
  #                                                     #
  #     FACADE LEGACY OPTION MIGRATION (INTERNAL)     #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # Migrerar gamla option-namn till nya namn automatiskt.
  # (Migrated från automations/facade_lights_migration.yaml)
  #
  # TRIGGRAR:
  # - HA start (säkerhetskontroll vid omstart)
  # - input_select.facade_lights state changes (catches manual sets)
  #
  # LOGIK:
  # - Om state = 'Tänd' → convert to 'Morgon/Kväll' (ny standard)
  # - Om state = 'Normal' → convert to 'Morgon/Kväll' (ny standard)
  # - WHY: Säkerställer att gamla konfigurationer inte bryter UI
  #
  # SÄKERHET:
  # - Endast intern migrering, inte synlig för slutanvändare
  # - Mode: single (förhindrar race conditions)
  #######################################################
  - alias: Facade Light option migration
    id: 'facade_lights_option_migration'
    mode: single

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_fasad
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_select.facade_lights
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: 'Tänd'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: Morgon/Kväll
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: 'Normal'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: Morgon/Kväll
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: 'Max'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: Person upptäckt
        default: []

  ####################################
  ### Fasadbelysning resolver (single)
  ####################################
  - alias: Fasadbelysning resolver
    id: '1735604100098'
    description: >
      Resolver som synkar input_select.facade_lights via script.facade_set_correct_mode
      (en källa till sanning för beslutslogiken).
    mode: restart

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_fasad
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        above: input_number.ljusstyrka_60
        for: "00:02:00"
        id: bright_2m

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        below: input_number.ljusstyrka_40
        for: "00:02:00"
        id: dark_2m

      - platform: state
        entity_id: input_select.home_status

      - platform: state
        entity_id:
          - binary_sensor.cam3_person_occupancy
          - binary_sensor.cam7_person_occupancy
          - binary_sensor.cam8_person_occupancy
          - binary_sensor.cam9_person_occupancy
        to: 'on'
        id: person_on

      - platform: state
        entity_id:
          - binary_sensor.cam3_person_occupancy
          - binary_sensor.cam7_person_occupancy
          - binary_sensor.cam8_person_occupancy
          - binary_sensor.cam9_person_occupancy
        to: 'off'
        for: "00:00:30"
        id: person_off_30s

    action:
      - service: script.facade_set_correct_mode
#
# Related Entities:
# - sensor.ljusstyrka
# - input_select.facade_lights
# - input_select.home_status
# - binary_sensor.cam3/7/8_person_occupancy
# - script.fasadbelysning_*
####################################################


  ####################################################
  #          EXECUTE SCRIPT ON STATE CHANGE          #
  ####################################################
  - alias: Facade Light changed
    id: '6820471947308'
    mode: single
    trigger:
      platform: state
      entity_id: input_select.facade_lights
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Släckt"
            sequence:
              - service: script.fasadbelysning_off
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Morgon/Kväll"
            sequence:
              - service: script.fasadbelysning_on
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Natt"
            sequence:
              - service: script.fasadbelysning_night
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Person upptäckt"
            sequence:
              - service: script.fasadbelysning_max

##############
### Script ###
##############
script:

  facade_set_correct_mode:
    alias: Återställ fasadbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          lux: "{{ states('sensor.ljusstyrka') | float(none) }}"
          lux_40: "{{ states('input_number.ljusstyrka_40') | float(40) }}"
          lux_60: "{{ states('input_number.ljusstyrka_60') | float(60) }}"

          person_cam3: "{{ is_state('binary_sensor.cam3_person_occupancy', 'on') }}"
          person_cam7: "{{ is_state('binary_sensor.cam7_person_occupancy', 'on') }}"
          person_cam8: "{{ is_state('binary_sensor.cam8_person_occupancy', 'on') }}"
          person_cam9: "{{ is_state('binary_sensor.cam9_person_occupancy', 'on') }}"
          person_any: "{{ person_cam3 or person_cam7 or person_cam8 or person_cam9 }}"

          current_option: "{{ states('input_select.facade_lights') }}"
          is_bright: "{{ lux is number and lux > lux_60 }}"
          is_dark: "{{ lux is number and lux < lux_40 }}"
          is_not_too_bright: "{{ lux is number and lux < lux_60 }}"

          valid_options:
            - Släckt
            - Morgon/Kväll
            - Natt
            - Person upptäckt

          desired_option: >-
            {% if is_bright %}
              Släckt
            {% elif person_any and is_not_too_bright %}
              Person upptäckt
            {% elif home_status == 'Sover' and is_not_too_bright %}
              Natt
            {% elif is_dark %}
              Morgon/Kväll
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#             FASADBELYSNING SCRIPTS                  #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Scenarier för fasadbelysning (släckt, morgon/kväll, natt, person upptäckt).
#
# HÅRDVARA:
# - light.friggebod_fasad
# - light.forrad_fasad
# - light.tvattstugan_fasad
# - light.huvudentre2
#
# SÄKERHET:
# - Mode: restart – förhindrar överlapp
# - Tillgänglighetskontroller per armatur
# - Mjuka övergångar (1s)
#######################################################

  fasadbelysning_off:
    alias: Fasadbelysning släckt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.forrad_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.tvattstugan_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.huvudentre2
          transition: 1

  fasadbelysning_on:
    alias: Fasadbelysning tänd
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 60
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 60
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 80
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1

  fasadbelysning_night:
    alias: Fasadbelysning natt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 45
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 65
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.huvudentre2
          transition: 1

  fasadbelysning_max:
    alias: Fasadbelysning max
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1
