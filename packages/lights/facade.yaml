####################################################
#                                                  #
#          FASADBELYSNING PACKAGE                  #
#                                                  #
####################################################
# METADATA:
# Skapad: 2025-12-29
# Senast ändrad: 2025-12-29
# Version: 1.0
#
# BESKRIVNING:
# Samlar all logik för fasadbelysning i ett paket:
# - input_select.facade_lights (Släckt/Morgon\/Kväll/Natt/Person upptäckt)
# - automationer för lux, hemstatus och persondetektering
# - scripts för faktisk ljuskontroll
#
# Källor:
# - Tidigare: packages/lights/exterior.yaml
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  facade_lights:
    name: Fasadbelysning
    # Facade and exterior accent lighting control
    # Modes: Släckt, Morgon/Kväll, Natt, Person upptäckt
    # Used by: Exterior lighting automation and evening/night scenes
    options:
      - Släckt
      - Morgon/Kväll
      - Natt
      - Person upptäckt
    icon: mdi:lightbulb

##################
### Automation ###
##################
automation:

####################################################
#                                                  #
#            FACADE LIGHT AUTOMATIONS              #
#                                                  #
####################################################
#
# Manages exterior facade lighting based on:
# - Ambient light levels (lux sensors)
# - Home occupancy status
# - Person detection from cameras
#
# Light States:
# - Släckt: Off (lux > 60)
# - Morgon/Kväll: On (lux < 40, home active)
# - Natt: Night mode (home away)
# - Person upptäckt: Maximum brightness (person detected)

  ####################################################
  #        MIGRATE LEGACY OPTION NAMES (SAFE)        #
  ####################################################
  - alias: Facade Light option migration
    id: 'facade_lights_option_migration'
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_select.facade_lights
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: 'Tänd'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: Morgon/Kväll
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: 'Normal'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: Morgon/Kväll
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: 'Max'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: Person upptäckt
        default: []
#
# Related Entities:
# - sensor.ljusstyrka
# - input_select.facade_lights
# - input_select.home_status
# - binary_sensor.cam3/7/8_person_occupancy
# - script.fasadbelysning_*
####################################################

  ####################################################
  #         LIGHT OFF WHEN BRIGHT OUTSIDE            #
  ####################################################
  - alias: Facade Light Off When Bright Outside
    id: '6820471947302'
    mode: single
    trigger:
      platform: numeric_state
      entity_id: sensor.ljusstyrka
      above: input_number.ljusstyrka_60
      for: "00:02:00"
    condition:
      condition: not
      conditions:
        - condition: state
          entity_id: input_select.facade_lights
          state: 'Släckt'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Släckt

  ####################################################
  #          LIGHT ON WHEN DARK OUTSIDE              #
  ####################################################
  - alias: Facade Light On When Dark Outside
    id: '6820471947303'
    mode: single
    trigger:
      platform: numeric_state
      entity_id: sensor.ljusstyrka
      below: input_number.ljusstyrka_40
      for: "00:02:00"
    condition:
      condition: not
      conditions:
        - condition: state
          entity_id: input_select.facade_lights
          state: 'Morgon/Kväll'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Morgon/Kväll

  ####################################################
  #              NIGHT MODE ACTIVATION               #
  ####################################################
  - alias: Facade Light Night Mode
    id: '6820471947304'
    mode: single
    trigger:
      platform: state
      entity_id: input_select.home_status
      to: "Sover"
    condition:
      condition: and
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: input_select.facade_lights
              state: 'Natt'
        - condition: numeric_state
          entity_id: sensor.ljusstyrka
          below: input_number.ljusstyrka_60
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Natt

  ####################################################
  #         MAX LIGHT WHEN PERSON DETECTED           #
  ####################################################
  - alias: Facade Light Max When Person Detected
    id: '6820471947305'
    mode: single
    trigger:
      platform: state
      entity_id:
        - binary_sensor.cam3_person_occupancy
        - binary_sensor.cam7_person_occupancy
        - binary_sensor.cam8_person_occupancy
      to: 'on'
    condition:
      condition: and
      conditions:
        - condition: or
          conditions:
            - condition: state
              entity_id: input_select.facade_lights
              state: 'Morgon/Kväll'
            - condition: state
              entity_id: input_select.facade_lights
              state: 'Natt'
        - condition: not
          conditions:
            - condition: state
              entity_id: input_select.facade_lights
              state: 'Person upptäckt'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Person upptäckt

  ####################################################
  #   RETURN TO MORNING/EVENING AFTER PERSON LEAVES  #
  ####################################################
  - alias: Facade Light On When No Person Detected
    id: '6820471947306'
    mode: restart
    trigger:
      platform: state
      entity_id:
        - binary_sensor.cam3_person_occupancy
        - binary_sensor.cam7_person_occupancy
        - binary_sensor.cam8_person_occupancy
      to: 'off'
      for: "00:00:30"
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_select.facade_lights
          state: 'Person upptäckt'
        - condition: state
          entity_id: binary_sensor.cam3_person_occupancy
          state: 'off'
        - condition: state
          entity_id: binary_sensor.cam7_person_occupancy
          state: 'off'
        - condition: state
          entity_id: binary_sensor.cam8_person_occupancy
          state: 'off'
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.home_status
                state: "Sover"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: Natt
        default:
          - service: input_select.select_option
            data:
              entity_id: input_select.facade_lights
              option: Morgon/Kväll

  ####################################################
  #         EXIT NIGHT MODE WHEN HOME ACTIVE         #
  ####################################################
  - alias: Facade Light from Night to On
    id: '6820471947307'
    mode: single
    trigger:
      platform: state
      entity_id: input_select.home_status
      to: "Hemma"
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_select.facade_lights
          state: 'Natt'
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: Morgon/Kväll

  ####################################################
  #          EXECUTE SCRIPT ON STATE CHANGE          #
  ####################################################
  - alias: Facade Light changed
    id: '6820471947308'
    mode: single
    trigger:
      platform: state
      entity_id: input_select.facade_lights
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Släckt"
            sequence:
              - service: script.fasadbelysning_off
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Morgon/Kväll"
            sequence:
              - service: script.fasadbelysning_on
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Natt"
            sequence:
              - service: script.fasadbelysning_night
          - conditions:
              - condition: state
                entity_id: input_select.facade_lights
                state: "Person upptäckt"
            sequence:
              - service: script.fasadbelysning_max

##############
### Script ###
##############
script:

  facade_set_correct_mode:
    alias: Återställ fasadbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          lux: "{{ states('sensor.ljusstyrka') | float(none) }}"
          lux_40: "{{ states('input_number.ljusstyrka_40') | float(40) }}"
          lux_60: "{{ states('input_number.ljusstyrka_60') | float(60) }}"

          person_cam3: "{{ is_state('binary_sensor.cam3_person_occupancy', 'on') }}"
          person_cam7: "{{ is_state('binary_sensor.cam7_person_occupancy', 'on') }}"
          person_cam8: "{{ is_state('binary_sensor.cam8_person_occupancy', 'on') }}"
          person_any: "{{ person_cam3 or person_cam7 or person_cam8 }}"

          current_option: "{{ states('input_select.facade_lights') }}"
          is_bright: "{{ lux is number and lux > lux_60 }}"
          is_dark: "{{ lux is number and lux < lux_40 }}"
          is_not_too_bright: "{{ lux is number and lux < lux_60 }}"

          desired_option: >-
            {% if is_bright %}
              Släckt
            {% elif person_any and is_not_too_bright %}
              Person upptäckt
            {% elif home_status == 'Sover' and is_not_too_bright %}
              Natt
            {% elif is_dark %}
              Morgon/Kväll
            {% else %}
              {{ current_option }}
            {% endif %}

      - service: input_select.select_option
        data:
          entity_id: input_select.facade_lights
          option: "{{ desired_option | trim }}"

#######################################################
#                                                     #
#             FASADBELYSNING SCRIPTS                  #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Scenarier för fasadbelysning (släckt, morgon/kväll, natt, person upptäckt).
#
# HÅRDVARA:
# - light.friggebod_fasad
# - light.forrad_fasad
# - light.tvattstugan_fasad
# - light.huvudentre2
#
# SÄKERHET:
# - Mode: restart – förhindrar överlapp
# - Tillgänglighetskontroller per armatur
# - Mjuka övergångar (1s)
#######################################################

  fasadbelysning_off:
    alias: Fasadbelysning släckt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.forrad_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.tvattstugan_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.huvudentre2
          transition: 1

  fasadbelysning_on:
    alias: Fasadbelysning tänd
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 50
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 50
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 75
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1

  fasadbelysning_night:
    alias: Fasadbelysning natt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 40
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 60
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 50
          transition: 1

  fasadbelysning_max:
    alias: Fasadbelysning max
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1
