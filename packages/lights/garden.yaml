####################################################
#                                                  #
#          TRÄDGÅRDSBELYSNING PACKAGE              #
#                                                  #
####################################################
# Samlar all trädgårdsbelysningslogik i ett paket:
# - Input select för tänd/släckt
# - Automations för ljus-, tid- och hemstatusstyrning
# - Scripts för faktisk switchkontroll
#
# Källor:
# - automations/light_garden.yaml
# - automations/input_select_light_garden.yaml
# - script/light_garden.yaml
# - helpers/input_selects.yaml (light_garden)
#
# Hårdvara/Entiteter:
# - Ljussensor: sensor.ljusstyrka
# - Trädgårdsswitch: switch.tradgard
# - Trädäck: switch.stickpropp_8
# - Friggebod fönster: switch.friggebod_fonster
# - Friggebod ute: light.friggebod_ute_2
# - Hemstatus: input_select.home_status
# - Hemspårning: group.track_for_home_devices
# - Innebelysning: light.kok_lilla_fonstret
# - input_select.light_garden (Släckt/Tänd)
#
# Säkerhet:
# - IDs och alias bibehållna för bakåtkompatibilitet
# - Mode single/restart enligt original

# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  light_garden: 
    name: Trädgård
    # Garden/patio lighting simple on/off
    # Controls deck lights and ground-level garden accent lights
    # Updated by: automation "Trädgårdsbelysning resolver" via script.garden_set_correct_mode (manual override allowed)
    options:
      - Släckt
      - Tänd
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  lights_auto_tradgard:
    name: Auto Trädgård
    icon: mdi:flower
    initial: on

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#            TRÄDGÅRDSBELYSNING AUTOMATION            #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Trädgårdsbelysning är uppbyggd i två lager:
# - Resolver: triggas av lux/hemstatus/hemspårning och anropar script.garden_set_correct_mode
# - State machine: input_select.light_garden ändringar exekverar rätt script
#
# Beslutslogik (Tänd/Släckt) ligger i script.garden_set_correct_mode som sätter
# input_select.light_garden vid behov.
#
# HÅRDVARA:
# - Ljussensor: sensor.ljusstyrka
# - Trädgårdsswitch: switch.tradgard
# - Hemstatus: input_select.home_status
# - Innebelysning: light.kok_lilla_fonstret
#
# TRIGGRAR:
# - Hemstatus ändras till 'Hemma'
# - Hemstatus ändras till 'Sover'
# - Ljusnivå under 40 lux (mörkt)
# - Ljusnivå över 60 lux (ljust)
#
#
# LOGIK:
# TÄND:
# - Morgon (05:00-12:00): När HEMMA och mörkt
# - Eftermiddag/kväll (12:00-05:00): När HEMMA och mörkt
# - Borta (12:00-05:00): När borta och mörkt (säkerhet)
#
# SLÄCK:
# - När det blir ljust (>60 lux)
# - Sover: Släck när hemstatus blir 'Sover'
#
# INTEGRATION:
# - Styrs via input_select.light_garden
# - Samordnas med innebelysning
#######################################################

  ######################################
  ### Trädgårdsbelysning resolver (single)
  ######################################
  - alias: Trädgårdsbelysning resolver
    id: '1735604100094'
    description: >
      Resolver som synkar input_select.light_garden via script.garden_set_correct_mode
      (en källa till sanning för beslutslogiken).
    mode: restart

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_tradgard
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id: input_select.home_status

      - platform: state
        entity_id: group.track_for_home_devices

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        below: input_number.ljusstyrka_40

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        above: input_number.ljusstyrka_60

    action:
      - service: script.garden_set_correct_mode

#######################################################
#                                                     #
#    TRÄDGÅRDSBELYSNING INPUT_SELECT AUTOMATION       #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 1.1
# Författare: Home Assistant Config
#
# BESKRIVNING:
# State machine automation för trädgårdsbelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande belysningsskript.
#
# HÅRDVARA/ENTITETER:
# - input_select.light_garden (Tänd/Släckt)
# - script.tradgards_belysning_on
# - script.tradgards_belysning_off
#
# TRIGGRAR:
# - input_select.light_garden -> 'Tänd'
# - input_select.light_garden -> 'Släckt'
#
# LOGIK:
# När input_select.light_garden ändras:
# - Tänd -> Anropar script.tradgards_belysning_on
# - Släckt -> Anropar script.tradgards_belysning_off
#
# INTEGRATION:
# - Kopplad till input_select.light_garden
# - Synkas av automation "Trädgårdsbelysning resolver" via script.garden_set_correct_mode
# - Scriptet hanterar faktisk ljuskontroll
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga automationer
# v1.1 (2025-12-27): Lade till omfattande dokumentation
#######################################################

  #######################################################
  #                                                     #
  #     TRÄDGÅRDSBELYSNING (INPUT_SELECT)                #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # State machine för trädgårdsbelysning.
  # När input_select.light_garden ändras körs rätt script.
  #######################################################

  - alias: Trädgårdsbelysning (input_select)
    id: '6989544174114'
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.light_garden
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_garden
                state: Tänd
            sequence:
              - service: script.tradgards_belysning_on
          - conditions:
              - condition: state
                entity_id: input_select.light_garden
                state: Släckt
            sequence:
              - service: script.tradgards_belysning_off
        default: []

##############
### Script ###
##############
script:

  garden_set_correct_mode:
    alias: Återställ trädgårdsbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          track_state: "{{ states('group.track_for_home_devices') }}"
          lux: "{{ states('sensor.ljusstyrka') | float(none) }}"
          lux_40: "{{ states('input_number.ljusstyrka_40') | float(40) }}"
          lux_60: "{{ states('input_number.ljusstyrka_60') | float(60) }}"
          current_option: "{{ states('input_select.light_garden') }}"

          is_time_05_12: "{{ 5 <= now().hour < 12 }}"
          is_time_12_05: "{{ now().hour >= 12 or now().hour < 5 }}"
          is_time_21_06: "{{ now().hour >= 21 or now().hour < 6 }}"

          is_dark: "{{ lux is number and lux < lux_40 }}"
          is_bright: "{{ lux is number and lux > lux_60 }}"

          valid_options:
            - Släckt
            - Tänd

          desired_option: >-
            {% if home_status == 'Sover' %}
              Släckt
            {% elif is_bright %}
              Släckt
            {% elif track_state == 'home' and is_time_21_06 %}
              Släckt
            {% elif is_dark and is_time_05_12 and home_status == 'Hemma' %}
              Tänd
            {% elif is_dark and is_time_12_05 and track_state == 'home' and home_status == 'Hemma' %}
              Tänd
            {% elif is_dark and is_time_12_05 and track_state == 'not_home' %}
              Tänd
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_garden
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#              TRÄDGÅRDSBELYSNING SCRIPTS             #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Tänder/släcker trädgårdsbelysning och trädäck (uterum).
#
# HÅRDVARA:
# - switch.tradgard
# - switch.stickpropp_8 (Trädäck uterum)
# - switch.friggebod_fonster
# - light.friggebod_ute_2
#
# SÄKERHET:
# - Mode: restart – förhindrar kö-race vid snabba anrop
# - Tillgänglighetskontroll på båda switchar
#######################################################

  ##############################
  ### Trädgårdsbelysning on ###
  ##############################
  tradgards_belysning_on:
    alias: Trädgårdsbelysning on
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('switch.tradgard') != 'unavailable' }}"
      - service: switch.turn_on
        entity_id: switch.tradgard
      - condition: template
        value_template: "{{ states('switch.stickpropp_8') != 'unavailable' }}"
      - service: switch.turn_on
        entity_id: switch.stickpropp_8
      - condition: template
        value_template: "{{ states('switch.friggebod_fonster') != 'unavailable' }}"
      - service: switch.turn_on
        entity_id: switch.friggebod_fonster
      - condition: template
        value_template: "{{ states('light.friggebod_ute_2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_ute_2
          transition: 2
 
  ###############################
  ### Trädgårdsbelysning off ###
  ###############################
  tradgards_belysning_off:
    alias: Trädgårdsbelysning off
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('switch.tradgard') != 'unavailable' }}"
      - service: switch.turn_off
        entity_id: switch.tradgard
      - condition: template
        value_template: "{{ states('switch.stickpropp_8') != 'unavailable' }}"
      - service: switch.turn_off
        entity_id: switch.stickpropp_8
      - condition: template
        value_template: "{{ states('switch.friggebod_fonster') != 'unavailable' }}"
      - service: switch.turn_off
        entity_id: switch.friggebod_fonster
      - condition: template
        value_template: "{{ states('light.friggebod_ute_2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_ute_2
          transition: 2
