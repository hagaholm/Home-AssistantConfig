####################################################
#                                                  #
#              HALLBELYSNING PACKAGE               #
#                                                  #
####################################################
# Samlar all hallbelysningslogik i ett paket:
# - Automations för automatisk släckning och fjärrkontroll
# - Scripts för olika ljusnivåer
#
# Källor:
# - automations/light_hall.yaml (migrated)
# - script/light_hall_roof.yaml (migrated)
# - automations/light_hall_auto_off.yaml (Hall släck belysning automation)
# - automations/light_hall_remote_control.yaml (Hall fjärrkontroll automation)
#
# Hårdvara/Entiteter:
# - Light: light.hall_tak
# - Switch: switch.fjarrkontroll_hall
# - input_select: input_select.light_hall
# - input_select: input_select.home_status
#
# Säkerhet:
# - IDs och alias bibehållna för bakåtkompatibilitet
# - Mode single enligt original
#
####################################################

#######################
### Input Select(s) ###
#######################
# Helpers moved to packages/lights/helpers/hall.yaml, scripts to packages/scripts/lights/hall.yaml (Fas 2)

automation:

  #######################################################
  #                                                     #
  #          HALLTAK RESOLVER (DECISION MAKER)        #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # Resolver automation som triggas av externa faktorer och bestämmer
  # önskad ljusnivå för halltak. Anropar script.hall_set_correct_mode
  # som uppdaterar input_select.light_hall om behövligt.
  #
  # TRIGGRAR:
  # - HA start (initiering av system)
  # - input_select.home_status ändras (hemstatus shift)
  # - light.hall_tak state changes (manuell override detection)
  #
  # SÄKERHET:
  # - Mode: restart (förhindrar överlappande körningar)
  # - Script gated på input_select state changes (undviker oändliga loopar)
  #######################################################
  - alias: Halltak resolver
    id: halltak_resolver
    description: >
      Resolver som synkar input_select.light_hall via script.hall_set_correct_mode
      (en källa till sanning för vald nivå).
    mode: restart

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_halltak
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id: input_select.home_status

      - platform: state
        entity_id: light.hall_tak

    action:
      - service: script.hall_set_correct_mode

  #######################################################
  #                                                     #
  #     HALLTAKBELYSNING (INPUT_SELECT)                #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # State machine för halltak. När input_select.light_hall ändras
  # körs motsvarande script för vald ljusnivå.
  #######################################################

  - alias: Halltakbelysning (input_select)
    id: '1735304100030'
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.light_hall
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_hall
                state: Släckt
            sequence:
              - service: script.hall_taklampor_off

          - conditions:
              - condition: state
                entity_id: input_select.light_hall
                state: 1%
            sequence:
              - service: script.hall_taklampor_1_procent

          - conditions:
              - condition: state
                entity_id: input_select.light_hall
                state: 10%
            sequence:
              - service: script.hall_taklampor_10_procent

          - conditions:
              - condition: state
                entity_id: input_select.light_hall
                state: 50%
            sequence:
              - service: script.hall_taklampor_50_procent

          - conditions:
              - condition: state
                entity_id: input_select.light_hall
                state: 100%
            sequence:
              - service: script.hall_taklampor_100_procent
        default: []

#######################################################
#                                                     #
#          HALL LIGHT AUTOMATION                     #
#                                                     #
#######################################################
#
#
# BESKRIVNING:
# Automationer för hallbelysning — automatisk släckning och
# fjärrkontroll. Synkar med hemstatus.
# Möjliggör manuell styrning via fjärrkontroll.
#
# HÅRDVARA/ENTITETER:
# - Light: light.hall_tak
# - Switch: switch.fjarrkontroll_hall
# - input_select: input_select.light_hall
# - input_select: input_select.home_status
# - Scripts: script.hall_taklampor_off, script.hall_taklampor_1_procent,
#            script.hall_taklampor_100_procent
#
# AUTOMATIONER:
# 1. Hall släck belysning:
#    - Trigger: input_select.home_status state change
#    - Condition: != 'Hemma'
#    - Action: Kör script.hall_set_correct_mode (som sätter input_select.light_hall vid behov)
#
# 2. Hall fjärrkontroll:
#    - Trigger: switch.fjarrkontroll_hall (on/off)
#    - on -> 100% (script.hall_taklampor_100_procent)
#    - off -> Släckt (script.hall_taklampor_off)
#
# LOGIK:
# SLÄCK BELYSNING:
# - Automatiskt släcker när hemstatus inte är 'Hemma'
#
# FJÄRRKONTROLL:
# - Enkel on/off kontroll
# - 'on' -> 100% ljusstyrka
# - 'off' -> Släcker helt
#
# SÄKERHET:
# - Template validation i släckautomation
# - Choose block med default för fjärrkontroll
# - Mode: single förhindrar överlappande körningar
#
# INTEGRATION:
# - Integreras med input_select.home_status (global hemstatus)
# - Använder scripts för ljusstyrning
# - Fjärrkontroll ger manuell överstyrning
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga automationer
# v1.1 (2025-12-27): Lade till omfattande dokumentation
#######################################################

  - alias: "Hall släck belysning"
    description: "Kör script.hall_taklampor_off om light.hall_tak är på och (input_select.home_status != Hemma)"
    id: hall_slack_belysning
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.home_status
    condition:
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ states('input_select.home_status') != 'Hemma' }}"
    action:
      - service: script.hall_set_correct_mode

  # Hall fjärrkontroll — enkel logik:
  # - Om `switch.fjarrkontroll_hall` blir 'on' -> kör `script.hall_taklampor_100_procent` (sätt 100%)
  # - Om `switch.fjarrkontroll_hall` blir 'off' -> kör `script.hall_taklampor_off` (släck)
  - alias: Hall fjärrkontroll
    id: 'hall_remote_light_control'
    description: >
      Enkel styrning av halltaklampor via switch.fjarrkontroll_hall:
      - 'on' -> 100%
      - 'off' -> Släckt
    mode: single
    trigger:
      - platform: state
        entity_id: switch.fjarrkontroll_hall
        to: 'on'
      - platform: state
        entity_id: switch.fjarrkontroll_hall
        to: 'off'
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'on' }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_hall
                  option: 100%
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'off' }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_hall
                  option: Släckt
        default: []

