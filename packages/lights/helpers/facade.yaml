# Helpers/entities for facade lighting - split out of packages/lights/facade.yaml (Fas 2)
# Full documentation: packages/lights/facade.yaml

input_select:
  facade_lights:
    name: Fasad
    # Facade and exterior accent lighting control
    # Modes: Släckt, Morgon/Kväll, Natt, Person upptäckt
    # Used by: Exterior lighting automation and evening/night scenes
    options:
      - Släckt
      - Morgon/Kväll
      - Natt
      - Person upptäckt
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  lights_auto_fasad:
    name: Auto Fasad
    icon: mdi:home-outline
    initial: on

