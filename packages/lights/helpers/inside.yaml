# Helpers/entities for inside lighting - split out of packages/lights/inside.yaml (Fas 2)
# Full documentation: packages/lights/inside.yaml

input_select:
  light_inside:
    name: Inne
    # Lighting mode for interior lights (living room, kitchen, bedrooms)
    # Options represent different lighting scenes for various times of day
    # Updated by: sensor.light_inside_desired_option via automation "Innebelysning resolver"
    # Used by: light_morning, light_day, light_evening, light_night scripts
    options:
      - Släckt
      - Morgonbelysning
      - Förmiddagsbelysning
      - Dagbelysning
      - Kvällsbelysning
      - Nattbelysning
      - Bortabelysning
      - Arbetsbelysning
      - Fönsterbelysning
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  lights_auto_inne:
    name: Auto Inne
    icon: mdi:home-lightbulb
    initial: on

  tv_light_mode:
    name: TV-ljusläge
    icon: mdi:television-ambient-light

  inside_pause_day_window_transition:
    name: Inne pausa dag/fönster (09:00)
    icon: mdi:pause-circle
    initial: off

##################
### Automation ###
##################
template:
  - sensor:
      - name: light_inside_desired_option
        unique_id: light_inside_desired_option
        state: >-
          {% set home_status = states('input_select.home_status') %}
          {% set home_status_changed = states.input_select.home_status.last_changed %}
          {% set seconds_since_home_status_changed = (as_timestamp(now()) - as_timestamp(home_status_changed)) | int(0) %}
          {% set borta_long_enough = seconds_since_home_status_changed >= 60 %}

          {% set pause_day_window_transition = is_state('input_boolean.inside_pause_day_window_transition', 'on') %}
          {% set current_option = states('input_select.light_inside') %}

          {% set is_time_05_09 = 5 <= now().hour < 9 %}
          {# Crosses midnight: 09:00 -> 05:00 #}
          {% set is_time_09_05 = (now().hour >= 9) or (now().hour < 5) %}
          {% set is_time_08_22 = 8 <= now().hour < 22 %}

          {% set morning_on = is_state('input_boolean.morning_light_on', 'on') %}
          {% set daylight_on = is_state('input_boolean.daylight_on', 'on') %}
          {% set awaylight_on = is_state('input_boolean.awaylight_on', 'on') %}
          {% set christmas_on = is_state('input_boolean.christmas_light', 'on') %}
          {% set kitchen_motion = is_state('binary_sensor.kok_narvaro', 'on') %}

          {% if home_status == 'Borta' and awaylight_on and is_time_08_22 and borta_long_enough %}
            Bortabelysning
          {% elif home_status == 'Sover' %}
            {% if kitchen_motion and daylight_on %}
              Nattbelysning
            {% else %}
              Släckt
            {% endif %}
          {% elif home_status == 'Hemma' and morning_on and is_time_05_09 %}
            Morgonbelysning
          {% elif pause_day_window_transition and home_status == 'Hemma' and is_time_09_05 and daylight_on %}
            {{ current_option | trim }}
          {% elif home_status == 'Hemma' and daylight_on and is_time_09_05 %}
            Dagbelysning
          {% elif home_status == 'Hemma' and christmas_on and is_time_09_05 %}
            Fönsterbelysning
          {% else %}
            Släckt
          {% endif %}

##############
### Script ###
##############
