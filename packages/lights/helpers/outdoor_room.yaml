# Helpers/entities for outdoor_room lighting - split out of packages/lights/outdoor_room.yaml (Fas 2)
# Full documentation: packages/lights/outdoor_room.yaml

input_select:
  light_uterum:
    name: Uterum
    # Conservatory/sunroom simple on/off control
    # Släckt: all lights off; Fönsterbelysning: window light only;
    # Tänd: window light and both other conservatory lights on
    # Used by: Garden room automation sequences
    options:
      - Släckt
      - Fönsterbelysning
      - Tänd
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  lights_auto_uterum:
    name: Auto Uterum
    icon: mdi:greenhouse
    initial: on

