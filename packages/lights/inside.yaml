        data:
          entity_id: light.hall_skap
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_skank
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_vagn
          transition: 2

      # Tvänd Louise rum fokus
      - service: light.turn_on
        data:
          entity_id: light.louise_fonster
          brightness_pct: 80
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.louise_golvlampa
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_vitrinskap2
          transition: 2

      # Tellstick
      - service: light.turn_on
        data:
          entity_id: light.kok_lilla_fonstret
          transition: 2

      # Tellstick Julbelysning
      - service: light.turn_on
        data:
          entity_id: light.kok_stora_fonstret_ljusstake
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster_ljusstake_2
          brightness_pct: 100
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_gran
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.uterum_julstjarnor
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.andreas_fonster
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.sovrum_sangbord
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.hall_jullampa
          transition: 2

