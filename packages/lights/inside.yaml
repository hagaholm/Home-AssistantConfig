####################################################
#                                                  #
#            INNEBELYSNING (INSIDE) PACKAGE        #
#                                                  #
####################################################
# Samlar all innebelysningslogik i ett paket:
# - input_select.light_inside (läge/scener)
# - automationer för att sätta state över dygnet
# - state machine som anropar rätt script
# - scripts för de faktiska ljusscenerna
#
# Källor:
# - automations/input_select_light_inside.yaml
# - automations/light_inside_morning.yaml
# - automations/light_inside_day.yaml
# - automations/light_inside_evening.yaml (saknas som separat automation)
# - automations/light_inside_night.yaml
# - automations/light_inside_away.yaml
# - script/light_morning.yaml
# - script/light_day.yaml
# - script/light_evening.yaml
# - script/light_night.yaml
# - script/light_away.yaml
# - script/light_window.yaml
# - script/light_cleaning.yaml
# - script/light_dimmer.yaml
# - script/light_button.yaml
# - script/light_off_room.yaml
# - script/light_goodnight.yaml
# - packages/helpers/input_selects.yaml (light_inside)
#
# Noteringar / fixar under flytten:
# - input_select_light_inside pekade på script.christmas_lights_on (fanns inte).
#   Det är nu korrigerat till script.window_lights_on (från light_window.yaml).
# - light_goodnight.yaml refererade till script.daylights_*_off (fanns inte).
#   Det är nu korrigerat till script.inside_lights_off (från light_day.yaml).

# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  light_inside:
    name: Innebelysning
    # Lighting mode for interior lights (living room, kitchen, bedrooms)
    # Options represent different lighting scenes for various times of day
    # Updated by: Automations (time-based, occupancy, mode changes)
    # Used by: light_morning, light_day, light_evening, light_night scripts
    options:
      - Släckt
      - Morgonbelysning
      - Förmiddagsbelysning
      - Dagbelysning
      - Kvällsbelysning
      - Nattbelysning
      - Bortabelysning
      - Arbetsbelysning
      - Fönsterbelysning
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  tv_light_mode:
    name: TV-ljusläge
    icon: mdi:television-ambient-light

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#        INNEBELYSNING INPUT_SELECT AUTOMATION        #
#                                                     #
#######################################################
#
# BESKRIVNING:
# State machine automation för innebelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande belysningsskript.
#
# HÅRDVARA:
# - Styrs via: input_select.light_inside
# - Exekveras av: script.*_lights_on
#
# TILLSTÅND (input_select.light_inside):
# - Släckt: Släcker allt inne
# - Morgonbelysning: Mjukt morgonljus (ca 05:00-09:00)
# - Förmiddagsbelysning: Övergång till dagläge
# - Dagbelysning: Normalt dagsljus
# - Kvällsbelysning: Dämpat kvällsljus
# - Nattbelysning: Minimalt nattljus (vid rörelse)
# - Bortabelysning: Simulerar närvaro när borta
# - Arbetsbelysning: Praktiskt/klart ljus (mappas till städbelysning)
# - Fönsterbelysning: Fönster/julbelysning
#
# LOGIK:
# När input_select.light_inside ändras:
# - Identifiera nytt tillstånd
# - Anropa motsvarande script
# - Scriptet hanterar faktisk ljuskontroll för alla rum
#
# INTEGRATION:
# - Decision-automationer sätter input_select.light_inside (dygn/hemstatus/lux/närvaro)
# - Denna automation är exekveraren (state machine) och anropar scripts
# - Scriptlagret sköter faktisk device-kontroll per rum/grupp
#######################################################

  - alias: Innebelysning
    id: '1735304100020'
    mode: single

    trigger:
      - platform: state
        entity_id: input_select.light_inside

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Släckt
            sequence:
              - service: script.inside_lights_off

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Morgonbelysning
            sequence:
              - service: script.morning_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Förmiddagsbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Dagbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Kvällsbelysning
            sequence:
              - service: script.eveninglights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Nattbelysning
            sequence:
              - service: script.night_light

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Bortabelysning
            sequence:
              - service: script.away_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Fönsterbelysning
            sequence:
              - service: script.window_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Arbetsbelysning
            sequence:
              - service: script.cleaning_lights_on

  ################################
  ### TV-ljusläge (manuell UI) ###
  ################################
  - alias: TV-ljusläge
    id: '1735604100090'
    mode: restart

    trigger:
      - platform: state
        entity_id: input_boolean.tv_light_mode

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.tv_light_mode
                state: 'on'
            sequence:
              - service: script.tv_light_look_at_tv

          - conditions:
              - condition: state
                entity_id: input_boolean.tv_light_mode
                state: 'off'
            sequence:
              - service: script.inside_apply_current_scene

  - alias: Morgonbelysning styrning
    id: '1735304100010'
    mode: queued

    trigger:
      # Tänd när HEMMA
      - platform: state
        entity_id: input_select.home_status
        to: 'Hemma'
        id: turn_on

      # Släck när ljust
      - platform: state
        entity_id: input_boolean.morning_light_on
        to: "off"
        id: turn_off

      # Släck när borta
      - platform: state
        entity_id: input_select.home_status
        to: 'Borta'
        id: turn_off

    action:
      - choose:
          # TÄND MORGONBELYSNING
          - alias: Tänd morgonbelysning
            conditions:
              - condition: trigger
                id: turn_on
              - condition: state
                entity_id: input_boolean.morning_light_on
                state: 'on'
              - condition: time
                after: '05:00:00'
                before: '09:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Morgonbelysning

          # SLÄCK MORGONBELYSNING
          - alias: Släck morgonbelysning
            conditions:
              - condition: trigger
                id: turn_off
              - condition: time
                after: '05:00:00'
                before: '09:00:00'
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_select.light_inside
                    state: 'Morgonbelysning'
                  - condition: state
                    entity_id: input_select.light_inside
                    state: 'Dagbelysning'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Släckt

#######################################################
#                                                     #
#         DAY LIGHTING AUTOMATION                     #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 2.0
# Författare: Home Assistant Config
#
# BESKRIVNING:
# Samlad automation för dagbelysning.
# Tänder/släcker ljus baserat på tid, ljusnivå och närvaro.
# Hanterar övergång från morgon till dag och dag till kväll.
#
# HÅRDVARA/ENTITETER:
# - input_select.home_status
# - input_select.light_inside
# - input_boolean.daylight_on
# - input_boolean.christmas_light
# - light.sovrum_fonster
# - light.sovrum_sangbord
#
# TRIGGRAR:
# - Tänd morgon: time='09:00:00'
# - Tänd mörkt: daylight_on -> 'on'
# - Tänd hemma: home_status -> 'Hemma'
# - Tänd sovrumsfönster: light.sovrum_fonster -> 'on'
# - Släck ljust: daylight_on -> 'off'
# - Släck borta: home_status -> 'Borta'
# - Övergång kväll: light.sovrum_fonster -> 'unavailable'
#
# VILLKOR:
# - Tänd: daylight_on='on' OCH home_status='Hemma' OCH 09:00-05:00
# - Släck: Olika beroende på trigger
#######################################################

  - alias: Dagbelysning styrning
    id: '1735304100011'
    mode: queued

    trigger:
      # Tänd morgon kl 09:00
      - platform: time
        at: '09:00:00'
        id: turn_on_morning

      # Tänd när mörkt
      - platform: state
        entity_id: input_boolean.daylight_on
        to: "on"
        id: turn_on_dark

      # Tänd när Hemma
      - platform: state
        entity_id: input_select.home_status
        to: 'Hemma'
        id: turn_on_home

      # Tänd vid sovrumsfönster on (morgon->dag övergång)
      - platform: state
        entity_id: light.sovrum_fonster
        to: 'on'
        id: turn_on_bedroom_window

      # Släck när ljust
      - platform: state
        entity_id: input_boolean.daylight_on
        to: "off"
        id: turn_off_light

      # Släck när borta
      - platform: state
        entity_id: input_select.home_status
        to: 'Borta'
        id: turn_off_away

      # Övergång till kvällsbelysning
      - platform: state
        entity_id: light.sovrum_fonster
        to: 'unavailable'
        id: transition_evening

    action:
      - choose:
          # TÄND MORGON (09:00)
          - alias: Tänd dagbelysning morgon
            conditions:
              - condition: trigger
                id: turn_on_morning
              - condition: state
                entity_id: input_boolean.daylight_on
                state: "on"
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Dagbelysning

          # TÄND NÄR MÖRKT
          - alias: Tänd dagbelysning när mörkt
            conditions:
              - condition: trigger
                id: turn_on_dark
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma'
              - condition: time
                after: '09:00:00'
                before: '05:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Dagbelysning

          # TÄND NÄR HEMMA
          - alias: Tänd dagbelysning när hemma
            conditions:
              - condition: trigger
                id: turn_on_home
              - condition: state
                entity_id: input_boolean.daylight_on
                state: 'on'
              - condition: time
                after: '09:00:00'
                before: '05:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Dagbelysning

          # TÄND VID SOVRUMSFÖNSTER (MORGON->DAG)
          - alias: Tänd dagbelysning vid sovrumsfönster
            conditions:
              - condition: trigger
                id: turn_on_bedroom_window
              - condition: state
                entity_id: input_select.light_inside
                state: 'Morgonbelysning'
              - condition: time
                after: '05:00:00'
                before: '09:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Dagbelysning

          # SLÄCK NÄR LJUST
          - alias: Släck dagbelysning när ljust
            conditions:
              - condition: trigger
                id: turn_off_light
              - condition: state
                entity_id: input_select.home_status
                state: 'Hemma'
              - condition: time
                after: '09:00:00'
                before: '05:00:00'
            sequence:
              - choose:
                  - conditions: "{{ is_state('input_boolean.christmas_light', 'on') }}"
                    sequence:
                      - service: input_select.select_option
                        entity_id: input_select.light_inside
                        data:
                          option: Fönsterbelysning
                default:
                  - service: input_select.select_option
                    entity_id: input_select.light_inside
                    data:
                      option: Släckt

          # SLÄCK NÄR BORTA
          - alias: Släck dagbelysning när borta
            conditions:
              - condition: trigger
                id: turn_off_away
              - condition: time
                after: '09:00:00'
                before: '05:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Släckt

          # ÖVERGÅNG TILL KVÄLLSBELYSNING
          - alias: Övergång dag till kvällsbelysning
            conditions:
              - condition: trigger
                id: transition_evening
              - condition: state
                entity_id: light.sovrum_sangbord
                state: 'on'
              - condition: time
                after: '21:00:00'
                before: '23:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Kvällsbelysning
                  transition: 2

#######################################################
#                                                     #
#        NIGHT LIGHTING AUTOMATION                    #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 2.0
# Författare: Home Assistant Config
#
# BESKRIVNING:
# Samlad automation för nattbelysning.
# Tänder/släcker ljus baserat på rörelse i kök
# när status är 'Sover' och dagsljus är på.
#######################################################

  - alias: Nattbelysning styrning
    id: '1735304100012'
    mode: single

    trigger:
      # Tänd vid rörelse
      - platform: state
        entity_id: binary_sensor.kok_narvaro
        to: 'on'
        id: motion_on

      # Släck när rörelse upphör
      - platform: state
        entity_id: binary_sensor.kok_narvaro
        to: 'off'
        id: motion_off

    action:
      - choose:
          # TÄND NATTBELYSNING
          - alias: Tänd nattbelysning vid rörelse
            conditions:
              - condition: trigger
                id: motion_on
              - condition: state
                entity_id: input_select.home_status
                state: 'Sover'
              - condition: state
                entity_id: input_boolean.daylight_on
                state: 'on'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Nattbelysning

          # SLÄCK NATTBELYSNING
          - alias: Släck nattbelysning efter rörelse
            conditions:
              - condition: trigger
                id: motion_off
              - condition: state
                entity_id: input_select.home_status
                state: 'Sover'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Släckt

#######################################################
#                                                     #
#        AWAY LIGHTING AUTOMATION                     #
#                                                     #
#######################################################
#
# METADATA:
# Skapad: [ursprungligt datum]
# Senast ändrad: 2025-12-27
# Version: 2.0
# Författare: Home Assistant Config
#
# BESKRIVNING:
# Samlad automation för bortabelysning.
# Tänder/släcker ljus när ingen är hemma för säkerhet.
# Simulerar närvaro genom att tända lampor under dagen.
#######################################################

  - alias: Bortabelysning styrning
    id: '1735304100013'
    mode: queued

    trigger:
      # Tänd morgon kl 08:00
      - platform: time
        at: '08:00:00'
        id: turn_on_morning

      # Tänd när borta (1 min fördröjning)
      - platform: state
        entity_id: input_select.home_status
        to: 'Borta'
        for:
          minutes: 1
        id: turn_on_away

      # Tänd när mörkt
      - platform: state
        entity_id: input_boolean.awaylight_on
        to: "on"
        id: turn_on_dark

      # Släck när ljust
      - platform: state
        entity_id: input_boolean.awaylight_on
        to: "off"
        id: turn_off_light

      # Släck kväll kl 22:30
      - platform: time
        at: '22:30:00'
        id: turn_off_evening

    action:
      - choose:
          # TÄND MORGON (08:00)
          - alias: Tänd bortabelysning morgon
            conditions:
              - condition: trigger
                id: turn_on_morning
              - condition: state
                entity_id: input_boolean.awaylight_on
                state: 'on'
              - condition: state
                entity_id: input_select.home_status
                state: 'Borta'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Bortabelysning

          # TÄND NÄR BORTA
          - alias: Tänd bortabelysning när borta
            conditions:
              - condition: trigger
                id: turn_on_away
              - condition: state
                entity_id: input_boolean.awaylight_on
                state: 'on'
              - condition: time
                after: '08:00:00'
                before: '22:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Bortabelysning

          # TÄND NÄR MÖRKT
          - alias: Tänd bortabelysning när mörkt
            conditions:
              - condition: trigger
                id: turn_on_dark
              - condition: state
                entity_id: input_select.home_status
                state: 'Borta'
              - condition: time
                after: '08:00:00'
                before: '22:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Bortabelysning

          # SLÄCK NÄR LJUST
          - alias: Släck bortabelysning när ljust
            conditions:
              - condition: trigger
                id: turn_off_light
              - condition: state
                entity_id: input_select.home_status
                state: 'Borta'
              - condition: time
                after: '08:00:00'
                before: '22:00:00'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Släckt

          # SLÄCK KVÄLL (22:30)
          - alias: Släck bortabelysning kväll
            conditions:
              - condition: trigger
                id: turn_off_evening
              - condition: state
                entity_id: input_select.home_status
                state: 'Borta'
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: Släckt

##############
### Script ###
##############
script:

  inside_set_correct_mode:
    alias: Återställ innebelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          hour: "{{ now().hour }}"
          is_time_05_09: "{{ 5 <= now().hour < 9 }}"
          # Crosses midnight: 09:00 -> 05:00
          is_time_09_05: "{{ now().hour >= 9 or now().hour < 5 }}"
          is_time_08_22: "{{ 8 <= now().hour < 22 }}"

          morning_on: "{{ is_state('input_boolean.morning_light_on', 'on') }}"
          daylight_on: "{{ is_state('input_boolean.daylight_on', 'on') }}"
          awaylight_on: "{{ is_state('input_boolean.awaylight_on', 'on') }}"
          christmas_on: "{{ is_state('input_boolean.christmas_light', 'on') }}"
          kitchen_motion: "{{ is_state('binary_sensor.kok_narvaro', 'on') }}"

          # Deterministic priority (only one option wins):
          # 1) Borta -> Bortabelysning (if active)
          # 2) Sover -> Nattbelysning (if motion + dark), else Släckt
          # 3) Hemma -> Morgonbelysning (if morning window), else Dagbelysning (if dark window),
          #    else Fönsterbelysning (if jul), else Släckt
          desired_option: >-
            {% if home_status == 'Borta' and awaylight_on and is_time_08_22 %}
              Bortabelysning
            {% elif home_status == 'Sover' %}
              {% if kitchen_motion and daylight_on %}
                Nattbelysning
              {% else %}
                Släckt
              {% endif %}
            {% elif home_status == 'Hemma' and morning_on and is_time_05_09 %}
              Morgonbelysning
            {% elif home_status == 'Hemma' and daylight_on and is_time_09_05 %}
              Dagbelysning
            {% elif home_status == 'Hemma' and christmas_on and is_time_09_05 %}
              Fönsterbelysning
            {% else %}
              Släckt
            {% endif %}

      - service: input_select.select_option
        data:
          entity_id: input_select.light_inside
          option: "{{ desired_option | trim }}"

  inside_apply_current_scene:
    alias: Återställ innebelysning (utifrån nuvarande läge)
    mode: restart
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Släckt
            sequence:
              - service: script.inside_lights_off

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Morgonbelysning
            sequence:
              - service: script.morning_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Förmiddagsbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Dagbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Kvällsbelysning
            sequence:
              - service: script.eveninglights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Nattbelysning
            sequence:
              - service: script.night_light

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Bortabelysning
            sequence:
              - service: script.away_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Fönsterbelysning
            sequence:
              - service: script.window_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Arbetsbelysning
            sequence:
              - service: script.cleaning_lights_on

#######################################################
#                                                     #
#           MORGONBELYSNING SCRIPTS (05:00-09:00)     #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Mjukt morgonljus för att väcka på ett behagligt sätt.
# Stöder både vanligt läge och julmodus.
#######################################################

  morning_lights_on:
    alias: Morgonbelysning on
