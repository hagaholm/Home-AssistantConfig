####################################################
#                                                  #
#            INNEBELYSNING (INSIDE) PACKAGE        #
#                                                  #
####################################################
# Samlar all innebelysningslogik i ett paket:
# - input_select.light_inside (läge/scener)
# - beräkning av önskat läge (template-sensor)
# - resolver som synkar input_select mot önskat läge
# - state machine som anropar rätt script
# - scripts för de faktiska ljusscenerna
#
# Källor:
# - automations/input_select_light_inside.yaml
# - automations/light_inside_morning.yaml
# - automations/light_inside_day.yaml
# - automations/light_inside_evening.yaml (saknas som separat automation)
# - automations/light_inside_night.yaml
# - automations/light_inside_away.yaml
# - script/light_morning.yaml
# - script/light_day.yaml
# - script/light_evening.yaml
# - script/light_night.yaml
# - script/light_away.yaml
# - script/light_window.yaml
# - script/light_cleaning.yaml
# - script/light_dimmer.yaml
# - script/light_button.yaml
# - script/light_off_room.yaml
# - script/light_goodnight.yaml
# - packages/helpers/input_selects.yaml (light_inside)
#
# Noteringar / fixar under flytten:
# - input_select_light_inside pekade på script.christmas_lights_on (fanns inte).
#   Det är nu korrigerat till script.window_lights_on (från light_window.yaml).
# - light_goodnight.yaml refererade till script.daylights_*_off (fanns inte).
#   Det är nu korrigerat till script.inside_lights_off (från light_day.yaml).
####################################################

#######################
### Input Select(s) ###
#######################
# Helpers moved to packages/lights/helpers/inside.yaml, scripts to packages/scripts/lights/inside.yaml (Fas 2)

automation:

#######################################################
#                                                     #
#        INNEBELYSNING INPUT_SELECT AUTOMATION        #
#                                                     #
#######################################################
#
# BESKRIVNING:
# State machine automation för innebelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande belysningsskript.
#
# HÅRDVARA:
# - Styrs via: input_select.light_inside
# - Exekveras av: script.*_lights_on
#
# TILLSTÅND (input_select.light_inside):
# - Släckt: Släcker allt inne
# - Morgonbelysning: Mjukt morgonljus (ca 05:00-09:00)
# - Förmiddagsbelysning: Övergång till dagläge
# - Dagbelysning: Normalt dagsljus
# - Kvällsbelysning: Dämpat kvällsljus
# - Nattbelysning: Minimalt nattljus (vid rörelse)
# - Bortabelysning: Simulerar närvaro när borta
# - Arbetsbelysning: Praktiskt/klart ljus (mappas till städbelysning)
# - Fönsterbelysning: Fönster/julbelysning
#
# LOGIK:
# När input_select.light_inside ändras:
# - Identifiera nytt tillstånd
# - Anropa motsvarande script
# - Scriptet hanterar faktisk ljuskontroll för alla rum
#
# INTEGRATION:
# - sensor.light_inside_desired_option beräknar önskat läge (single source of truth)
# - automation "Innebelysning resolver" synkar input_select.light_inside via script.inside_set_correct_mode
# - Denna automation är exekveraren (state machine) och anropar scripts
# - Scriptlagret sköter faktisk device-kontroll per rum/grupp
#######################################################

  - alias: Innebelysning
    id: '1735304100020'
    mode: single

    trigger:
      - platform: state
        entity_id: input_select.light_inside

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Släckt
            sequence:
              - service: script.inside_lights_off

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Morgonbelysning
            sequence:
              - service: script.morning_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Förmiddagsbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Dagbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Kvällsbelysning
            sequence:
              - service: script.eveninglights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Nattbelysning
            sequence:
              - service: script.night_light

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Bortabelysning
            sequence:
              - service: script.away_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Fönsterbelysning
            sequence:
              - service: script.window_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Arbetsbelysning
            sequence:
              - service: script.cleaning_lights_on

  ################################
  ### TV-ljusläge (manuell UI) ###
  ################################
  - alias: TV-ljusläge
    id: '1735604100090'
    mode: restart

    trigger:
      - platform: state
        entity_id: input_boolean.tv_light_mode

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.tv_light_mode
                state: 'on'
            sequence:
              - service: script.tv_light_look_at_tv

          - conditions:
              - condition: state
                entity_id: input_boolean.tv_light_mode
                state: 'off'
            sequence:
              - service: script.inside_apply_current_scene

  ########################################
  ### Innebelysning resolver (single)  ###
  ########################################
  - alias: Innebelysning resolver
    id: '1735604100091'
    mode: single

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_inne
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id: sensor.light_inside_desired_option

    action:
      - service: script.inside_set_correct_mode

#########################
### Desired Mode Calc ###
#########################
