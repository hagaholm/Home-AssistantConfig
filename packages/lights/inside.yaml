####################################################
#                                                  #
#            INNEBELYSNING (INSIDE) PACKAGE        #
#                                                  #
####################################################
# Samlar all innebelysningslogik i ett paket:
# - input_select.light_inside (läge/scener)
# - beräkning av önskat läge (template-sensor)
# - resolver som synkar input_select mot önskat läge
# - state machine som anropar rätt script
# - scripts för de faktiska ljusscenerna
#
# Källor:
# - automations/input_select_light_inside.yaml
# - automations/light_inside_morning.yaml
# - automations/light_inside_day.yaml
# - automations/light_inside_evening.yaml (saknas som separat automation)
# - automations/light_inside_night.yaml
# - automations/light_inside_away.yaml
# - script/light_morning.yaml
# - script/light_day.yaml
# - script/light_evening.yaml
# - script/light_night.yaml
# - script/light_away.yaml
# - script/light_window.yaml
# - script/light_cleaning.yaml
# - script/light_dimmer.yaml
# - script/light_button.yaml
# - script/light_off_room.yaml
# - script/light_goodnight.yaml
# - packages/helpers/input_selects.yaml (light_inside)
#
# Noteringar / fixar under flytten:
# - input_select_light_inside pekade på script.christmas_lights_on (fanns inte).
#   Det är nu korrigerat till script.window_lights_on (från light_window.yaml).
# - light_goodnight.yaml refererade till script.daylights_*_off (fanns inte).
#   Det är nu korrigerat till script.inside_lights_off (från light_day.yaml).

# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  light_inside:
    name: Innebelysning
    # Lighting mode for interior lights (living room, kitchen, bedrooms)
    # Options represent different lighting scenes for various times of day
    # Updated by: sensor.light_inside_desired_option via automation "Innebelysning resolver"
    # Used by: light_morning, light_day, light_evening, light_night scripts
    options:
      - Släckt
      - Morgonbelysning
      - Förmiddagsbelysning
      - Dagbelysning
      - Kvällsbelysning
      - Nattbelysning
      - Bortabelysning
      - Arbetsbelysning
      - Fönsterbelysning
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  tv_light_mode:
    name: TV-ljusläge
    icon: mdi:television-ambient-light

  inside_pause_day_window_transition:
    name: Innebelysning pausa dag/fönster (09:00)
    icon: mdi:pause-circle
    initial: off

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#        INNEBELYSNING INPUT_SELECT AUTOMATION        #
#                                                     #
#######################################################
#
# BESKRIVNING:
# State machine automation för innebelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande belysningsskript.
#
# HÅRDVARA:
# - Styrs via: input_select.light_inside
# - Exekveras av: script.*_lights_on
#
# TILLSTÅND (input_select.light_inside):
# - Släckt: Släcker allt inne
# - Morgonbelysning: Mjukt morgonljus (ca 05:00-09:00)
# - Förmiddagsbelysning: Övergång till dagläge
# - Dagbelysning: Normalt dagsljus
# - Kvällsbelysning: Dämpat kvällsljus
# - Nattbelysning: Minimalt nattljus (vid rörelse)
# - Bortabelysning: Simulerar närvaro när borta
# - Arbetsbelysning: Praktiskt/klart ljus (mappas till städbelysning)
# - Fönsterbelysning: Fönster/julbelysning
#
# LOGIK:
# När input_select.light_inside ändras:
# - Identifiera nytt tillstånd
# - Anropa motsvarande script
# - Scriptet hanterar faktisk ljuskontroll för alla rum
#
# INTEGRATION:
# - sensor.light_inside_desired_option beräknar önskat läge (single source of truth)
# - automation "Innebelysning resolver" synkar input_select.light_inside via script.inside_set_correct_mode
# - Denna automation är exekveraren (state machine) och anropar scripts
# - Scriptlagret sköter faktisk device-kontroll per rum/grupp
#######################################################

  - alias: Innebelysning
    id: '1735304100020'
    mode: single

    trigger:
      - platform: state
        entity_id: input_select.light_inside

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Släckt
            sequence:
              - service: script.inside_lights_off

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Morgonbelysning
            sequence:
              - service: script.morning_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Förmiddagsbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Dagbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Kvällsbelysning
            sequence:
              - service: script.eveninglights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Nattbelysning
            sequence:
              - service: script.night_light

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Bortabelysning
            sequence:
              - service: script.away_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Fönsterbelysning
            sequence:
              - service: script.window_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Arbetsbelysning
            sequence:
              - service: script.cleaning_lights_on

  ################################
  ### TV-ljusläge (manuell UI) ###
  ################################
  - alias: TV-ljusläge
    id: '1735604100090'
    mode: restart

    trigger:
      - platform: state
        entity_id: input_boolean.tv_light_mode

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.tv_light_mode
                state: 'on'
            sequence:
              - service: script.tv_light_look_at_tv

          - conditions:
              - condition: state
                entity_id: input_boolean.tv_light_mode
                state: 'off'
            sequence:
              - service: script.inside_apply_current_scene

  ########################################
  ### Innebelysning resolver (single)  ###
  ########################################
  - alias: Innebelysning resolver
    id: '1735604100091'
    mode: single

    trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id: sensor.light_inside_desired_option

    action:
      - service: script.inside_set_correct_mode

#########################
### Desired Mode Calc ###
#########################
template:
  - sensor:
      - name: light_inside_desired_option
        unique_id: light_inside_desired_option
        state: >-
          {% set home_status = states('input_select.home_status') %}
          {% set home_status_changed = states.input_select.home_status.last_changed %}
          {% set seconds_since_home_status_changed = (as_timestamp(now()) - as_timestamp(home_status_changed)) | int(0) %}
          {% set borta_long_enough = seconds_since_home_status_changed >= 60 %}

          {% set pause_day_window_transition = is_state('input_boolean.inside_pause_day_window_transition', 'on') %}
          {% set current_option = states('input_select.light_inside') %}

          {% set is_time_05_09 = 5 <= now().hour < 9 %}
          {# Crosses midnight: 09:00 -> 05:00 #}
          {% set is_time_09_05 = (now().hour >= 9) or (now().hour < 5) %}
          {% set is_time_08_22 = 8 <= now().hour < 22 %}

          {% set morning_on = is_state('input_boolean.morning_light_on', 'on') %}
          {% set daylight_on = is_state('input_boolean.daylight_on', 'on') %}
          {% set awaylight_on = is_state('input_boolean.awaylight_on', 'on') %}
          {% set christmas_on = is_state('input_boolean.christmas_light', 'on') %}
          {% set kitchen_motion = is_state('binary_sensor.kok_narvaro', 'on') %}

          {% if home_status == 'Borta' and awaylight_on and is_time_08_22 and borta_long_enough %}
            Bortabelysning
          {% elif home_status == 'Sover' %}
            {% if kitchen_motion and daylight_on %}
              Nattbelysning
            {% else %}
              Släckt
            {% endif %}
          {% elif home_status == 'Hemma' and morning_on and is_time_05_09 %}
            Morgonbelysning
          {% elif pause_day_window_transition and home_status == 'Hemma' and is_time_09_05 and (daylight_on or christmas_on) %}
            {{ current_option | trim }}
          {% elif home_status == 'Hemma' and daylight_on and is_time_09_05 %}
            Dagbelysning
          {% elif home_status == 'Hemma' and christmas_on and is_time_09_05 %}
            Fönsterbelysning
          {% else %}
            Släckt
          {% endif %}

##############
### Script ###
##############
script:

  inside_set_correct_mode:
    alias: Återställ innebelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') | trim }}"
          desired_option: "{{ states('sensor.light_inside_desired_option') | trim }}"
          current_option: "{{ states('input_select.light_inside') | trim }}"
          valid_options:
            - Släckt
            - Morgonbelysning
            - Förmiddagsbelysning
            - Dagbelysning
            - Kvällsbelysning
            - Nattbelysning
            - Bortabelysning
            - Arbetsbelysning
            - Fönsterbelysning

      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{
                    desired_option in valid_options
                    and desired_option != current_option
                    and not (current_option == 'Kvällsbelysning' and home_status == 'Hemma')
                  }}
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_inside
                  option: "{{ desired_option }}"

        default: []

  inside_apply_current_scene:
    alias: Återställ innebelysning (utifrån nuvarande läge)
    mode: restart
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Släckt
            sequence:
              - service: script.inside_lights_off

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Morgonbelysning
            sequence:
              - service: script.morning_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Förmiddagsbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Dagbelysning
            sequence:
              - service: script.daylights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Kvällsbelysning
            sequence:
              - service: script.eveninglights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Nattbelysning
            sequence:
              - service: script.night_light

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Bortabelysning
            sequence:
              - service: script.away_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Fönsterbelysning
            sequence:
              - service: script.window_lights_on

          - conditions:
              - condition: state
                entity_id: input_select.light_inside
                state: Arbetsbelysning
            sequence:
              - service: script.cleaning_lights_on

#######################################################
#                                                     #
#           MORGONBELYSNING SCRIPTS (05:00-09:00)     #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Mjukt morgonljus för att väcka på ett behagligt sätt.
# Stöder både vanligt läge och julmodus.
#######################################################

  morning_lights_on:
    alias: Morgonbelysning on
    mode: restart
    sequence:
      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.morning_lights_christmas_on
            {% else %}
              script.morning_lights_default_on
            {% endif %}

  morning_lights_default_on:
    alias: Morgonbelysning default on
    mode: restart
    sequence:
      # IKEA - 50/40/40/80% (fönster mjukt)
      - service: light.turn_on
        data:
          entity_id: light.kok_stora_fonstret
          brightness_pct: 50
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.hall_byra
          brightness_pct: 40
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.hall_skap
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster
          brightness_pct: 40
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_skank
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_vagn
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.uterum_fonster
          brightness_pct: 80
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.andreas_fonster_2
          transition: 2

