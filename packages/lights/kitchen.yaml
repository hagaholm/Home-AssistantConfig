####################################################
#                                                  #
#              KÖKSBELYSNING PACKAGE               #
#                                                  #
####################################################
# Samlar all köksbelysningslogik i ett paket:
# - Input select för ljusnivåer
# - Automations för närvaro- och state-machine-styrning
# - Scripts för faktiska ljusnivåer
#
# Källor:
# - automations/light_kitchen.yaml
# - automations/input_select_light_kitchen.yaml
# - script/light_kitchen.yaml
# - helpers/input_selects.yaml (light_kitchen)
#
# Hårdvara/Entiteter:
# - Aqara FP2 närvarosensor (3 zoner)
# - input_select.light_kitchen (Släckt/25%/50%/100%)
# - input_boolean.kitchen_light_on, input_boolean.morning_light_on
# - Scripts: script.kitchen_light_{25,50,100,off}
#
# Säkerhet:
# - IDs och alias bibehållna för bakåtkompatibilitet
# - Mode single/queued enligt original
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  light_kitchen:
    name: Kök
    # Kitchen brightness control with 4 levels
    # Allows fine-grained control of brightness in kitchen work areas
    # Updated by: automation "Köksbelysning resolver" via script.kitchen_set_correct_mode (manual override allowed)
    # Used by: light_kitchen script for brightness adjustment
    options:
      - Släckt
      - 25%
      - 50%
      - 100%
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  lights_auto_kok:
    name: Auto Kök
    icon: mdi:lightbulb
    initial: on

##################
### Automation ###
##################
automation:

####################################################
#                                                  #
#                KÖKSBELYSNING AUTOMATION          #
#                                                  #
####################################################
#
# BESKRIVNING:
# Automatiserat belysningssystem för köket som styrs av Aqara FP2-närvarosensorer och hemstatus.
#
# HÅRDVARA:
# - Aqara FP2 närvarosensor med 3 zoner:
#   * Zone 1 (sensor_1): Övergripande köksnärvaro
#   * Zone 2 (sensor_2): Köksbord
#   * Zone 3 (sensor_3): Köksbänk
#
# FUNKTIONALITET:
# - Resolvern triggas av närvaro/home_status/booleans och anropar script.kitchen_set_correct_mode.
# - script.kitchen_set_correct_mode är enda stället som beslutar vilket läge som ska gälla och sätter input_select.light_kitchen vid behov.
#
# SLÄCK (fördröjt):
# - När ingen närvaro i hela köket (sensor_1 = off):
#   - 30 sek om aktuellt läge är 25%
#   - 1 min annars
#
# TÄND:
# - 25% vid närvaro och home_status = Sover
# - 50% vid närvaro och morning_light_on (beroende på hemstatus)
# - 100% vid närvaro i zon 2/3 och kitchen_light_on
#
# SÄKERHETSKONTROLLER:
# - Kontroll av att lampor inte redan är släckta innan släckning.
# - Kontroll av hemstatus och kitchen_light_on innan tändning.
#
# INTEGRATION:
# - Styrs via input_select.light_kitchen (Släckt/25%/100%)
# - Aktiveras/inaktiveras via input_boolean.kitchen_light_on
# - Hemstatus från input_select.home_status
####################################################

  ###################################
  ### Köksbelysning resolver (single)
  ###################################
  - alias: Köksbelysning resolver
    id: '1735604100092'
    mode: restart

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_kok
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id: input_select.home_status

      - platform: state
        entity_id: input_boolean.kitchen_light_on

      - platform: state
        entity_id: input_boolean.morning_light_on

      - platform: state
        entity_id: binary_sensor.presence_sensor_fp2_9a29_presence_sensor_1
        to: 'on'

      - platform: state
        entity_id: binary_sensor.presence_sensor_fp2_9a29_presence_sensor_2
        to: 'on'

      - platform: state
        entity_id: binary_sensor.presence_sensor_fp2_9a29_presence_sensor_3
        to: 'on'

      - platform: state
        entity_id: binary_sensor.presence_sensor_fp2_9a29_presence_sensor_1
        to: 'off'
        for:
          seconds: 30
        id: delay_30s

      - platform: state
        entity_id: binary_sensor.presence_sensor_fp2_9a29_presence_sensor_1
        to: 'off'
        for:
          minutes: 1
        id: delay_1min

    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'delay_30s' and states('input_select.light_kitchen') == '25%' }}"
            sequence:
              - service: script.kitchen_set_correct_mode

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'delay_1min' and states('input_select.light_kitchen') != '25%' and states('input_select.light_kitchen') != 'Släckt' }}"
            sequence:
              - service: script.kitchen_set_correct_mode

        default:
          - service: script.kitchen_set_correct_mode

#######################################################
#                                                     #
#         KÖKSBELYSNING INPUT_SELECT AUTOMATION       #
#                                                     #
#######################################################
#
# BESKRIVNING:
# State machine automation för köksbelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande ljusskript.
#
# HÅRDVARA:
# - Styrs via: input_select.light_kitchen
# - Exekveras av: script.kitchen_light_*
#
# TILLSTÅND:
# - Släckt: Alla lampor av
# - 25%: Dämpat nattljus
# - 50%: Morgonljus
# - 100%: Full belysning
#
# LOGIK:
# När input_select.light_kitchen ändras:
# - Identifiera nytt tillstånd
# - Anropa motsvarande script
# - Scriptet hanterar faktisk ljuskontroll
#
# INTEGRATION:
# - Kopplad till input_select.light_kitchen
# - Triggar script för faktisk ljuskontroll
# - Styrs av automationer i light_kitchen.yaml
#######################################################

  - alias: Köksbelysning
    id: '1735304100019'
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.light_kitchen
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_kitchen
                state: '100%'
            sequence:
              - service: script.kitchen_light_100
          - conditions:
              - condition: state
                entity_id: input_select.light_kitchen
                state: '50%'
            sequence:
              - service: script.kitchen_light_50
          - conditions:
              - condition: state
                entity_id: input_select.light_kitchen
                state: '25%'
            sequence:
              - service: script.kitchen_light_25
          - conditions:
              - condition: state
                entity_id: input_select.light_kitchen
                state: Släckt
            sequence:
              - service: script.kitchen_light_off

##############
### Script ###
##############
script:

  kitchen_set_correct_mode:
    alias: Återställ köksbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          presence_all: "{{ is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_1', 'on') }}"
          presence_zone_2: "{{ is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_2', 'on') }}"
          presence_zone_3: "{{ is_state('binary_sensor.presence_sensor_fp2_9a29_presence_sensor_3', 'on') }}"
          kitchen_light_on: "{{ is_state('input_boolean.kitchen_light_on', 'on') }}"
          morning_light_on: "{{ is_state('input_boolean.morning_light_on', 'on') }}"
          current_option: "{{ states('input_select.light_kitchen') }}"

          valid_options:
            - Släckt
            - 25%
            - 50%
            - 100%

          desired_option: >-
            {% if not presence_all %}
              Släckt
            {% elif home_status == 'Sover' %}
              25%
            {% elif home_status in ['Hemma', 'Borta'] and kitchen_light_on and (presence_zone_2 or presence_zone_3) %}
              100%
            {% elif home_status in ['Hemma', 'Borta'] and morning_light_on and current_option in ['Släckt'] %}
              50%
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.light_kitchen
                data:
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#              KÖKSBELYSNING SCRIPTS                  #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Styr köksbelysning med 4 ljusnivåer (100%, 50%, 25%, av).
# Hanterar tre ljuszoner: underskåp bank, underskåp diskbank,
# och vitrinskap.
#
# HÅRDVARA:
# - Underskåp bank: light.kok_underskap_bank
# - Underskåp diskbank: light.kok_underskap_diskbank
# - Vitrinskap: light.kok_vitrinskap
#
# SCRIPTS:
# - kitchen_light_100: Full belysning (90%/90%/100%)
# - kitchen_light_50: Halvljus (50%/50%/80%)
# - kitchen_light_25: Dämpat ljus (10%/10%/25%)
# - kitchen_light_off: Släcker all köksbelysning
#
# SÄKERHET:
# - Mode: restart - stoppar tidigare körning vid ny trigger
# - Tillgänglighetskontroll av alla lampor
# - Mjuka övergångar (2s) för ögonkomfort
# - Intelligent kontroll - ändrar endast om ljus är tillgängligt
#
# ANVÄNDNING:
# Anropas från input_select_light_kitchen.yaml automation
# och köksbelysning automation baserat på närvaro.
#######################################################

  ##########################
  ### Köksbelysning 100% ###
  ##########################
  kitchen_light_100:
    alias: Köksbelysning 100%
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.kok_underskap_bank') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_underskap_bank
          brightness_pct: 90
          transition: 2
      - condition: template
        value_template: "{{ states('light.kok_underskap_diskbank') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_underskap_diskbank
          brightness_pct: 90
          transition: 2
      - condition: template
        value_template: "{{ states('light.kok_vitrinskap') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_vitrinskap
          brightness_pct: 100
          transition: 2

  #########################
  ### Köksbelysning 50% ###
  #########################
  kitchen_light_50:
    alias: Köksbelysning 50%
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.kok_underskap_bank') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_underskap_bank
          brightness_pct: 50
          transition: 2
      - condition: template
        value_template: "{{ states('light.kok_underskap_diskbank') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_underskap_diskbank
          brightness_pct: 50
          transition: 2
      - condition: template
        value_template: "{{ states('light.kok_vitrinskap') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_vitrinskap
          brightness_pct: 80
          transition: 2

  #########################
  ### Köksbelysning 25% ###
  #########################
  kitchen_light_25:
    alias: Köksbelysning 25%
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.kok_underskap_bank') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_underskap_bank
          brightness_pct: 10
          transition: 2
      - condition: template
        value_template: "{{ states('light.kok_underskap_diskbank') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_underskap_diskbank
          brightness_pct: 10
          transition: 2
      - condition: template
        value_template: "{{ states('light.kok_vitrinskap') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.kok_vitrinskap
          brightness_pct: 25
          transition: 2

  #########################
  ### Köksbelysning off ###
  #########################
  kitchen_light_off:
    alias: Köksbelysning off
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.kok_underskap_bank') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.kok_underskap_bank
          transition: 2
      - condition: template
        value_template: "{{ states('light.kok_underskap_diskbank') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.kok_underskap_diskbank
          transition: 2
      - condition: template
        value_template: "{{ states('light.kok_vitrinskap') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.kok_vitrinskap
          transition: 2
