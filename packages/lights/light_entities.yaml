####################################################
#                                                  #
#                   LIGHT ENTITIES                 #
#                                                  #
####################################################
# Light platform definitions for switch-based lights
# Provides light interface for simple on/off switches
# Documentation: https://www.home-assistant.io/integrations/light.switch/
#
# Platform Overview:
# - Tellstick: Wireless ZigBee lights (kitchen, hallway, bedrooms)
# - Switch-based: Relay switches converted to light entities
#
# Switch Categories:
# - Window/exterior lights: Decorative accent lights (candles, stars, trees)
# - Furniture lights: Desk lamps, lamp tables, shelving (vitrines)
# - Room accents: LED strips, pendant lights
# - Holiday lights: Facade, tree, and seasonal decorations
#
# Safety Notes:
# - All switch entities use ON/OFF control only (no brightness dimming)
# - Transitions handled at automation level
# - Availability checked before use in multi-step sequences
#
####################################################

light:
  # Tellstick Platform - Wireless ZigBee lights (controllable brightness/color)
  - platform: tellstick
    # Kitchen ceiling light, hallway lights, bedroom ceiling lights
    # Integrated Tellstick devices with dimming support

  # Switch-based Lights - Relay switches (simple on/off only)
  # Window lights and accent lighting - no brightness control at device level
  
  - platform: switch
    name: Louise skrivbord
    entity_id: switch.louise_skrivbord
