####################################################
#                                                  #
#            LIGHT GROUPS - STANDARD MODE          #
#                                                  #
####################################################
# Standard (non-seasonal) light groups for scene automation
# Provides logical groupings for controlling lights by room or usage
# Documentation: https://www.home-assistant.io/integrations/light.group/
#
# Group Categories:
# - Daily Scenarios: Lighting modes for time-of-day automation
#   (Morgon, Dag, Kväll, Natt, Borta = Morning, Day, Evening, Night, Away)
# - Room Groups: All lights in specific rooms for bulk control
# - Feature Groups: Specific functions (Kitchen under-cabinet, facade, etc)
#
# Design Pattern:
# - Used by automation scripts to control multiple lights with one action
# - Individual lights can be turned on/off or dimmed via group
# - Groups simplify lighting automation logic
#
####################################################

light:
  # Daily Lighting Scenarios - Times of day
  - platform: group
    name: Dagbelysning
    # Day mode lighting (maximum brightness general illumination)
    # Used by: light_day script for daytime ambiance
    # Includes: Window lights, cabinet accent lights, and room illumination
    entities:
      - light.kok_stora_fonstret
      - light.kok_lilla_fonstret
      - light.hall_byra
      - light.hall_skap
      - light.vardagsrum_fonster
      - light.vardagsrum_skank
      - light.vardagsrum_vagn
      - light.vardagsrum_vitrinskap2
      - light.sovrum_fonster
      - light.sovrum_sangbord
      - light.andreas_fonster_2
      - light.louise_fonster
      - light.louise_golvlampa

  - platform: group
    name: Köksbelysning
    # Kitchen-specific lighting (task and ambient)
    # Used by: light_kitchen script for brightness adjustment
    # Includes: Under-cabinet work lights and cabinet accent lighting
    entities:
      - light.kok_underskap_bank
      - light.kok_underskap_diskbank
      - light.kok_vitrinskap

  - platform: group
    name: Morgonbelysning
    # Morning/breakfast lighting (soft, focused)
    # Used by: light_morning script for gentle wake-up lighting
    # Includes: Kitchen windows and main living areas
    entities:
      - light.kok_stora_fonstret
      - light.kok_lilla_fonstret
      - light.hall_byra
      - light.vardagsrum_fonster

  - platform: group
    name: Nattbelysning
    # Night/bedroom lighting (very low brightness)
    # Used by: light_night script for sleeping mode
    # Includes: Minimal lighting for safe movement without waking
    entities:
      - light.kok_lilla_fonstret
      - light.kok_stora_fonstret    
      - light.hall_byra
      - light.vardagsrum_fonster

  - platform: group
    name: Fasadbelysning
    # House exterior facade lighting (decorative accents)
    # Used by: fasadbelysning_* (packages/lights/facade.yaml)
    # Includes: Front entrance, laundry room, storage, garden shed accents
    entities:
      - light.huvudentre2
      - light.tvattstugan_fasad
      - light.forrad_fasad
      - light.friggebod_fasad

  - platform: group
    name: Utebelysning
    # Exterior outdoor lighting (gardens and entertainment areas)
    # Used by:
    # - outside_light_on/off (packages/lights/spabad.yaml) (spabad-lampor)
    # - tradgards_belysning_on/off (packages/lights/garden.yaml) (friggebod_ute_2)
    # Includes: Hot tub area lighting + friggebod ute
    entities:
      - light.friggebod_ute_2
      - light.spabad_v
      - light.spabad_m
      - light.spabad_h

  - platform: group
    name: Bortabelysning
    # Away mode lighting (security simulation)
    # Used by: light_away script to simulate occupancy
    # Includes: Key visible windows and entry lighting
    entities:
      - light.kok_stora_fonstret
      - light.kok_lilla_fonstret
      - light.hall_byra
      - light.vardagsrum_fonster
      - light.sovrum_sangbord
      - light.louise_fonster

  # Room-based Lighting Groups
  - platform: group
    name: Sovrum
    # Master bedroom all lights
    # Used by: Room-specific automation and scene control
    # Includes: Bedside lamp and window accent
    entities:
      - light.sovrum_sangbord
      - light.sovrum_fonster

  - platform: group
    name: Hall
    # Hallway and entryway lights
    # Used by: Motion-activated hallway lighting
    # Includes: Hallway furniture accents
    entities:
      - light.hall_byra
      - light.hall_skap

  - platform: group
    name: Vardagsrum
    # Living room all lights
    # Used by: Main living area scene activation
    # Includes: Window lights, furniture, cabinet lighting, Christmas tree
    entities:
      - light.vardagsrum_fonster
      - light.vardagsrum_skank
      - light.vardagsrum_vagn
      - light.vardagsrum_vitrinskap2
      - light.vardagsrum_gran

  - platform: group
    name: Kök
    # Kitchen general lighting (windows)
    # Used by: Kitchen automation scenes
    # Includes: Window candle lights
    entities:
      - light.kok_stora_fonstret
      - light.kok_lilla_fonstret

  - platform: group
    name: Louise rum
    # Louise's bedroom lights
    # Used by: Child's room automation (bedtime, morning)
    # Includes: Window light, floor lamp
    entities:
      - light.louise_fonster
      - light.louise_golvlampa

  - platform: group
    name: Andreas rum
    # Andreas's bedroom lights
    # Used by: Child's room automation (bedtime, morning)
    # Includes: Window light
    entities:
      - light.andreas_fonster_2

  - platform: group
    name: Uterum
    entities:
      - light.uterum_led
      - light.uterum_fonster
      - light.uterum_fotogenlampa

  - platform: group
    name: Badrum
    entities:
      - light.tak_spottar
      - light.fonster_spott

  - platform: group
    name: Hall tak
    entities:
      - light.kajplats_e27_ws_globe_470lm # 1.1
      - light.kajplats_e27_ws_globe_470lm_2 # 1.2
      - light.kajplats_e27_ws_globe_470lm_3 # 1.3
      - light.kajplats_e27_ws_globe_470lm_4 # 2.1
      - light.kajplats_e27_ws_globe_470lm_5 # 2.2
      - light.kajplats_e27_ws_globe_470lm_6 # 2.3
      - light.kajplats_e27_ws_globe_470lm_7 # 3.1
      - light.kajplats_e27_ws_globe_470lm_8 # 3.2
      - light.kajplats_e27_ws_globe_470lm_9 # 3.3
      - light.kajplats_e27_ws_globe_470lm_10 # 4.1
      - light.kajplats_e27_ws_globe_470lm_11 # 4.2
      - light.kajplats_e27_ws_globe_470lm_12 # 4.3
      - light.kajplats_e27_ws_globe_1521lm # 5
