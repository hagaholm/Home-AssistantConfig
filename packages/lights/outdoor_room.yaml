####################################################
#                                                  #
#           UTERUMSBELYSNING PACKAGE               #
#                                                  #
####################################################
# Samlar all uterumsbelysningslogik i ett paket:
# - Input select för tänd/släckt
# - Automations för temperatur-, ljus- och hemstatusstyrning
# - Scripts för faktisk ljuskontroll
#
# Källor:
# - automations/light_outdoor_room.yaml
# - automations/input_select_light_outdoor_room.yaml
# - script/light_outdoor_room.yaml
# - helpers/input_selects.yaml (light_uterum)
#
# Hårdvara/Entiteter:
# - Temperatursensor: sensor.uterum_temperatur
# - Ljussensor: sensor.ljusstyrka
# - Hemspårning: group.track_for_home_devices
# - Uterumsbelysning: light.uterum_led, light.uterum_fotogenlampa, light.uterum_fonster
# - input_select.light_uterum (Släckt/Tänd)
#
# Säkerhet:
# - IDs och alias bibehållna för bakåtkompatibilitet
# - Mode single/restart enligt original
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  light_uterum:
    name: Uterum
    # Conservatory/sunroom multi-level control
    # Controls accent lighting and decorative lights in conservatory
    # Used by: Garden room automation sequences
    options:
      - Släckt
      - Låg
      - Mellan
      - Hög
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  lights_auto_uterum:
    name: Auto Uterum
    icon: mdi:greenhouse
    initial: on

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#            UTERUMSBELYSNING AUTOMATION              #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Uterumsbelysning är uppbyggd i två lager:
# - Resolver: triggas av temperatur/lux/hemstatus/hemspårning och anropar script.uterum_set_correct_mode
# - State machine: input_select.light_uterum ändringar exekverar rätt script
#
# Beslutslogik (Tänd/Släckt) ligger i script.uterum_set_correct_mode som sätter
# input_select.light_uterum vid behov.
#
# HÅRDVARA:
# - Temperatursensor: sensor.uterum_temperatur
# - Ljussensor: sensor.ljusstyrka
# - Hemspårning: group.track_for_home_devices
#
# TRIGGRAR:
# - Någon kommer hem
# - Hemstatus ändras till 'Sover'
# - Temperatur över 18°C (varmt nog)
# - Ljusnivå under 150 lux (mörkt)
# - Temperatur under 17°C (för kallt)
# - Alla lämnar hemmet
#
#
# LOGIK:
# TÄND:
# - Mellan 12:00-21:45
# - När ljus <150 lux OCH temp >18°C OCH hemma
#
# SLÄCK:
# - Temperatur <17°C (för kallt att sitta ute)
# - När alla lämnar hemmet
# - Sover: Släck när hemstatus blir 'Sover'
#
# INTEGRATION:
# - Styrs via input_select.light_uterum
# - Samordnas med innebelysning och hemstatus
#######################################################

  ####################################
  ### Uterumsbelysning resolver (single)
  ####################################
  - alias: Uterumsbelysning resolver
    id: '1735604100096'
    description: >
      Resolver som synkar input_select.light_uterum via script.uterum_set_correct_mode
      (en källa till sanning för beslutslogiken).
    mode: restart

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_uterum
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id: input_select.home_status

      - platform: state
        entity_id: group.track_for_home_devices

      - platform: numeric_state
        entity_id: sensor.uterum_temperatur
        above: 18

      - platform: numeric_state
        entity_id: sensor.uterum_temperatur
        below: 17

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        below: input_number.ljusstyrka_150
        for: "00:02:00"
        id: dark

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        above: input_number.ljusstyrka_200
        for: "00:02:00"
        id: bright

    action:
      - service: script.uterum_set_correct_mode

#######################################################
#                                                     #
#     UTERUMSBELYSNING INPUT_SELECT AUTOMATION        #
#                                                     #
#######################################################
#
#
# BESKRIVNING:
# State machine automation för uterumsbelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande belysningsskript.
#
# HÅRDVARA/ENTITETER:
# - input_select.light_uterum (Tänd/Släckt)
# - script.outdoor_room_light_on
# - script.outdoor_room_light_off
#
# TRIGGRAR:
# - input_select.light_uterum -> 'Tänd'
# - input_select.light_uterum -> 'Släckt'
#
# LOGIK:
# När input_select.light_uterum ändras:
# - Tänd -> Anropar script.outdoor_room_light_on
# - Släckt -> Anropar script.outdoor_room_light_off
#
# INTEGRATION:
# - Kopplad till input_select.light_uterum
# - Styrs av automation i light_outdoor_room.yaml
# - Scriptet hanterar faktisk ljuskontroll
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga automationer
# v1.1 (2025-12-27): Lade till omfattande dokumentation
#######################################################

  #######################################################
  #                                                     #
  #     UTERUMSBELYSNING (INPUT_SELECT)                  #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # State machine för uterumsbelysning.
  # När input_select.light_uterum ändras körs rätt script.
  #######################################################

  - alias: Uterumsbelysning (input_select)
    id: '4204784871343'
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.light_uterum
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_uterum
                state: Släckt
            sequence:
              - service: script.outdoor_room_light_off
          - conditions:
              - condition: template
                value_template: "{{ states('input_select.light_uterum') not in ['Släckt'] }}"
            sequence:
              - service: script.outdoor_room_light_on
        default: []

##############
### Script ###
##############
script:

  uterum_set_correct_mode:
    alias: Återställ uterumsbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          track_state: "{{ states('group.track_for_home_devices') }}"
          lux: "{{ states('sensor.ljusstyrka') | float(none) }}"
          lux_on: "{{ states('input_number.ljusstyrka_150') | float(150) }}"
          lux_off: "{{ states('input_number.ljusstyrka_200') | float(200) }}"
          temp: "{{ states('sensor.uterum_temperatur') | float(none) }}"
          current_option: "{{ states('input_select.light_uterum') }}"

          is_time_window: "{{ (now().hour >= 8) and (now().hour < 22) }}"
          is_dark: "{{ lux is number and lux < lux_on }}"
          is_bright: "{{ lux is number and lux > lux_off }}"
          temp_ok: "{{ temp is number and temp > 18 }}"
          temp_too_cold: "{{ temp is number and temp < 17 }}"

          valid_options:
            - Släckt
            - Låg
            - Mellan
            - Hög

          desired_option: >-
            {% if home_status == 'Sover' %}
              Släckt
            {% elif track_state != 'home' %}
              Släckt
            {% elif temp_too_cold %}
              Släckt
            {% elif is_time_window and is_dark and temp_ok %}
              {% if now().hour < 18 %}
                Hög
              {% else %}
                Mellan
              {% endif %}
            {% elif is_bright %}
              Släckt
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_uterum
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#             UTERUMS BELYSNING SCRIPTS               #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Tänder/släcker uterumsbelysning och uppdaterar state-maskin.
#
# HÅRDVARA:
# - light.uterum_led
# - light.uterum_fotogenlampa
# - input_select.light_uterum (state)
#
# SÄKERHET:
# - Mode: restart – hindrar överlappande körningar
# - Tillgänglighetskontroll för båda lampor
# - Mjuka övergångar (1s)
#######################################################

  ############################
  ### Uterums belysning on ###
  ############################
  outdoor_room_light_on:
    alias: Uterums belysning on
    mode: restart
    sequence:
      - variables:
          selected_level: "{{ states('input_select.light_uterum') }}"
          brightness_pct: >-
            {% set level = states('input_select.light_uterum') %}
            {% if level == 'Låg' %}
              25
            {% elif level == 'Mellan' %}
              55
            {% elif level == 'Hög' %}
              80
            {% else %}
              {% set hour = now().hour %}
              {% if hour < 9 %}
                80
              {% elif hour < 18 %}
                80
              {% else %}
                40
              {% endif %}
            {% endif %}

      - condition: template
        value_template: "{{ states('light.uterum_led') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.uterum_led
          transition: 1
      - condition: template
        value_template: "{{ states('light.uterum_fotogenlampa') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.uterum_fotogenlampa
          transition: 1
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.christmas_light
                state: 'on'
            sequence:
              - condition: template
                value_template: "{{ states('light.uterum_julstjarnor') != 'unavailable' }}"
              - service: light.turn_on
                data:
                  entity_id: light.uterum_julstjarnor
                  transition: 1
          - conditions:
              - condition: state
                entity_id: input_boolean.christmas_light
                state: 'off'
            sequence:
              - condition: template
                value_template: "{{ states('light.uterum_fonster') != 'unavailable' }}"
              - service: light.turn_on
                data_template:
                  entity_id: light.uterum_fonster
                  brightness_pct: "{{ brightness_pct }}"
                  transition: 1

  #############################
  ### Uterums belysning off ###
  #############################
  outdoor_room_light_off:
    alias: Uterums belysning off
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.uterum_led') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.uterum_led
          transition: 1
      - condition: template
        value_template: "{{ states('light.uterum_fotogenlampa') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.uterum_fotogenlampa
          transition: 1
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.christmas_light
                state: 'on'
            sequence:
              - condition: template
                value_template: "{{ states('light.uterum_julstjarnor') != 'unavailable' }}"
              - service: light.turn_off
                data:
                  entity_id: light.uterum_julstjarnor
                  transition: 1
          - conditions:
              - condition: state
                entity_id: input_boolean.christmas_light
                state: 'off'
            sequence:
              - condition: template
                value_template: "{{ states('light.uterum_fonster') != 'unavailable' }}"
              - service: light.turn_off
                data:
                  entity_id: light.uterum_fonster
                  transition: 1
