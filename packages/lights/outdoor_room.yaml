####################################################
#                                                  #
#           UTERUMSBELYSNING PACKAGE               #
#                                                  #
####################################################
# Samlar all uterumsbelysningslogik i ett paket:
# - Input select för tänd/släckt
# - Automations för temperatur-, ljus- och hemstatusstyrning
# - Scripts för faktisk ljuskontroll
#
# Källor:
# - automations/light_outdoor_room.yaml
# - automations/input_select_light_outdoor_room.yaml
# - script/light_outdoor_room.yaml
# - helpers/input_selects.yaml (light_uterum)
#
# Hårdvara/Entiteter:
# - Temperatursensor: sensor.uterum_temperatur
# - Ljussensor: sensor.ljusstyrka
# - Hemspårning: group.track_for_home_devices
# - Uterumsbelysning: light.uterum_led, light.uterum_fotogenlampa
# - Fönsterbelysning: light.uterum_fonster (egen 200-luxgräns, ej temperaturstyrd)
# - input_select.light_uterum (Släckt/Fönsterbelysning/Tänd)
#
# Säkerhet:
# - IDs och alias bibehållna för bakåtkompatibilitet
# - Mode single/restart enligt original
####################################################

#######################
### Input Select(s) ###
#######################
# Helpers moved to packages/lights/helpers/outdoor_room.yaml, scripts to packages/scripts/lights/outdoor_room.yaml (Fas 2)

automation:

#######################################################
#                                                     #
#            UTERUMSBELYSNING AUTOMATION              #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Uterumsbelysning är uppbyggd i två lager:
# - Resolver: triggas av temperatur/lux/hemstatus/hemspårning och anropar script.uterum_set_correct_mode
# - State machine: input_select.light_uterum ändringar exekverar rätt script
#
# Beslutslogik (Tänd/Släckt) ligger i script.uterum_set_correct_mode som sätter
# input_select.light_uterum vid behov.
#
# HÅRDVARA:
# - Temperatursensor: sensor.uterum_temperatur
# - Ljussensor: sensor.ljusstyrka
# - Hemspårning: group.track_for_home_devices
#
# TRIGGRAR:
# - Någon kommer hem
# - Hemstatus ändras till 'Sover'
# - Temperatur över 18°C (varmt nog)
# - Ljusnivå under 150 lux (mörkt)
# - Temperatur under 17°C (för kallt)
# - Alla lämnar hemmet
#
#
# LOGIK:
# - Fönsterlampan tänds under 200 lux; när de andra lamporna är tända följer den läget "Tänd".
# - Temperatur påverkar inte fönsterlampan.
# - Vid hemstatus Borta följer fönsterlampan inomhuslogikens 60 sekunders fördröjning
#   och är bara tillåten mellan 08:00 och 22:00.
# - Godnatt släcker fönsterlampan direkt.
# TÄND:
# - Mellan 12:00-21:45
# - När ljus <150 lux OCH temp >18°C OCH hemma
#
# SLÄCK:
# - Temperatur <17°C släcker de två andra uterumslamporna, inte fönsterlampan.
# - När alla lämnar hemmet
# - Sover: Släck när hemstatus blir 'Sover'
#
# INTEGRATION:
# - Styrs via input_select.light_uterum
# - Samordnas med innebelysning och hemstatus
#######################################################

  ####################################
  ### Uterumsbelysning resolver (single)
  ####################################
  - alias: Uterumsbelysning resolver
    id: '1735604100096'
    description: >
      Resolver som synkar input_select.light_uterum via script.uterum_set_correct_mode
      (en källa till sanning för beslutslogiken).
    mode: restart

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_uterum
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: state
        entity_id: input_select.home_status

      - platform: state
        entity_id: input_select.home_status
        to: 'Borta'
        for: '00:01:00'

      - platform: state
        entity_id: group.track_for_home_devices

      - platform: numeric_state
        entity_id: sensor.uterum_temperatur
        above: 18

      - platform: numeric_state
        entity_id: sensor.uterum_temperatur
        below: 17

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        below: input_number.ljusstyrka_150

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        above: input_number.ljusstyrka_200

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        below: input_number.ljusstyrka_200

      - platform: state
        entity_id: input_number.ljusstyrka_150

      - platform: state
        entity_id: input_number.ljusstyrka_200

      - platform: time
        at: '08:00:00'

      - platform: time
        at: '22:00:00'

    action:
      - service: script.uterum_set_correct_mode

#######################################################
#                                                     #
#     UTERUMSBELYSNING INPUT_SELECT AUTOMATION        #
#                                                     #
#######################################################
#
#
# BESKRIVNING:
# State machine automation för uterumsbelysning.
# Lyssnar på input_select ändringar och anropar
# motsvarande belysningsskript.
#
# HÅRDVARA/ENTITETER:
# - input_select.light_uterum (Släckt/Fönsterbelysning/Tänd)
# - script.outdoor_room_light_on
# - script.outdoor_room_light_off
#
# TRIGGRAR:
# - Tänd: alla tre lampor
# - Fönsterbelysning: endast fönsterlampan
# - Släckt: alla lampor
#
# LOGIK:
# När input_select.light_uterum ändras:
# - Läget väljer både de två temperaturstyrda lamporna och fönsterlampan
#
# INTEGRATION:
# - Kopplad till input_select.light_uterum
# - Styrs av automation i light_outdoor_room.yaml
# - Scriptet hanterar faktisk ljuskontroll
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga automationer
# v1.1 (2025-12-27): Lade till omfattande dokumentation
#######################################################

  #######################################################
  #                                                     #
  #     UTERUMSBELYSNING (INPUT_SELECT)                  #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # State machine för uterumsbelysning.
  # När input_select.light_uterum ändras körs rätt script.
  #######################################################

  - alias: Uterumsbelysning (input_select)
    id: '4204784871343'
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.light_uterum
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_uterum
                state: Tänd
            sequence:
              - service: script.outdoor_room_light_on
              - service: script.uterum_window_light_on
          - conditions:
              - condition: state
                entity_id: input_select.light_uterum
                state: Fönsterbelysning
            sequence:
              - service: script.outdoor_room_light_off
              - service: script.uterum_window_light_on
          - conditions:
              - condition: state
                entity_id: input_select.light_uterum
                state: Släckt
            sequence:
              - service: script.outdoor_room_light_off
              - service: script.uterum_window_light_off
        default: []

  - alias: Uterumsbelysning synka läge med lamporna
    id: 'uterum_light_mode_sync'
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - light.uterum_led
          - light.uterum_fotogenlampa
          - light.uterum_fonster
        to: 'on'
        for: '00:00:03'
      - platform: state
        entity_id:
          - light.uterum_led
          - light.uterum_fotogenlampa
          - light.uterum_fonster
        to: 'off'
        for: '00:00:03'
    action:
      - variables:
          room_lights_on: >-
            {{ is_state('light.uterum_led', 'on') or is_state('light.uterum_fotogenlampa', 'on') }}
          window_on: "{{ is_state('light.uterum_fonster', 'on') }}"
          current_option: "{{ states('input_select.light_uterum') | trim }}"
          actual_option: >-
            {% if room_lights_on | bool %}
              Tänd
            {% elif window_on | bool %}
              Fönsterbelysning
            {% else %}
              Släckt
            {% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (actual_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_uterum
                  option: "{{ actual_option | trim }}"
          - conditions:
              - condition: template
                value_template: "{{ (actual_option | trim) == 'Tänd' }}"
            sequence:
              - service: script.outdoor_room_light_on
              - service: script.uterum_window_light_on
        default: []

##############
### Script ###
##############
