####################################################
#                                                  #
#               SPABAD PACKAGE                      #
#                                                  #
####################################################
#
# BESKRIVNING:
# Samlar all logik för spabad-belysning i ett paket:
# - input_select.light_outside (Släckt/Tänd) med visningsnamn "Spabad"
# - resolver som synkar input_select via script.spabad_set_correct_mode
# - state machine som exekverar rätt ljusskript
# - scripts för faktisk ljuskontroll
#
# Källor:
# - Tidigare: packages/lights/exterior.yaml
####################################################

#######################
### Input Select(s) ###
#######################
input_select:
  light_outside:
    name: Spabad
    # Simple on/off for spa lighting
    # Updated by: automation "Spabad resolver" via script.spabad_set_correct_mode (manual override allowed)
    options:
      - Släckt
      - Tänd
    icon: mdi:lightbulb

########################
### Input Boolean(s) ###
########################
input_boolean:
  lights_auto_spabad:
    name: Auto Spabad
    icon: mdi:hot-tub
    initial: on

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#                 SPABAD AUTOMATION                   #
#                                                     #
#######################################################

  #######################################################
  #                                                     #
  #          SPABAD RESOLVER (DECISION MAKER)         #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # Resolver automation som triggas av externa faktorer och bestämmer
  # önskad ljusstatus. Anropar script.spabad_set_correct_mode som
  # uppdaterar input_select.light_outside om behövligt.
  #
  # TRIGGRAR:
  # - HA start (initiering av system)
  # - sensor.ljusstyrka < 5 lux (mörknar - behöver utomhusbelysning)
  # - Daglig tid 22:00 (kväll → energisparning)
  # - input_select.home_status ändras (hemstatus shift)
  # - group.track_for_home_devices ändras (hemspårning)
  # - binary_sensor.workday_tomorrow ändras (arbetsdagsstatus)
  #
  # LOGIK:
  # - Endast aktiv om input_boolean.lights_auto_spabad = 'on'
  # - Anropar script.spabad_set_correct_mode för beslutsfattning
  # - Script uppdaterar input_select endast om önskad nivå skiljer sig
  #
  # SÄKERHET:
  # - Mode: restart (förhindrar överlappande körningar)
  # - Script gated på input_select state changes (undviker loopar)
  #######################################################
  - alias: Spabad resolver
    id: '1735604100097'
    mode: restart

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_spabad
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        below: input_number.ljusstyrka_5

      - platform: time
        at: '22:00:00'

      - platform: state
        entity_id: input_select.home_status
        to: 'Sover'

      - platform: state
        entity_id: group.track_for_home_devices

      - platform: state
        entity_id: binary_sensor.workday_tomorrow

    action:
      - service: script.spabad_set_correct_mode

  #######################################################
  #                                                     #
  #     SPABADBELYSNING (INPUT_SELECT) STATE MACHINE   #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # State machine automation. Triggas när input_select.light_outside
  # ändras (via resolver script eller manuell override) och exekverar
  # motsvarande effektskript.
  #
  # TRIGGRAR:
  # - input_select.light_outside state changes
  #
  # LOGIK:
  # - Släckt → anropar script.outside_light_off
  # - Tänd → anropar script.outside_light_on
  #
  # FUNKTIONALITET:
  # - Mappning mellan input_select states och effect scripts
  # - Mode: single (förhindrar concurrent körningar)
  # - Only executes known states (Släckt/Tänd)
  #
  # INTEGRATION:
  # - Tillåter manuell override (om user ändrar input_select direkt)
  #######################################################
  - alias: Spabadbelysning (input_select)
    id: 'light_outside_changed'
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.light_outside
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_outside
                state: 'Släckt'
            sequence:
              - service: script.outside_light_off
          - conditions:
              - condition: state
                entity_id: input_select.light_outside
                state: 'Tänd'
            sequence:
              - service: script.outside_light_on

##############
### Script ###
##############
script:

  spabad_set_correct_mode:
    alias: Återställ spabadbelysning (sätt korrekt läge)
    description: >
      Decision-making script för spabadbelysning.
      Läser hemstatus, ljusnivå, tid och arbetsdagsstatus,
      sedan bestämmer önskad spabadläge och uppdaterar input_select
      endast om det skiljer sig från aktuell status (undviker loops).
    mode: single
    sequence:
      - variables:
          # External state reads
          home_status: "{{ states('input_select.home_status') }}"
          track_state: "{{ states('group.track_for_home_devices') }}"
          # NOTE: unknown/unavailable behaves as False (safe fail-open for manual override)
          workday_tomorrow: "{{ is_state('binary_sensor.workday_tomorrow', 'on') }}"
          lux: "{{ states('sensor.ljusstyrka') | float(none) }}"
          lux_5: "{{ states('input_number.ljusstyrka_5') | float(5) }}"
          current_option: "{{ states('input_select.light_outside') }}"

          # Time boundaries for typical spa usage
          # 12:00-21:45: typical spa hours (daytime + early evening)
          is_time_12_2145: "{{ (now().hour > 12 or (now().hour == 12 and now().minute >= 0)) and (now().hour < 21 or (now().hour == 21 and now().minute <= 45)) }}"
          # After 22:00: energy-saving gate (unlikely to use spa late night)
          is_time_after_22: "{{ now().hour >= 22 }}"
          # Is ambient light low enough to need outdoor lights?
          is_dark: "{{ lux is number and lux < lux_5 }}"

          valid_options:
            - Släckt
            - Tänd

          desired_option: >-
            {% if home_status == 'Sover' %}
              Släckt
            {% elif track_state != 'home' %}
              Släckt
            {% elif is_time_after_22 and workday_tomorrow %}
              Släckt
            {% elif is_time_12_2145 and is_dark and (not workday_tomorrow) %}
              Tänd
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_outside
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#                 SPABAD SCRIPTS                      #
#                                                     #
#######################################################

  #######################
  ### Spabelysning on ###
  #######################
  spa_light_on:
    alias: Spabelysning on
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.spabad_v') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_v
          brightness_pct: 40
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_m') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_m
          brightness_pct: 40
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_h') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_h
          brightness_pct: 40
          transition: 2

  ########################
  ### Utebelysning on  ###
  ########################
  outside_light_on:
    alias: Utebelysning on
    mode: restart
    sequence:
      - service: script.spa_light_on

  ########################
  ### Utebelysning off ###
  ########################
  outside_light_off:
    alias: Utebelysning off
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.spabad_v') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_v
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_m') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_m
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_h') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_h
          transition: 2
