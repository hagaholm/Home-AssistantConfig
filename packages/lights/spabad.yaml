####################################################
#                                                  #
#               SPABAD PACKAGE                      #
#                                                  #
####################################################
#
# BESKRIVNING:
# Samlar all logik för spabad-belysning i ett paket:
# - input_select.light_outside (Släckt/Tänd) med visningsnamn "Spabad"
# - resolver som synkar input_select via script.spabad_set_correct_mode
# - state machine som exekverar rätt ljusskript
# - scripts för faktisk ljuskontroll
#
# Källor:
# - Tidigare: packages/lights/exterior.yaml
####################################################

#######################
### Input Select(s) ###
#######################
# Helpers moved to packages/lights/helpers/spabad.yaml, scripts to packages/scripts/lights/spabad.yaml (Fas 2)

automation:

#######################################################
#                                                     #
#                 SPABAD AUTOMATION                   #
#                                                     #
#######################################################

  #######################################################
  #                                                     #
  #          SPABAD RESOLVER (DECISION MAKER)         #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # Resolver automation som triggas av externa faktorer och bestämmer
  # önskad ljusstatus. Anropar script.spabad_set_correct_mode som
  # uppdaterar input_select.light_outside om behövligt.
  #
  # TRIGGRAR:
  # - HA start (initiering av system)
  # - sensor.ljusstyrka < 5 lux (mörknar - behöver utomhusbelysning)
  # - Daglig tid 22:00 (kväll → energisparning)
  # - input_select.home_status ändras (hemstatus shift)
  # - group.track_for_home_devices ändras (hemspårning)
  # - binary_sensor.workday_tomorrow ändras (arbetsdagsstatus)
  #
  # LOGIK:
  # - Endast aktiv om input_boolean.lights_auto_spabad = 'on'
  # - Anropar script.spabad_set_correct_mode för beslutsfattning
  # - Script uppdaterar input_select endast om önskad nivå skiljer sig
  #
  # SÄKERHET:
  # - Mode: restart (förhindrar överlappande körningar)
  # - Script gated på input_select state changes (undviker loopar)
  #######################################################
  - alias: Spabad resolver
    id: '1735604100097'
    mode: restart

    condition:
      - condition: state
        entity_id: input_boolean.lights_auto_spabad
        state: 'on'

    trigger:
      - platform: homeassistant
        event: start

      - platform: numeric_state
        entity_id: sensor.ljusstyrka
        below: input_number.ljusstyrka_5

      - platform: time
        at: '22:00:00'

      - platform: state
        entity_id: input_select.home_status
        to: 'Sover'

      - platform: state
        entity_id: group.track_for_home_devices

      - platform: state
        entity_id: binary_sensor.workday_tomorrow

    action:
      - service: script.spabad_set_correct_mode

  #######################################################
  #                                                     #
  #     SPABADBELYSNING (INPUT_SELECT) STATE MACHINE   #
  #                                                     #
  #######################################################
  #
  # BESKRIVNING:
  # State machine automation. Triggas när input_select.light_outside
  # ändras (via resolver script eller manuell override) och exekverar
  # motsvarande effektskript.
  #
  # TRIGGRAR:
  # - input_select.light_outside state changes
  #
  # LOGIK:
  # - Släckt → anropar script.outside_light_off
  # - Tänd → anropar script.outside_light_on
  #
  # FUNKTIONALITET:
  # - Mappning mellan input_select states och effect scripts
  # - Mode: single (förhindrar concurrent körningar)
  # - Only executes known states (Släckt/Tänd)
  #
  # INTEGRATION:
  # - Tillåter manuell override (om user ändrar input_select direkt)
  #######################################################
  - alias: Spabadbelysning (input_select)
    id: 'light_outside_changed'
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.light_outside
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.light_outside
                state: 'Släckt'
            sequence:
              - service: script.outside_light_off
          - conditions:
              - condition: state
                entity_id: input_select.light_outside
                state: 'Tänd'
            sequence:
              - service: script.outside_light_on

##############
### Script ###
##############
