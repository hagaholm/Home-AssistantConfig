####################################################
#                                                  #
#               GOOGLE ASSISTANT                   #
#                                                  #
####################################################
# Google Assistant voice command automations
# Triggered by Google Home devices via switch entities
# Documentation: https://www.home-assistant.io/integrations/google_assistant/
#
# Design Pattern:
# - Virtual switches exposed to Google Assistant
# - Switches turn ON via voice command ("Hey Google, turn on Godnatt")
# - Automation triggers script sequence
# - Switch auto-resets to OFF after execution
#
# Voice Commands:
# - "Godnatt" (Goodnight): Shutdown routine for evening
#
# Safety Notes:
# - Mode: queued (allow multiple voice commands in sequence)
# - Automatic switch reset prevents stuck states
# - 5 second delay ensures script completes before reset
#
####################################################

# Källor:
# - Tidigare Google-assistent/voice-automation i detta repo (paketfil)
#
# BESKRIVNING:
# Automations som triggas av Google Assistant via exponerade switchar.
#

automation:
  - alias: "Godnatt"
    id: '6728860851847'
    # Google Assistant "Goodnight" voice command handler
    # Triggered by: "Hey Google, turn on Godnatt"
    # Actions: Runs goodnight script (lights off, Harmony off, etc)
    # Switch auto-resets after 5 seconds
    mode: queued

    trigger:
      platform: state
      entity_id: switch.ha_godnatt
      to: 'on'

    action:
      - service: script.goodnight_all
        # Executes complete goodnight sequence:
        # - Turn off all lights
        # - Power off entertainment system
        # - Enable night lighting mode
      - delay: '00:00:05'
        # Wait for script completion before resetting switch
      - service: homeassistant.turn_off
        entity_id: switch.ha_godnatt
        # Reset switch for next voice command