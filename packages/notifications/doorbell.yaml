####################################################
#                                                  #
#              DOORBELL (NOTIFICATIONS) PACKAGE     #
#                                                  #
####################################################
# Samlar ringklock-automationer (tvättstuga + hall).
#
# Källor:
# - automations/doorbell.yaml
#
# Säkerhet:
# - IDs, alias, mode och logik bibehållna
####################################################

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#           DOORBELL AUTOMATION                       #
#                                                     #
#######################################################
#
#######################################################

  - alias: Ringklocka hantering
    id: '1735304100001'
    mode: queued
    max: 5

    trigger:
      # Ringklocka tvättstuga
      - platform: state
        entity_id: switch.ringklocka_tvattstuga
        to: 'on'
        id: doorbell_laundry

      # Ringklocka hall
      - platform: state
        entity_id: switch.ringklocka_hall
        to: 'on'
        id: doorbell_hall

      # Enable/disable baserat på närvaro
      - platform: state
        entity_id: group.track_for_home_devices
        to: 'not_home'
        id: disable_doorbell

      - platform: state
        entity_id: group.track_for_home_devices
        to: 'home'
        id: enable_doorbell

    action:
      - choose:
          # RINGKLOCKA TVÄTTSTUGA
          - alias: Tvättstuga ringklocka hantering
            conditions:
              - condition: trigger
                id: doorbell_laundry
            sequence:
              # Stäng av switch
              - service: homeassistant.turn_off
                entity_id: switch.ringklocka_tvattstuga
              - delay:
                  seconds: 5

              # Ljusblinkning om hemma
              - if:
                  - condition: state
                    entity_id: group.track_for_home_devices
                    state: 'home'
                then:
                  - service: light.toggle
                    entity_id: light.vardagsrum_vitrinskap2
                  - delay:
                      seconds: 1
                  - service: light.toggle
                    entity_id: light.vardagsrum_vitrinskap2
                  - delay:
                      seconds: 1
                  - service: light.toggle
                    entity_id: light.vardagsrum_vitrinskap2
                  - delay:
                      seconds: 1
                  - service: light.toggle
                    entity_id: light.vardagsrum_vitrinskap2

              # Snapshot och notifikation baserat på home_status
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Hemma'
                    sequence:
                      - service: camera.snapshot
                        data:
                          entity_id: camera.camera_3
                          filename: /media/Day/camera_3_latest.jpg
                      - service: notify.mobile_app_sm_a528b
                        data:
                          title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          message: "Ringklocka tvättstuga, dag"
                          data:
                            file: /media/Day/camera_3_latest.jpg
                  - conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Sover'
                    sequence:
                      - service: camera.snapshot
                        data:
                          entity_id: camera.camera_3
                          filename: /media/Night/camera_3_latest.jpg
                      - service: notify.mobile_app_sm_a528b
                        data:
                          title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          message: "Ringklocka tvättstuga, natt"
                          data:
                            file: /media/Night/camera_3_latest.jpg
                  - conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Borta'
                    sequence:
                      - service: camera.snapshot
                        data:
                          entity_id: camera.camera_3
                          filename: /media/Away/camera_3_latest.jpg
                      - service: notify.mobile_app_sm_a528b
                        data:
                          title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          message: "Ringklocka tvättstuga, borta"
                          data:
                            file: /media/Away/camera_3_latest.jpg
              - delay:
                  seconds: 10

          # RINGKLOCKA HALL
          - alias: Hall ringklocka hantering
            conditions:
              - condition: trigger
                id: doorbell_hall
            sequence:
              # Stäng av switch
              - service: homeassistant.turn_off
                entity_id: switch.ringklocka_hall
              - delay:
                  seconds: 5

              # Ljusblinkning om hemma
              - if:
                  - condition: state
                    entity_id: group.track_for_home_devices
                    state: 'home'
                then:
                  - service: light.toggle
                    entity_id: light.vardagsrum_vitrinskap2
                  - delay:
                      seconds: 1
                  - service: light.toggle
                    entity_id: light.vardagsrum_vitrinskap2
                  - delay:
                      seconds: 1
                  - service: light.toggle
                    entity_id: light.vardagsrum_vitrinskap2
                  - delay:
                      seconds: 1
                  - service: light.toggle
                    entity_id: light.vardagsrum_vitrinskap2

              # Snapshot och notifikation baserat på home_status
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Hemma'
                    sequence:
                      - service: camera.snapshot
                        data:
                          entity_id: camera.camera_2
                          filename: /media/Day/camera_2_latest.jpg
                      - service: notify.mobile_app_sm_a528b
                        data:
                          title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          message: "Ringklocka hall, dag"
                          data:
                            file: /media/Day/camera_2_latest.jpg
                  - conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Sover'
                    sequence:
                      - service: camera.snapshot
                        data:
                          entity_id: camera.camera_2
                          filename: /media/Night/camera_2_latest.jpg
                      - service: notify.mobile_app_sm_a528b
                        data:
                          title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          message: "Ringklocka hall, natt"
                          data:
                            file: /media/Night/camera_2_latest.jpg
                  - conditions:
                      - condition: state
                        entity_id: input_select.home_status
                        state: 'Borta'
                    sequence:
                      - service: camera.snapshot
                        data:
                          entity_id: camera.camera_2
                          filename: /media/Away/camera_2_latest.jpg
                      - service: notify.mobile_app_sm_a528b
                        data:
                          title: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          message: "Ringklocka hall, borta"
                          data:
                            file: /media/Away/camera_2_latest.jpg
              - delay:
                  seconds: 10

          # INAKTIVERA RINGKLOCKA (BORTA)
          - alias: Inaktivera ringklocka när borta
            conditions:
              - condition: trigger
                id: disable_doorbell
            sequence:
              - service: homeassistant.turn_off
                entity_id: switch.ringklocka

          # AKTIVERA RINGKLOCKA (HEMMA)
          - alias: Aktivera ringklocka när hemma
            conditions:
              - condition: trigger
                id: enable_doorbell
            sequence:
              - service: homeassistant.turn_on
                entity_id: switch.ringklocka
