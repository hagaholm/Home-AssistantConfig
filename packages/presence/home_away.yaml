####################################################
#                                                  #
#             HOME/AWAY (HEMMASTATUS) PACKAGE       #
#                                                  #
####################################################
# Samlar home/away-statuslogik i ett paket.
#
# Källor:
# - automations/home_away.yaml
#
# Entiteter:
# - group.track_for_home_devices
# - group.persons
# - binary_sensor.kok_narvaro
# - input_select.home_status
# - remote.harmony_hub
#
# Säkerhet:
# - ID och alias bibehållna
# - Mode/queued/max enligt original
####################################################

##################
### Automation ###
##################
automation:

#######################################################
#                                                     #
#          HOME/AWAY STATUS AUTOMATION               #
#                                                     #
#######################################################
#
#
# BESKRIVNING:
# Samlad automation för hantering av hem/borta status.
# Aktiverar rätt läge baserat på närvaro och rörelse.
# Styr belysning, media och andra system.
#
# MENTAL MODEL:
# - group.persons och group.track_for_home_devices är de två huvudsakliga
#   källorna för närvaro.
# - input_select.home_status är den enda "house mode" som resten av systemet
#   ska läsa från.
# - Köksrörelse kan väcka huset från Sover till Hemma under dagen.
#
# HÅRDVARA/ENTITETER:
# - group.track_for_home_devices (enhetssparar grupp)
# - group.persons (persongrupp)
# - binary_sensor.kok_narvaro (kök närvarosensor)
# - input_select.home_status (Hemma/Sover/Borta)
# - remote.harmony_hub (mediaspelare)
#
# TRIGGRAR:
# - Borta: home_devices/persons -> 'not_home'
# - Hemma: home_devices/persons -> 'home'
# - Hemma (rörelse): kök närvaro -> 'on'
# - Media off: home_devices -> 'not_home'
#
# VILLKOR:
# - Hemma vid rörelse: home, 05:00-21:00, status='Sover'
#
# LOGIK:
# BORTA MODE:
# - När alla enheter/personer borta
# - Sätter input_select till 'Borta'
#
# HEMMA MODE:
# - När någon kommer hem
# - Sätter input_select till 'Hemma'
#
# HEMMA MODE (RÖRELSE):
# - Rörelse i kök mellan 05:00-21:00
# - Endast om status 'Sover' och någon hemma
# - Ändrar till 'Hemma'
#
# MEDIASPELARE OFF:
# - När alla åker hemifrån
# - Stänger av Harmony Hub
#
# SÄKERHET:
# - Dubbla triggers (devices + persons) för redundans
# - Tidsvillkor förhindrar aktivering nattetid
# - State check för rörelseaktivering
#
# INTEGRATION:
# - input_select.select_option för statusbyte
# - remote.turn_off för media
# - Triggar andra automationer via home_status
#
# KONSOLIDERINGSHISTORIK:
# Denna automation ersätter följande tidigare automationer:
# - Aktivera borta mode (ID: 9332529339727)
# - Aktivera Hemma mode (ID: 4877699058462)
# - Aktivera Hemma mode vid rörelse (ID: 8016198182454)
# - Mediaspelare off (-> borta) (ID: 4088468088280)
# 
# Konsoliderad: 2025-12-27
# Behållet ID: 9332529339727 (från borta mode)
# Anledning: Enklare underhåll, delad logik, samlad statushantering
#
# ÄNDRINGSLOGG:
# v1.0: Ursprungliga separata automationer
# v2.0 (2025-12-27): Konsoliderade alla hem/borta lägen i en automation
#######################################################

  - alias: Hem borta status styrning
    id: '1735304100003'
    mode: queued
    max: 5

    trigger:
      - platform: state
        entity_id:
          - group.track_for_home_devices
          - group.persons
        to:
          - 'home'
          - 'not_home'
        id: presence_changed

      - platform: state
        entity_id: binary_sensor.kok_narvaro
        to: 'on'
        id: motion_wake

    action:
      - variables:
          current_home_status: "{{ states('input_select.home_status') }}"
          someone_is_home: >-
            {{ is_state('group.persons', 'home') or is_state('group.track_for_home_devices', 'home') }}
          motion_wake: >-
            {{ trigger.id == 'motion_wake'
              and is_state('group.track_for_home_devices', 'home')
              and current_home_status == 'Sover'
              and 5 <= now().hour < 21 }}
          target_home_status: >-
            {{ 'Hemma' if (someone_is_home or motion_wake) else 'Borta' }}

      - if:
          - condition: template
            value_template: "{{ target_home_status != current_home_status }}"
        then:
          - service: input_select.select_option
            data:
              entity_id: input_select.home_status
              option: "{{ target_home_status }}"

      - if:
          - condition: template
            value_template: "{{ target_home_status == 'Borta' }}"
        then:
          - service: remote.turn_off
            entity_id: remote.harmony_hub
          - delay: '00:00:15'
          - service: homeassistant.turn_off
            entity_id: switch.vardagsrum_stereobank
          - service: homeassistant.turn_off
            entity_id: switch.vardagsrum_tv
          - service: homeassistant.turn_off
            entity_id: switch.vardagsrum_subbas
