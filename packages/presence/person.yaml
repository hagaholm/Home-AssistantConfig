####################################################
#                                                  #
#                      PERSON                      #
#                                                  #
####################################################
# Person entities are the human-facing presence layer.
# They should be treated as "who is home?" rather than as a
# device-specific tracker.
#
# Simple flow:
#   device_tracker -> person -> group.persons / group.track_for_home_devices -> input_select.home_status
#
# Recommended pattern for phone changes:
# 1. Add the new phone's device tracker to the existing person's device_trackers list.
# 2. Keep the old phone tracker for a transition period (a few days to 1-2 weeks).
# 3. Verify that the person entity still changes to home/away correctly.
# 4. Remove the old tracker only after the new one is reliable and stable.
#
# Notes:
# - A new phone should normally be added to the existing person, not treated as a new person.
# - The person entity is more robust than relying on a single phone tracker.
# - Keep the list of trackers small and meaningful; avoid adding old or unused devices.
#
# Family Members:
# - Micke, Annelie: Parents (primary occupants)
# - Louise, Andreas: Children
# - Herbert, Margareta, Erik: Extended family
#
# Usage:
# - Home/away automations trigger on person state
# - Lighting scenes adjust based on occupancy
# - Security mode activated when all away
# - Welcome home sequences when arriving
#
####################################################

person:
  - name: Micke
    id: micke
    device_trackers:
      - device_tracker.mikaels_a52s
  - name: Annelie
    id: annelie
    device_trackers:
      - device_tracker.annelies_galaxy_a71
  - name: Louise
    id: louise
    device_trackers:
      - device_tracker.louises_a54
  - name: Andreas
    id: andreas
    device_trackers:
      - device_tracker.62_57_81_af_f2_a1
  - name: Herbert
    id: herbert
    device_trackers:
      - device_tracker.mobil_herbert
      - device_tracker.mobil_herbert_2
  - name: Margareta
    id: margareta
    device_trackers:
      - device_tracker.mobil_margareta
  - name: Erik
    id: erik
    device_trackers:
      - device_tracker.mobil_erik

####################################################
#                                                  #
#                       GROUP                      #
#                                                  #
####################################################
group:
  persons:
    name: Personer hemma
    entities:
      - person.micke
      - person.annelie
      - person.louise
      - person.andreas
      - person.herbert
      - person.margareta