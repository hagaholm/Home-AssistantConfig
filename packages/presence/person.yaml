####################################################
#                                                  #
#                      PERSON                      #
#                                                  #
####################################################
# Person entities for presence detection and tracking
# Aggregates multiple device trackers per person
# Documentation: https://www.home-assistant.io/integrations/person/
#
# Design Pattern:
# - Each person has multiple device trackers (phone, WiFi, BT)
# - Home Assistant intelligently determines presence
# - Used by automations for home/away status
# - Updates input_select.home_status based on occupancy
#
# Family Members:
# - Micke, Annelie: Parents (primary occupants)
# - Louise, Andreas: Children
# - Herbert, Margareta, Erik: Extended family
#
# Usage:
# - Home/away automations trigger on person state
# - Lighting scenes adjust based on occupancy
# - Security mode activated when all away
# - Welcome home sequences when arriving
#
####################################################

person:
  - name: Micke
    id: micke
    device_trackers:
      - device_tracker.mikaels_a52s
  - name: Annelie
    id: annelie
    device_trackers:
      - device_tracker.annelies_galaxy_a71
  - name: Louise
    id: louise
    device_trackers:
      - device_tracker.louises_a54
  - name: Andreas
    id: andreas
    device_trackers:
      - device_tracker.62_57_81_af_f2_a1
  - name: Herbert
    id: herbert
    device_trackers:
      - device_tracker.mobil_herbert
      - device_tracker.mobil_herbert_2
  - name: Margareta
    id: margareta
    device_trackers:
      - device_tracker.mobil_margareta
  - name: Erik
    id: erik
    device_trackers:
      - device_tracker.mobil_erik

####################################################
#                                                  #
#                       GROUP                      #
#                                                  #
####################################################
group:
  persons:
    name: Personer hemma
    entities:
      - person.micke
      - person.annelie
      - person.louise
      - person.andreas
      - person.herbert
      - person.margareta