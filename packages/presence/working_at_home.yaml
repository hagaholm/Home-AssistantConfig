####################################################
#                                                  #
#              WORKING AT HOME                     #
#                                                  #
####################################################
# Work-from-home automation for home office lighting
# Automatically controls lighting in Louise's room (home office)
# Triggered by work laptop online/offline status
#
# Design Pattern:
# - Work laptop online detection via network tracker
# - Conditional on: working_at_home boolean + workday
# - Automatic desk lamp and ambient lighting control
# - Camera light notification (doorbell blink warning)
#
# Automation Sequences:
# 1. Laptop Online → Turn on desk lamp (louise_skrivbord)
# 2. Laptop Online → Turn on ambient lights (fonster, golvlampa)
# 3. Laptop Offline → Turn off desk lamp
# 4. Doorbell → Blink lights (camera notification)
#
# Conditions:
# - input_boolean.working_at_home = ON (manual enable)
# - binary_sensor.workday_today = ON (weekdays only)
# - sensor.mickes_work_laptop = Online/Offline
#
# Safety Notes:
# - Mode: single (prevent concurrent executions)
# - Only active on workdays
# - Manual override via input_boolean
#
####################################################

# Källor:
# - Tidigare working_at_home-konfiguration i detta repo (paketfil)
#
# BESKRIVNING:
# Styr arbetsrumsbelysning baserat på arbetsdatorns online-status på vardagar.
#
# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config

#####################
### Input Boolean ###
#####################
input_boolean:
  working_at_home:
    name: Jobbar hemifrån
    # Enable/disable work-from-home automation
    # When ON: Automatic office lighting based on laptop status
    # When OFF: Manual lighting control only

  camera_light_control:
    name: Kameraljus (jobba hemifrån)
    # When ON: triggers a light flash notification while working at home
    # Typically toggled from UI as a manual attention signal

##################
### AUTOMATION ###
##################
automation:
  ################################
  ### Tänd skrivbordsbelysning ###
  ################################
  - alias: Tänd skrivbordsbelysning
    mode: single

    trigger:
      - platform: state
        entity_id: sensor.mickes_work_laptop
        to: 'Online'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_boolean.working_at_home
          state: 'on'
        - condition: state
          entity_id: binary_sensor.workday_today
          state: 'on'

    action:
      - service: light.turn_on
        entity_id: light.louise_skrivbord

  #####################################
  ### Tänd övrig belysning i rummet ###
  #####################################
  - alias: Tänd övrig belysning i rummet
    mode: single

    trigger:
      - platform: state
        entity_id: sensor.mickes_work_laptop
        to: 'Online'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_boolean.working_at_home
          state: 'on'
        - condition: state
          entity_id: binary_sensor.workday_today
          state: 'on'

    action:
      - service: light.turn_on
        entity_id: light.louise_fonster
      - service: light.turn_on
        entity_id: light.louise_golvlampa

  #################################
  ### Släck skrivbordsbelysning ###
  #################################
  - alias: Släck skrivbordsbelysning
    mode: single

    trigger:
      - platform: state
        entity_id: sensor.mickes_work_laptop
        to: 'Offline'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_boolean.working_at_home
          state: 'on'
        - condition: state
          entity_id: binary_sensor.workday_today
          state: 'on'

    action:
      - service: light.turn_off
        entity_id: light.louise_skrivbord

  ###########################################
  ### Blinka med lyset vid jobba hemifrån ###
  ###########################################
  - alias: Blinka med lyset vid jobba hemifrån
    mode: single

    trigger:
      - platform: state
        entity_id: input_boolean.camera_light_control
        to: 'on'
      - platform: state
        entity_id: switch.ringklocka_tvattstuga
        to: 'on'
      - platform: state
        entity_id: switch.ringklocka_hall
        to: 'on'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_boolean.working_at_home
          state: 'on'
        - condition: state
          entity_id: binary_sensor.workday_today
          state: 'on'
        - condition: state
          entity_id: sensor.mickes_work_laptop
          state: 'Online'

    action:
      - service: script.flash_light

##############
### SCRIPT ###
##############
script:
  flash_light:
    alias: Blinka med lyset
    sequence:
      - service: light.toggle
        entity_id: light.louise_skrivbord
      - service: light.toggle
        entity_id: light.vardagsrum_vitrinskap2
      - delay:
          seconds: 1

      - service: light.toggle
        entity_id: light.louise_skrivbord
      - service: light.toggle
        entity_id:  light.vardagsrum_vitrinskap2
      - delay:
          seconds: 1

      - service: light.toggle
        entity_id: light.louise_skrivbord
      - service: light.toggle
        entity_id:  light.vardagsrum_vitrinskap2
      - delay:
          seconds: 1

      - service: light.toggle
        entity_id: light.louise_skrivbord
      - service: light.toggle
        entity_id:  light.vardagsrum_vitrinskap2
