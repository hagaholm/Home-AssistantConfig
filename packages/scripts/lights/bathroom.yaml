# Scripts for bathroom lighting - split out of packages/lights/bathroom.yaml (Fas 2)
# Full documentation: packages/lights/bathroom.yaml

script:

  bathroom_set_correct_mode:
    alias: Återställ badrumsbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          motion: "{{ is_state('binary_sensor.motion_sensor', 'on') }}"
          lux: "{{ states('sensor.kokets_ljusniva') | float(none) }}"
          current_option: "{{ states('input_select.light_bathroom') }}"

          is_dark: "{{ lux is number and lux < 100 }}"
          is_bright: "{{ lux is number and lux > 150 }}"

          valid_options:
            - Släckt
            - Dag
            - Dag närvaro
            - Natt närvaro

          desired_option: >-
            {% if home_status == 'Borta' %}
              Släckt
            {% elif is_bright %}
              Släckt
            {% elif home_status == 'Sover' %}
              {% if motion and is_dark %}
                Natt närvaro
              {% else %}
                Släckt
              {% endif %}
            {% elif home_status == 'Hemma' and is_dark %}
              {% if motion %}
                Dag närvaro
              {% else %}
                Dag
              {% endif %}
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_bathroom
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#            BADRUMSBELYSNING SCRIPTS                 #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Styr badrumsbelysning med olika nivåer beroende på
# tid på dygnet och närvaro.
#
# HÅRDVARA:
# - Fönsterspottar: light.fonster_spott
#
# SCRIPTS:
# - bathroom_light_off: Släcker all belysning
# - bathroom_light_day: 20% - Mjukt dagsljus
# - bathroom_light_day_presence: 80% - Fullt dagsljus vid närvaro
# - bathroom_light_night_presence: 2% - Minimalt nattljus vid närvaro
#
# SÄKERHET:
# - Mode: restart - avbryter tidigare körning vid ny trigger
# - Tillgänglighetskontroll av ljusenheter
# - Mjuka övergångar (1s) för att undvika abrupt ljusväxling
#
# ANVÄNDNING:
# Anropas från input_select_light_bathroom.yaml automation
# baserat på tid och rörelsedetektering.
#######################################################

  ###############################
  ### Badrumsbelysning släckt ###
  ###############################
  bathroom_light_off:
    alias: Badrumsbelysning släckt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.fonster_spott') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.fonster_spott
          transition: 1

  ############################
  ### Badrumsbelysning dag ###
  ############################
  bathroom_light_day:
    alias: Badrumsbelysning dag
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.fonster_spott') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.fonster_spott
          brightness_pct: 20
          transition: 1

  ####################################
  ### Badrumsbelysning dag närvaro ###
  ####################################
  bathroom_light_day_presence:
    alias: Badrumsbelysning dag närvaro
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.fonster_spott') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.fonster_spott
          brightness_pct: 80
          transition: 1

  #####################################
  ### Badrumsbelysning natt närvaro ###
  #####################################
  bathroom_light_night_presence:
    alias: Badrumsbelysning natt närvaro
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.fonster_spott') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.fonster_spott
          brightness_pct: 2
          transition: 2
