# Scripts for facade lighting - split out of packages/lights/facade.yaml (Fas 2)
# Full documentation: packages/lights/facade.yaml

script:

  facade_set_correct_mode:
    alias: Återställ fasadbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          lux: "{{ states('sensor.ljusstyrka') | float(none) }}"
          lux_40: "{{ states('input_number.ljusstyrka_40') | float(40) }}"
          lux_60: "{{ states('input_number.ljusstyrka_60') | float(60) }}"

          person_cam10: "{{ is_state('binary_sensor.cam10_person_occupancy', 'on') }}"
          person_cam8: "{{ is_state('binary_sensor.cam8_person_occupancy', 'on') }}"
          person_cam9: "{{ is_state('binary_sensor.cam9_person_occupancy', 'on') }}"
          person_any: "{{ person_cam10 or person_cam8 or person_cam9 }}"

          current_option: "{{ states('input_select.facade_lights') }}"
          is_bright: "{{ lux is number and lux > lux_60 }}"
          is_dark: "{{ lux is number and lux < lux_40 }}"
          is_not_too_bright: "{{ lux is number and lux < lux_60 }}"

          valid_options:
            - Släckt
            - Morgon/Kväll
            - Natt
            - Person upptäckt

          desired_option: >-
            {% if is_bright %}
              Släckt
            {% elif person_any and is_not_too_bright %}
              Person upptäckt
            {% elif home_status == 'Sover' and is_not_too_bright %}
              Natt
            {% elif is_dark %}
              Morgon/Kväll
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.facade_lights
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#             FASADBELYSNING SCRIPTS                  #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Scenarier för fasadbelysning (släckt, morgon/kväll, natt, person upptäckt).
#
# HÅRDVARA:
# - light.friggebod_fasad
# - light.forrad_fasad
# - light.tvattstugan_fasad
# - light.huvudentre2
#
# SÄKERHET:
# - Mode: restart – förhindrar överlapp
# - Tillgänglighetskontroller per armatur
# - Mjuka övergångar (1s)
#######################################################

  fasadbelysning_off:
    alias: Fasadbelysning släckt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.forrad_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.tvattstugan_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.huvudentre2
          transition: 1

  fasadbelysning_on:
    alias: Fasadbelysning tänd
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 60
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 60
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 80
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1

  fasadbelysning_night:
    alias: Fasadbelysning natt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 45
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 65
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.huvudentre2
          transition: 1

  fasadbelysning_max:
    alias: Fasadbelysning max
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 100
          transition: 1
      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1
