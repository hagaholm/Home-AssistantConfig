# Scripts for outdoor_room lighting - split out of packages/lights/outdoor_room.yaml (Fas 2)
# Full documentation: packages/lights/outdoor_room.yaml

script:

  uterum_set_correct_mode:
    alias: Återställ uterumsbelysning (sätt korrekt läge)
    mode: single
    sequence:
      - variables:
          home_status: "{{ states('input_select.home_status') }}"
          track_state: "{{ states('group.track_for_home_devices') }}"
          lux: "{{ states('sensor.ljusstyrka') | float(none) }}"
          lux_150: "{{ states('input_number.ljusstyrka_150') | float(150) }}"
          lux_200: "{{ states('input_number.ljusstyrka_200') | float(200) }}"
          temp: "{{ states('sensor.uterum_temperatur') | float(none) }}"
          current_option: "{{ states('input_select.light_uterum') }}"
          away_long_enough: >-
            {% from 'home_status.jinja' import borta_long_enough %}
            {{ (borta_long_enough(60) | trim) == 'True' }}

          is_time_12_2145: "{{ (now().hour > 12 or (now().hour == 12 and now().minute >= 0)) and (now().hour < 21 or (now().hour == 21 and now().minute <= 45)) }}"
          is_time_08_22: >-
            {% from 'time_windows.jinja' import in_time_range %}
            {{ in_time_range(8, 0, 22, 0) }}
          is_dark_for_room_lights: "{{ lux is number and lux < lux_150 }}"
          is_dark_for_window: "{{ lux is number and lux < lux_200 }}"
          is_bright_for_window: "{{ lux is number and lux > lux_200 }}"
          temp_ok: "{{ temp is number and temp > 18 }}"
          temp_too_cold: "{{ temp is number and temp < 17 }}"

          valid_options:
            - Släckt
            - Fönsterbelysning
            - Tänd

          room_lights_should_be_on: >-
            {% if home_status == 'Sover' %}
              False
            {% elif track_state != 'home' %}
              False
            {% elif temp_too_cold | bool %}
              False
            {% elif (is_time_12_2145 | bool) and (is_dark_for_room_lights | bool) and (temp_ok | bool) %}
              True
            {% else %}
              {{ current_option == 'Tänd' }}
            {% endif %}

          window_should_be_on: >-
            {% if home_status == 'Sover' %}
              False
            {% elif home_status == 'Borta' and not (is_time_08_22 | bool) %}
              False
            {% elif home_status == 'Borta' and not (away_long_enough | bool) %}
              {{ is_state('light.uterum_fonster', 'on') }}
            {% elif is_dark_for_window | bool %}
              True
            {% elif is_bright_for_window | bool %}
              False
            {% else %}
              {{ is_state('light.uterum_fonster', 'on') }}
            {% endif %}

          desired_option: >-
            {% if room_lights_should_be_on | bool %}
              Tänd
            {% elif window_should_be_on | bool %}
              Fönsterbelysning
            {% else %}
              Släckt
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_uterum
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#             UTERUMS BELYSNING SCRIPTS               #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Tänder/släcker uterumsbelysning och uppdaterar state-maskin.
#
# HÅRDVARA:
# - light.uterum_led
# - light.uterum_fotogenlampa
# - light.uterum_fonster
# - input_select.light_uterum (state)
#
# SÄKERHET:
# - Mode: restart – hindrar överlappande körningar
# - Tillgänglighetskontroll för båda lampor
# - Mjuka övergångar (1s)
#######################################################

  ############################
  ### Uterums belysning on ###
  ############################
  outdoor_room_light_on:
    alias: Uterums belysning on
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.uterum_led') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.uterum_led
          transition: 1
      - condition: template
        value_template: "{{ states('light.uterum_fotogenlampa') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.uterum_fotogenlampa
          transition: 1

  #############################
  ### Uterums belysning off ###
  #############################
  outdoor_room_light_off:
    alias: Uterums belysning off
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.uterum_led') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.uterum_led
          transition: 1
      - condition: template
        value_template: "{{ states('light.uterum_fotogenlampa') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.uterum_fotogenlampa
          transition: 1

  uterum_window_light_on:
    alias: Uterum fönsterbelysning on
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.uterum_fonster') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.uterum_fonster
          brightness_pct: 80
          transition: 1

  uterum_window_light_off:
    alias: Uterum fönsterbelysning off
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.uterum_fonster') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.uterum_fonster
          transition: 1

  uterum_goodnight_off:
    alias: Uterum släckt vid godnatt
    mode: restart
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.light_uterum
          option: Släckt
      - service: script.outdoor_room_light_off
      - service: script.uterum_window_light_off
