# Scripts for spabad lighting - split out of packages/lights/spabad.yaml (Fas 2)
# Full documentation: packages/lights/spabad.yaml

script:

  spabad_set_correct_mode:
    alias: Återställ spabadbelysning (sätt korrekt läge)
    description: >
      Decision-making script för spabadbelysning.
      Läser hemstatus, ljusnivå, tid och arbetsdagsstatus,
      sedan bestämmer önskad spabadläge och uppdaterar input_select
      endast om det skiljer sig från aktuell status (undviker loops).
    mode: single
    sequence:
      - variables:
          # External state reads
          home_status: "{{ states('input_select.home_status') }}"
          track_state: "{{ states('group.track_for_home_devices') }}"
          # NOTE: unknown/unavailable behaves as False (safe fail-open for manual override)
          workday_tomorrow: "{{ is_state('binary_sensor.workday_tomorrow', 'on') }}"
          lux: "{{ states('sensor.ljusstyrka') | float(none) }}"
          lux_5: "{{ states('input_number.ljusstyrka_5') | float(5) }}"
          current_option: "{{ states('input_select.light_outside') }}"

          # Time boundaries for typical spa usage
          # 12:00-21:45: typical spa hours (daytime + early evening)
          is_time_12_2145: "{{ (now().hour > 12 or (now().hour == 12 and now().minute >= 0)) and (now().hour < 21 or (now().hour == 21 and now().minute <= 45)) }}"
          # After 22:00: energy-saving gate (unlikely to use spa late night)
          is_time_after_22: "{{ now().hour >= 22 }}"
          # Is ambient light low enough to need outdoor lights?
          is_dark: "{{ lux is number and lux < lux_5 }}"

          valid_options:
            - Släckt
            - Tänd

          desired_option: >-
            {% if home_status == 'Sover' %}
              Släckt
            {% elif track_state != 'home' %}
              Släckt
            {% elif is_time_after_22 and workday_tomorrow %}
              Släckt
            {% elif is_time_12_2145 and is_dark and (not workday_tomorrow) %}
              Tänd
            {% else %}
              {{ current_option }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (desired_option | trim) in valid_options and (desired_option | trim) != (current_option | trim) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.light_outside
                  option: "{{ desired_option | trim }}"

        default: []

#######################################################
#                                                     #
#                 SPABAD SCRIPTS                      #
#                                                     #
#######################################################

  #######################
  ### Spabelysning on ###
  #######################
  spa_light_on:
    alias: Spabelysning on
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.spabad_v') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_v
          brightness_pct: 40
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_m') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_m
          brightness_pct: 40
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_h') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.spabad_h
          brightness_pct: 40
          transition: 2

  ########################
  ### Utebelysning on  ###
  ########################
  outside_light_on:
    alias: Utebelysning on
    mode: restart
    sequence:
      - service: script.spa_light_on

  ########################
  ### Utebelysning off ###
  ########################
  outside_light_off:
    alias: Utebelysning off
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.spabad_v') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_v
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_m') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_m
          transition: 2
      - condition: template
        value_template: "{{ states('light.spabad_h') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.spabad_h
          transition: 2
