####################################################
#                                                  #
#           SENSOR READING MISSING                #
#                                                  #
####################################################
# Temperature sensor availability monitoring system
# Detects when sensors stop reporting and sends alerts
# Template sensors: packages/template_sensor_reading_missing.yaml
#
# Monitored Sensors:
# - Critical: Frys (freezer), Kyl (refrigerator)
# - Rooms: Badrum, Hall, Vardagsrum, Louise rum
# - Climate: Tvättstuga, Värmepump, Uterum, Sovrum
# - Outdoor: Förråd, Garage, Friggebod, Ute friggebod
# - Ventilation: Uteluft, Avluft, Tilluft, Franluft
# - Light: Ljusstyrka sensor
#
# Design Pattern:
# - Time pattern trigger checks every 5 minutes
# - Template sensors track last_changed timestamp
# - If sensor unchanged > threshold: Send notification
# - Input booleans enable/disable alarms per sensor
#
# Safety Notes:
# - Critical sensors (freezer/fridge) have stricter thresholds
# - Notifications sent via persistent_notification service
# - Manual alarm enable/disable prevents alert spam
#
####################################################

# Källor:
# - Tidigare sensor-övervakning i detta repo (paketfil)
#
# BESKRIVNING:
# Övervakar att sensorer uppdateras och larmar vid uteblivna avläsningar.
#
# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config

#########################################################
# Template timestamp sensors migrated to:
# packages/template_sensor_reading_missing.yaml
#########################################################

input_boolean:
  frys_reading_missing_alarm:
    name: Frys avläsning saknas larm aktiverat
    initial: off
  kyl_reading_missing_alarm:
    name: Kyl avläsning saknas larm aktiverat
    initial: off
  badrum_reading_missing_alarm:
    name: Badrum avläsning saknas larm aktiverat
    initial: off
  tvattstuga_reading_missing_alarm:
    name: Tvättstuga avläsning saknas larm aktiverat
    initial: off
  varmepump_reading_missing_alarm:
    name: Värmepump avläsning saknas larm aktiverat
    initial: off
  vardagsrum_reading_missing_alarm:
    name: Vardagsrum avläsning saknas larm aktiverat
    initial: off
  hall_reading_missing_alarm:
    name: Hall avläsning saknas larm aktiverat
    initial: off
  forrad_reading_missing_alarm:
    name: Förråd avläsning saknas larm aktiverat
    initial: off
  garage_reading_missing_alarm:
    name: Garage avläsning saknas larm aktiverat
    initial: off
  friggebod_reading_missing_alarm:
    name: Friggebod avläsning saknas larm aktiverat
    initial: off
  ute_friggebod_reading_missing_alarm:
    name: Ute friggebod avläsning saknas larm aktiverat
    initial: off

#########################################################
automation:
  - alias: Avläsning saknas, frys
    id: '4782464542967' 

    trigger:
      - platform: time_pattern
        minutes: "/5"

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: input_boolean.frys_reading_missing_alarm
          state: 'off'
        - condition: template
          value_template: >
            {% if state_attr('sensor.frys_temperature', 'last_updated') == None %} 
              0
            {% else %} 
              {{ (as_timestamp(now())-as_timestamp(states.sensor.frys_temperature.last_updated)) > 7200 }}
            {% endif %}

    action:
      - service: homeassistant.turn_on
        entity_id: input_boolean.frys_reading_missing_alarm
#      - service: notify.mobile_app_sm_a528b
#        data:
#          message: 'Frys - ingen avläsning på 2 timmar'
