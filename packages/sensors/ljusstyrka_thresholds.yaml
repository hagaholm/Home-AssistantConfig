####################################################
#                                                  #
#           LJUSSTYRKA THRESHOLDS                 #
#                                                  #
####################################################
# Light sensor threshold configuration for automations
# Defines lux thresholds for automatic lighting control
# Documentation: https://www.home-assistant.io/integrations/input_number/
#
# Purpose:
# - Configurable thresholds for dusk/dawn detection
# - Adjustable via UI without automation editing
# - Separate on/off thresholds prevent lighting flicker
# - Different thresholds for different lighting modes
#
# Threshold Categories:
# - Inside sensors: Kitchen, morning, day, evening, night
# - Outside sensors: Facade, garden, outdoor
# - Hysteresis: On threshold < Off threshold (prevents oscillation)
#
# Usage:
# - Automations compare sensor.ljusstyrka to these thresholds
# - When lux < threshold_on: Turn lights on
# - When lux > threshold_off: Turn lights off
# - UI sliders allow runtime adjustment
#
####################################################

####################
### Input Number ###
####################
input_number:
  ###############################################
  # Values from inside sensor to be used inside #
  ###############################################
  inside_kitchen_light_on:
    name: Inside kitchen light On
    initial: 320
    max: 600
    min: 20
    step: 20
    mode: box

  inside_kitchen_light_off:
    name: Inside kitchen light Off
    initial: 400
    max: 600
    min: 20
    step: 20
    mode: box

  inside_morning_light_on:
    name: Inside morning light On
    initial: 100
    max: 100
    min: 0
    step: 10
    mode: box

  inside_morning_light_off:
    name: Inside morning light Off
    initial: 150
    max: 200
    min: 100
    step: 10
    mode: box
    
  inside_daylight_on:
    name: Inside daylight On
    initial: 150
    max: 200
    min: 100
    step: 10
    mode: box

  inside_daylight_off:
    name: Inside daylight Off
    initial: 200
    max: 250
    min: 150
    step: 10
    mode: box

  inside_awaylight_on:
    name: Inside awaylight On
    initial: 30
    max: 100
    min: 10
    step: 10
    mode: box

  inside_awaylight_off:
    name: Inside awaylight Off
    initial: 60
    max: 100
    min: 10
    step: 10
    mode: box

  ################################################
  # Values from outside sensor to be used inside #
  ################################################
  kitchen_light_on:
    name: On (3000,4000)
    initial: 3000
    max: 5000
    min: 2500
    step: 500
    mode: box

  kitchen_light_off:
    name: Off (3500,5000)
    initial: 3500
    max: 6000
    min: 3000
    step: 500
    mode: box

  morning_light_on:
    name: On (2000,3000)
    initial: 2000
    max: 4000
    min: 2000
    step: 500
    mode: box

  morning_light_off:
    name: Off (2500,4000)
    initial: 2500
    max: 5000
    min: 2000
    step: 500
    mode: box

  daylight_on:
    name: On (2000,3500)
    initial: 2000
    max: 5000
    min: 1500
    step: 500
    mode: box

  daylight_off:
    name: Off (2500,4500)
    initial: 2500
    max: 5000
    min: 2000
    step: 500
    mode: box

  awaylight_on:
    name: On (200)
    initial: 200
    max: 500
    min: 100
    step: 50
    mode: box

  awaylight_off:
    name: Off (250)
    initial: 250
    max: 500
    min: 100
    step: 50
    mode: box

  #################################################
  # Values from outside sensor to be used outside #
  #################################################
  ljusstyrka_150:
    name: Ljusstyrka 150
    initial: 150
    min: 0
    max: 1000
    step: 1
  ljusstyrka_200:
    name: Ljusstyrka 200
    initial: 200
    min: 0
    max: 1000
    step: 1
  ljusstyrka_60:
    name: Ljusstyrka 60
    initial: 60
    min: 0
    max: 1000
    step: 1
  ljusstyrka_40:
    name: Ljusstyrka 40
    initial: 40
    min: 0
    max: 1000
    step: 1
  ljusstyrka_5:
    name: Ljusstyrka 5
    initial: 5
    min: 0
    max: 1000
    step: 1
  ljusstyrka_1:
    name: Ljusstyrka 1
    initial: 1
    min: 0
    max: 1000
    step: 1

#####################
### Input Boolean ###
#####################
input_boolean:
  kitchen_light_on:
    name: Köksbelysning on

  morning_light_on:
    name: Morgonbelysning on

  daylight_on:
    name: Dagbelysning on

  awaylight_on:
    name: Bortabelysning on

##################
### Automation ###
##################
automation:
  ##################################
  - alias: Kitchen light on - inside
    id: '4720950564444' 

    trigger:
      - platform: template
        value_template: >
          {% set curr_level = states('sensor.kokets_ljusniva') %}
          {% set set_level = states('input_number.inside_kitchen_light_on') %}
          {{ curr_level not in ['unknown', 'unavailable', ''] and (curr_level | int(0)) < (set_level | int(0)) }}
        for:
          minutes: 2

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id:  input_boolean.kitchen_light_on
          state: 'off'

    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.kitchen_light_on

  ###################################
  - alias: Kitchen light on - outside
    id: '3203744919900' 

    trigger:
      - platform: template
        value_template: "{{ (states('sensor.ljusstyrka') | int(0)) < (states('input_number.kitchen_light_on') | int(0)) }}"

    condition:
      condition: and
      conditions:
        - condition: state
