##############
### Script ###
##############
script:
  # Script: Send lux sensor values to mobile notification
  send_lux_values:
    alias: "Send lux sensor values"
    sequence:
      - service: notify.mobile_app_sm_a528b
        data:
          title: "Ljusnivåer. {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: |
            Utomhus    {{ states('sensor.ljusstyrka') | int(0) }} lx
            Kökets     {{ states('sensor.kokets_ljusniva') | int(0) }} lx
            Hall       {{ states('sensor.hall_ljusniva') | int(0) }} lx
            Vardagsrum {{ states('sensor.vardagsrum_ljusniva') | int(0) }} lx
