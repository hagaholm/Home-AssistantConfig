####################################################
#                                                  #
#            TEMPLATE SENSOR - LJUSSTYRKA         #
#                                                  #
####################################################
# Template sensor for ambient light measurement
# Provides calibrated lux reading for lighting automation
# Documentation: https://www.home-assistant.io/integrations/template/
#
# Purpose:
# - Monitors outdoor light levels via TSL2591 sensor
# - Used by dusk/dawn automation for lighting triggers
# - Prevents camera spotlights from feeding their own light back into automation
#
# Logic:
# - Reads from sensor.ljusstyrka_measured (MQTT TSL2591)
# - Holds the last ambient reading while the sensor-facing spotlights are on
#   and briefly after they turn off, while the sensor settles
# - Returns rounded lux value for threshold comparisons
#
# Usage:
# - Trigger: automation when lux < threshold (turn lights on)
# - Trigger: automation when lux > threshold (turn lights off)
# - Display: UI dashboard for current light levels
#
####################################################

# Källor:
# - Tidigare ljusstyrka/template-konfiguration i detta repo (paketfil)
#
# BESKRIVNING:
# Kalibrerad ljusstyrka (lux) som används av belysningsautomationer.
#

# Modern template sensor for Ljusstyrka (Ambient Light Level)
template:
  - sensor:
      - name: "Ljusstyrka"
        unit_of_measurement: "lx"
        unique_id: sensor_ljusstyrka_calibrated
        # Primary ambient light sensor for automation triggers
        # Holds ambient lux from before the spotlights turn on and while the sensor settles after they turn off.
        state: >-
          {% set sensor_lights_on =
            is_state('light.stralkastare_husgavel', 'on')
            or is_state('light.kamera5_stralkastare', 'on')
            or is_state('light.kamera6_stralkastare', 'on')
          %}
          {% set light_changed_recently =
            (as_timestamp(now()) - as_timestamp(states.light.stralkastare_husgavel.last_changed, 0)) < 10
            or (as_timestamp(now()) - as_timestamp(states.light.kamera5_stralkastare.last_changed, 0)) < 10
            or (as_timestamp(now()) - as_timestamp(states.light.kamera6_stralkastare.last_changed, 0)) < 10
          %}
          {% set previous_lux = this.state | float(none) %}
          {% if (sensor_lights_on or light_changed_recently) and previous_lux is number %}
            {{ previous_lux | round(0) }}
          {% else %}
            {{ states('sensor.ljusstyrka_measured') | float(0) | round(0) }}
          {% endif %}
        availability: "{{ states('sensor.ljusstyrka_measured') not in ['unknown', 'unavailable'] }}"
