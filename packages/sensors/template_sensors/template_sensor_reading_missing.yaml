# Källor:
# - packages/sensor_reading_missing.yaml (migrerade template timestamp-sensorer)
#
# BESKRIVNING:
# Template-sensorer för "senast uppdaterad"-tidsstämplar med device_class: timestamp.
#

# Keep the same friendly names and device_class: timestamp

template:
  - sensor:
      - name: "Frys temp senast uppdaterad"
        availability: "{{ states.sensor.frys_temperature is defined and states.sensor.frys_temperature.last_updated is not none }}"
        state: "{{ states.sensor.frys_temperature.last_updated if states.sensor.frys_temperature is defined else none }}"
        device_class: timestamp
        icon: >-
          {% set lu = states.sensor.frys_temperature.last_updated if states.sensor.frys_temperature is defined else none %}
          {% if lu is none %}
            mdi:progress-check
          {% elif (as_timestamp(now()) - as_timestamp(lu) > 100) %}
            mdi:progress-alert
          {% else %}
            mdi:progress-check
          {% endif %}

