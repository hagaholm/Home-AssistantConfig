# Källor:
# - packages/sensor_reading_missing.yaml (migrerade template timestamp-sensorer)
#
# BESKRIVNING:
# Template-sensorer för "senast uppdaterad"-tidsstämplar med device_class: timestamp.
#

# Keep the same friendly names and device_class: timestamp

template:
  - sensor:
      - name: "Frys temp senast uppdaterad"
        availability: "{{ states.sensor.frys_temperature is not none }}"
        state: >-
          {% set sensor = states.sensor.frys_temperature %}
          {{ sensor.last_updated.isoformat() if sensor is not none else 'unknown' }}
        device_class: timestamp
        icon: >-
          {% set sensor = states.sensor.frys_temperature %}
          {% set lu = sensor.last_updated if sensor is not none else none %}
          {% if lu is none or (as_timestamp(now()) - as_timestamp(lu, default=0) > 100) %}
            mdi:progress-alert
          {% else %}
            mdi:progress-check
          {% endif %}

      - name: "Kyl temp senast uppdaterad"
        availability: "{{ states.sensor.kyl_temperature is not none }}"
        state: >-
          {% set sensor = states.sensor.kyl_temperature %}
          {{ sensor.last_updated.isoformat() if sensor is not none else 'unknown' }}
        device_class: timestamp
        icon: >-
          {% set sensor = states.sensor.kyl_temperature %}
          {% set lu = sensor.last_updated if sensor is not none else none %}
          {% if lu is none or (as_timestamp(now()) - as_timestamp(lu, default=0) > 100) %}
            mdi:progress-alert
          {% else %}
            mdi:progress-check
          {% endif %}

      - name: "Badrum temp senast uppdaterad"
        availability: "{{ states.sensor.badrum_temperatur is defined and states.sensor.badrum_temperatur.last_updated is not none and states.sensor.badrum_temperatur.last_updated != '' }}"
        state: "{{ states.sensor.badrum_temperatur.last_updated.isoformat() if states.sensor.badrum_temperatur is defined and states.sensor.badrum_temperatur.last_updated is not none and states.sensor.badrum_temperatur.last_updated != '' else 'unknown' }}"
        device_class: timestamp
        icon: >-
          {% set lu = states.sensor.badrum_temperatur.last_updated if states.sensor.badrum_temperatur is defined and states.sensor.badrum_temperatur.last_updated is not none and states.sensor.badrum_temperatur.last_updated != '' else none %}
          {% if lu is none %}
            mdi:progress-check
          {% elif (as_timestamp(now()) - as_timestamp(lu) > 100) %}
            mdi:progress-alert
          {% else %}
            mdi:progress-check
          {% endif %}

      - name: "Badrum fukt senast uppdaterad"
        availability: "{{ states.sensor.badrum_luftfuktighet is defined and states.sensor.badrum_luftfuktighet.last_updated is not none and states.sensor.badrum_luftfuktighet.last_updated != '' }}"
        state: "{{ states.sensor.badrum_luftfuktighet.last_updated.isoformat() if states.sensor.badrum_luftfuktighet is defined and states.sensor.badrum_luftfuktighet.last_updated is not none and states.sensor.badrum_luftfuktighet.last_updated != '' else 'unknown' }}"
        device_class: timestamp
        icon: >-
          {% set lu = states.sensor.badrum_luftfuktighet.last_updated if states.sensor.badrum_luftfuktighet is defined and states.sensor.badrum_luftfuktighet.last_updated is not none and states.sensor.badrum_luftfuktighet.last_updated != '' else none %}
          {% if lu is none %}
            mdi:progress-check
          {% elif (as_timestamp(now()) - as_timestamp(lu) > 100) %}
            mdi:progress-alert
          {% else %}
            mdi:progress-check
          {% endif %}

      # ... other sensors migrated similarly ...
      - name: "Aqara Multi Sensor 4 fukt senast uppdaterad"
        availability: "{{ states.sensor.aqara_multi_sensor_4_humidity is not none }}"
        state: >-
          {% set sensor = states.sensor.aqara_multi_sensor_4_humidity %}
          {{ sensor.last_updated.isoformat() if sensor is not none else 'unknown' }}
        device_class: timestamp
        icon: >-
          {% set sensor = states.sensor.aqara_multi_sensor_4_humidity %}
          {% set lu = sensor.last_updated if sensor is not none else none %}
          {% if lu is none or (as_timestamp(now()) - as_timestamp(lu, default=0) > 100) %}
            mdi:progress-alert
          {% else %}
            mdi:progress-check
          {% endif %}
