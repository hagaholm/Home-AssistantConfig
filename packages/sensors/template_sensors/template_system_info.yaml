####################################################
#                                                  #
#         TEMPLATE SENSORS - SYSTEM INFO          #
#                                                  #
####################################################
# Device presence and availability template sensors
# Converts device_tracker states to Online/Offline status
# Documentation: https://www.home-assistant.io/integrations/template/
#
# Purpose:
# - Monitor network device connectivity
# - Display friendly Online/Offline status in UI
# - Trigger alerts when critical devices go offline
#
# Device Categories:
# - Network Infrastructure: Router, NAS, Raspberry Pi servers
# - Entertainment: Harmony Hub, Chromecast, TV, receiver
# - Smart Home: cameras, sensors
# - People: Family member phones and computers
#
# Usage:
# - UI dashboard: System health monitoring
# - Automations: Device availability checks
# - Alerts: Notify when critical devices offline
#
####################################################

# Källor:
# - packages/system_info.yaml (template-sensorer bröts ut hit)
#
# BESKRIVNING:
# Template-sensorer för enhetsnärvaro/online-status (friendly Online/Offline).
#

# Modern template sensors migrated from packages/system_info.yaml
template:
  - sensor:
      - name: "Nas DNS-320"
        unique_id: system_nas_status
        state: "{{ 'Online' if is_state('device_tracker.dns320', 'home') else 'Offline' }}"
        # Network attached storage (file server)

      # Entertainment System Devices
      - name: "Harmony Hub"
        unique_id: system_harmony_status
        state: "{{ 'Online' if is_state('device_tracker.harmonyhub', 'home') else 'Offline' }}"
        # Logitech Harmony Hub IR control system
        
      - name: "Canal Digital"
        unique_id: system_sat_receiver_status
        state: "{{ 'Online' if is_state('device_tracker.68_63_59_44_5a_17', 'home') else 'Offline' }}"
        # Satellite TV receiver
        
      - name: "SqueezeBox Classic"
