# Källor:
# - Zigbee/Timmerflotte Temp & Humidity Sensor (32773) (Hall) (template-"proxy"-sensorer)
#
# BESKRIVNING:
# Template-sensorer för temperatur/fukt i Hall baserat på den ersatta Timmerflotte-sensorn.
#
#
# Ändringar v1.2 (2026-09-11):
# - Byt från Timmerflotte Temp & Humidity Sensor 2 till sensor 5 / 32773

# Timmerflotte Temp & Humidity Sensor (Hall)
template:
  - sensor:
      # Source: Timmerflotte Temp & Humidity Sensor (32773)
      # Company: IKEA of Sweden
      # Type: Temperature, Humidity sensor
      - name: "Hall Temperatur"
        unique_id: hall_timmerflotte_temperatur
        state: "{{ states('sensor.timmerflotte_temp_hmd_sensor_temperatur_5') | float(0) }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ states('sensor.timmerflotte_temp_hmd_sensor_temperatur_5') not in ['unknown', 'unavailable', ''] }}"
        attributes:
          source_sensor: sensor.timmerflotte_temp_hmd_sensor_temperatur_5
          icon: mdi:thermometer
          friendly_name: Hall Temperatur

      - name: "Hall Luftfuktighet"
        unique_id: hall_timmerflotte_luftfuktighet
        state: "{{ states('sensor.timmerflotte_temp_hmd_sensor_luftfuktighet_5') | float(0) }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: "{{ states('sensor.timmerflotte_temp_hmd_sensor_luftfuktighet_5') not in ['unknown', 'unavailable'] }}"
        attributes:
          source_sensor: sensor.timmerflotte_temp_hmd_sensor_luftfuktighet_5
          icon: mdi:water-percent
          friendly_name: Hall Luftfuktighet

