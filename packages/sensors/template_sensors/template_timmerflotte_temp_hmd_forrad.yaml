# Källor:
# - Zigbee/Timmerflotte Temp & Humidity Sensor (Förråd) (template-"proxy"-sensorer)
#
# BESKRIVNING:
# Template-sensorer för temperatur/fukt i Förråd baserat på Timmerflotte-sensorn.
#
#
# Ändringar v1.1 (2026-01-16):
# - Migrera från 433 till Timmerflotte Temp & Humidity Sensor

# Timmerflotte Temp & Humidity Sensor (Förråd)
template:
  #
  # Förråd Temperatur – med backup efter 30 minuter och logg
  #
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - sensor.timmerflotte_temp_hmd_sensor_temperatur
          - sensor.forrad_backup_temperature

    sensor:
      - name: "Förråd Temperatur"
        unique_id: forrad_timmerflotte_temperatur
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set primary = states('sensor.timmerflotte_temp_hmd_sensor_temperatur') | float(none) %}
          {% set backup = states('sensor.forrad_backup_temperature') | float(none) %}
          {% set primary_sensor = states.sensor.timmerflotte_temp_hmd_sensor_temperatur %}
          {% set primary_last = primary_sensor.last_changed if primary_sensor is not none else none %}
          {% set now_ts = as_timestamp(now()) %}
          {% set primary_last_ts = as_timestamp(primary_last, default=0) %}

          {% if primary is not none and primary_last is not none and (now_ts - primary_last_ts) < 1800 %}
            {{ primary }}
          {% elif backup is not none %}
            {{ backup }}
          {% else %}
            0
          {% endif %}
        availability: >
          {{ is_number(states('sensor.timmerflotte_temp_hmd_sensor_temperatur'))
             or is_number(states('sensor.forrad_backup_temperature')) }}
        attributes:
          source_sensor: >
            {% set primary = states('sensor.timmerflotte_temp_hmd_sensor_temperatur') | float(none) %}
            {% set primary_sensor = states.sensor.timmerflotte_temp_hmd_sensor_temperatur %}
            {% set primary_last = primary_sensor.last_changed if primary_sensor is not none else none %}
            {% set now_ts = as_timestamp(now()) %}

            {% if primary is not none and primary_last is not none and (now_ts - as_timestamp(primary_last, default=0)) < 1800 %}
              sensor.timmerflotte_temp_hmd_sensor_temperatur
            {% elif is_number(states('sensor.forrad_backup_temperature')) %}
              sensor.forrad_backup_temperature
            {% else %}
              unknown
            {% endif %}
          used_at: >
            {% set primary = states('sensor.timmerflotte_temp_hmd_sensor_temperatur') | float(none) %}
            {% set backup = states('sensor.forrad_backup_temperature') | float(none) %}
            {% set primary_sensor = states.sensor.timmerflotte_temp_hmd_sensor_temperatur %}
            {% set backup_sensor = states.sensor.forrad_backup_temperature %}
            {% set primary_last = primary_sensor.last_changed if primary_sensor is not none else none %}
            {% set backup_last = backup_sensor.last_changed if backup_sensor is not none else none %}

            {% if primary is not none and primary_last is not none and (as_timestamp(now()) - as_timestamp(primary_last, default=0)) < 1800 %}
              {{ primary_last.isoformat() }}
            {% elif backup is not none and backup_last is not none %}
              {{ backup_last.isoformat() }}
            {% else %}
              unknown
            {% endif %}
          icon: mdi:thermometer
          friendly_name: Förråd Temperatur

  #
  # Förråd Luftfuktighet – utan backup (oförändrad)
  #
  - sensor:
      - name: "Förråd Luftfuktighet"
        unique_id: forrad_timmerflotte_luftfuktighet
        state: "{{ states('sensor.timmerflotte_temp_hmd_sensor_luftfuktighet') | float(0) }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: "{{ states('sensor.timmerflotte_temp_hmd_sensor_luftfuktighet') not in ['unknown', 'unavailable'] }}"
        attributes:
          source_sensor: sensor.timmerflotte_temp_hmd_sensor_luftfuktighet
          icon: mdi:water-percent
          friendly_name: Förråd Luftfuktighet
