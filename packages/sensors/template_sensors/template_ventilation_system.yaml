# Källor:
# - packages/ventilation_system.yaml (template-sensorer bröts ut hit)
#
# BESKRIVNING:
# Template-sensorer för FTX/ventilation (t.ex. verkningsgrad).
#
# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config

# Modern template sensor for ventilation FTX
template:
  - sensor:
      - name: "FTX verkningsgrad"
        state: >-
          {% if states('sensor.Tilluft') not in ['unknown', 'unavailable', 'none'] and
                states('sensor.Uteluft') not in ['unknown', 'unavailable', 'none'] and
                states('sensor.Franluft') not in ['unknown', 'unavailable', 'none'] %}
            {% set tilluft = states('sensor.Tilluft') | float(0) %}
            {% set uteluft = states('sensor.Uteluft') | float(0) %}
            {% set franluft = states('sensor.Franluft') | float(0) %}
            {% if (franluft - uteluft) != 0 %}
              {{ (((tilluft - uteluft) / (franluft - uteluft)) * 100) | round(1) }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "%"
