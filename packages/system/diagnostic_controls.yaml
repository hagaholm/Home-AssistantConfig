####################################################
#                                                  #
#         DIAGNOSTIC CONTROLS & MUTES              #
#                                                  #
####################################################
# Input boolean toggles to enable or mute diagnostics
# and alerts on specific devices, sensors, and nodes.
# When ON: Device/sensor is monitored by diagnostics
# When OFF: Device/sensor is ignored/muted (does not trigger alarms/warnings)
#
####################################################

