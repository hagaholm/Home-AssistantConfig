####################################################
#                                                  #
#              SYSTEM DIAGNOSTICS                  #
#                                                  #
####################################################
# BESKRIVNING:
# Läsande diagnostiksensorer för systemets hälsa,
# integrationer, nätverk, hårdvarunoder, automationer
# och sensorfärskhet med stöd för muting/ignorering.
#

template:
  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    sensor:
      - name: diagnostics_sensor_freshness
        unique_id: diagnostics_sensor_freshness
        icon: >-
          {% if this.state == 'OK' %}mdi:clock-check-outline
          {% else %}mdi:clock-alert-outline{% endif %}
        state: >-
          {% set monitored = [
            {'name': 'Frys temperatur', 'entity': 'sensor.frys_temperature', 'mute': 'input_boolean.monitor_sensor_frys_temperature'},
            {'name': 'Kyl temperatur', 'entity': 'sensor.kyl_temperature', 'mute': 'input_boolean.monitor_sensor_kyl_temperature'},
            {'name': 'Badrum temperatur', 'entity': 'sensor.badrum_temperatur', 'mute': 'input_boolean.monitor_sensor_badrum_temperatur'},
            {'name': 'Badrum luftfuktighet', 'entity': 'sensor.badrum_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_badrum_temperatur'},
            {'name': 'Tvättstuga temperatur', 'entity': 'sensor.tvattstuga_temperature', 'mute': 'input_boolean.monitor_sensor_tvattstuga_temperature'},
            {'name': 'Tvättstuga luftfuktighet', 'entity': 'sensor.tvattstuga_humidity', 'mute': 'input_boolean.monitor_sensor_tvattstuga_temperature'},
            {'name': 'Värmepump temperatur', 'entity': 'sensor.varmepump_temperature', 'mute': 'input_boolean.monitor_sensor_varmepump_temperature'},
            {'name': 'Hall temperatur', 'entity': 'sensor.hall_temperatur', 'mute': 'input_boolean.monitor_sensor_hall_temperatur'},
            {'name': 'Hall luftfuktighet', 'entity': 'sensor.hall_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_hall_temperatur'},
            {'name': 'Garage temperatur', 'entity': 'sensor.garage_temperature', 'mute': 'input_boolean.monitor_sensor_garage_temperature'},
            {'name': 'Garage luftfuktighet', 'entity': 'sensor.garage_humidity', 'mute': 'input_boolean.monitor_sensor_garage_temperature'},
            {'name': 'Förråd temperatur', 'entity': 'sensor.forrad_temperature', 'mute': 'input_boolean.monitor_sensor_forrad_temperature'},
            {'name': 'Förråd luftfuktighet', 'entity': 'sensor.forrad_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_forrad_temperature'},
            {'name': 'Friggebod temperatur', 'entity': 'sensor.friggebod_temperatur', 'mute': 'input_boolean.monitor_sensor_friggebod_temperatur'},
            {'name': 'Friggebod luftfuktighet', 'entity': 'sensor.friggebod_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_friggebod_temperatur'},
            {'name': 'Ute friggebod temperatur', 'entity': 'sensor.ute_friggebod_temperature', 'mute': 'input_boolean.monitor_sensor_ute_friggebod_temperature'},
            {'name': 'Ute friggebod luftfuktighet', 'entity': 'sensor.ute_friggebod_humidity', 'mute': 'input_boolean.monitor_sensor_ute_friggebod_temperature'},
            {'name': 'Uterum temperatur', 'entity': 'sensor.uterum_temperatur', 'mute': 'input_boolean.monitor_sensor_uterum_temperatur'},
            {'name': 'Uterum luftfuktighet', 'entity': 'sensor.uterum_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_uterum_temperatur'},
            {'name': 'Utomhus ljusstyrka', 'entity': 'sensor.ljusstyrka', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
            {'name': 'Utomhus ljusstyrka råvärde', 'entity': 'sensor.ljusstyrka_measured', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
            {'name': 'Kök ljusnivå', 'entity': 'sensor.kokets_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
            {'name': 'Hall ljusnivå', 'entity': 'sensor.hall_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
            {'name': 'Vardagsrum ljusnivå', 'entity': 'sensor.vardagsrum_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'}
          ] %}
          {% set freshness = namespace(stale=[]) %}
          {% for item in monitored %}
            {% if not is_state(item.mute, 'off') %}
              {% set source = states[item.entity] %}
              {% if source is none or source.state in ['unknown', 'unavailable', ''] or (as_timestamp(now()) - as_timestamp(source.last_updated, 0)) > 3600 %}
                {% set freshness.stale = freshness.stale + [item.name] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if freshness.stale %}Varning{% else %}OK{% endif %}
        attributes:
          reason: "Givare i listan nedan saknar data eller har inte uppdaterats på minst 60 minuter; om listan är Inga är alla övervakade givare färska"
          stale_sensors: >-
            {% set monitored = [
              {'name': 'Frys temperatur', 'entity': 'sensor.frys_temperature', 'mute': 'input_boolean.monitor_sensor_frys_temperature'},
              {'name': 'Kyl temperatur', 'entity': 'sensor.kyl_temperature', 'mute': 'input_boolean.monitor_sensor_kyl_temperature'},
              {'name': 'Badrum temperatur', 'entity': 'sensor.badrum_temperatur', 'mute': 'input_boolean.monitor_sensor_badrum_temperatur'},
              {'name': 'Badrum luftfuktighet', 'entity': 'sensor.badrum_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_badrum_temperatur'},
              {'name': 'Tvättstuga temperatur', 'entity': 'sensor.tvattstuga_temperature', 'mute': 'input_boolean.monitor_sensor_tvattstuga_temperature'},
              {'name': 'Tvättstuga luftfuktighet', 'entity': 'sensor.tvattstuga_humidity', 'mute': 'input_boolean.monitor_sensor_tvattstuga_temperature'},
              {'name': 'Värmepump temperatur', 'entity': 'sensor.varmepump_temperature', 'mute': 'input_boolean.monitor_sensor_varmepump_temperature'},
              {'name': 'Hall temperatur', 'entity': 'sensor.hall_temperatur', 'mute': 'input_boolean.monitor_sensor_hall_temperatur'},
              {'name': 'Hall luftfuktighet', 'entity': 'sensor.hall_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_hall_temperatur'},
              {'name': 'Garage temperatur', 'entity': 'sensor.garage_temperature', 'mute': 'input_boolean.monitor_sensor_garage_temperature'},
              {'name': 'Garage luftfuktighet', 'entity': 'sensor.garage_humidity', 'mute': 'input_boolean.monitor_sensor_garage_temperature'},
              {'name': 'Förråd temperatur', 'entity': 'sensor.forrad_temperature', 'mute': 'input_boolean.monitor_sensor_forrad_temperature'},
              {'name': 'Förråd luftfuktighet', 'entity': 'sensor.forrad_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_forrad_temperature'},
              {'name': 'Friggebod temperatur', 'entity': 'sensor.friggebod_temperatur', 'mute': 'input_boolean.monitor_sensor_friggebod_temperatur'},
              {'name': 'Friggebod luftfuktighet', 'entity': 'sensor.friggebod_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_friggebod_temperatur'},
              {'name': 'Ute friggebod temperatur', 'entity': 'sensor.ute_friggebod_temperature', 'mute': 'input_boolean.monitor_sensor_ute_friggebod_temperature'},
              {'name': 'Ute friggebod luftfuktighet', 'entity': 'sensor.ute_friggebod_humidity', 'mute': 'input_boolean.monitor_sensor_ute_friggebod_temperature'},
              {'name': 'Uterum temperatur', 'entity': 'sensor.uterum_temperatur', 'mute': 'input_boolean.monitor_sensor_uterum_temperatur'},
              {'name': 'Uterum luftfuktighet', 'entity': 'sensor.uterum_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_uterum_temperatur'},
              {'name': 'Utomhus ljusstyrka', 'entity': 'sensor.ljusstyrka', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
              {'name': 'Utomhus ljusstyrka råvärde', 'entity': 'sensor.ljusstyrka_measured', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
              {'name': 'Kök ljusnivå', 'entity': 'sensor.kokets_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
              {'name': 'Hall ljusnivå', 'entity': 'sensor.hall_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
              {'name': 'Vardagsrum ljusnivå', 'entity': 'sensor.vardagsrum_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'}
            ] %}
            {% set freshness = namespace(stale=[]) %}
            {% for item in monitored %}
              {% if not is_state(item.mute, 'off') %}
                {% set source = states[item.entity] %}
                {% if source is none or source.state in ['unknown', 'unavailable', ''] %}
                  {% set freshness.stale = freshness.stale + [item.name ~ ' (' ~ (source.state if source is not none else 'entitet saknas') ~ ')'] %}
                {% elif (as_timestamp(now()) - as_timestamp(source.last_updated, 0)) > 3600 %}
                  {% set age = ((as_timestamp(now()) - as_timestamp(source.last_updated, 0)) / 60) | round(0) | int %}
                  {% set freshness.stale = freshness.stale + [item.name ~ ' (' ~ age ~ ' min sedan senaste uppdatering)'] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ freshness.stale | join(', ') if freshness.stale else 'Inga' }}
          muted_sensors: >-
            {% set monitored = [
              {'name': 'Frys temperatur', 'entity': 'sensor.frys_temperature', 'mute': 'input_boolean.monitor_sensor_frys_temperature'},
              {'name': 'Kyl temperatur', 'entity': 'sensor.kyl_temperature', 'mute': 'input_boolean.monitor_sensor_kyl_temperature'},
              {'name': 'Badrum temperatur', 'entity': 'sensor.badrum_temperatur', 'mute': 'input_boolean.monitor_sensor_badrum_temperatur'},
              {'name': 'Badrum luftfuktighet', 'entity': 'sensor.badrum_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_badrum_temperatur'},
              {'name': 'Tvättstuga temperatur', 'entity': 'sensor.tvattstuga_temperature', 'mute': 'input_boolean.monitor_sensor_tvattstuga_temperature'},
              {'name': 'Tvättstuga luftfuktighet', 'entity': 'sensor.tvattstuga_humidity', 'mute': 'input_boolean.monitor_sensor_tvattstuga_temperature'},
              {'name': 'Värmepump temperatur', 'entity': 'sensor.varmepump_temperature', 'mute': 'input_boolean.monitor_sensor_varmepump_temperature'},
              {'name': 'Hall temperatur', 'entity': 'sensor.hall_temperatur', 'mute': 'input_boolean.monitor_sensor_hall_temperatur'},
              {'name': 'Hall luftfuktighet', 'entity': 'sensor.hall_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_hall_temperatur'},
              {'name': 'Garage temperatur', 'entity': 'sensor.garage_temperature', 'mute': 'input_boolean.monitor_sensor_garage_temperature'},
              {'name': 'Garage luftfuktighet', 'entity': 'sensor.garage_humidity', 'mute': 'input_boolean.monitor_sensor_garage_temperature'},
              {'name': 'Förråd temperatur', 'entity': 'sensor.forrad_temperature', 'mute': 'input_boolean.monitor_sensor_forrad_temperature'},
              {'name': 'Förråd luftfuktighet', 'entity': 'sensor.forrad_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_forrad_temperature'},
              {'name': 'Friggebod temperatur', 'entity': 'sensor.friggebod_temperatur', 'mute': 'input_boolean.monitor_sensor_friggebod_temperatur'},
              {'name': 'Friggebod luftfuktighet', 'entity': 'sensor.friggebod_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_friggebod_temperatur'},
              {'name': 'Ute friggebod temperatur', 'entity': 'sensor.ute_friggebod_temperature', 'mute': 'input_boolean.monitor_sensor_ute_friggebod_temperature'},
              {'name': 'Ute friggebod luftfuktighet', 'entity': 'sensor.ute_friggebod_humidity', 'mute': 'input_boolean.monitor_sensor_ute_friggebod_temperature'},
              {'name': 'Uterum temperatur', 'entity': 'sensor.uterum_temperatur', 'mute': 'input_boolean.monitor_sensor_uterum_temperatur'},
              {'name': 'Uterum luftfuktighet', 'entity': 'sensor.uterum_luftfuktighet', 'mute': 'input_boolean.monitor_sensor_uterum_temperatur'},
              {'name': 'Utomhus ljusstyrka', 'entity': 'sensor.ljusstyrka', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
              {'name': 'Utomhus ljusstyrka råvärde', 'entity': 'sensor.ljusstyrka_measured', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
              {'name': 'Kök ljusnivå', 'entity': 'sensor.kokets_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
              {'name': 'Hall ljusnivå', 'entity': 'sensor.hall_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'},
              {'name': 'Vardagsrum ljusnivå', 'entity': 'sensor.vardagsrum_ljusniva', 'mute': 'input_boolean.monitor_sensor_ljusstyrka'}
            ] %}
            {% set muted = namespace(items=[]) %}
            {% for item in monitored %}
              {% if is_state(item.mute, 'off') %}
                {% set muted.items = muted.items + [item.name] %}
              {% endif %}
            {% endfor %}
            {{ muted.items | unique | join(', ') if muted.items else 'Inga' }}
          threshold_minutes: 60

  - sensor:
      - name: diagnostics_sensors_health
        unique_id: diagnostics_sensors_health
        icon: >-
          {% if this.state == 'OK' %}mdi:access-point-check
          {% else %}mdi:access-point-alert{% endif %}
        state: >-
          {% if states('sensor.diagnostics_sensor_freshness') in ['unknown', 'unavailable'] %}Fel
          {% elif is_state('sensor.diagnostics_sensor_freshness', 'Varning') %}Varning
          {% else %}OK{% endif %}
        attributes:
          reason: >-
            {% if states('sensor.diagnostics_sensor_freshness') in ['unknown', 'unavailable'] %}Färskhetskontrollen kan inte rapportera
            {% elif is_state('sensor.diagnostics_sensor_freshness', 'Varning') %}En eller flera direktmätande givare saknar färsk data
            {% else %}Alla övervakade temperatur-, fukt- och ljusgivare är färska{% endif %}
          active_issues: "{{ state_attr('sensor.diagnostics_sensor_freshness', 'stale_sensors') or 'Inga' }}"
          affected_entities: "{{ state_attr('sensor.diagnostics_sensor_freshness', 'stale_sensors') or 'Inga' }}"
          muted_sensors: "{{ state_attr('sensor.diagnostics_sensor_freshness', 'muted_sensors') or 'Inga' }}"
          checked_at: "{{ now().isoformat() }}"
          threshold_minutes: 60

      - name: diagnostics_network_health
        unique_id: diagnostics_network_health
        icon: >-
          {% if this.state == 'OK' %}mdi:lan-check
          {% elif this.state == 'Varning' %}mdi:lan-pending
          {% else %}mdi:lan-disconnect{% endif %}
        state: >-
          {% set critical = [
            {'name': 'Kamera 5', 'entity': 'sensor.kamera_5', 'mute': 'input_boolean.monitor_node_kamera_5'},
            {'name': 'Kamera 6', 'entity': 'sensor.kamera_6', 'mute': 'input_boolean.monitor_node_kamera_6'},
            {'name': 'Kamera 8', 'entity': 'sensor.kamera_8', 'mute': 'input_boolean.monitor_node_kamera_8'},
            {'name': 'Kamera 9', 'entity': 'sensor.kamera_9', 'mute': 'input_boolean.monitor_node_kamera_9'},
            {'name': 'Kamera 10', 'entity': 'sensor.kamera_10', 'mute': 'input_boolean.monitor_node_kamera_10'}
          ] %}
          {% set warning = [
            {'name': 'NAS', 'entity': 'sensor.nas_dns_320', 'mute': 'input_boolean.monitor_node_nas'},
            {'name': 'Harmony Hub', 'entity': 'sensor.harmony_hub', 'mute': 'input_boolean.monitor_node_harmony_hub'},
            {'name': 'Raspberry Pi 1-Wire', 'entity': 'sensor.raspberry_pi_b_1_wire', 'mute': 'input_boolean.monitor_node_pi_1wire'},
            {'name': 'Raspberry Pi Lux', 'entity': 'sensor.raspberry_pi_3b_lux', 'mute': 'input_boolean.monitor_node_pi_lux'},
            {'name': 'Raspberry Pi Flightradar24', 'entity': 'sensor.raspberry_pi_flightradar24', 'mute': 'input_boolean.monitor_node_pi_flightradar'}
          ] %}
          {% set health = namespace(critical_issue=false, warning_issue=false) %}
          {% for device in critical %}
            {% if not is_state(device.mute, 'off') %}
              {% if states(device.entity) in ['Offline', 'unknown', 'unavailable'] %}{% set health.critical_issue = true %}{% endif %}
            {% endif %}
          {% endfor %}
          {% for device in warning %}
            {% if not is_state(device.mute, 'off') %}
              {% if states(device.entity) in ['Offline', 'unknown', 'unavailable'] %}{% set health.warning_issue = true %}{% endif %}
            {% endif %}
          {% endfor %}
          {% if health.critical_issue %}Fel
          {% elif health.warning_issue %}Varning
          {% else %}OK{% endif %}
        attributes:
          reason: >-
            {% if this.state == 'Fel' %}En kritisk nätverks-, gateway- eller kamerakälla är offline eller kan inte rapportera
            {% elif this.state == 'Varning' %}En sekundär infrastruktureenhet är offline
            {% else %}Router, gateway, sensorhubbar och övervakade kameror rapporterar online{% endif %}
          active_issues: >-
            {% set devices = [
              {'name': 'Kamera 5', 'entity': 'sensor.kamera_5', 'severity': 'Fel', 'mute': 'input_boolean.monitor_node_kamera_5'},
              {'name': 'Kamera 6', 'entity': 'sensor.kamera_6', 'severity': 'Fel', 'mute': 'input_boolean.monitor_node_kamera_6'},
              {'name': 'Kamera 8', 'entity': 'sensor.kamera_8', 'severity': 'Fel', 'mute': 'input_boolean.monitor_node_kamera_8'},
              {'name': 'Kamera 9', 'entity': 'sensor.kamera_9', 'severity': 'Fel', 'mute': 'input_boolean.monitor_node_kamera_9'},
              {'name': 'Kamera 10', 'entity': 'sensor.kamera_10', 'severity': 'Fel', 'mute': 'input_boolean.monitor_node_kamera_10'},
              {'name': 'NAS', 'entity': 'sensor.nas_dns_320', 'severity': 'Varning', 'mute': 'input_boolean.monitor_node_nas'},
              {'name': 'Harmony Hub', 'entity': 'sensor.harmony_hub', 'severity': 'Varning', 'mute': 'input_boolean.monitor_node_harmony_hub'},
              {'name': 'Raspberry Pi 1-Wire', 'entity': 'sensor.raspberry_pi_b_1_wire', 'severity': 'Varning', 'mute': 'input_boolean.monitor_node_pi_1wire'},
              {'name': 'Raspberry Pi Lux', 'entity': 'sensor.raspberry_pi_3b_lux', 'severity': 'Varning', 'mute': 'input_boolean.monitor_node_pi_lux'},
              {'name': 'Raspberry Pi Flightradar24', 'entity': 'sensor.raspberry_pi_flightradar24', 'severity': 'Varning', 'mute': 'input_boolean.monitor_node_pi_flightradar'}
            ] %}
            {% set issues = namespace(items=[]) %}
            {% for device in devices %}
              {% if not is_state(device.mute, 'off') %}
                {% if states(device.entity) in ['Offline', 'unknown', 'unavailable'] %}
                  {% set issues.items = issues.items + [device.severity ~ ': ' ~ device.name ~ ' (' ~ states(device.entity) ~ ')'] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ issues.items | join('\n') if issues.items else 'Inga' }}
          muted_devices: >-
            {% set devices = [
              {'name': 'Kamera 5', 'mute': 'input_boolean.monitor_node_kamera_5'},
              {'name': 'Kamera 6', 'mute': 'input_boolean.monitor_node_kamera_6'},
              {'name': 'Kamera 8', 'mute': 'input_boolean.monitor_node_kamera_8'},
              {'name': 'Kamera 9', 'mute': 'input_boolean.monitor_node_kamera_9'},
              {'name': 'Kamera 10', 'mute': 'input_boolean.monitor_node_kamera_10'},
              {'name': 'NAS', 'mute': 'input_boolean.monitor_node_nas'},
              {'name': 'Harmony Hub', 'mute': 'input_boolean.monitor_node_harmony_hub'},
              {'name': 'Raspberry Pi 1-Wire', 'mute': 'input_boolean.monitor_node_pi_1wire'},
              {'name': 'Raspberry Pi Lux', 'mute': 'input_boolean.monitor_node_pi_lux'},
              {'name': 'Raspberry Pi Flightradar24', 'mute': 'input_boolean.monitor_node_pi_flightradar'}
            ] %}
            {% set muted = namespace(items=[]) %}
            {% for d in devices %}
              {% if is_state(d.mute, 'off') %}{% set muted.items = muted.items + [d.name] %}{% endif %}
            {% endfor %}
            {{ muted.items | join(', ') if muted.items else 'Inga' }}
          checked_at: "{{ now().isoformat() }}"

      # Automation drift detection
      - name: diagnostics_automation_drift
        unique_id: diagnostics_automation_drift
        icon: >-
          {% if this.state == 'OK' %}mdi:robot-happy-outline
          {% else %}mdi:robot-confused-outline{% endif %}
        state: >-
          {% if is_state('input_boolean.monitor_automation_drift', 'off') %}
            Avaktiverad
          {% else %}
            {% set expected_off = [
              'automation.test_motion_light_control',
              'automation.test_motion_radio_control_backside',
              'automation.person_motion_light_control_frontside_test',
              'automation.blink_light_person_detected',
              'automation.hassbian_startad',
              'automation.hassbian_stoppad'
            ] %}
            {% set drift = namespace(count=0) %}
            {% for auto in states.automation %}
              {% if auto.entity_id in expected_off and auto.state == 'on' %}
                {% set drift.count = drift.count + 1 %}
              {% elif auto.entity_id not in expected_off and auto.state == 'off' %}
                {% set drift.count = drift.count + 1 %}
              {% endif %}
            {% endfor %}
            {% if drift.count > 0 %}Avvikelse ({{ drift.count }}){% else %}OK{% endif %}
          {% endif %}
        attributes:
          reason: >-
            {% if is_state('input_boolean.monitor_automation_drift', 'off') %}Övervakning av automationsavvikelser är tystad/avaktiverad
            {% elif this.state == 'OK' %}Alla automationer matchar sitt förväntade driftläge (normalt på/av)
            {% else %}En eller flera automationer avviker från förväntat läge{% endif %}
          deviating_count: >-
            {% set expected_off = [
              'automation.test_motion_light_control',
              'automation.test_motion_radio_control_backside',
              'automation.person_motion_light_control_frontside_test',
              'automation.blink_light_person_detected',
              'automation.hassbian_startad',
              'automation.hassbian_stoppad'
            ] %}
            {% set drift = namespace(count=0) %}
            {% for auto in states.automation %}
              {% if auto.entity_id in expected_off and auto.state == 'on' %}
                {% set drift.count = drift.count + 1 %}
              {% elif auto.entity_id not in expected_off and auto.state == 'off' %}
                {% set drift.count = drift.count + 1 %}
              {% endif %}
            {% endfor %}
            {{ drift.count }}
          unexpectedly_off: >-
            {% set expected_off = [
              'automation.test_motion_light_control',
              'automation.test_motion_radio_control_backside',
              'automation.person_motion_light_control_frontside_test',
              'automation.blink_light_person_detected',
              'automation.hassbian_startad',
              'automation.hassbian_stoppad'
            ] %}
            {% set items = namespace(list=[]) %}
            {% for auto in states.automation %}
              {% if auto.entity_id not in expected_off and auto.state == 'off' %}
                {% set items.list = items.list + [auto.name ~ ' (' ~ auto.entity_id ~ ')'] %}
              {% endif %}
            {% endfor %}
            {{ items.list | join('\n') if items.list else 'Inga' }}
          unexpectedly_on: >-
            {% set expected_off = [
              'automation.test_motion_light_control',
              'automation.test_motion_radio_control_backside',
              'automation.person_motion_light_control_frontside_test',
              'automation.blink_light_person_detected',
              'automation.hassbian_startad',
              'automation.hassbian_stoppad'
            ] %}
            {% set items = namespace(list=[]) %}
            {% for auto in states.automation %}
              {% if auto.entity_id in expected_off and auto.state == 'on' %}
                {% set items.list = items.list + [auto.name ~ ' (' ~ auto.entity_id ~ ')'] %}
              {% endif %}
            {% endfor %}
            {{ items.list | join('\n') if items.list else 'Inga' }}

  - sensor:
      - name: diagnostics_system_health
        unique_id: diagnostics_system_health
        icon: >-
          {% if this.state == 'OK' %}
            mdi:check-circle-outline
          {% else %}
            mdi:alert-circle-outline
          {% endif %}
        state: >-
          {% set light_diagnostics = [
            {'name': 'Inne', 'entity': 'sensor.lights_debug_inside'},
            {'name': 'Kök', 'entity': 'sensor.lights_debug_kitchen'},
