####################################################
#                                                  #
#              SYSTEM DIAGNOSTICS                  #
#                                                  #
####################################################
# BESKRIVNING:
# Läsande diagnostiksensorer för systemets hälsa. De
# sammanfattar befintliga larm och påverkar aldrig automationer.
#

template:
  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    sensor:
      - name: diagnostics_sensor_freshness
        unique_id: diagnostics_sensor_freshness
        icon: >-
          {% if this.state == 'OK' %}mdi:clock-check-outline
          {% else %}mdi:clock-alert-outline{% endif %}
        state: >-
          {% set monitored = [
            {'name': 'Frys temperatur', 'entity': 'sensor.frys_temperature'},
            {'name': 'Kyl temperatur', 'entity': 'sensor.kyl_temperature'},
            {'name': 'Badrum temperatur', 'entity': 'sensor.lumi_lumi_sensor_ht_agl02_temperatur'},
            {'name': 'Badrum luftfuktighet', 'entity': 'sensor.lumi_lumi_sensor_ht_agl02_luftfuktighet'},
            {'name': 'Tvättstuga temperatur', 'entity': 'sensor.tvattstuga_temperature'},
            {'name': 'Tvättstuga luftfuktighet', 'entity': 'sensor.tvattstuga_humidity'},
            {'name': 'Värmepump temperatur', 'entity': 'sensor.varmepump_temperature'},
            {'name': 'Hall temperatur', 'entity': 'sensor.lumi_lumi_sensor_ht_agl02_temperatur_2'},
            {'name': 'Hall luftfuktighet', 'entity': 'sensor.lumi_lumi_weather_humidity_2'},
            {'name': 'Garage temperatur', 'entity': 'sensor.garage_temperature'},
            {'name': 'Garage luftfuktighet', 'entity': 'sensor.garage_humidity'},
            {'name': 'Förråd temperatur', 'entity': 'sensor.forrad_temperature'},
            {'name': 'Förråd luftfuktighet', 'entity': 'sensor.forrad_luftfuktighet'},
            {'name': 'Friggebod temperatur', 'entity': 'sensor.friggebod_temperatur'},
            {'name': 'Friggebod luftfuktighet', 'entity': 'sensor.friggebod_luftfuktighet'},
            {'name': 'Ute friggebod temperatur', 'entity': 'sensor.ute_friggebod_temperature'},
            {'name': 'Ute friggebod luftfuktighet', 'entity': 'sensor.ute_friggebod_humidity'},
            {'name': 'Uterum temperatur', 'entity': 'sensor.uterum_temperatur'},
            {'name': 'Uterum luftfuktighet', 'entity': 'sensor.uterum_luftfuktighet'}
          ] %}
          {% set freshness = namespace(stale=[]) %}
          {% for item in monitored %}
            {% set source = states[item.entity] %}
            {% if source is none or source.state in ['unknown', 'unavailable', ''] or (as_timestamp(now()) - as_timestamp(source.last_updated, 0)) > 3600 %}
              {% set freshness.stale = freshness.stale + [item.name] %}
            {% endif %}
          {% endfor %}
          {% if freshness.stale %}Varning{% else %}OK{% endif %}
        attributes:
          reason: "Givare i listan nedan saknar data eller har inte uppdaterats på minst 60 minuter; om listan är Inga är alla övervakade givare färska"
          stale_sensors: >-
            {% set monitored = [
              {'name': 'Frys temperatur', 'entity': 'sensor.frys_temperature'},
              {'name': 'Kyl temperatur', 'entity': 'sensor.kyl_temperature'},
              {'name': 'Badrum temperatur', 'entity': 'sensor.lumi_lumi_sensor_ht_agl02_temperatur'},
              {'name': 'Badrum luftfuktighet', 'entity': 'sensor.lumi_lumi_sensor_ht_agl02_luftfuktighet'},
              {'name': 'Tvättstuga temperatur', 'entity': 'sensor.tvattstuga_temperature'},
              {'name': 'Tvättstuga luftfuktighet', 'entity': 'sensor.tvattstuga_humidity'},
              {'name': 'Värmepump temperatur', 'entity': 'sensor.varmepump_temperature'},
              {'name': 'Hall temperatur', 'entity': 'sensor.lumi_lumi_sensor_ht_agl02_temperatur_2'},
              {'name': 'Hall luftfuktighet', 'entity': 'sensor.lumi_lumi_weather_humidity_2'},
              {'name': 'Garage temperatur', 'entity': 'sensor.garage_temperature'},
              {'name': 'Garage luftfuktighet', 'entity': 'sensor.garage_humidity'},
              {'name': 'Förråd temperatur', 'entity': 'sensor.forrad_temperature'},
              {'name': 'Förråd luftfuktighet', 'entity': 'sensor.forrad_luftfuktighet'},
              {'name': 'Friggebod temperatur', 'entity': 'sensor.friggebod_temperatur'},
              {'name': 'Friggebod luftfuktighet', 'entity': 'sensor.friggebod_luftfuktighet'},
              {'name': 'Ute friggebod temperatur', 'entity': 'sensor.ute_friggebod_temperature'},
              {'name': 'Ute friggebod luftfuktighet', 'entity': 'sensor.ute_friggebod_humidity'},
              {'name': 'Uterum temperatur', 'entity': 'sensor.uterum_temperatur'},
              {'name': 'Uterum luftfuktighet', 'entity': 'sensor.uterum_luftfuktighet'}
            ] %}
            {% set freshness = namespace(stale=[]) %}
            {% for item in monitored %}
              {% set source = states[item.entity] %}
              {% if source is none or source.state in ['unknown', 'unavailable', ''] %}
                {% set freshness.stale = freshness.stale + [item.name ~ ' (' ~ (source.state if source is not none else 'entitet saknas') ~ ')'] %}
              {% elif (as_timestamp(now()) - as_timestamp(source.last_updated, 0)) > 3600 %}
                {% set age = ((as_timestamp(now()) - as_timestamp(source.last_updated, 0)) / 60) | round(0) | int %}
                {% set freshness.stale = freshness.stale + [item.name ~ ' (' ~ age ~ ' min sedan senaste uppdatering)'] %}
              {% endif %}
            {% endfor %}
            {{ freshness.stale | join(', ') if freshness.stale else 'Inga' }}
          threshold_minutes: 60

  - sensor:
      - name: diagnostics_system_health
        unique_id: diagnostics_system_health
        icon: >-
          {% if this.state == 'OK' %}
            mdi:check-circle-outline
          {% else %}
            mdi:alert-circle-outline
          {% endif %}
        state: >-
          {% set light_diagnostics = [
            {'name': 'Inne', 'entity': 'sensor.lights_debug_inside'},
            {'name': 'Kök', 'entity': 'sensor.lights_debug_kitchen'},
            {'name': 'Badrum', 'entity': 'sensor.lights_debug_bathroom'},
            {'name': 'Hall', 'entity': 'sensor.lights_debug_hall'},
            {'name': 'Trädgård', 'entity': 'sensor.lights_debug_garden'},
            {'name': 'Uterum', 'entity': 'sensor.lights_debug_uterum'},
            {'name': 'Spabad', 'entity': 'sensor.lights_debug_spabad'},
            {'name': 'Fasad', 'entity': 'sensor.lights_debug_facade'}
          ] %}
          {% set climate_diagnostics = [
            {'name': 'Förråd', 'entity': 'sensor.diagnostics_climate_forrad'},
            {'name': 'Friggebod', 'entity': 'sensor.diagnostics_climate_friggebod'},
            {'name': 'Garage', 'entity': 'sensor.diagnostics_climate_garage'},
            {'name': 'Husvagn', 'entity': 'sensor.diagnostics_climate_husvagn'},
            {'name': 'Uterum', 'entity': 'sensor.diagnostics_climate_uterum'},
            {'name': 'Ute', 'entity': 'sensor.diagnostics_climate_ute'}
          ] %}
          {% set issues = namespace(items=[]) %}
          {% if is_state('sensor.diagnostics_sensor_freshness', 'Varning') %}
            {% set issues.items = issues.items + ['Givare: ' ~ state_attr('sensor.diagnostics_sensor_freshness', 'stale_sensors')] %}
          {% endif %}
          {% for item in light_diagnostics %}
            {% set reality = state_attr(item.entity, 'reality_status') | string %}
            {% if 'Avvikelse:' in reality %}{% set issues.items = issues.items + ['Belysning ' ~ item.name ~ ': ' ~ reality] %}{% endif %}
          {% endfor %}
          {% for item in climate_diagnostics %}
            {% if states(item.entity) in ['Varning', 'Data saknas'] %}{% set issues.items = issues.items + ['Klimat ' ~ item.name ~ ': ' ~ states(item.entity)] %}{% endif %}
          {% endfor %}
          {% if is_state('sensor.diagnostics_ventilation', 'Varning') %}{% set issues.items = issues.items + ['Ventilation: ' ~ state_attr('sensor.diagnostics_ventilation', 'reason')] %}{% endif %}
          {% if issues.items %}
            Varning
          {% elif is_state('binary_sensor.updater', 'on') %}
            Uppdatering tillgänglig
          {% else %}
            OK
          {% endif %}
        attributes:
          reason: >-
            {% set light_diagnostics = [
              {'name': 'Inne', 'entity': 'sensor.lights_debug_inside'},
              {'name': 'Kök', 'entity': 'sensor.lights_debug_kitchen'},
              {'name': 'Badrum', 'entity': 'sensor.lights_debug_bathroom'},
              {'name': 'Hall', 'entity': 'sensor.lights_debug_hall'},
              {'name': 'Trädgård', 'entity': 'sensor.lights_debug_garden'},
              {'name': 'Uterum', 'entity': 'sensor.lights_debug_uterum'},
              {'name': 'Spabad', 'entity': 'sensor.lights_debug_spabad'},
              {'name': 'Fasad', 'entity': 'sensor.lights_debug_facade'}
            ] %}
            {% set climate_diagnostics = [
              {'name': 'Förråd', 'entity': 'sensor.diagnostics_climate_forrad'},
              {'name': 'Friggebod', 'entity': 'sensor.diagnostics_climate_friggebod'},
              {'name': 'Garage', 'entity': 'sensor.diagnostics_climate_garage'},
              {'name': 'Husvagn', 'entity': 'sensor.diagnostics_climate_husvagn'},
              {'name': 'Uterum', 'entity': 'sensor.diagnostics_climate_uterum'},
              {'name': 'Ute', 'entity': 'sensor.diagnostics_climate_ute'}
            ] %}
            {% set issues = namespace(items=[]) %}
            {% if is_state('sensor.diagnostics_sensor_freshness', 'Varning') %}{% set issues.items = issues.items + ['Givare: ' ~ state_attr('sensor.diagnostics_sensor_freshness', 'stale_sensors')] %}{% endif %}
            {% for item in light_diagnostics %}
              {% set reality = state_attr(item.entity, 'reality_status') | string %}
              {% if 'Avvikelse:' in reality %}{% set issues.items = issues.items + ['Belysning ' ~ item.name ~ ': ' ~ reality] %}{% endif %}
            {% endfor %}
            {% for item in climate_diagnostics %}
              {% if states(item.entity) in ['Varning', 'Data saknas'] %}{% set issues.items = issues.items + ['Klimat ' ~ item.name ~ ': ' ~ states(item.entity)] %}{% endif %}
            {% endfor %}
            {% if is_state('sensor.diagnostics_ventilation', 'Varning') %}{% set issues.items = issues.items + ['Ventilation: ' ~ state_attr('sensor.diagnostics_ventilation', 'reason')] %}{% endif %}
            {% if issues.items %}
              {{ issues.items | join(' | ') }}
            {% elif is_state('binary_sensor.updater', 'on') %}
              En Home Assistant-uppdatering är tillgänglig
            {% else %}
              Inga aktiva delsystemproblem eller väntande uppdateringar
            {% endif %}
          active_issues: >-
            {% set light_diagnostics = [
              {'name': 'Inne', 'entity': 'sensor.lights_debug_inside'}, {'name': 'Kök', 'entity': 'sensor.lights_debug_kitchen'}, {'name': 'Badrum', 'entity': 'sensor.lights_debug_bathroom'}, {'name': 'Hall', 'entity': 'sensor.lights_debug_hall'}, {'name': 'Trädgård', 'entity': 'sensor.lights_debug_garden'}, {'name': 'Uterum', 'entity': 'sensor.lights_debug_uterum'}, {'name': 'Spabad', 'entity': 'sensor.lights_debug_spabad'}, {'name': 'Fasad', 'entity': 'sensor.lights_debug_facade'}
            ] %}
            {% set climate_diagnostics = [
              {'name': 'Förråd', 'entity': 'sensor.diagnostics_climate_forrad'}, {'name': 'Friggebod', 'entity': 'sensor.diagnostics_climate_friggebod'}, {'name': 'Garage', 'entity': 'sensor.diagnostics_climate_garage'}, {'name': 'Husvagn', 'entity': 'sensor.diagnostics_climate_husvagn'}, {'name': 'Uterum', 'entity': 'sensor.diagnostics_climate_uterum'}, {'name': 'Ute', 'entity': 'sensor.diagnostics_climate_ute'}
            ] %}
            {% set issues = namespace(items=[]) %}
            {% if is_state('sensor.diagnostics_sensor_freshness', 'Varning') %}{% set issues.items = issues.items + ['Givare: ' ~ state_attr('sensor.diagnostics_sensor_freshness', 'stale_sensors')] %}{% endif %}
            {% for item in light_diagnostics %}{% set reality = state_attr(item.entity, 'reality_status') | string %}{% if 'Avvikelse:' in reality %}{% set issues.items = issues.items + ['Belysning ' ~ item.name ~ ': ' ~ reality] %}{% endif %}{% endfor %}
            {% for item in climate_diagnostics %}{% if states(item.entity) in ['Varning', 'Data saknas'] %}{% set issues.items = issues.items + ['Klimat ' ~ item.name ~ ': ' ~ states(item.entity)] %}{% endif %}{% endfor %}
            {% if is_state('sensor.diagnostics_ventilation', 'Varning') %}{% set issues.items = issues.items + ['Ventilation: ' ~ state_attr('sensor.diagnostics_ventilation', 'reason')] %}{% endif %}
            {{ issues.items | join('\n') if issues.items else 'Inga' }}
          active_reading_alarms: >-
            {% set stale_alarms = [
              'input_boolean.frys_reading_missing_alarm',
              'input_boolean.kyl_reading_missing_alarm',
              'input_boolean.badrum_reading_missing_alarm',
              'input_boolean.tvattstuga_reading_missing_alarm',
              'input_boolean.varmepump_reading_missing_alarm',
              'input_boolean.vardagsrum_reading_missing_alarm',
              'input_boolean.hall_reading_missing_alarm',
              'input_boolean.forrad_reading_missing_alarm',
              'input_boolean.garage_reading_missing_alarm',
              'input_boolean.friggebod_reading_missing_alarm',
              'input_boolean.ute_friggebod_reading_missing_alarm'
            ] %}
            {{ stale_alarms | select('is_state', 'on') | list | join(', ') }}
          sensor_freshness: "{{ states('sensor.diagnostics_sensor_freshness') }}"
          stale_sensors: "{{ state_attr('sensor.diagnostics_sensor_freshness', 'stale_sensors') }}"
          update_available: "{{ is_state('binary_sensor.updater', 'on') }}"
          installed_version: "{{ states('sensor.installed_version') }}"
          latest_version: "{{ states('sensor.current_ha_version') }}"