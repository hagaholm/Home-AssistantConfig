# Källor:
# - packages/harmony_hub.yaml (template-sensorer bröts ut hit)
#
# BESKRIVNING:
# Template-sensorer relaterade till Harmony Hub och Yamaha-volym/aktivitet.
#
# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config

# Modern template sensors for Harmony Hub

template:
  - sensor:
      - name: "Aktuell aktivitet"
        state: "{{ state_attr('remote.harmony_hub', 'current_activity') }}"
      - name: "Yamaha volym"
        state: >-
          {% if state_attr('media_player.yamaha_receiver', 'volume_level') == None %}
            0
          {% else %}
            {{state_attr('media_player.yamaha_receiver', 'volume_level') }}
          {% endif %}
        unit_of_measurement: '%'
