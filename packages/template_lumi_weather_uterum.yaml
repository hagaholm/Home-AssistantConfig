# LUMI Weather Sensors (Uterum)
template:
  - sensor:
      # Source: LUMI lumi.weather (Uterum)
      # Company: LUMI
      # Type: Temperature, Humidity, Pressure sensor
      - name: "Uterum Temperatur"
        unique_id: uterum_lumi_weather_temperature_4
        state: "{{ states('sensor.lumi_lumi_weather_temperature_4') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        attributes:
          source_sensor: sensor.lumi_lumi_weather_temperature_4
          icon: mdi:thermometer
          friendly_name: Uterum Temperatur

      - name: "Uterum Luftfuktighet"
        unique_id: uterum_lumi_weather_humidity_4
        state: "{{ states('sensor.lumi_lumi_weather_humidity_4) }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        attributes:
          source_sensor: sensor.lumi_lumi_weather_humidity_4
          icon: mdi:water-percent
          friendly_name: Uterum Luftfuktighet

      - name: "Uterum Lufttryck"
        unique_id: uterum_lumi_weather_pressure_4
        state: "{{ states('sensor.lumi_lumi_weather_pressure_4') }}"
        unit_of_measurement: "hPa"
        device_class: pressure
        state_class: measurement
        attributes:
          source_sensor: sensor.lumi_lumi_weather_pressure_4
          icon: mdi:gauge
          friendly_name: Uterum Lufttryck
