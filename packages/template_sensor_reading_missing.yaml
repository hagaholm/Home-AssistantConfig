# Modern template timestamp sensors migrated from sensor_reading_missing
# Keep the same friendly names and device_class: timestamp

template:
  - sensor:
      - name: "Frys temp senast uppdaterad"
        state: >-
          {% if state_attr('sensor.frys_temperature', 'last_updated') == None %}
            ''
          {% else %}
            {{ states.sensor.frys_temperature.last_updated.strftime('%Y-%m-%dT%H:%M:%S') }}
          {% endif %}
        device_class: timestamp
        icon: >-
          {% if state_attr('sensor.frys_temperature', 'last_updated') == None %}
            mdi:progress-check
          {% elif (as_timestamp(now()) - as_timestamp(states.sensor.frys_temperature.last_updated) > 100) %}
            mdi:progress-alert
          {% else %}
            mdi:progress-check
          {% endif %}

