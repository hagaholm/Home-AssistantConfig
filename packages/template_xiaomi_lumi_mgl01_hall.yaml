# Källor:
# - Xiaomi Lumi Sen Ill MGL01 (Hall) (template-"proxy"-sensor)
#
# BESKRIVNING:
# Template-sensor för ljusnivå (lux) i Hall.
#
# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config

# Xiaomi Lumi Sen Ill MGL01 Sensors
# Hall

template:
  - sensor:
      # Source: Xiaomi Lumi Sen Ill MGL01 (Illuminance sensor)
      # Company: Xiaomi
      # Type: Illuminance (lux) sensor
      - name: "Hall ljusnivå"
        unique_id: hall_illuminance
        state: "{{ states('sensor.xiaomi_lumi_sen_ill_mgl01_illuminance_2') | int(0) }}"
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        attributes:
          source_sensor: sensor.xiaomi_lumi_sen_ill_mgl01_illuminance_2
          icon: mdi:weather-sunny
          friendly_name: Hall ljusnivå
