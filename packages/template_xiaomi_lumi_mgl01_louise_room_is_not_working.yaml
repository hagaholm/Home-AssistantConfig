# Källor:
# - Xiaomi Lumi Sen Ill MGL01 (Louise Room) (template-"proxy"-sensor)
#
# BESKRIVNING:
# Template-sensor för ljusnivå (lux) i Louise rum.
#
# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config

# Xiaomi Lumi Sen Ill MGL01 Sensors
# Louise Room

template:
  - sensor:
      # Source: Xiaomi Lumi Sen Ill MGL01 (Illuminance sensor)
      # Company: Xiaomi
      # Type: Illuminance (lux) sensor
      - name: "Louise rum ljusnivå"
        unique_id: louise_rom_illuminance
        state: "{{ states('sensor.xiaomi_lumi_sen_ill_mgl01') | int(0) }}"
        unit_of_measurement: "lx"
        device_class: illuminance
        state_class: measurement
        attributes:
          source_sensor: sensor.xiaomi_lumi_sen_ill_mgl01
          icon: mdi:weather-sunny
          friendly_name: Louise rum ljusnivå
