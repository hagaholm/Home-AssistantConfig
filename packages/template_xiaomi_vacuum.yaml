# Modern template sensors for Xiaomi vacuum
template:
  - sensor:
      - name: "Vacuum Status"
        state: >-
          Status: {{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'status') }}
        icon: >-
          {% set val = state_attr('vacuum.xiaomi_vacuum_cleaner', 'status') %}
          {% if val == 'Charging' %}
            mdi:battery-charging
          {% elif val == 'Cleaning' %}
            mdi:move-resize
          {% elif val == 'Returning home' %}
            mdi:keyboard-return
          {% elif val == 'Idle' %}
            mdi:dots-horizontal
          {% elif val == 'Paused' %}
            mdi:pause-circle
          {% else %}
            mdi:help-circle
          {% endif %}

      - name: "Vacuum Fan Speed"
        state: >-
          Mode: {{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'fan_speed') }}
        icon: 'mdi:speedometer'

      - name: "Time of Last Cycle"
        state: "{{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'cleaning_time') }}"
        icon: 'mdi:timer-outline'

      - name: "Area of Last Cycle"
        state: "{{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'cleaned_area') }}"
        unit_of_measurement: 'm²'
        icon: 'mdi:ruler'

      - name: "Replace main brush"
        state: >-
          Main Brush: {{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'main_brush_left') }}
        unit_of_measurement: 'h'
        icon: 'mdi:screwdriver'

      - name: "Replace side brush"
        state: >-
          Side brush: {{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'side_brush_left') }}
        unit_of_measurement: 'h'
        icon: 'mdi:screwdriver'

      - name: "Replace filter"
        state: >-
          Filter: {{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'filter_left') }}
        unit_of_measurement: 'h'
        icon: 'mdi:screwdriver'

      - name: "Clean stop"
        state: >-
          Filter: {{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'clean_stop') }}
        unit_of_measurement: 'date'
        icon: 'mdi:stop'

      - name: "Clean sensor"
        state: >-
          Sensor:  {{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'sensor_dirty_left') }}
        unit_of_measurement: 'h'
        icon: 'mdi:screwdriver'

      - name: "Do Not Disturb"
        state: >-
          {{ state_attr('vacuum.xiaomi_vacuum_cleaner', 'do_not_disturb') }}
        icon: >-
          {% set val = state_attr('vacuum.xiaomi_vacuum_cleaner', 'do_not_disturb') %}
          {% if val == 'on' %}
            mdi:do-not-disturb
          {% else %}
            mdi:minus-circle-off
          {% endif %}

      - name: "Vacuum Operation"
        state: 'Operation'
