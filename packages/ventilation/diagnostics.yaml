####################################################
#                                                  #
#           VENTILATION DIAGNOSTICS                #
#                                                  #
####################################################
# BESKRIVNING:
# Läsande sammanfattning av FTX-läge, timers och de
# befintliga diagnostiska larmflaggorna.
#

template:
  - sensor:
      - name: diagnostics_ventilation
        unique_id: diagnostics_ventilation
        state: >-
          {% set relay = states('switch.shelly1_c45bbe77099d') %}
          {% set flags = [
            'input_boolean.high_humidity_bathroom_away',
            'input_boolean.low_temp_franluft',
            'input_boolean.high_temp_franluft',
            'input_boolean.low_temp_tilluft',
            'input_boolean.high_temp_tilluft'
          ] %}
          {% if relay in ['unknown', 'unavailable'] %}Data saknas
          {% elif flags | select('is_state', 'on') | list | count > 0 %}Varning
          {% elif relay == 'on' %}Forcerad
          {% else %}Normal{% endif %}
        attributes:
          reason: >-
            {% set relay = states('switch.shelly1_c45bbe77099d') %}
            {% set flags = [
              'input_boolean.high_humidity_bathroom_away',
              'input_boolean.low_temp_franluft',
              'input_boolean.high_temp_franluft',
              'input_boolean.low_temp_tilluft',
              'input_boolean.high_temp_tilluft'
            ] %}
            {% set active = flags | select('is_state', 'on') | list %}
            {% if relay in ['unknown', 'unavailable'] %}FTX-reläet är inte tillgängligt
            {% elif active | count > 0 %}Aktiva ventilationslarm: {{ active | join(', ') }}
            {% elif relay == 'on' %}Reläet är på: forcerad ventilationsdrift
            {% else %}Reläet är av: normal ventilationsdrift{% endif %}
          relay_state: "{{ states('switch.shelly1_c45bbe77099d') }}"
          max_timer: "{{ states('timer.timer_humidity_bathroom_max_time') }}"
          stability_timer: "{{ states('timer.timer_humidity_bathroom') }}"
          bathroom_humidity: "{{ states('sensor.fukt_badrumsfonster') }}"
          humidity_force_on: "{{ states('input_number.ventilation_rh_force_on') }}"
          ventilation_control_entity: switch.shelly1_c45bbe77099d
          humidity_force_off: "{{ states('input_number.ventilation_rh_force_off') }}"
          force_rules: >-
            {% set humidity = states('sensor.fukt_badrumsfonster') | float(none) %}
            {% set outside_temperature = states('sensor.ute') | float(none) %}
            {% set force_on = states('input_number.ventilation_rh_force_on') | float(70) %}
            {% set force_off = states('input_number.ventilation_rh_force_off') | float(69) %}
            {% set min_outside_temperature = states('input_number.ventilation_outdoor_temp_min_force') | float(-8) %}
            {% set stable_min = states('input_number.ventilation_rh_stable_min') | float(70) %}
            {% set stable_max = states('input_number.ventilation_rh_stable_max') | float(90) %}
            Start på hög fukt: RH {{ humidity if humidity is number else 'saknas' }} %, kräver över {{ force_on }} % och en ökning på minst {{ states('input_number.ventilation_rh_delta_high') }} % sedan föregående mätning: {{ 'RH-villkoret är uppfyllt' if humidity is number and humidity > force_on else 'RH-villkoret är ej uppfyllt' }}.
            Start på snabb ökning: kräver en RH-ökning på minst {{ states('input_number.ventilation_rh_delta_fast') }} % sedan föregående mätning; den historiska skillnaden är bara tillgänglig när automationen triggas.
            Utetemperatur: {{ outside_temperature if outside_temperature is number else 'saknas' }} °C, kräver över {{ min_outside_temperature }} °C för fuktstyrd forcering: {{ 'uppfyllt' if outside_temperature is number and outside_temperature > min_outside_temperature else 'ej uppfyllt' }}.
            Normal på låg fukt: RH under {{ force_off }} %: {{ 'uppfyllt' if humidity is number and humidity < force_off else 'ej uppfyllt' }}.
            Stabilitetsåtergång: RH mellan {{ stable_min }} och {{ stable_max }} % och stabilitetstimern måste löpa ut: {{ 'RH inom fönstret' if humidity is number and stable_min <= humidity <= stable_max else 'RH utanför fönstret' }}.
            Maxtid: forcering återgår till normal när maxtimern löper ut efter {{ states('input_number.ventilation_max_runtime_minutes') }} minuter.
          active_alarm_flags: >-
            {% set flags = [
              'input_boolean.high_humidity_bathroom_away',
              'input_boolean.low_temp_franluft',
              'input_boolean.high_temp_franluft',
              'input_boolean.low_temp_tilluft',
              'input_boolean.high_temp_tilluft'
            ] %}
            {{ flags | select('is_state', 'on') | list | join(', ') }}
          alarm_active: "{{ is_state('input_boolean.alarm_ventilation', 'on') }}"