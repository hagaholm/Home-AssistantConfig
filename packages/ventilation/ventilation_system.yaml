### Script ###
##############
# Script for repeated turn_off or turn_on ventilation
script:
  ventilation_turn_off_loop:
    alias: Ventilation Turn Off Loop
    sequence:
      - repeat:
          count: 7
          sequence:
            - service: homeassistant.turn_off
              entity_id: switch.ventilationsaggregat
            - delay: '00:00:05'

  ventilation_turn_on_loop:
    alias: Ventilation Turn On Loop
    sequence:
      - repeat:
          count: 7
          sequence:
            - service: homeassistant.turn_on
              entity_id: switch.ventilationsaggregat
            - delay: '00:00:05'

  ventilation_tuning_reset_defaults:
    alias: Återställ ventilation standardvärden
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_rh_force_on
        data:
          value: 70
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_rh_force_off
        data:
          value: 69
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_rh_stable_min
        data:
          value: 70
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_rh_stable_max
        data:
          value: 90
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_rh_delta_fast
        data:
          value: 4
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_rh_delta_high
        data:
          value: 2
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_outdoor_temp_min_force
        data:
          value: -8
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_max_runtime_minutes
        data:
          value: 90
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_stable_minutes
        data:
          value: 20
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_house_humidity_diff
        data:
          value: 8
      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_sensor_fresh_seconds
        data:
          value: 600
