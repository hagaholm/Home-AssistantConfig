####################################################
#                                                  #
#             VENTILATION SYSTEM (FTX)            #
#                                                  #
####################################################
# Heat recovery ventilation system automation
# Controls fan speed based on humidity and temperature
# Template sensors: packages/template_ventilation_system.yaml
#
# Hardware:
# - Switch: Shelly1 relay (entity: switch.shelly1_c45bbe77099d)
# - Function: Normal / Forced ventilation mode toggle
# - Sensors: Temperature (4 probes), Humidity (bathroom)
#
# Automation Logic:
# - Bathroom humidity > threshold → Force high speed (thresholds are configurable via helpers)
# - Temperature out of range → Force high speed
# - Max timer (90 min) prevents indefinite forced mode
# - Stability timer (20 min) prevents rapid cycling
# - Auto-reset when conditions normalize
#
# Safety Features:
# - Diagnostic input_booleans track alarm conditions
# - Temperature monitoring (tilluft, franluft thresholds)
# - Away mode high humidity detection
# - Auto-recovery when switch becomes available
#
# Usage:
# - Triggered by: Bathroom humidity, temperature sensors
# - Manual override: Physical switch or UI toggle
# - Notifications: Alarm conditions logged to input_booleans
#
# Tuning:
# - Thresholds/timers are exposed as input_number helpers (see below)
#
####################################################

# Källor:
# - Tidigare FTX/ventilations-konfiguration i detta repo (paketfil)
#
# BESKRIVNING:
# Styr FTX/ventilation baserat på fukt och temperatur med timers och skydd.
#
# METADATA:
# Skapad: okänt
# Senast ändrad: 2025-12-28
# Version: 1.0
# Författare: Home Assistant Config

##############
### Sensor ###
##############
# Template sensor 'ftx' migrated to packages/template_ventilation_system.yaml

##############
### Switch ###
##############
#command_line:
#  - switch:
#      name: Fläkt Normal / Forcerad
#      command_on: python3 -c "import requests; requests.get('http://192.168.1.12:3001/uncached/12.A84D7D000000/?PIO.A=on&PIO.A=CHANGE');"
#      command_off: python3 -c "import requests; requests.get('http://192.168.1.12:3001/uncached/12.A84D7D000000/?PIO.A=CHANGE');"

# Hämta aktuell status: 'http://192.168.1.12:3001/text/12.A84D7D000000/PIO.A' 
# Sätt till Off: 'http://192.168.1.12:3001/uncached/12.A84D7D000000/?PIO.A=CHANGE'
# Sätt till On: 'http://192.168.1.12:3001/uncached/12.A84D7D000000/?PIO.A=on&PIO.A=CHANGE'

#############
### Timer ###
#############
timer:
  # Max timer
  timer_humidity_bathroom_max_time:
    name: Timer max tid
    duration: '01:30:00'

  # Reset everytime humidity is changes in bathroom
  timer_humidity_bathroom:
    name: Timer stabil fukt i badrum
    duration: '00:20:00'

####################
### Input Number ###
####################
input_number:
  ventilation_rh_force_on:
    name: Ventilation forcerad start (RH)
    min: 40
    max: 95
    step: 1
    unit_of_measurement: '%'
    mode: box
    initial: 70

  ventilation_rh_force_off:
    name: Ventilation normal stop (RH)
    min: 40
    max: 95
    step: 1
    unit_of_measurement: '%'
    mode: box
    initial: 69

  ventilation_rh_stable_min:
    name: Ventilation stabilitetsfönster min (RH)
    min: 40
    max: 95
    step: 1
    unit_of_measurement: '%'
    mode: box
    initial: 70

  ventilation_rh_stable_max:
    name: Ventilation stabilitetsfönster max (RH)
    min: 40
    max: 99
    step: 1
    unit_of_measurement: '%'
    mode: box
    initial: 90

  ventilation_rh_delta_fast:
    name: Ventilation forcerad snabb ökning (ΔRH)
    min: 1
    max: 20
    step: 1
    unit_of_measurement: '%'
    mode: box
    initial: 4

  ventilation_rh_delta_high:
    name: Ventilation forcerad ökning (ΔRH)
    min: 1
    max: 20
    step: 1
    unit_of_measurement: '%'
    mode: box
    initial: 2

  ventilation_outdoor_temp_min_force:
    name: Ventilation min utetemp för forcering
    min: -30
    max: 20
    step: 1
    unit_of_measurement: '°C'
    mode: box
    initial: -8

  ventilation_max_runtime_minutes:
    name: Ventilation forcerad maxtid (min)
    min: 10
    max: 240
    step: 5
    unit_of_measurement: 'min'
    mode: box
    initial: 90

  ventilation_stable_minutes:
    name: Ventilation stabil tid (min)
    min: 5
    max: 60
    step: 1
    unit_of_measurement: 'min'
    mode: box
    initial: 20

  ventilation_house_humidity_diff:
    name: Ventilation diff badrum vs vardagsrum (RH)
    min: 0
    max: 20
    step: 1
    unit_of_measurement: '%'
    mode: box
    initial: 8

  ventilation_sensor_fresh_seconds:
    name: Ventilation sensor-färskhet (sek)
    min: 60
    max: 3600
    step: 60
    unit_of_measurement: 's'
    mode: box
    initial: 600

#####################
### Input Boolean ###
#####################
input_boolean:
  # Used for diagnostic
  alarm_ventilation:
    name: Larm ventilation 
    initial: off

  # Used for diagnostic
  high_humidity_bathroom_away:
    name: Hög luftfuktighet ingen hemma 
    initial: off

  # Used for diagnostic
  low_temp_franluft:
    name: Lågtemp frånluft 
    initial: off

  # Used for diagnostic
  high_temp_franluft:
    name: Högtemp frånluft 
    initial: off

  # Used for diagnostic
  low_temp_tilluft:
    name: Lågtemp tilluft 
    initial: off

  # Used for diagnostic
  high_temp_tilluft:
    name: Högtemp tilluft 
    initial: off

##################
### Automation ###
##################
automation:
  - alias: Turn off max speed when available again
    id: '2167646707765' 

    trigger:
      platform: state
      entity_id: switch.shelly1_c45bbe77099d
      from: "unavailable"

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.shelly1_c45bbe77099d
          state: 'on'
        - condition: template 
          value_template: "{{ not is_state('timer.timer_humidity_bathroom_max_time','active') }}"

    action:
      - service: script.fan_normal
        data: {}

    ##############################################################
    ### Startar Timer när forcerad fläkt startar               ###
    ### T: switch.shelly1_c45bbe77099d == on                   ###
    ### A: Cancel timer timer.timer_humidity_bathroom_max_time ###
    ###    Start timer timer.timer_humidity_bathroom_max_time  ###
    ##############################################################
  - alias: Startar max timer Badrum
    id: '2167646707481' 

    trigger:
      platform: state
      entity_id: switch.shelly1_c45bbe77099d
      to: 'on'

    action:
      # Cancel timer and reset to max time
      - service: timer.cancel
        entity_id: timer.timer_humidity_bathroom_max_time

      # Start timer and count down
      - service: timer.start
        data:
          entity_id: timer.timer_humidity_bathroom_max_time
          duration: >-
            {% set m = states('input_number.ventilation_max_runtime_minutes')|int(90) %}
            {{ '%02d:%02d:00' | format((m // 60), (m % 60)) }}

    ##########################################################
    ### Startar Timer när luftfuktighet ändras i badrummet ###
    ### T: sensor.badrum_luftfuktighet                     ###
    ### C: sensor.fukt_badrumsfonster < 90                 ###
    ###    sensor.fukt_badrumsfonster > 75                 ###
    ### A: Cancel timer timer.timer_humidity_bathroom      ###
    ###    Start timer timer.timer_humidity_bathroom       ###
    ##########################################################
  - alias: Restart timer Badrum
    id: '7708699706754' 
    mode: restart

    trigger:
      - platform: state
        entity_id: sensor.badrum_luftfuktighet

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >-
            {% set rh = states('sensor.fukt_badrumsfonster')|float(none) %}
            {% set low = states('input_number.ventilation_rh_stable_min')|float(70) %}
            {% set high = states('input_number.ventilation_rh_stable_max')|float(90) %}
            {{ rh is not none and (low <= rh <= high) }}

    action:
      # Cancel timer and reset to max time
      - service: timer.cancel
        entity_id: timer.timer_humidity_bathroom

      # Start timer and count down
      - service: timer.start
        data:
          entity_id: timer.timer_humidity_bathroom
          duration: >-
            {% set m = states('input_number.ventilation_stable_minutes')|int(20) %}
            {{ '%02d:%02d:00' | format((m // 60), (m % 60)) }}

    #############################################################
    ### Sätter larm för ventilation om något annat larm sätts ###
    ### T: input_boolean.high_humidity_bathroom_away == on    ###
    ###    input_boolean.low_temp_franluft == on              ###
    ###    input_boolean.high_temp_franluft == on             ###
    ###    input_boolean.low_temp_tilluft == on               ###
    ###    input_boolean.high_temp_tilluft == on              ###
    ### C: switch.shelly1_c45bbe77099d == 'on'                ###
    ### A: input_boolean.alarm_ventilation = on               ###
    #############################################################
  - alias: Sätt larm för vent 
    id: '1260867887061' 

    trigger:
      - platform: state
        entity_id: input_boolean.high_humidity_bathroom_away
        to: 'on'
      - platform: state
        entity_id: input_boolean.low_temp_franluft
        to: 'on'
      - platform: state
        entity_id: input_boolean.high_temp_franluft
        to: 'on'
      - platform: state
        entity_id: input_boolean.low_temp_tilluft
        to: 'on'
      - platform: state
        entity_id: input_boolean.high_temp_tilluft
        to: 'on'
       
    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.alarm_ventilation


    #######################
    ### ALARM - NOTIFY ####
    #######################
    ####################################################
    ### Larm! Hög fukt i badrummet, ingen hemma      ###
    ### T: switch.shelly1_c45bbe77099d == on         ###
    ### C: group.track_for_home_devices = 'not_home' ###
    ### A: notify                                    ###
    ####################################################
  - alias: Badrumsfönster hög fukt larm
    id: '9957878217554' 

    trigger:
      platform: state
      entity_id: switch.shelly1_c45bbe77099d
      to: 'on'

    condition:
      condition: state
      entity_id: group.track_for_home_devices
      state: 'not_home'
    
    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.high_humidity_bathroom_away
      - service: notify.mobile_app_sm_a528b
        data:
          message: "Larm! Hög fukt i badrummet {{ states('sensor.fukt_badrumsfonster') }} {{ state_attr('sensor.fukt_badrumsfonster', 'unit_of_measurement') }}, ingen är hemma"

    ###########################################
    ### Larm! Låg temp ventilation frånluft ###
    ### T: sensor.Franluft < 17             ###
    ### A: notify.mobile_app_sm_a528b       ###
    ###########################################
  - alias: Låg temp frånluft
    id: '9429831261148' 

    trigger:
      platform: numeric_state
      entity_id: sensor.Franluft
      below: '17'
      
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.ventilationsaggregat
          state: 'on'

    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.low_temp_franluft
      - service: notify.mobile_app_sm_a528b
        data:
          message: "Larm! Låg temp frånluft ventilation: {{ states('sensor.Franluft') }} {{ state_attr('sensor.Franluft', 'unit_of_measurement') }}"

    ###########################################
    ### Larm! Hög temp ventilation frånluft ###
    ### T: sensor.Franluft > 35             ###
    ### A: notify.mobile_app_sm_a528b       ###
    ###########################################
  - alias: Hög temp frånluft
    id: '9899866850141' 

    trigger:
      platform: numeric_state
      entity_id: sensor.Franluft
      above: '35'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.ventilationsaggregat
          state: 'on'  

    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.high_temp_franluft
      - service: notify.mobile_app_sm_a528b
        data:
          message: "Larm! Hög temp frånluft ventilation: {{ states('sensor.Franluft') }} {{ state_attr('sensor.Franluft', 'unit_of_measurement') }}"

    ##########################################
    ### Larm! Låg temp ventilation tilluft ###
    ### T: sensor.Tilluft < 12             ###
    ### A: notify.mobile_app_sm_a528b      ###
    ##########################################
  - alias: Låg temp tilluft
    id: '4486107333202' 

    trigger:
      platform: numeric_state
      entity_id: sensor.Tilluft
      below: '12'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.ventilationsaggregat
          state: 'on'

    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.low_temp_tilluft
      - service: notify.mobile_app_sm_a528b
        data:
          message: "Larm! Låg temp tilluft ventilation: {{ states('sensor.Tilluft') }} {{ state_attr('sensor.Tilluft', 'unit_of_measurement') }}"

    ##########################################
    ### Larm! Hög temp ventilation tilluft ###
    ### T: sensor.Tilluft > 35             ###
    ### A: notify.mobile_app_sm_a528b      ###
    ##########################################
  - alias: Hög temp tilluft
    id: '0562422564630' 

    trigger:
      platform: numeric_state
      entity_id: sensor.Tilluft
      above: '35'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.ventilationsaggregat
          state: 'on'

    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.high_temp_tilluft
      - service: notify.mobile_app_sm_a528b
        data:
          message: "Larm! Hög temp tilluft ventilation: {{ states('sensor.Tilluft') }} {{ state_attr('sensor.Tilluft', 'unit_of_measurement') }}"

    ################
    ### Hög fukt ###
    ################
    ###########################################
    ### Snabbt ökande fukt                  ###
    ### T: new - old >= 4                   ###
    ### A: switch.shelly1_c45bbe77099d = on ###
    ###########################################
  - alias: Forcerad Snabbt ökande fukt
    id: '9929138154747' 

    trigger:
      - platform: state
        entity_id: sensor.fukt_badrumsfonster

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.shelly1_c45bbe77099d
          state: 'off'
        - condition: template
          value_template: >-
            {{ trigger.to_state is not none
              and trigger.from_state is not none
              and trigger.to_state.state not in ['unknown','unavailable','None']
              and trigger.from_state.state not in ['unknown','unavailable','None'] }}
        - condition: template 
          value_template: >-
            {% set to = trigger.to_state.state|float(0) %}
            {% set fr = trigger.from_state.state|float(0) %}
            {% set delta = states('input_number.ventilation_rh_delta_fast')|float(4) %}
            {{ (to - fr) >= delta }}
        - condition: template
          value_template: >-
            {% set t = states('sensor.ute')|float(none) %}
            {% set min_t = states('input_number.ventilation_outdoor_temp_min_force')|float(-8) %}
            {{ t is not none and t > min_t }}

    action:
      - service: script.fan_forced
        data: {}

    ###########################################
    ### Hög fukt badrumsfönster             ###
    ### T: sensor.fukt_badrumsfonster > 70  ###
    ### A: switch.shelly1_c45bbe77099d = on ###
    ###########################################
  - alias: Forcerad Badrumsfönster hög fukt
    id: '4666590923645' 

    trigger:
      - platform: state
        entity_id: sensor.fukt_badrumsfonster

    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >-
            {% set rh = states('sensor.fukt_badrumsfonster')|float(none) %}
            {% set on = states('input_number.ventilation_rh_force_on')|float(70) %}
            {{ rh is not none and rh > on }}
        - condition: state
          entity_id: switch.shelly1_c45bbe77099d
          state: 'off'
        - condition: template
          value_template: >-
            {{ trigger.to_state is not none
              and trigger.from_state is not none
              and trigger.to_state.state not in ['unknown','unavailable','None']
              and trigger.from_state.state not in ['unknown','unavailable','None'] }}
        - condition: template 
          value_template: >-
            {% set to = trigger.to_state.state|float(0) %}
            {% set fr = trigger.from_state.state|float(0) %}
            {% set delta = states('input_number.ventilation_rh_delta_high')|float(2) %}
            {{ (to - fr) >= delta }}
        - condition: template
          value_template: >-
            {% set t = states('sensor.ute')|float(none) %}
            {% set min_t = states('input_number.ventilation_outdoor_temp_min_force')|float(-8) %}
            {{ t is not none and t > min_t }}

    action:
      - service: script.fan_forced
        data: {}

    ################
    ### Låg fukt ###
    ################
    ############################################
    ### Låg fukt badrumsfönster              ###
    ### T: sensor.fukt_badrumsfonster < 69   ###
    ### A: switch.shelly1_c45bbe77099d = off ###
    ############################################
  - alias: Normal Badrumsfönster låg fukt
    id: '2338758060314' 

    trigger:
      - platform: state
        entity_id: sensor.fukt_badrumsfonster

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.shelly1_c45bbe77099d
          state: 'on'
        - condition: template
          value_template: >-
            {% set rh = states('sensor.fukt_badrumsfonster')|float(none) %}
            {% set off = states('input_number.ventilation_rh_force_off')|float(69) %}
            {{ rh is not none and rh < off }}

    action:
      - service: script.fan_normal
        data: {}

    #################################################################################################
    ### Hög fukt i huset                                                                          ###
    ### Fukt värdet är högt i huset då kan vi stänga av forcerad fläkt vid högre värde än normalt ###
    ### T: every 5 minutes                                                                        ###
    ### C: mindre än 8% skillnad mellan badrum och hall                                           ###
    ### C: sensorer uppdaterade de senaste 10 minuterna                                           ###
    ### A: switch.shelly1_c45bbe77099d = off                                                      ###
    #################################################################################################
  - alias: Normal Hög fukt i huset
    id: '8205563946460' 

    trigger:
      - platform: time_pattern
        minutes: "/5"

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.shelly1_c45bbe77099d
          state: 'on'

        # Om fukten är hög i hela huset: stäng av forcering tidigare (diff-tuned) men bara om sensorerna är "färska".
        - condition: template
          value_template: >-
            {% set b = states('sensor.badrum_luftfuktighet')|float(none) %}
            {% set v = states('sensor.vardagsrum_luftfuktighet')|float(none) %}
            {% set diff = states('input_number.ventilation_house_humidity_diff')|float(8) %}
            {% set fresh = states('input_number.ventilation_sensor_fresh_seconds')|int(600) %}
            {% set b_updated = states.sensor.badrum_luftfuktighet.last_updated if states.sensor.badrum_luftfuktighet is defined else none %}
            {% set v_updated = states.sensor.vardagsrum_luftfuktighet.last_updated if states.sensor.vardagsrum_luftfuktighet is defined else none %}
            {% set b_age = (as_timestamp(now()) - as_timestamp(b_updated)) if b_updated is not none else 999999 %}
            {% set v_age = (as_timestamp(now()) - as_timestamp(v_updated)) if v_updated is not none else 999999 %}
            {{ b is not none and v is not none and (b - diff) <= v and b_age < fresh and v_age < fresh }}
    action:
      - service: script.fan_normal
        data: {}

    #####################################################################################
    ### Sätter ventilation till Normal när luftfuktigheten stabiliserats i 20 minuter ###
    ### T: timer_humidity_bathroom == timer.finished                                  ###
    ### C: switch.shelly1_c45bbe77099d == 'on'                                        ###
    ###    sensor.fukt_badrumsfonster < 90                                            ###
    ###    sensor.fukt_badrumsfonster > 70                                            ###
    ### A: switch.shelly1_c45bbe77099d = 'off'                                        ###
    #####################################################################################
  - alias: Normal vid stabiliserad fukt 
    id: '2929098085256' 

    trigger:
      # Timer finished after20 minutes
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.timer_humidity_bathroom
      
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.shelly1_c45bbe77099d
          state: 'on'
        - condition: template
          value_template: >-
            {% set rh = states('sensor.fukt_badrumsfonster')|float(none) %}
            {% set low = states('input_number.ventilation_rh_stable_min')|float(70) %}
            {% set high = states('input_number.ventilation_rh_stable_max')|float(90) %}
            {{ rh is not none and (low <= rh <= high) }}

    action:
      - service: script.fan_normal
        data: {}

    #############################################################################
    ### Sätter ventilation till Normal efter maxtid uppnåtts efter 90 minuter ###
    ### T: timer_humidity_bathroom_max_time == timer.finished                 ###
    ### C: switch.shelly1_c45bbe77099d == 'on'                                ###
    ### A: switch.shelly1_c45bbe77099d = 'off'                                ###
    #############################################################################
  - alias: Normal efter maxtid 
    id: '2363906399069' 

    trigger:
      # Timer finished after 90 minutes
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.timer_humidity_bathroom_max_time
      
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.shelly1_c45bbe77099d
          state: 'on'

    action:
      - service: script.fan_normal
        data: {}

    #############################################################
    ### Reset timer när ventilationen sätts till Normal       ###
    ### T: switch.shelly1_c45bbe77099d == 'off'               ###
    ### A: timer_humidity_bathroom == timer.finished          ###
    ###    timer_humidity_bathroom_max_time == timer.finished ###
    #############################################################
  - alias: Reset timer när vent sätts till Normal 
    id: '5200984544851' 

    trigger:
      platform: state
      entity_id: switch.shelly1_c45bbe77099d
      from: 'on'
      to: 'off'
      
    action:
      # Cancel timer and reset to max time
      - service: timer.cancel
        entity_id: timer.timer_humidity_bathroom
      - service: timer.cancel
        entity_id: timer.timer_humidity_bathroom_max_time
        
    #######################
    ### Ventilation off ###
    #######################
    #####################################################
    ### Ventilation off                               ###
    ### T: group.track_for_home_devices == 'not_home' ###
    ### C: switch.ventilationsaggregat == on          ###
    ### C: sensor.ute > 24                            ###
    ### C: sensor.fukt_badrumsfonster < 60            ###
    ### C: sensor.inne_medel > 23                     ###
    ### A: switch.ventilationsaggregat = off          ###
    #####################################################
  - alias: Vent off (Borta, ute >24°C, <60%, Inne > 23°C)
    id: '4095198757607' 

    trigger:
      platform: state
      entity_id: group.track_for_home_devices
      from: 'home'
      to: 'not_home'

    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: switch.ventilationsaggregat
          state: 'on'
        - condition: numeric_state
          entity_id: sensor.ute
          above: '24'
        - condition: numeric_state
          entity_id: sensor.fukt_badrumsfonster
          below: '60'
        - condition: numeric_state
          entity_id: sensor.inne_medel
          above: '23'

