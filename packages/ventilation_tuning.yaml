####################################################
#                                                  #
#           VENTILATION AUTO-TUNING (FTX)          #
#                                                  #
####################################################
# BESKRIVNING:
# Ger en säker "advisor" för att föreslå (och vid behov auto-applicera) nya
# tröskelvärden för ventilationens forceringslogik.
#
# Filosofi:
# - Justerar små steg (±1) inom hårda gränser.
# - Kräver explicit enable + (valfritt) auto-apply.
# - Bygger på historik/statistik (Recorder/History).
#
# Källor:
# - packages/ventilation_system.yaml (styrlogik + input_numbers)
#
# METADATA:
# Skapad: 2025-12-30
# Senast ändrad: 2025-12-30
# Version: 1.0
# Författare: Home Assistant Config
####################################################

#####################
### Input Boolean ###
#####################
input_boolean:
  ventilation_auto_tuning_enabled:
    name: Ventilation auto-tuning (på)
    initial: off

  ventilation_auto_tuning_auto_apply:
    name: Ventilation auto-tuning (auto-applicera)
    initial: off

################
### Template ###
################
template:
  - sensor:
      - name: Ventilation RH (forcerad)
        unique_id: ventilation_rh_when_forced
        unit_of_measurement: '%'
        state: >-
          {% if is_state('switch.shelly1_c45bbe77099d', 'on') %}
            {{ states('sensor.fukt_badrumsfonster')|float(none) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Ventilation rekommenderad RH start
        unique_id: ventilation_recommended_rh_force_on
        unit_of_measurement: '%'
        state: >-
          {% set cur_on = states('input_number.ventilation_rh_force_on')|float(70) %}
          {% set cur_off = states('input_number.ventilation_rh_force_off')|float(69) %}
          {% set runtime_h = states('sensor.ventilation_forcerad_tid_24h')|float(0) %}
          {% set max_runtime_h = (states('input_number.ventilation_max_runtime_minutes')|float(90) / 60) %}
          {% set rh_max = states('sensor.ventilation_fukt_fonster_max_24h')|float(none) %}
          {% set new_on = cur_on %}

          {# För mycket forcering nära maxtid: höj trösklar lite #}
          {% if runtime_h > (max_runtime_h * 0.9) %}
            {% set new_on = cur_on + 1 %}
          {# Väldigt hög max-fukt men nästan ingen forcering: sänk lite #}
          {% elif rh_max is not none and rh_max > 85 and runtime_h < 0.5 %}
            {% set new_on = cur_on - 1 %}
          {% endif %}

          {# Bounds #}
          {% set new_on = [60, [new_on, 85]|min]|max %}
          {# Säkerställ hysteresis: on minst 1 över off #}
          {% set new_on = [new_on, (cur_off + 1)]|max %}
          {{ new_on|round(0) }}

      - name: Ventilation rekommenderad RH stop
        unique_id: ventilation_recommended_rh_force_off
        unit_of_measurement: '%'
        state: >-
          {% set cur_on = states('input_number.ventilation_rh_force_on')|float(70) %}
          {% set cur_off = states('input_number.ventilation_rh_force_off')|float(69) %}
          {% set runtime_h = states('sensor.ventilation_forcerad_tid_24h')|float(0) %}
          {% set max_runtime_h = (states('input_number.ventilation_max_runtime_minutes')|float(90) / 60) %}
          {% set rh_max = states('sensor.ventilation_fukt_fonster_max_24h')|float(none) %}
          {% set new_off = cur_off %}

          {% if runtime_h > (max_runtime_h * 0.9) %}
            {% set new_off = cur_off + 1 %}
          {% elif rh_max is not none and rh_max > 85 and runtime_h < 0.5 %}
            {% set new_off = cur_off - 1 %}
          {% endif %}

          {# Bounds + hysteresis #}
          {% set new_off = [58, [new_off, 84]|min]|max %}
          {% set new_off = [new_off, (cur_on - 1)]|min %}
          {{ new_off|round(0) }}

      - name: Ventilation rekommenderad stabil tid
        unique_id: ventilation_recommended_stable_minutes
        unit_of_measurement: 'min'
        state: >-
          {% set cur = states('input_number.ventilation_stable_minutes')|int(20) %}
          {% set runtime_h = states('sensor.ventilation_forcerad_tid_24h')|float(0) %}
          {% set count = states('sensor.ventilation_forcerad_antal_24h')|int(0) %}
          {% set avg = ((runtime_h * 60) / count) if count > 0 else 0 %}
          {% set new = cur %}

          {# Om många start/stopp med korta körningar: öka stabilitetstid (anti-fladder) #}
          {% if count >= 10 and avg < 8 %}
            {% set new = cur + 5 %}
          {% elif count >= 6 and avg < 12 %}
            {% set new = cur + 2 %}
          {% endif %}

          {# Bounds - vi minskar inte automatiskt (safety) #}
          {% set new = [10, [new, 45]|min]|max %}
          {{ new|round(0) }}

      - name: Ventilation rekommenderad maxtid
        unique_id: ventilation_recommended_max_runtime_minutes
        unit_of_measurement: 'min'
        state: >-
          {% set cur = states('input_number.ventilation_max_runtime_minutes')|int(90) %}
          {% set rh_max = states('sensor.ventilation_fukt_fonster_max_24h')|float(none) %}
          {% set runtime_h = states('sensor.ventilation_forcerad_tid_24h')|float(0) %}
          {% set count = states('sensor.ventilation_forcerad_antal_24h')|int(0) %}
          {% set avg = ((runtime_h * 60) / count) if count > 0 else 0 %}
          {% set new = cur %}

          {# Om sessionerna typiskt är nära maxtid: justera försiktigt upp/ner #}
          {% if count > 0 and avg > (cur * 0.8) %}
            {% if rh_max is not none and rh_max > 80 %}
              {% set new = cur + 10 %}
            {% elif rh_max is not none and rh_max < 75 %}
              {% set new = cur - 5 %}
            {% endif %}
          {% endif %}

          {# Normalisera till 5-min steg och bounds #}
          {% set new = (5 * ((new / 5) | round(0))) | int %}
          {% set new = [30, [new, 150]|min]|max %}
          {{ new }}

##############
### Sensor ###
##############
sensor:
  - platform: history_stats
    name: Ventilation forcerad tid (24h)
    entity_id: switch.shelly1_c45bbe77099d
    state: 'on'
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Ventilation forcerad antal (24h)
    entity_id: switch.shelly1_c45bbe77099d
    state: 'on'
    type: count
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

  - platform: statistics
    name: Ventilation fukt fönster max (24h)
    entity_id: sensor.fukt_badrumsfonster
    state_characteristic: max_value
    max_age:
      hours: 24

  - platform: statistics
    name: Ventilation RH (forcerad) medel (24h)
    entity_id: sensor.ventilation_rh_when_forced
    state_characteristic: mean
    max_age:
      hours: 24

##############
### Script ###
##############
script:
  ventilation_tuning_apply_recommended:
    alias: Applicera rekommenderade ventilationvärden
    sequence:
      - condition: state
        entity_id: input_boolean.ventilation_auto_tuning_enabled
        state: 'on'

      - variables:
          rec_on: "{{ states('sensor.ventilation_recommended_rh_force_on')|float(none) }}"
          rec_off: "{{ states('sensor.ventilation_recommended_rh_force_off')|float(none) }}"
          rec_stable: "{{ states('sensor.ventilation_recommended_stable_minutes')|float(none) }}"
          rec_max: "{{ states('sensor.ventilation_recommended_max_runtime_minutes')|float(none) }}"

      - condition: template
        value_template: "{{ rec_on is not none and rec_off is not none and rec_stable is not none and rec_max is not none }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_rh_force_on
        data:
          value: "{{ rec_on }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_rh_force_off
        data:
          value: "{{ rec_off }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_stable_minutes
        data:
          value: "{{ rec_stable }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.ventilation_max_runtime_minutes
        data:
          value: "{{ rec_max }}"

##############
### Automation ###
##############
automation:
  - alias: Ventilation auto-tuning advisor
    id: 'ventilation_auto_tuning_advisor'
    trigger:
      - platform: time
        at: '03:15:00'
      - platform: homeassistant
        event: start

    condition:
      - condition: state
        entity_id: input_boolean.ventilation_auto_tuning_enabled
        state: 'on'

    action:
      - variables:
          cur_on: "{{ states('input_number.ventilation_rh_force_on')|float(70) }}"
          cur_off: "{{ states('input_number.ventilation_rh_force_off')|float(69) }}"
          rec_on: "{{ states('sensor.ventilation_recommended_rh_force_on')|float(none) }}"
          rec_off: "{{ states('sensor.ventilation_recommended_rh_force_off')|float(none) }}"
          cur_stable: "{{ states('input_number.ventilation_stable_minutes')|float(20) }}"
          cur_max: "{{ states('input_number.ventilation_max_runtime_minutes')|float(90) }}"
          rec_stable: "{{ states('sensor.ventilation_recommended_stable_minutes')|float(none) }}"
          rec_max: "{{ states('sensor.ventilation_recommended_max_runtime_minutes')|float(none) }}"
          runtime_h: "{{ states('sensor.ventilation_forcerad_tid_24h')|float(0) }}"
          forced_count: "{{ states('sensor.ventilation_forcerad_antal_24h')|int(0) }}"
          rh_max: "{{ states('sensor.ventilation_fukt_fonster_max_24h')|float(none) }}"

      - condition: template
        value_template: "{{ rec_on is not none and rec_off is not none and rec_stable is not none and rec_max is not none }}"

      - condition: template
        value_template: >-
          {{ (rec_on|round(0) != cur_on|round(0))
             or (rec_off|round(0) != cur_off|round(0))
             or (rec_stable|round(0) != cur_stable|round(0))
             or (rec_max|round(0) != cur_max|round(0)) }}

      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.ventilation_auto_tuning_auto_apply
                state: 'on'
            sequence:
              - service: script.ventilation_tuning_apply_recommended
                data: {}
              - service: persistent_notification.create
                data:
                  notification_id: ventilation_auto_tuning
                  title: Ventilation auto-tuning (applicerad)
                  message: >-
                    Nya värden applicerade.

                    RH start: {{ cur_on|round(0) }} → {{ rec_on|round(0) }}
                    RH stop: {{ cur_off|round(0) }} → {{ rec_off|round(0) }}
                    Stabil tid: {{ cur_stable|round(0) }} → {{ rec_stable|round(0) }} min
                    Maxtid: {{ cur_max|round(0) }} → {{ rec_max|round(0) }} min

                    Forcerad tid 24h: {{ runtime_h|round(2) }} h
                    Forcerad antal 24h: {{ forced_count }}
                    Max fukt fönster 24h: {{ rh_max|round(0) if rh_max is not none else 'unknown' }} %
        default:
          - service: persistent_notification.create
            data:
              notification_id: ventilation_auto_tuning
              title: Ventilation auto-tuning (förslag)
              message: >-
                Förslag på nya värden (ej applicerade).

                RH start: {{ cur_on|round(0) }} → {{ rec_on|round(0) }}
                RH stop: {{ cur_off|round(0) }} → {{ rec_off|round(0) }}
                Stabil tid: {{ cur_stable|round(0) }} → {{ rec_stable|round(0) }} min
                Maxtid: {{ cur_max|round(0) }} → {{ rec_max|round(0) }} min

                Forcerad tid 24h: {{ runtime_h|round(2) }} h
                Forcerad antal 24h: {{ forced_count }}
                Max fukt fönster 24h: {{ rh_max|round(0) if rh_max is not none else 'unknown' }} %
