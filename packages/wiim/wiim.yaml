script:
  wiim_play_p3:
    alias: "WiiM - Play Sveriges Radio P3"
    description: "Play Sveriges Radio P3 stream on WiiM Mini-F7E6"
    sequence:
      - service: media_player.play_media
        data:
          entity_id: media_player.wiim_mini_f7e6
          media_content_type: music
          media_content_id: "https://edge1.sr.se/p3-aac-320"
        target: {}
  wiim_play_spotify:
    alias: "WiiM - Play Spotify"
    description: "Switch to Spotify on WiiM Mini-F7E6"
    sequence:
      - service: media_player.select_source
        data:
          entity_id: media_player.wiim_mini_f7e6
          source: "Spotify"
        target: {}
