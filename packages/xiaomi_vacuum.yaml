################################################################################
automation:
  - alias: Dagligen måndag
    trigger:
      - platform: time
        at: '10:00:00'
    condition:
      condition: and
      conditions:
        - condition: time
          weekday:
            - mon
#            - tue
#            - wed
#            - thu
#            - fri
        - condition: state
          entity_id: group.track_for_home_devices
          state: 'not_home'        
    action:
      - service: script.vacuum_daily

  - alias: Dagligen onsdag
    trigger:
      - platform: time
        at: '10:00:00'
    condition:
      condition: and
      conditions:
        - condition: time
          weekday:
            - wed
        - condition: state
          entity_id: group.track_for_home_devices
          state: 'not_home'        
    action:
      - service: script.vacuum_daily

  - alias: Dagligen fredag
    trigger:
      - platform: time
        at: '10:00:00'
    condition:
      condition: and
      conditions:
        - condition: time
          weekday:
            - fri
        - condition: state
          entity_id: group.track_for_home_devices
          state: 'not_home'        
    action:
      - service: script.vacuum_daily        

  - alias: "Dammsugaren har problem"
    trigger:
      - platform: state
        entity_id: vacuum.xiaomi_vacuum_cleaner
        to: "error"
    action:
      - service: notify.mobile_app_sm_a528b
        data:
          title: "Dammsugaren har problem"
          message: "Sitter fast eller vill bara ha lite uppmärksamhet"