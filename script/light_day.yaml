#######################################################
#                                                     #
#             DAGBELYSNING SCRIPTS (09:00-18:00)      #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Fullt normalt dagsljus för aktiv användardag.
# Stöder både vanligt läge och julmodus.
#
# HÅRDVARA:
# - IKEA ljusgrupper (kök/hall/vardagsrum/sovrum/etc)
# - Tellstick-lampor
# - Julbelysning (villkor: input_boolean.christmas_light)
#
# SCRIPTS:
# - daylights_on: Huvudscript (växlar mellan jul/vanligt)
# - daylights_default_on: Normalt dagsläge (40-80%)
# - daylights_christmas_on: Julbelysning
# - daylights_on_morning: Morgon-variant av dagsläge
# - inside_lights_off: Slutlig släckning innebelysning
#
# SÄKERHET:
# - Mode: restart – ny trigger avbryter tidigare kör
# - Mjuka övergångar (2s)
#
# ANVÄNDNING:
# Anropas från ljusstyrka-automation 09:00-18:00.
#######################################################

  #######################
  ### Dagbelysning on ###
  #######################
  daylights_on:
    alias: Dagbelysning on
    mode: restart
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.home_status
          option: Hemma på

      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.daylights_christmas_on
            {% else %}
              script.daylights_default_on
            {% endif %}

  ### ==================== ###
  ### Dagbelysning default on
  ### ==================== ###
  daylights_default_on:
    alias: Dagbelysning default on
    mode: restart
    sequence:
      # IKEA - Normalt dagsljus (40-80%)
      - service: light.turn_on
        data:
          entity_id: light.kok_stora_fonstret
          brightness_pct: 50
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.hall_byra
          brightness_pct: 40
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.hall_skap
          brightness_pct: 40
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster
          brightness_pct: 50
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_skank
          brightness_pct: 50
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_vagn
          brightness_pct: 50
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.uterum_fonster
          brightness_pct: 80
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.andreas_fonster_2
          brightness_pct: 30
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.sovrum_fonster
          brightness_pct: 50
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.louise_fonster
          brightness_pct: 80
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.louise_golvlampa
          brightness_pct: 80
          transition: 2
      - service: light.turn_on
        entity_id: light.vardagsrum_vitrinskap2

# IKEA Julbelysning

# Tellstick
      - service: light.turn_on
        entity_id: light.kok_lilla_fonstret
 
  ### ------------------- ###
  ### Dagbelysning Jul on ###
  ### ------------------- ###
  daylights_christmas_on:
    alias: Dagbelysning jul on
    sequence:
# IKEA

      - service: light.turn_on
        data:
          entity_id: light.hall_skap
          brightness_pct: 50
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_skank
          brightness_pct: 50
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_vagn
          brightness_pct: 50
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.louise_fonster
          brightness_pct: 80
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.louise_golvlampa
          brightness_pct: 80
          transition: 2
      - service: light.turn_on
        entity_id: light.vardagsrum_vitrinskap2

# IKEA Julbelysning

# Tellstick
      - service: light.turn_on
        entity_id: light.kok_lilla_fonstret

# Tellstick Julbelysning
      - service: light.turn_on
        entity_id: light.kok_stora_fonstret_ljusstake

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster_ljusstake_2
          brightness_pct: 100
          transition: 2
      - service: light.turn_on
        entity_id: light.vardagsrum_gran

      - service: light.turn_on
        entity_id: light.uterum_julstjarnor

      - service: light.turn_on
        entity_id: light.andreas_fonster

      - service: light.turn_on
        entity_id: light.sovrum_sangbord

      - service: light.turn_on
        entity_id: light.hall_jullampa


  #######################
  ### Dagbelysning on ###
  #######################
  daylights_on_morning:
    alias: Dagbelysning on morgon
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.home_status
          option: Hemma på

      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.daylights_christmas_on
            {% else %}
              script.daylights_default_on
            {% endif %}

  #########################
  ### Innebelysning off ###
  #########################
  inside_lights_off:
    alias: Innebelysning off
    sequence:
# IKEA
      - service: light.turn_off
        entity_id: light.dagbelysning

      - service: light.turn_off
        entity_id: light.dagbelysning_jul
        