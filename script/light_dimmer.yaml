#######################################################
#                                                     #
#              TV LJUSDIMMER SCRIPTS                  #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Fyrstegsdimmer för TV-rum (max/normal/se på tv/off).
#
# HÅRDVARA:
# - light.vardagsrum_skank
# - light.vardagsrum_vagn
# - light.vardagsrum_fonster
# - light.hall_byra
#
# SÄKERHET:
# - Mode: restart – ny nivå avbryter pågående
# - Tillgänglighetskontroll per ljus
# - Mjuka övergångar (2s)
#######################################################

  tv_light_max:
    alias: Tv lampor max
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.vardagsrum_skank') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_skank
          brightness_pct: 100
          transition: 2

      - condition: template
        value_template: "{{ states('light.vardagsrum_vagn') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_vagn
          brightness_pct: 100
          transition: 2

      - condition: template
        value_template: "{{ states('light.vardagsrum_fonster') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster
          brightness_pct: 100
          transition: 2

      - condition: template
        value_template: "{{ states('light.hall_byra') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.hall_byra
          brightness_pct: 100  
          transition: 2
        
  tv_light_normal:
    alias: Tv lampor normal
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.vardagsrum_skank') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_skank
          brightness_pct: 50
          transition: 2

      - condition: template
        value_template: "{{ states('light.vardagsrum_vagn') != 'unavailable' }}"
      - service: light.turn_on
