          entity_id: light.vardagsrum_vagn
          brightness_pct: 50
          transition: 2

      - condition: template
        value_template: "{{ states('light.vardagsrum_fonster') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster
          brightness_pct: 50
          transition: 2

      - condition: template
        value_template: "{{ states('light.hall_byra') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.hall_byra
          brightness_pct: 40
          transition: 2

  tv_light_look_at_tv:
    alias: Tv lampor se på tv
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.vardagsrum_skank') != 'unavailable' }}"
      - service: light.turn_on
