#######################################################
#                                                     #
#            KVÄLLSBELYSNING SCRIPTS (18:00-22:00)    #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Dämpad kvällsbelysning för avslappning när solen går ned.
# Stöder både vanligt läge och julmodus.
#
# HÅRDVARA:
# - IKEA ljusgrupper (15-25% nivåer)
# - Tellstick-lampor
# - Julbelysning (villkor: input_boolean.christmas_light)
#
# SÄKERHET:
# - Mode: restart – ny trigger avbryter tidigare kör
# - Mjuka övergångar (2s)
#
# ANVÄNDNING:
# Anropas från ljusstyrka-automation 18:00-22:00.
#######################################################

  ##########################
  ### Kvällsbelysning on ###
  ##########################
  eveninglights_on:
    alias: Kvällsbelysning on
    mode: restart
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.home_status
          option: Hemma på

      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.eveninglights_christmas_on
            {% else %}
              script.eveninglights_default_on
            {% endif %}

  ### ========================== ###
  ### Kvällsbelysning default on ###
  ### ========================== ###
  eveninglights_default_on:
    alias: Kvällsbelysning default on
    mode: restart
    sequence:
      # IKEA - Dämpad kvällsnivå (15-40%)
      - service: light.turn_on
        data:
          entity_id: light.kok_stora_fonstret
          brightness_pct: 25
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.hall_byra
          brightness_pct: 20
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.hall_skap
          brightness_pct: 15
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster
          brightness_pct: 25
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_skank
          brightness_pct: 25
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_vagn
          brightness_pct: 25
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.uterum_fonster
          brightness_pct: 40
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.andreas_fonster_2
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.sovrum_fonster
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.louise_fonster
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.louise_golvlampa
          transition: 2
      - service: light.turn_on
        entity_id: light.vardagsrum_vitrinskap

# IKEA Julbelysning

# Tellstick
      - service: light.turn_on
        entity_id: light.kok_lilla_fonstret
 
  ### ---------------------- ###
  ### Kvällsbelysning Jul on ###
  ### ---------------------- ###
  eveninglights_christmas_on:
    alias: Kvällsbelysning jul on
    sequence:
# IKEA

      - service: light.turn_on
        data:
          entity_id: light.hall_skap
          brightness_pct: 15
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_skank
          brightness_pct: 25
          transition: 2
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_vagn
          brightness_pct: 25
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.louise_fonster
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.louise_golvlampa
          transition: 2
      - service: light.turn_on
        entity_id: light.vardagsrum_vitrinskap

# IKEA Julbelysning

# Tellstick
      - service: light.turn_on
        entity_id: light.kok_lilla_fonstret

# Tellstick Julbelysning
      - service: light.turn_on
        entity_id: light.kok_stora_fonstret_ljusstake

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster_ljusstake_2
          brightness_pct: 50
          transition: 2
      - service: light.turn_on
        entity_id: light.vardagsrum_gran

      - service: light.turn_on
        entity_id: light.uterum_julstjarnor

      - service: light.turn_on
        entity_id: light.hall_jullampa

      - service: light.turn_off
        entity_id: light.andreas_fonster

      - service: light.turn_off
        entity_id: light.sovrum_sangbord
