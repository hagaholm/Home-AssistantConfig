#######################################################
#                                                     #
#           GODNATT SCRIPTS (sovning/avstängning)     #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Två varianter av Godnatt-sekvenser för sovning och
# full avstängning av hemmet (systemkväll).
#
# SCRIPTS:
# - goodnight: Släcker ljus, ställer hemma av
# - goodnight_10_min: Samma men med 10 min försening
# - goodnight_all: Full avstängning av alls (TV, stereor, etc)
# - goodnight_all_10_min: Med 10 min försening
#
# SÄKERHET:
# - Mode: restart – ny trigger avbryter tidigare
# - Ställer hemma-läge för säkerhet
# - Delay används för tidsintervall
#
# ANVÄNDNING:
# Anropas från UI-knapp eller Goodnight-automation.
#######################################################

  #############################
  ### Godnatt, släcker allt ###
  #############################
  goodnight:
    alias: Godnatt, släcker allt
    mode: restart
    sequence:
      # Ställ hemma av
      - service: input_select.select_option
        data:
          entity_id: input_select.home_status
          option: Hemma av

      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.daylights_christmas_off
            {% else %}
              script.daylights_default_off
            {% endif %}

      - service: light.turn_off
        data:
          entity_id: light.koksbelysning
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 2
      - service: switch.turn_off
        data:
          entity_id: switch.friggebod_fonster
      - service: switch.turn_off
        entity_id: switch.tradgard
      - service: switch.turn_off
        entity_id: switch.stickpropp_8 # Trädäck uterum
#      - service: light.turn_off
#        entity_id: light.tradack_ute
      - service: light.turn_off
        entity_id: light.spabad_v
      - service: light.turn_off
        entity_id: light.spabad_m
      - service: light.turn_off
        entity_id: light.spabad_h
      - service: light.turn_off
        entity_id: light.friggebod_ute_2

  ###########################################
  ### Godnatt, släcker allt om 10 minuter ###
  ###########################################
  goodnight_10_min:
    alias: Godnatt, släcker allt om 10 minuter
    mode: restart
    sequence:
      - delay: '00:10:00'
      # Ställ hemma av
      - service: input_select.select_option
        data:
          entity_id: input_select.home_status
          option: Hemma av

      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.daylights_christmas_off
            {% else %}
              script.daylights_default_off
            {% endif %}

      - service: light.turn_off
        data:
          entity_id: light.koksbelysning
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 2
      - service: switch.turn_off
        data:
          entity_id: switch.friggebod_fonster
      - service: switch.turn_off
        entity_id: switch.tradgard
      - service: switch.turn_off
        entity_id: switch.stickpropp_8 # Trädäck uterum
#      - service: light.turn_off
#        entity_id: light.tradack_ute
      - service: light.turn_off
        entity_id: light.spabad_v
      - service: light.turn_off
        entity_id: light.spabad_m
      - service: light.turn_off
        entity_id: light.spabad_h
      - service: light.turn_off
        entity_id: light.friggebod_ute_2

  ################################
  ### Godnatt, stänger av allt ###
  ################################
  goodnight_all:
    alias: Godnatt, stänger av allt
    mode: restart
    sequence:
      # Ställ hemma av
      - service: input_select.select_option
        data:
          entity_id: input_select.home_status
          option: Hemma av

      - service: input_select.select_option
        data:
          entity_id: input_select.light_inside
          option: Släckt

      - service: input_select.select_option
        data:
          entity_id: input_select.light_kitchen
          option: Släckt

      - service: input_select.select_option
        data:
          entity_id: input_select.light_garden
          option: Släckt

      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 2
      - service: switch.turn_off
        data:
          entity_id: switch.friggebod_fonster

#      - service: light.turn_off
#        entity_id: light.tradack_ute

      - service: remote.turn_off
        entity_id: remote.harmony_hub

      - delay: '00:00:15'

      - service: homeassistant.turn_off
        entity_id: switch.vardagsrum_stereobank
      - service: homeassistant.turn_off
        entity_id: switch.vardagsrum_tv
      - service: homeassistant.turn_off
        entity_id: switch.vardagsrum_subbas
      - service: light.turn_off
        entity_id: light.spabad_v
      - service: light.turn_off
        entity_id: light.spabad_m
      - service: light.turn_off
        entity_id: light.spabad_h
      - service: light.turn_off
        entity_id: light.friggebod_ute_2

