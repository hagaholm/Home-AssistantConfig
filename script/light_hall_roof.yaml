#######################################################
#                                                     #
#              HALL TAKLAMPOR SCRIPTS                 #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Förinställda nivåer för halltak (off/1/10/50/100%).
#
# SÄKERHET:
# - Mode: single (för att undvika samtidiga dim-ändringar)
# - Tillgänglighetskontroll för light.hall_tak
#######################################################

  ##########################
  ### Hall taklampor OFF ###
  ##########################
  hall_taklampor_off:
    alias: Hall taklampor off
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('light.hall_tak') != 'unavailable' }}"
      - service: light.turn_off
        target:
          entity_id: light.hall_tak
        data:
          transition: 10

  hall_taklampor_1_procent:
    alias: Hall taklampor 1 procent
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('light.hall_tak') != 'unavailable' }}"
      - service: light.turn_on
        target:
          entity_id: light.hall_tak
        data:
          brightness_pct: 1
          transition: 5

  hall_taklampor_10_procent:
    alias: Hall taklampor 10 procent
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('light.hall_tak') != 'unavailable' }}"
      - service: light.turn_on
        target:
          entity_id: light.hall_tak
        data:
          brightness_pct: 10
          transition: 5

  hall_taklampor_50_procent:
    alias: Hall taklampor 50 procent
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('light.hall_tak') != 'unavailable' }}"
      - service: light.turn_on
        target:
          entity_id: light.hall_tak
        data:
          brightness_pct: 50
          transition: 5

  hall_taklampor_100_procent:
    alias: Hall taklampor 100 procent
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('light.hall_tak') != 'unavailable' }}"
      - service: light.turn_on
        target:
          entity_id: light.hall_tak
        data:
          brightness_pct: 100
          transition: 5
