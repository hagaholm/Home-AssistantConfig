  ##########################
  ### Köksbelysning 100% ###
  ##########################
  kitchen_light_100:
    alias: Köksbelysning 100%
    sequence:
      - choose:
        - conditions: "{{ not is_state('light.kok_underskap_bank', '100%') }}"
          sequence:
            - service: light.turn_on
              data:
                entity_id: light.kok_underskap_bank
                brightness_pct: 90
                transition: 2

      - choose:
        - conditions: "{{ not is_state('light.kok_underskap_diskbank', '100%') }}"
          sequence:
            - service: light.turn_on
              data:
                entity_id: light.kok_underskap_diskbank
                brightness_pct: 90
                transition: 2

      - service: light.turn_on
        data:
          entity_id: light.kok_vitrinskap
          brightness_pct: 100
          transition: 2

  #########################
