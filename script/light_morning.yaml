#######################################################
#                                                     #
#           MORGONBELYSNING SCRIPTS (05:00-09:00)     #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Mjukt morgonljus för att väcka på ett behagligt sätt.
# Stöder både vanligt läge och julmodus.
#
# HÄRDVARA:
# - IKEA ljusgrupper (rum/fönster)
# - Tellstick-lampor (lilla fönstret)
# - Julbelysning (villkor: input_boolean.christmas_light)
#
# SCRIPTS:
# - morning_lights_on: Huvudscript (växlar mellan jul/vanligt)
# - morning_lights_default_on: Normalt morgonläge (50/40/40%)
# - morning_lights_christmas_on: Julbelysning (50-100%)
# - morning_lights_off: Slut-script (gör rent)
#
# SÄKERHET:
# - Mode: restart – ny klocka avbryter tidigare kör
# - Mjuka övergångar (2s) för ögonkomfort
#
# ANVÄNDNING:
# Anropas från ljusstyrka-automation vid 05:00-09:00.
#######################################################

  ##########################
  ### Morgonbelysning on ###
  ##########################
  morning_lights_on:
    alias: Morgonbelysning on
    mode: restart
    sequence:
      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.morning_lights_christmas_on
            {% else %}
              script.morning_lights_default_on
            {% endif %}

  ### ========================== ###
  ### Morgonbelysning default on ###
  ### ========================== ###
  morning_lights_default_on:
    alias: Morgonbelysning default on
    mode: restart
    sequence:
      # IKEA - 50/40/40/80% (fönster mjukt)
      - service: light.turn_on
        data:
          entity_id: light.kok_stora_fonstret
          brightness_pct: 50
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.hall_byra
          brightness_pct: 40
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.hall_skap
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster
          brightness_pct: 40
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_skank
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_vagn
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.uterum_fonster
          brightness_pct: 80
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.andreas_fonster_2
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.sovrum_fonster
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.louise_fonster
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.louise_golvlampa
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_vitrinskap2
          transition: 2

      # Tellstick
      - service: light.turn_on
        data:
          entity_id: light.kok_lilla_fonstret
          transition: 2

  ### ========================= ###
  ### Morgonjulbelysning on    ###
  ### ========================= ###
  morning_lights_christmas_on:
    alias: Morgonjulbelysning on
    mode: restart
    sequence:
      # IKEA - Släck övriga
      - service: light.turn_off
        data:
          entity_id: light.hall_skap
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_skank
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_vagn
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.louise_fonster
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.louise_golvlampa
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_vitrinskap2
          transition: 2

      # Tellstick
      - service: light.turn_on
        data:
          entity_id: light.kok_lilla_fonstret
          transition: 2

      # Tellstick Julbelysning (50-100%)
      - service: light.turn_on
        data:
          entity_id: light.kok_stora_fonstret_ljusstake
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster_ljusstake_2
          brightness_pct: 100
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_gran
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.uterum_julstjarnor
          transition: 2

      - service: light.turn_on
        data:
          entity_id: light.hall_jullampa
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.andreas_fonster
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.sovrum_sangbord
          transition: 2

  ### ========================== ###
  ### Morgonbelysning off       ###
  ### ========================== ###
  morning_lights_off:
    alias: Morgonbelysning off
    mode: restart
    sequence:
      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.morning_lights_christmas_off
            {% else %}
              script.morning_lights_default_off
            {% endif %}

  ### ============================= ###
  ### Morgonbelysning default off  ###
  ### ============================= ###
  morning_lights_default_off:
    alias: Morgonbelysning default off
    mode: restart
    sequence:
      # IKEA - Släck allt mjukt
      - service: light.turn_off
        data:
          entity_id: light.kok_stora_fonstret
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.hall_byra
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_fonster
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.uterum_fonster
          transition: 2

      # Tellstick
      - service: light.turn_off
        data:
          entity_id: light.kok_lilla_fonstret
          transition: 2

  ### ============================ ###
  ### Morgonbelysning jul off    ###
  ### ============================ ###
  morning_lights_christmas_off:
    alias: Morgonbelysning jul off
    mode: restart
    sequence:
      # Tellstick
      - service: light.turn_off
        data:
          entity_id: light.kok_lilla_fonstret
          transition: 2

      # Tellstick Julbelysning
      - service: light.turn_off
        data:
          entity_id: light.kok_stora_fonstret_ljusstake
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_fonster_ljusstake_2
          transition: 2
      - service: light.turn_off
        data:
          entity_id: light.vardagsrum_gran
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.uterum_julstjarnor
          transition: 2

      - service: light.turn_off
        data:
          entity_id: light.hall_jullampa
          transition: 2
   