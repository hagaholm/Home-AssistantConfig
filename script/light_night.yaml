#######################################################
#                                                     #
#             NATTBELYSNING SCRIPTS (22:00-05:00)     #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Minimalt nattljus för sovmiljö och orientering.
# Stöder både vanligt läge och julmodus.
#
# HÅRDVARA:
# - IKEA lampor (1-10% nivåer)
# - Tellstick Julbelysning
#
# SÄKERHET:
# - Mode: restart – ny trigger avbryter tidigare
# - Mjuka övergångar (5s för minimal störning)
#
# ANVÄNDNING:
# Anropas från ljusstyrka-automation 22:00-05:00.
#######################################################

  ########################
  ### Nattbelysning on ###
  ########################
  night_light:
    alias: Nattbelysning
    mode: restart
    sequence:
      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.night_light_christmas_on
            {% else %}
              script.night_light_default_on
            {% endif %}  
  
  ################################
  ### Nattbelysning default on ###
  ################################
  night_light_default_on:
    alias: Nattbelysning default
    mode: restart
    sequence:
      # IKEA - 1% minimal nattljus
      - service: light.turn_on
        data:
          entity_id: light.kok_stora_fonstret
          brightness_pct: 1
          transition: 5
      - service: light.turn_on
        data:
          entity_id: light.hall_byra
          brightness_pct: 1
          transition: 5
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster
          brightness_pct: 1
          transition: 5

      # Tellstick
      - service: light.turn_on
        data:
          entity_id: light.kok_lilla_fonstret
          transition: 5

  ##################################
  ### Nattbelysning christmas on ###
  ##################################
  night_light_christmas_on:
    alias: Nattjulbelysning
    mode: restart
    sequence:
      # Tellstick Jul (10% nivå)
      - service: light.turn_on
        data:
          entity_id: light.vardagsrum_fonster_ljusstake_2
          brightness_pct: 10
          transition: 5

      - service: light.turn_on
        data:
          entity_id: light.hall_jullampa
          transition: 5

      - service: light.turn_on
        data:
          entity_id: light.kok_lilla_fonstret
          transition: 5

  #########################
  ### Nattbelysning off ###
  #########################
  night_light_off:
    alias: Nattbelysning off
    mode: restart
    sequence:
      - service: script.turn_on
        data_template:
          entity_id: >
            {% if is_state('input_boolean.christmas_light', 'on') %}
              script.night_light_christmas_off
            {% else %}
              script.night_light_default_off
            {% endif %}

  night_light_default_off:
    alias: Nattbelysning default off
    mode: restart
    sequence:
      - service: light.turn_off
        data:
          entity_id: light.nattbelysning
          transition: 2

  night_light_christmas_off:
    alias: Nattjulbelysning off
    mode: restart
    sequence:
      - service: light.turn_off
        data:
          entity_id: light.nattbelysning_jul
          transition: 2

