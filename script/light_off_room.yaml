#######################################################
#                                                     #
#             SLÄCK RUM VISA SCRIPTS                  #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Släcker individuella rum: Sovrum, Andreas rum, Louise rum.
#
# SÄKERHET:
# - Mode: restart – avbryter pågående sekvens
# - Tillgänglighetskontroll per ljus
# - Mjuka övergångar (2s)
#######################################################

  #########################
  ### Släck i sovrummet ###
  #########################
  bedroom_off:
    alias: Släck i sovrummet
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.sovrum') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.sovrum
          transition: 2

  ###########################
  ### Släck i Andreas rum ###
  ###########################
  andreas_room_off:
    alias: Släck i Andreas rum
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.andreas_rum') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.andreas_rum
          transition: 2

      - condition: template
        value_template: "{{ states('light.andreas_rum_julstjarna') != 'unavailable' }}"
      - service: light.turn_off
        entity_id: light.andreas_rum_julstjarna

  ##########################
  ### Släck i Louise rum ###
  ##########################
  louise_room_off:
    alias: Släck i Louise rum
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.louise_rum') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.louise_rum
          transition: 2

#      - service: light.turn_off
#        entity_id: light.louise_fonster_dimmer_julstjarna