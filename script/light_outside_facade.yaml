#######################################################
#                                                     #
#             FASADBELYSNING SCRIPTS                  #
#                                                     #
#######################################################
#
# BESKRIVNING:
# Scenarier för fasadbelysning (på, av, natt, max).
#
# HÅRDVARA:
# - light.friggebod_fasad
# - light.forrad_fasad
# - light.tvattstugan_fasad
# - light.huvudentre2
#
# SÄKERHET:
# - Mode: restart – förhindrar överlapp
# - Tillgänglighetskontroller per armatur
# - Mjuka övergångar (1s)
#######################################################

  fasadbelysning_off:
    alias: Fasadbelysning släckt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1

      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.forrad_fasad
          transition: 1

      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.tvattstugan_fasad
          transition: 1

      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.huvudentre2
          transition: 1

  fasadbelysning_on:
    alias: Fasadbelysning tänt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 50
          transition: 1

      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 50
          transition: 1

      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 75
          transition: 1

      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1

  fasadbelysning_night:
    alias: Fasadbelysning natt
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1

      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 40
          transition: 1

      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 60
          transition: 1

      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 50
          transition: 1

  fasadbelysning_max:
    alias: Fasadbelysning max
    mode: restart
    sequence:
      - condition: template
        value_template: "{{ states('light.friggebod_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 100
          transition: 1

      - condition: template
        value_template: "{{ states('light.forrad_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 100
          transition: 1

      - condition: template
        value_template: "{{ states('light.tvattstugan_fasad') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 100
          transition: 1

      - condition: template
        value_template: "{{ states('light.huvudentre2') != 'unavailable' }}"
      - service: light.turn_on
        data:
          entity_id: light.huvudentre2
          brightness_pct: 100
          transition: 1
