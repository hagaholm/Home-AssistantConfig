  fasadbelysning_off:
    alias: Fasadbelysning släckt
    sequence:
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - service: light.turn_off
        data:
          entity_id: light.forrad_fasad
          transition: 1
      - service: light.turn_off
        data:
          entity_id: light.tvattstugan_fasad
          transition: 1
      - service: light.turn_off
        data:
          entity_id: light.huvudentre2
          transition: 1

  fasadbelysning_on:
    alias: Fasadbelysning tänt
    sequence:
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 50
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 50
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 75
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.huvudentre
          brightness_pct: 100
          transition: 1

  fasadbelysning_night:
    alias: Fasadbelysning natt
    sequence:
      - service: light.turn_off
        data:
          entity_id: light.friggebod_fasad
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 40
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 60
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.huvudentre
          brightness_pct: 50
          transition: 1

  fasadbelysning_max:
    alias: Fasadbelysning max
    sequence:
      - service: light.turn_on
        data:
          entity_id: light.friggebod_fasad
          brightness_pct: 100
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.forrad_fasad
          brightness_pct: 100
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.tvattstugan_fasad
          brightness_pct: 100
          transition: 1
      - service: light.turn_on
        data:
          entity_id: light.huvudentre
          brightness_pct: 100
          transition: 1
