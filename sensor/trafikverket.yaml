####################################################
#                                                  #
#          TRAFIKVERKET WEATHER STATIONS          #
#                                                  #
####################################################
# Public road weather station sensors
# Data from Trafikverket API (Swedish Transport Administration)
# Documentation: https://www.home-assistant.io/integrations/trafikverket_weatherstation/
#
# Purpose:
# - Monitor road and air temperature for local conditions
# - Use in automations for winter safety and climate control
#
sensor:
  - platform: trafikverket_weatherstation
    name: Trafikverket Gröndal
    api_key: !secret trafikverket_api
    station: Gröndal
    monitored_conditions:
      - air_temp

## Add only for test
  - platform: trafikverket_weatherstation
    name: Trafikverket Kungälv
    api_key: !secret trafikverket_api
    station: Kungälv
    monitored_conditions:
        - air_temp
        - road_temp
        - humidity
        - precipitation
        - wind_direction
        - wind_direction_text
        - wind_speed

  - platform: trafikverket_weatherstation
    name: Trafikverket Lanna
    api_key: !secret trafikverket_api
    station: Lanna
    monitored_conditions:
        - air_temp
        - road_temp
        - humidity

  - platform: trafikverket_weatherstation
    name: Trafikverket Nöbbele
    api_key: !secret trafikverket_api
    station: Nöbbele
    monitored_conditions:
        - air_temp
        - road_temp
        - humidity
        - precipitation
        - precipitation_amount
        - precipitation_amountname