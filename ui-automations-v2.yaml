          ## 📝 Dokumentation
          
          **Organisationsstruktur:**
          - Översikt: Snabb status
          - Belysning: Alla ljusautomationer
          - Klimat: Ventilation och värme
          - Säkerhet: Kameror och detektering
          - Närvaro: Hemma/borta logik
          - Larm: Alla larmautomationer
          - Media: Harmony Hub och underhållning
          - System: MQTT och systemautomationer
          - Övrigt: Bil och specialautomationer
          - Kontroller: Master-omkopplare
          - Debug: Felsökning och statistik
          
          **Underhåll:**
          - Nya automationer läggs till i rätt kategori
          - Inaktiva automationer markeras eller tas bort
          - Håll grupperingar logiska och lättförståeliga
