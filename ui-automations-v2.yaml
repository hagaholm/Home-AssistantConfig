#######################################################
# UI AUTOMATIONS V2 - PROFESSIONAL ORGANIZATION
#######################################################
# 
# This file provides a comprehensive, well-organized view of all automations
# Organized by functional area for easy maintenance and monitoring
# Created: 2026-01-17
# Version: 2.0
#
#######################################################

title: Automations V2
views:
  #######################################################
  # OVERVIEW - Quick Status of Key Systems
  #######################################################
  - path: overview
    title: Översikt
    icon: mdi:view-dashboard-outline
    badges: []
    cards:
      - type: markdown
        content: |
          # 🏠 Automations Översikt
          
          Välkommen till den nya automationsöversikten!
          
          **Organiserat efter funktionsområde:**
          - 💡 Belysning (Lights)
          - 🌡️ Klimat & Ventilation (Climate)
          - 📹 Kameror & Säkerhet (Security)
          - 🏠 Närvaro & Läge (Presence)
          - 🚨 Larm & Övervakning (Alerts)
          - 📱 Mediaspelare (Media)
          - 🔧 System & Underhåll (System)
          - 🚗 Fordon & Övrigt (Other)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_boolean.lights_auto_inne
            name: Auto-belysning inne
          - type: tile
            entity: input_boolean.lights_auto_tradgard
            name: Auto-belysning ute
          - type: tile
            entity: switch.ventilationsaggregat
            name: Ventilation
          - type: tile
            entity: input_select.home_status
            name: Hemstatus

  #######################################################
  # LIGHTS - All lighting automation
  #######################################################
