    title: Belysning
    icon: mdi:lightbulb-multiple-outline
    badges: []
    cards:
      - type: markdown
        content: |
          # 💡 Belysningsautomationer
          
          Alla automationer som styr belysning i hemmet.
          Se **Diagnostik → Varför?** för en förklaring av varför en lampa är i sitt nuvarande läge just nu.

      # Resolvers - Main control logic
      - type: entities
        title: 🎯 Huvudstyrning (Resolvers)
        show_header_toggle: true
        state_color: true
        entities:
          - automation.innebelysning_resolver
          - automation.koksbelysning_resolver
          - automation.halltakbelysning_resolver
          - automation.badrumsbelysning_resolver
          - automation.uterumsbelysning_resolver
          - automation.tradgardsbelysning_resolver
          - automation.spabad_resolver
          - automation.fasadbelysning_resolver

