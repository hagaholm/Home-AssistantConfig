title: kameror
views:
  - path: kamera-gemensamt
    title: Kamera gemensamt
    badges: []

  - path: compare
    title: Compare
    badges: []
    cards:
      - type: heading
        heading: 📊 Daily Detection Summary & Comparison

      - type: custom:stack-in-card
        cards:
          - type: entities
            title: Overall Totals
            entities:
              - sensor.frigate_total_person_detections
              - sensor.frigate_total_animal_detections
              - sensor.reolink_total_person_detections
              - sensor.reolink_total_animal_detections

      - type: heading
        heading: ⚡ Response Time Analysis

      - type: custom:stack-in-card
        cards:
          - type: entities
            title: Detection Speed Comparison
            entities:
              - sensor.fastest_detection_system
              - sensor.detection_response_time_difference
              - input_number.frigate_last_detection_time
              - input_number.reolink_last_detection_time

      - type: heading
        heading: Frigate Daily Detections

      - type: custom:stack-in-card
        cards:
          - type: entities
            title: Frigate Camera Totals
            entities:
              - entity: input_number.frigate_cam3_person_count
                visibility:
                  - condition: numeric_state
                    entity: input_number.frigate_cam3_person_count
                    above: 0
              - entity: input_number.frigate_cam3_animal_count
