            entity: sensor.ute_friggebod_humidity
            name: Ute fukt

  ####################################################
  # STATUS VY
  ####################################################
  - theme: Backend-selected
    title: Status
    badges: []
    cards:
      - type: markdown
        content: "# 🌬️ Ventilation"

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: switch.ventilationsaggregat
            name: Ventilation
          - type: tile
            entity: switch.shelly1_c45bbe77099d
            name: Forcerad fläkt
          - type: tile
            entity: input_boolean.alarm_ventilation
            name: Larm

      - type: entities
        title: Luftfuktighet & Temperatur
        state_color: true
        entities:
          - entity: sensor.badrum_luftfuktighet
            name: Badrum fukt
          - entity: sensor.fukt_badrumsfonster
            name: Badrum fönster fukt
          - entity: sensor.badrum_temperatur
            name: Badrum temp
          - entity: sensor.ute_friggebod_humidity
            name: Ute fukt

      - type: entities
        title: Timers
        state_color: true
        entities:
          - timer.timer_humidity_bathroom_max_time
          - timer.timer_humidity_bathroom

      - type: markdown
        content: "# ❄️ Friggebod"

      - type: vertical-stack
        cards:
          - type: tile
            entity: input_boolean.friggebod_varme_auto
            name: Automatisk värmning
            icon: mdi:thermometer

          - type: tile
            entity: switch.friggebod_elvarme
            name: Elvärme

          - type: tile
            entity: counter.friggebod_varme_tid
            name: Värmetid idag

          - type: tile
            entity: timer.friggebod_min_runtime
            name: Min gångtid

          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.friggebod_temperatur
                name: Temperatur
                severity:
                  green: 5
                  yellow: 3
                  red: 0
              - type: gauge
                entity: sensor.friggebod_luftfuktighet
                name: Luftfuktighet
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 60
                  red: 70

          - type: entities
            title: Avancerade värden
            state_color: true
            entities:
              - entity: sensor.friggebod_absolut_fukt_inne
                name: Absolut fukt inne
              - entity: sensor.utomhus_absolut_fukt
                name: Absolut fukt ute
              - entity: sensor.friggebod_mogelrisk
                name: Mögelrisk

          - type: gauge
            entity: sensor.friggebod_mogelrisk
            name: Mögelrisk (%)
            min: 0
            max: 100
            severity:
              green: 30
              yellow: 60
              red: 75

          - type: entities
            title: Energi & Effekt
            state_color: true
            entities:
              - entity: sensor.friggebod_aktuell_effekt
                name: Aktuell effekt
              - entity: sensor.friggebod_energi_idag
                name: Energi idag
              - entity: sensor.friggebod_kostnad_idag
                name: Kostnad idag
              - entity: sensor.friggebod_varmebehov_per_grad
                name: Värmebehov (W/°C)

      - type: markdown
        content: "# 🏠 Förråd"

      - type: vertical-stack
        cards:
          - type: tile
            entity: input_boolean.forrad_varme_auto
            name: Automatisk värmning
            icon: mdi:thermometer

          - type: tile
            entity: switch.forrad_elvarme
            name: Elvärme

          - type: tile
            entity: counter.forrad_varme_tid
            name: Värmetid idag

          - type: tile
            entity: timer.forrad_min_runtime
            name: Min gångtid

          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.forrad_temperature
                name: Temperatur
                severity:
                  green: 5
                  yellow: 3
                  red: 0
              - type: gauge
                entity: sensor.forrad_luftfuktighet
                name: Luftfuktighet
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 60
                  red: 70

          - type: entities
            title: Avancerade värden
            state_color: true
            entities:
              - entity: sensor.forrad_absolut_fukt_inne
                name: Absolut fukt inne
              - entity: sensor.utomhus_absolut_fukt
                name: Absolut fukt ute
              - entity: sensor.forrad_mogelrisk
                name: Mögelrisk

          - type: gauge
            entity: sensor.forrad_mogelrisk
            name: Mögelrisk (%)
            min: 0
            max: 100
            severity:
              green: 30
              yellow: 60
              red: 75

          - type: entities
            title: Energi & Effekt
            state_color: true
            entities:
              - entity: sensor.forrad_aktuell_effekt
                name: Aktuell effekt
              - entity: sensor.forrad_energi_idag
                name: Energi idag
              - entity: sensor.forrad_kostnad_idag
                name: Kostnad idag
              - entity: sensor.forrad_varmebehov_per_grad
                name: Värmebehov (W/°C)

      - type: markdown
        content: "# 👁️ Översikt – Alla Sensorer"

      - type: entities
        state_color: true
        entities:
          - entity: sensor.ute
            name: "🌡️ Ute temperatur"
          - entity: sensor.inne_medel
            name: "🌡️ Inne medel temperatur"
          - entity: sensor.badrum_temperatur
            name: "🌡️ Badrum temperatur"
          - entity: sensor.friggebod_temperature
            name: "❄️ Friggebod temperatur"
          - entity: sensor.forrad_temperature
            name: "🏠 Förråd temperatur"
          - entity: sensor.ute_friggebod_humidity
            name: "🌡️ Ute fukt"
          - entity: sensor.badrum_luftfuktighet
            name: "💧 Badrum fukt"
          - entity: sensor.fukt_badrumsfonster
            name: "💧 Badrum fönster fukt"
          - entity: sensor.friggebod_luftfuktighet
            name: "❄️ Friggebod fukt"
          - entity: sensor.forrad_luftfuktighet
            name: "🏠 Förråd fukt"

  ####################################################
  # GRAFER VY
  ####################################################
  - theme: Backend-selected
    title: Grafer
    path: varden
    badges: []
    cards:
      - type: markdown
        content: "# 📈 Grafer"

      - type: markdown
        content: "## 🌬️ Ventilation"

      - type: history-graph
        title: Ventilation På/Av
        entities:
          - entity: switch.ventilationsaggregat
            name: Ventilation
          - entity: switch.shelly1_c45bbe77099d
            name: Forcerad Fläkt
