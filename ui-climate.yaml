    cards:
      - type: markdown
        content: |
          # ⚙️ Inställningar – Friggebod

          Justera värmestyrning, trösklar och mögelriskgränser för friggeboden.

      - type: markdown
        content: "## Konfigurerbara Värden"

      - type: markdown
        content: |
          Dessa värden är definierade i `packages/climate/friggebod.yaml` och kan justeras där.

          **Temperaturvärden (°C):**
          - `temp_frostskydd`: 3°C (aktiverar värmestyrning)
          - `temp_min_for_fuktvarme`: 0°C (minsta temp för fuktvärme)

          **Fuktvärden (%):**
          - `rh_aktivering`: 60% (tänd värmning vid fukt)
          - `rh_avaktivering`: 55% (släck värme vid fukt)

          **Absolut Fukt (g/m³):**
          - `delta_abs_aktivering`: 1.0 g/m³ (inne > ute + 1.0)
          - `delta_abs_avaktivering`: 0.5 g/m³ (inne > ute + 0.5)

          **Mögelrisk:**
          - `mogelrisk_troskel`: 75% RH
          - `mogelrisk_varning`: 60% risk för notifiering

          **Värmestyrning:**
          - `max_varmetid_per_dag`: 12 perioder (= 2h)
          - `min_gangtid`: 30 minuter

