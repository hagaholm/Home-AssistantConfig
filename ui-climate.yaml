      - type: markdown
        content: "## ❄️ Friggebod – Energi & Effekt"

      - type: history-graph
        title: Effekt & Temperatur
        entities:
          - entity: sensor.friggebod_aktuell_effekt
            name: Effekt (W)
          - entity: sensor.friggebod_temperatur
            name: Temp inne
          - entity: sensor.ute
            name: Temp ute
        hours_to_show: 24

      - type: history-graph
        title: Energiförbrukning
        entities:
          - entity: sensor.friggebod_energi_idag
            name: Energi (kWh)
          - entity: sensor.friggebod_kostnad_idag
            name: Kostnad (SEK)
        hours_to_show: 168

      - type: history-graph
        title: Fysiska Värden
        entities:
          - entity: sensor.friggebod_varmebehov_per_grad
            name: Värmebehov (W/°C)
          - entity: sensor.friggebod_uppskattat_u_varde
            name: U-värde
          - entity: sensor.friggebod_drifttid_procent
            name: Drifttid (%)
        hours_to_show: 48

  ####################################################
  # INSTÄLLNINGAR – VENTILATION
  ####################################################
  - theme: Backend-selected
    title: Inst. Ventilation
    path: inst_ventilation
    badges: []
    cards:
      - type: markdown
        content: |
          # ⚙️ Inställningar – Ventilation

          Justera trösklar och timers för forcerad ventilation.

          **Tips:**
          - Börja med små ändringar (1–2% eller 5–10 min)
          - Om forcerad fläkt ofta går i maxtid: sänk maxtid eller höj stop-tröskeln
          - Om den fladdrar: höj stabil tid eller öka hysteresis

      - type: tile
        entity: script.ventilation_tuning_reset_defaults
        name: Återställ standardvärden
        icon: mdi:backup-restore

      - type: tile
        entity: script.ventilation_tuning_dismiss_notifications
        name: Rensa notiser
        icon: mdi:bell-off

      - type: markdown
        content: "## Auto-tuning (Status)"

      - type: entities
        state_color: true
        entities:
          - entity: input_boolean.ventilation_auto_tuning_enabled
            name: Auto-tuning aktiverad
          - entity: input_boolean.ventilation_auto_tuning_auto_apply
            name: Auto-applicera
          - entity: sensor.ventilation_forcerad_tid_24h
            name: Forcerad tid (24h)
          - entity: sensor.ventilation_forcerad_antal_24h
            name: Forcerad antal (24h)
          - entity: sensor.ventilation_fukt_fonster_max_24h
            name: Max RH fönster (24h)
          - entity: sensor.ventilation_rh_forcerad_medel_24h
            name: RH medel (forcerad, 24h)

      - type: markdown
        content: "## Auto-tuning (Rekommendationer)"

      - type: entities
        state_color: true
        entities:
          - entity: sensor.ventilation_rekommenderad_rh_start
            name: RH start (rekomm)
          - entity: sensor.ventilation_rekommenderad_rh_stop
            name: RH stop (rekomm)
          - entity: sensor.ventilation_rekommenderad_stabil_tid
            name: Stabil tid (rekomm)
          - entity: sensor.ventilation_rekommenderad_maxtid
            name: Maxtid (rekomm)
          - entity: script.ventilation_tuning_apply_recommended
            name: Applicera rekommendationer

      - type: markdown
        content: "## Gränser & Timers"

      - type: entities
        state_color: true
        entities:
          - entity: input_number.ventilation_rh_force_on
            name: RH start
          - entity: input_number.ventilation_rh_force_off
            name: RH stop
          - entity: input_number.ventilation_rh_stable_min
            name: Stabil RH min
          - entity: input_number.ventilation_rh_stable_max
            name: Stabil RH max
          - entity: input_number.ventilation_rh_delta_fast
            name: ΔRH snabb
          - entity: input_number.ventilation_rh_delta_high
            name: ΔRH
          - entity: input_number.ventilation_outdoor_temp_min_force
            name: Min ute-temp
          - entity: input_number.ventilation_max_runtime_minutes
            name: Maxtid
          - entity: input_number.ventilation_stable_minutes
            name: Stabil tid
          - entity: input_number.ventilation_house_humidity_diff
            name: Diff badrum/v-rum
          - entity: input_number.ventilation_sensor_fresh_seconds
            name: Sensor-färskhet

      - type: markdown
        content: |
          ## Anomaly Detection

          Om någon anomaly blir **On** så stängs auto-applicera av automatiskt.

          - **sensor okänd**: RH/ute-temp saknas
          - **hysteresis fel**: start ≤ stop (risk för fladder)
          - **forcerad trots låg RH**: forcerad är på fast RH ligger under stop-tröskeln
          - **fladder**: många korta forceringar

      - type: entities
        state_color: true
        entities:
          - entity: binary_sensor.ventilation_anomaly_sensor_okand
            name: Sensor okänd
          - entity: sensor.ventilation_anomaly_okand_kalla
            name: Okänd källa
          - entity: binary_sensor.ventilation_anomaly_hysteresis_fel
            name: Hysteresis fel
          - entity: binary_sensor.ventilation_anomaly_forcerad_trots_lag_rh
            name: Forcerad trots låg RH
          - entity: binary_sensor.ventilation_anomaly_fladder
            name: Fladder

  ####################################################
  # INSTÄLLNINGAR – FRIGGEBOD
  ####################################################
  - theme: Backend-selected
    title: Inst. Friggebod
    path: inst_friggebod
    badges: []
    cards:
      - type: markdown
        content: |
          # ⚙️ Inställningar – Friggebod

          Justera värmestyrning, trösklar och mögelriskgränser för friggeboden.

      - type: markdown
        content: "## Konfigurerbara Värden"

      - type: markdown
        content: |
          Dessa värden är definierade i `packages/climate/friggebod.yaml` och kan justeras där.

          **Temperaturvärden (°C):**
          - `temp_frostskydd`: 3°C (aktiverar värmestyrning)
          - `temp_min_for_fuktvarme`: 0°C (minsta temp för fuktvärme)

          **Fuktvärden (%):**
          - `rh_aktivering`: 60% (tänd värmning vid fukt)
          - `rh_avaktivering`: 55% (släck värme vid fukt)

          **Absolut Fukt (g/m³):**
          - `delta_abs_aktivering`: 1.0 g/m³ (inne > ute + 1.0)
          - `delta_abs_avaktivering`: 0.5 g/m³ (inne > ute + 0.5)

          **Mögelrisk:**
          - `mogelrisk_troskel`: 75% RH
          - `mogelrisk_varning`: 60% risk för notifiering

          **Värmestyrning:**
          - `max_varmetid_per_dag`: 12 perioder (= 2h)
          - `min_gangtid`: 30 minuter

      - type: markdown
        content: "## Status Sensorer"

      - type: entities
        state_color: true
        entities:
          - entity: sensor.friggebod_temperatur
            secondary_info: last-updated
            name: Temperatur inne
          - entity: sensor.friggebod_luftfuktighet
            secondary_info: last-updated
            name: Fukt inne
          - entity: sensor.ute
            secondary_info: last-updated
            name: Temperatur ute
          - entity: sensor.ute_friggebod_humidity
            name: Fukt ute
          - entity: sensor.friggebod_absolut_fukt_inne
            name: Absolut fukt inne
          - entity: sensor.utomhus_absolut_fukt
            name: Absolut fukt ute
          - entity: sensor.friggebod_mogelrisk
            name: Mögelrisk

      - type: markdown
        content: "## Notifikation"

      - type: entities
        title: Mögelvarning-inställning
        state_color: true
        entities:
          - entity: input_text.friggebod_notification_target
            name: Notifikation target

      - type: markdown
        content: "## ⚡ Energi & Effekt"

      - type: entities
        title: Inställningar
        state_color: true
        entities:
          - entity: input_number.friggebod_element_effekt
            name: Elementeffekt
          - entity: input_number.friggebod_elpris
            name: Elpris (SEK/kWh)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.friggebod_aktuell_effekt
            name: Aktuell effekt
            min: 0
            max: 2000
            severity:
              green: 0
              yellow: 800
              red: 1500
            needle: true
          - type: gauge
            entity: sensor.friggebod_drifttid_procent
            name: Drifttid idag
            min: 0
            max: 100
            unit: "%"
            needle: true

      - type: entities
        title: Energiförbrukning
        state_color: true
        entities:
          - entity: sensor.friggebod_energi_idag
            name: Energi idag
          - entity: sensor.friggebod_energi_denna_manad
            name: Energi denna månad
          - entity: sensor.friggebod_energiforbrukning_total
            name: Total energi (sedan reset)

      - type: entities
        title: Kostnader
        state_color: true
        entities:
          - entity: sensor.friggebod_kostnad_idag
            name: Kostnad idag
          - entity: sensor.friggebod_kostnad_denna_manad
            name: Kostnad denna månad
          - entity: sensor.friggebod_varmekostnad_total
            name: Total kostnad
          - entity: sensor.friggebod_daglig_kostnad_prognos
            name: Prognos (vid max drift)

      - type: markdown
        content: "## 🏠 Fysiska Egenskaper"

      - type: markdown
        content: |
          **Byggnad:**
          - Bredd: 3.0 m
          - Längd: 5.0 m
          - Takhöjd: 2.0 m
          - Golvyta: 15 m²
          - Vägg area: 32 m²
          - Total area (väggar+tak+golv): 62 m²
          - Volym: 30 m³

      - type: entities
        title: Värmeprestanda
        state_color: true
        entities:
          - entity: sensor.friggebod_varmebehov_per_grad
            name: Värmebehov per °C
          - entity: sensor.friggebod_uppskattat_u_varde
            name: Uppskattat U-värde
          - entity: sensor.friggebod_specifik_varmeprestanda
            name: Specifik prestanda (W/m²)
          - entity: sensor.friggebod_energi_per_volym
            name: Energi per volym (Wh/m³)
          - entity: sensor.friggebod_cop
            name: COP (effektivitet)

      - type: entities
        title: Termisk Analys
        state_color: true
        entities:
          - entity: sensor.friggebod_temperaturfall_per_timme
            name: Temperaturfall (°C/h)
          - entity: sensor.friggebod_graddagar_idag
            name: Graddagar idag
          - entity: sensor.friggebod_effektbehov_vid_minus_10
            name: Effektbehov vid -10°C

