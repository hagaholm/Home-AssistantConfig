      - type: markdown
        content: "## 💧 Badrum – Fukt & Temperatur"

      - type: history-graph
        title: Badrum Luftfuktighet
        entities:
          - entity: sensor.badrum_luftfuktighet
            name: Badrum
          - entity: sensor.fukt_badrumsfonster
            name: Badrum Fönster
