#######################################################
# UI DEBUG / DIAGNOSTIK
#######################################################
# Visar VARFÖR en lampa eller automation är i sitt nuvarande läge,
# genom att exponera de "debug"-sensorer som redan finns i
# packages/lights/debug.yaml och packages/frigate/frigate_animal_detected.yaml.
#
# Varje sensor har attributen:
# - state: nuvarande beslutade läge
# - reason: en rad som förklarar varför
# - why_not: (endast lights_debug_*) alla regler och varför de inte valdes
#######################################################

title: Diagnostik
views:
  - path: diagnostik
    title: Varför?
    icon: mdi:help-circle-outline
    badges: []
    cards:
      - type: markdown
        content: |
          # 🔍 Varför är det så här?
          Den här vyn förklarar varför en lampa eller automation är i sitt
          nuvarande läge. "Varför" kommer från paketens debug-sensorer -
          se `packages/lights/debug.yaml` och
          `packages/frigate/frigate_animal_detected.yaml`.

      - type: markdown
        title: 💡 Inne
        content: >-
          **Läge:** {{ states('sensor.lights_debug_inside') }}

          **Varför:** {{ state_attr('sensor.lights_debug_inside', 'reason') }}

          **Alla regler:**

          {{ state_attr('sensor.lights_debug_inside', 'why_not') }}

      - type: markdown
        title: 💡 Kök
        content: >-
          **Läge:** {{ states('sensor.lights_debug_kitchen') }}

          **Varför:** {{ state_attr('sensor.lights_debug_kitchen', 'reason') }}

          **Alla regler:**

          {{ state_attr('sensor.lights_debug_kitchen', 'why_not') }}

      - type: markdown
        title: 💡 Badrum
        content: >-
          **Läge:** {{ states('sensor.lights_debug_bathroom') }}

          **Varför:** {{ state_attr('sensor.lights_debug_bathroom', 'reason') }}

          **Alla regler:**

