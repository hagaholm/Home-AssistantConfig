      - type: markdown
        title: 💡 Trädgård
        content: >-
          **Läge:** {{ states('sensor.lights_debug_garden') }}

          **Varför:** {{ state_attr('sensor.lights_debug_garden', 'reason') }}

          **Alla regler:**

          {{ state_attr('sensor.lights_debug_garden', 'why_not') }}

      - type: markdown
        title: 💡 Uterum
        content: >-
          **Läge:** {{ states('sensor.lights_debug_uterum') }}

