      - type: markdown
        title: 💡 Spabad
        content: >-
          **Läge:** {{ states('sensor.lights_debug_spabad') }}

          **Varför:** {{ state_attr('sensor.lights_debug_spabad', 'reason') }}

          **Alla regler:**

