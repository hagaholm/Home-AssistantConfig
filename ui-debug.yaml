#######################################################
# UI DEBUG / DIAGNOSTIK
#######################################################
# Visar VARFÖR en lampa eller automation är i sitt nuvarande läge,
# genom att exponera de "debug"-sensorer som redan finns i
# packages/lights/debug.yaml och packages/frigate/frigate_animal_detected.yaml.
#
# Varje sensor har attributen:
# - state: nuvarande beslutade läge
# - reason: en rad som förklarar varför
# - why_not: (endast lights_debug_*) alla regler och varför de inte valdes
#######################################################

title: Diagnostik
views:
  - path: overview
    title: Översikt
    icon: mdi:monitor-dashboard
    badges: []
    cards:
      - type: markdown
        title: Systemstatus
        content: >-
          **Läge:** {{ states('sensor.diagnostics_system_health') }}

          **Varför:** {{ state_attr('sensor.diagnostics_system_health', 'reason') }}

          **Aktiva delsystemproblem:**

          {{ state_attr('sensor.diagnostics_system_health', 'active_issues') }}

          **Aktiva avläsningslarm:** {{ state_attr('sensor.diagnostics_system_health', 'active_reading_alarms') or 'Inga' }}
      - type: markdown
        title: Sensorer utan färsk data
        content: >-
          **Status:** {{ states('sensor.diagnostics_sensor_freshness') }}

          **Varför:** {{ state_attr('sensor.diagnostics_sensor_freshness', 'reason') }}

          **Berörda givare:** {{ state_attr('sensor.diagnostics_sensor_freshness', 'stale_sensors') }}

          En varning visas när en övervakad givare saknar data eller inte har uppdaterats på 60 minuter. Orsaken kan vara batteri, kontakt, gateway eller integration.
      - type: entities
        title: Aktiva system
        entities:
          - sensor.diagnostics_presence
          - sensor.diagnostics_ventilation
          - sensor.diagnostics_frigate_security
