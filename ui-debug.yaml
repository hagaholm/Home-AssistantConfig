      - type: markdown
        title: 🦊 Djurdetektering (radio + strålkastare, baksida)
        content: >-
          **Läge:** {{ states('sensor.frigate_debug_animal_backside') }}

          **Varför:** {{ state_attr('sensor.frigate_debug_animal_backside', 'reason') }}

