#######################################################
# UI LIGHTS (BELYSNING)
#######################################################
# Unified Belysning Subsystem Dashboard
# 5-Tab Structure:
# 1. Översikt (Overview & Key quick scenes/toggles)
# 2. Rum & Grupper (All light entities per room/zone)
# 3. Automationer (Resolvers, state machines, triggers)
# 4. Skript & Scener (Scene controls, restore scripts)
# 5. Diagnostik & Varför (Lights debug, why-sensors, lux thresholds)
#######################################################

title: Lights
views:
  #######################################################
  # TAB 1: ÖVERSIKT (FAVORITER & SNABBVAL)
  #######################################################
  - path: lights
    title: Översikt
    icon: mdi:lightbulb-on-outline
    theme: default
    badges: []
    cards:
      - type: heading
        heading: 💡 Snabbval & Scener

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: script.lights_set_correct_modes
            name: Återställ
            icon: mdi:restore
          - type: tile
            entity: script.button_daylight
            name: Tänd allt
            icon: mdi:lightbulb
          - type: tile
            entity: script.cleaning_lights_on
            name: Städdags
            icon: mdi:vacuum
          - type: tile
            entity: script.button_goodnight
            name: Godnatt
            icon: mdi:sleep

      - type: heading
        heading: 🎭 Lägen & Säsong

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_select.light_inside
            name: Inne
          - type: tile
            entity: input_select.light_kitchen
            name: Kök
          - type: tile
            entity: input_select.light_hall
            name: Halltak
          - type: tile
            entity: input_select.light_bathroom
            name: Badrum
          - type: tile
            entity: input_select.light_uterum
            name: Uterum
          - type: tile
            entity: input_select.light_garden
            name: Trädgård
          - type: tile
            entity: input_select.light_outside
            name: Spabad
          - type: tile
            entity: input_select.facade_lights
            name: Fasad
          - type: tile
            entity: input_boolean.christmas_light
            name: Jul

      - type: heading
        heading: 🤖 Auto-automatik per zon

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_boolean.lights_auto_inne
            name: Auto Inne
          - type: tile
            entity: input_boolean.lights_auto_kok
            name: Auto Kök
          - type: tile
            entity: input_boolean.lights_auto_halltak
            name: Auto Halltak
          - type: tile
            entity: input_boolean.lights_auto_badrum
            name: Auto Badrum
          - type: tile
            entity: input_boolean.lights_auto_uterum
            name: Auto Uterum
          - type: tile
            entity: input_boolean.lights_auto_tradgard
            name: Auto Trädgård
          - type: tile
            entity: input_boolean.lights_auto_spabad
            name: Auto Spabad
          - type: tile
            entity: input_boolean.lights_auto_fasad
            name: Auto Fasad

      - type: heading
        heading: 🚪 Snabbt – Rumstoggling

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.kok
            name: Kök
          - type: tile
            entity: light.hall
            name: Hall
          - type: tile
            entity: light.vardagsrum
            name: Vardagsrum
          - type: tile
            entity: light.sovrum
            name: Sovrum
          - type: tile
            entity: light.louise_rum
            name: Louise rum
          - type: tile
            entity: light.andreas_rum
            name: Andreas rum

      - type: conditional
        conditions:
          - entity: input_boolean.christmas_light
            state: 'off'
        card:
          type: entities
          title: Dagläge (standard)
          show_header_toggle: false
          state_color: true
          entities:
            - input_boolean.daylight_on
            - light.dagbelysning

      - type: conditional
        conditions:
          - entity: input_boolean.christmas_light
            state: 'on'
        card:
          type: entities
          title: Dagläge (jul)
          show_header_toggle: false
          state_color: true
          entities:
            - input_boolean.daylight_on
            - light.dagbelysning_jul

  #######################################################
  # TAB 2: RUM & GRUPPER (ROOMS & GROUPS)
  #######################################################
  - path: lights-rum
    title: Rum & Grupper
    icon: mdi:sofa-outline
    theme: Backend-selected
    badges: []
    cards:
      - type: heading
        heading: 🛋️ Inomhusbelysning

      - type: entities
        title: Inne (Översikt & Hemläge)
        show_header_toggle: false
        state_color: true
        entities:
          - input_select.light_inside
          - input_boolean.lights_auto_inne
          - input_boolean.tv_light_mode
          - input_boolean.inside_pause_day_window_transition
          - input_select.home_status

      - type: entities
        title: Kök
        show_header_toggle: false
        state_color: true
        entities:
          - input_select.light_kitchen
          - input_boolean.lights_auto_kok
          - input_boolean.kitchen_light_on
          - input_boolean.morning_light_on
          - light.kok_underskap_bank
          - light.kok_underskap_diskbank
          - light.kok_vitrinskap
          - light.kok_stora_fonstret
          - light.kok_lilla_fonstret

      - type: entities
        title: Hall
        show_header_toggle: false
        state_color: true
        entities:
          - input_select.light_hall
          - input_boolean.lights_auto_halltak
          - light.hall_tak
          - light.hall_byra
          - light.hall_skap

      - type: entities
        title: Badrum
        show_header_toggle: false
        state_color: true
        entities:
          - input_select.light_bathroom
          - input_boolean.lights_auto_badrum
          - light.badrum
          - light.tak_spottar
          - light.fonster_spott

      - type: entities
        title: Vardagsrum
        show_header_toggle: false
        state_color: true
        entities:
          - light.vardagsrum_fonster
          - light.vardagsrum_skank
          - light.vardagsrum_vagn
          - light.vardagsrum_vitrinskap2

      - type: entities
        title: Sovrum
        show_header_toggle: false
        state_color: true
        entities:
          - light.sovrum_fonster
          - light.sovrum_sangbord

      - type: entities
        title: Louise
        show_header_toggle: false
        state_color: true
        entities:
          - light.louise_fonster
          - light.louise_golvlampa
          - light.louise_skrivbord

      - type: entities
        title: Andreas
        show_header_toggle: false
        state_color: true
        entities:
          - light.andreas_fonster_2

      - type: heading
        heading: 🌳 Utomhus & Trädgård

      - type: entities
        title: Uterum
        show_header_toggle: false
        state_color: true
        entities:
          - input_select.light_uterum
          - input_boolean.lights_auto_uterum
          - light.uterum_led
          - light.uterum_fonster
          - light.uterum_fotogenlampa

      - type: entities
        title: Trädgård
        show_header_toggle: false
        state_color: true
        entities:
          - input_select.light_garden
          - input_boolean.lights_auto_tradgard
          - switch.tradgard
          - switch.shellyoutdoorsg3_e4b063f8f840
          - switch.friggebod_fonster
          - light.friggebod_ute_2
          - switch.shellyoutdoorsg3_e4b063f3674c

      - type: entities
        title: Spabad
        show_header_toggle: false
        state_color: true
        entities:
          - input_select.light_outside
          - input_boolean.lights_auto_spabad
          - light.spabad_v
          - light.spabad_m
          - light.spabad_h

      - type: entities
        title: Fasad & Strålkastare
        show_header_toggle: false
        state_color: true
        entities:
          - input_select.facade_lights
          - input_boolean.lights_auto_fasad
          - light.huvudentre2
          - light.tvattstugan_fasad
          - light.forrad_fasad
          - light.friggebod_fasad
          - light.stralkastare_husgavel
          - light.kamera5_stralkastare
          - light.kamera6_stralkastare
          - light.kamera8_stralkastare
          - light.kamera9_stralkastare
          - light.kamera10_stralkastare

      - type: conditional
        conditions:
          - entity: input_boolean.christmas_light
            state: 'on'
        card:
          type: entities
          title: Julbelysning (aktiv)
          show_header_toggle: false
          state_color: true
          entities:
            - light.kok_stora_fonstret_ljusstake
            - light.vardagsrum_fonster_ljusstake
            - light.vardagsrum_fonster_ljusstake_2
            - light.vardagsrum_gran
            - light.hall_jullampa
            - light.uterum_julstjarnor
            - light.andreas_fonster

  #######################################################
  # TAB 3: AUTOMATIONER (AUTOMATIONS)
  #######################################################
  - path: lights-automationer
    title: Automationer
    icon: mdi:robot-outline
    theme: Backend-selected
    badges: []
    cards:
      - type: heading
        heading: 🎯 Resolvers (Beslutslogik)

      - type: entities
        title: Huvudstyrning & Resolvers
        show_header_toggle: true
        state_color: true
        entities:
          - automation.innebelysning_resolver
          - automation.koksbelysning_resolver
          - automation.halltak_resolver
          - automation.badrumsbelysning_resolver
          - automation.uterumsbelysning_resolver
          - automation.tradgardsbelysning_resolver
          - automation.spabad_resolver
          - automation.fasadbelysning_resolver

      - type: heading
        heading: 🔄 State Machines (Input Select → Scripts)

      - type: entities
        title: Scen-exekverare
        show_header_toggle: true
        state_color: true
        entities:
          - automation.innebelysning
          - automation.koksbelysning
          - automation.hall_takbelysning_input_select
          - automation.badrumsbelysning
          - automation.tand_uterumsbelysning
          - automation.tradgardsbelysning
          - automation.utebelysning_changed
          - automation.facade_light_changed

      - type: heading
        heading: ⏰ Tidsstyrda Övergångar & Sensorhändelser

      - type: entities
        title: Tidsstyrning Inne & Ute
        show_header_toggle: true
        state_color: true
        entities:
          - automation.morning_light_on_inside
          - automation.morning_light_on_outside
          - automation.morning_light_off_inside
          - automation.morning_light_off_outside
          - automation.daylight_on_inside
          - automation.daylight_on_outside
          - automation.daylight_off_inside
          - automation.daylight_off_outside
          - automation.awaylight_on_inside
          - automation.awaylight_on_outside
          - automation.awaylight_off_inside
          - automation.awaylight_off_outside
          - automation.kitchen_light_on_inside
          - automation.kitchen_light_on_outside
          - automation.kitchen_light_off_inside
          - automation.kitchen_light_off_outside

      - type: entities
        title: Specialstyrning & Knappar
        show_header_toggle: true
        state_color: true
        entities:
          - automation.tv_ljuslage
          - automation.hall_fjarrkontroll
          - automation.hall_slack_belysning
          - automation.facade_light_option_migration

  #######################################################
  # TAB 4: SKRIPT & SCENER (SCRIPTS & SCENES)
  #######################################################
  - path: lights-kontroll
    title: Skript & Scener
    icon: mdi:script-text-outline
    theme: default
    badges: []
    cards:
      - type: heading
        heading: 🎄 Säsong & Masterscener

      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            entity: scene.lighting_standard_mode
            name: Standardläge
            icon: mdi:lightbulb-outline
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.lighting_standard_mode
          - type: button
            entity: scene.lighting_christmas_mode
            name: Julläge
            icon: mdi:string-lights
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.lighting_christmas_mode

      - type: heading
        heading: 🔄 Återställ korrekta lägen (Resolvers)

      - type: entities
        title: Master & Områdesåterställning
        show_header_toggle: false
        state_color: true
        entities:
          - script.lights_set_correct_modes
          - script.inside_set_correct_mode
          - script.kitchen_set_correct_mode
          - script.hall_set_correct_mode
          - script.bathroom_set_correct_mode
          - script.garden_set_correct_mode
          - script.uterum_set_correct_mode
          - script.spabad_set_correct_mode
          - script.facade_set_correct_mode

      - type: heading
        heading: 🛋️ Inomhus Scenskript

      - type: entities
        title: Inne Huvudscener
        show_header_toggle: false
        state_color: true
        entities:
          - script.inside_apply_current_scene
          - script.morning_lights_on
          - script.daylights_on
          - script.eveninglights_on
          - script.night_light
          - script.away_lights_on
          - script.window_lights_on
          - script.inside_lights_off
          - script.cleaning_lights_on
          - script.tv_light_look_at_tv
          - script.tv_light_max
          - script.tv_light_normal
          - script.tv_light_off
          - script.bedroom_off
          - script.andreas_room_off
          - script.louise_room_off

      - type: entities
        title: Kök, Hall & Badrum
        show_header_toggle: false
        state_color: true
        entities:
          - script.kitchen_light_100
          - script.kitchen_light_50
          - script.kitchen_light_25
          - script.kitchen_light_off
          - script.hall_taklampor_100_procent
          - script.hall_taklampor_50_procent
          - script.hall_taklampor_10_procent
          - script.hall_taklampor_1_procent
          - script.hall_taklampor_off
          - script.bathroom_light_day
          - script.bathroom_light_day_presence
          - script.bathroom_light_night_presence
          - script.bathroom_light_off

      - type: heading
        heading: 🌳 Utomhus Scenskript

      - type: entities
        title: Trädgård, Uterum, Spabad & Fasad
        show_header_toggle: false
        state_color: true
        entities:
          - script.tradgards_belysning_on
          - script.tradgards_belysning_off
          - script.outdoor_room_light_on
          - script.outdoor_room_light_off
          - script.outside_light_on
          - script.outside_light_off
          - script.fasadbelysning_on
          - script.fasadbelysning_night
          - script.fasadbelysning_max
          - script.fasadbelysning_off

  #######################################################
  # TAB 5: DIAGNOSTIK & VARFÖR (DIAGNOSTICS & WHY)
  #######################################################
  - path: lights-debug
    title: Diagnostik & Varför
    icon: mdi:help-circle-outline
    theme: Backend-selected
    badges: []
    cards:
      - type: heading
        heading: 🩺 Hälsa & Beslutsstatus

      - type: markdown
        title: Belysningshälsa
        content: >-
          **Status:** {{ states('sensor.diagnostics_lights_health') }}

          **Varför:** {{ state_attr('sensor.diagnostics_lights_health', 'reason') }}

          **Aktiva problem:** {{ state_attr('sensor.diagnostics_lights_health', 'active_issues') or 'Inga' }}

      - type: entities
        title: Belysningssensorer (Varför?)
        show_header_toggle: false
        state_color: true
        entities:
          - sensor.lights_debug_inside
          - sensor.lights_debug_kitchen
          - sensor.lights_debug_bathroom
          - sensor.lights_debug_hall
          - sensor.lights_debug_garden
          - sensor.lights_debug_uterum
          - sensor.lights_debug_spabad
          - sensor.lights_debug_facade

      - type: heading
        heading: ☀️ Sensorvärden & Trösklar

      - type: entities
        title: Viktiga sensorinputs
        show_header_toggle: false
        state_color: true
        entities:
          - sensor.ljusstyrka
          - sensor.ljusstyrka_measured
          - sensor.kokets_ljusniva
          - sensor.hall_ljusniva
          - sensor.vardagsrum_ljusniva
          - input_select.home_status
          - input_boolean.morning_light_on
          - input_boolean.daylight_on
          - input_boolean.awaylight_on
          - input_boolean.christmas_light

      - type: heading
        heading: 🔕 Lokala Mute-switchar (Ljusgivare)

      - type: entities
        title: Övervakningskontroll Ljusgivare
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.monitor_sensor_ljusstyrka
            name: Ljusstyrka givare (utomhus/inomhus)
