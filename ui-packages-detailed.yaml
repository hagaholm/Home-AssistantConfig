  #################################################################
  # INTEGRATIONS - Detailed breakdown
  #################################################################
  - path: integrations
    title: Integrations
    icon: mdi:puzzle
    theme: default
    badges: []
    cards:
      - type: heading
        heading: 🔌 Integration Package Structure

      - type: markdown
        content: |
          **Package Overview:**
          Third-party service integrations including MQTT messaging, vehicle tracking, fitness platforms, and smart home protocols.

      - type: markdown
        content: |
          **7 Files in packages/integrations/:**
          📡 mqtt.yaml - MQTT message broker
          📡 mqtt_publish_values.yaml - MQTT publishing
          🚗 volvo.yaml - Volvo car integration
          🚴 zwift.yaml - Zwift fitness tracking
          📻 tellstick.yaml - Tellstick RF devices
          🔊 tts.yaml - Text-to-speech service
          🎮 media_player.yaml - Media player control

      - type: markdown
        content: "**Integration Details:**"

      - type: markdown
        content: |
          📡 **MQTT** - Real-time messaging protocol for device communication
          📤 **MQTT Publishing** - Broadcast sensor data and events
          🚗 **Volvo** - Vehicle location, status, and battery monitoring
          🚴 **Zwift** - Cycling fitness platform integration
          📻 **Tellstick** - RF protocol for wireless devices
          🔊 **TTS** - Google Home text-to-speech announcements
          🎮 **Media Player** - Unified media player controls

      - type: heading
