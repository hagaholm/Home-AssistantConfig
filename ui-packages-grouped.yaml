            entity: light.kok
            name: Kök
          - type: tile
            entity: light.hall
            name: Hall
          - type: tile
            entity: light.vardagsrum
            name: Vardagsrum
          - type: tile
            entity: light.sovrum
            name: Sovrum
          - type: tile
            entity: light.louise_rum
            name: Louise rum
          - type: tile
            entity: light.andreas_rum
            name: Andreas rum

