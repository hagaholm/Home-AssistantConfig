  #################################################################
  # MEDIA & ENTERTAINMENT
  #################################################################
  - path: media
    title: Media & Entertainment
    icon: mdi:play-circle-outline
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Audio

      - type: markdown
        content: |
          🔊 **Google Home Integration:**
          - Living room speaker
          - Nest Hub display
          - Voice control & playback

      - type: markdown
        content: |
          🎮 **Harmony Hub Integration:**
          - Remote controls & activities
          - Media player control
          - TV automation

