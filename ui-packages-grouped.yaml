title: Home Assistant
views:
  #################################################################
  # LIGHTS
  #################################################################
  - path: lights
    title: Lights
    icon: mdi:lightbulb
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Light Controls

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: script.lights_set_correct_modes
            name: Restore
            icon: mdi:restore
          - type: tile
            entity: script.button_daylight
            name: All On
            icon: mdi:lightbulb
          - type: tile
            entity: script.cleaning_lights_on
            name: Cleaning
            icon: mdi:vacuum
          - type: tile
            entity: script.button_goodnight
            name: Goodnight
            icon: mdi:sleep

      - type: heading
        heading: Light Zones

      - type: grid
        columns: 3
        square: false
        cards:
