  # INTEGRATIONS
  #################################################################
  - path: integrations
    title: Integrations
    icon: mdi:puzzle
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Integration Summary

      - type: markdown
        content: |
          **Active Integrations:**
          📡 MQTT - Media publishing
          🚗 Volvo - Vehicle integration
          🚴 Zwift - Fitness tracking
          📻 Tellstick - Home automation hub
          🔊 TTS - Text to speech
          🎵 Media Player controls
