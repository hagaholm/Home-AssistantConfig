title: Home Assistant
views:
  #################################################################
  # FRIGATE
  #################################################################
  - path: frigate
    title: Frigate
    icon: mdi:cctv
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Cameras & Motion Detection

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: camera.driveway
            name: Driveway
          - type: tile
            entity: camera.garage
            name: Garage
          - type: tile
            entity: camera.patio
            name: Patio
          - type: tile
            entity: camera.front_door
            name: Front Door
          - type: tile
            entity: camera.backyard
            name: Backyard

      - type: heading
        heading: Motion & Person Detection

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: binary_sensor.frigate_animal_motion
            name: Animal Motion
          - type: tile
            entity: binary_sensor.frigate_person_motion
            name: Person Motion
          - type: tile
            entity: binary_sensor.frigate_recording
            name: Recording

  #################################################################
  # MEDIA
  #################################################################
  - path: media
    title: Media
    icon: mdi:play-circle-outline
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Audio

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: media_player.google_home
            name: Google Home
          - type: tile
            entity: media_player.google_nest_hub
            name: Nest Hub

      - type: heading
        heading: Entertainment

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: media_player.harmony_hub
            name: Harmony Hub
          - type: tile
            entity: script.harmony_tv
            name: Start TV
            icon: mdi:television

  #################################################################
  # PRESENCE
  #################################################################
  - path: presence
    title: Presence
    icon: mdi:home-account
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Family Status

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: person.micke
            name: Micke
          - type: tile
            entity: person.annelie
            name: Annelie
          - type: tile
            entity: person.louise
            name: Louise
          - type: tile
            entity: person.andreas
            name: Andreas
          - type: tile
            entity: person.herbert
            name: Herbert
          - type: tile
            entity: person.margareta
            name: Margareta
          - type: tile
            entity: person.erik
            name: Erik

      - type: heading
        heading: Home Status

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_select.home_status
            name: Home Status
          - type: tile
            entity: binary_sensor.working_at_home
            name: Working at Home

  #################################################################
  # CLIMATE & VENTILATION
  #################################################################
  - path: climate
    title: Climate
    icon: mdi:thermometer
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Ventilation

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: switch.ventilationsaggregat
            name: Main Ventilation
          - type: tile
            entity: switch.shelly1_c45bbe77099d
            name: Forced Fan
          - type: tile
            entity: input_boolean.alarm_ventilation
            name: Ventilation Alarm

      - type: heading
        heading: Temperature Control

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: climate.forrad
            name: Förråd (Storage)
          - type: tile
            entity: climate.friggebod
            name: Friggebod (Shed)
          - type: tile
            entity: climate.garage
            name: Garage

      - type: heading
        heading: Temperature Sensors

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.ute
            name: Outside
          - type: tile
            entity: sensor.inne_medel
            name: Inside Avg
          - type: tile
            entity: sensor.uterum_temperatur
            name: Conservatory
          - type: tile
            entity: sensor.badrum_temperatur
            name: Bathroom
          - type: tile
            entity: sensor.friggebod_temperature
            name: Shed
          - type: tile
            entity: sensor.garage_temperature
            name: Garage

  #################################################################
  # SENSORS
  #################################################################
  - path: sensors
    title: Sensors
    icon: mdi:gauge
    theme: default
    badges: []
    cards:
