            entity: light.hall
            name: Hall
          - type: tile
            entity: light.kitchen
            name: Kitchen
          - type: tile
            entity: light.living_room
            name: Living Room
          - type: tile
            entity: light.bedroom
            name: Bedroom
          - type: tile
            entity: light.bathroom
            name: Bathroom
          - type: tile
            entity: light.garden
            name: Garden
          - type: tile
            entity: light.patio
            name: Patio

      - type: heading
