title: Home Assistant
views:
  #################################################################
  # FRIGATE
  #################################################################
  - path: frigate
    title: Frigate
    icon: mdi:cctv
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Frigate NVR

      - type: markdown
        content: |
          **Frigate Cameras:**
          📹 Driveway, Garage, Patio
          📹 Front Door, Backyard
          
          **Features:**
          🎥 24/7 Recording & Detection
          🚗 Animal & Person Alerts
          💾 Media Management

  #################################################################
  # MEDIA
  #################################################################
  - path: media
    title: Media
    icon: mdi:play-circle-outline
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Media & Entertainment

      - type: markdown
        content: |
          **Audio Players:**
          🔊 Google Home / Nest Hub
          🎮 Harmony Hub / Remote Control
          
          **Features:**
          ▶️ Media playback control
          🔗 Multi-device integration

  #################################################################
  # PRESENCE
  #################################################################
  - path: presence
    title: Presence
    icon: mdi:home-account
    theme: default
    badges: []
    cards:
      - type: heading
        heading: Home Status

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_select.home_status
            name: Status

  #################################################################
