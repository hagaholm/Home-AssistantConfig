            entity: input_select.light_inside
            name: Inside Mode
          - type: tile
            entity: input_select.light_kitchen
            name: Kitchen Mode
          - type: tile
            entity: input_select.light_hall
            name: Hall Mode
          - type: tile
            entity: input_select.light_bathroom
            name: Bathroom Mode

  #################################################################
  # SYSTEM
  #################################################################
  - path: system
    title: System
    icon: mdi:cog
    theme: default
    badges: []
    cards:
      - type: heading
