          - type: tile
            entity: sensor.hall_is_temperature
            name: Hall Temp
          - type: tile
            entity: sensor.livingroom_temperature
            name: Living Room Temp
          - type: tile
            entity: sensor.livingroom_humidity
            name: Living Room Humidity
          - type: tile
            entity: sensor.kitchen_temperature
            name: Kitchen Temp
          - type: tile
            entity: sensor.kitchen_humidity
            name: Kitchen Humidity
          - type: tile
            entity: sensor.badrum_luftfuktighet
            name: Bathroom Humidity

      - type: heading
        heading: System Monitoring

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.system_load
            name: System Load
          - type: tile
            entity: sensor.disk_free
            name: Disk Free

  #################################################################
